// ---- the floor plan
function wrapLabel(name, max) {
  const words = name.split(' '), lines = [''];
  words.forEach((w) => { const l = lines[lines.length - 1]; if ((l + ' ' + w).trim().length > max && l) lines.push(w); else lines[lines.length - 1] = (l + ' ' + w).trim(); });
  return lines;
}

function buildPlan() {
  const ctx = G.puzzle.ctx, w = ctx.world, el = document.getElementById('plan');
  const inPlay = new Map(ctx.roomIdx.map((wi, li) => [wi, li]));
  let u, rowH, padL, padT, maxX = 0, maxY = 0;
  w.rooms.forEach((r) => { maxX = Math.max(maxX, r.rect.x + r.rect.w); maxY = Math.max(maxY, r.rect.y + r.rect.h); });
  const line = w.layoutKind === 'line';
  u = line ? 82 : 62; rowH = line ? 78 : 64; padL = line ? 74 : 98; padT = line ? 20 : 30;
  const W = padL + maxX * u + 14, H = padT + maxY * rowH + (line ? 40 : 16);
  const rooms = w.rooms.map((r, wi) => {
    const li = inPlay.get(wi), on = li !== undefined;
    const x = padL + r.rect.x * u + 2, y = padT + r.rect.y * rowH + 2, rw = r.rect.w * u - 4, rh = r.rect.h * rowH - 4;
    const lines = wrapLabel(r.name, Math.max(8, Math.floor(rw / 7.4)));
    const text = lines.map((t, k) => `<text x="${x + 8}" y="${y + 18 + k * 14}">${esc(t)}</text>`).join('');
    const rx = line ? 7 : 2;
    return `<g class="room ${on ? '' : 'off'}" ${on ? `data-ent="r${li}"` : ''} data-x="${x}" data-y="${y}" data-w="${rw}" data-h="${rh}"><rect x="${x}" y="${y}" width="${rw}" height="${rh}" rx="${rx}"/>${text}${on ? '' : `<text x="${x + 8}" y="${y + rh - 8}" style="font-size:10px">${line ? 'sealed' : 'locked'}</text>`}</g>`;
  }).join('');
  let extra = '';
  if (line) {
    const y = padT + rowH - 2;
    extra += `<path d="M${padL - 6} ${padT + 8} h-44 l-8 ${rowH - 18} h52z" fill="rgba(207,226,240,.16)" stroke="#cfe2f0" stroke-width="1.5"/><text class="ahead" x="6" y="${padT + rowH + 22}">engine</text>`;
    for (let i = 0; i < maxX; i++) extra += `<circle cx="${padL + i * u + 18}" cy="${y + 8}" r="5" fill="none" stroke="#cfe2f0" stroke-width="1.4"/><circle cx="${padL + i * u + u - 18}" cy="${y + 8}" r="5" fill="none" stroke="#cfe2f0" stroke-width="1.4"/>`;
    extra += `<line x1="${padL - 6}" y1="${y + 14}" x2="${padL + maxX * u}" y2="${y + 14}" stroke="#cfe2f0" stroke-width="1.4"/>`;
  } else {
    for (let f = 0; f <= 2; f++) extra += `<text class="floorlbl" x="4" y="${padT + (2 - f) * rowH + 22}">${['Cellar', 'Ground floor', 'Upstairs'][f]}</text>`;
    extra += `<path d="M${padL - 6} ${padT - 2} L${padL + maxX * u / 2} ${padT - 22} L${padL + maxX * u + 6} ${padT - 2}" fill="none" stroke="#cfe2f0" stroke-width="1.5" opacity=".6"/>`;
  }
  el.innerHTML = `<h3>${esc(w.name)}, as it stood<small>Rooms that touch share a wall${w.floors ? ' or a floor' : ' or a door'}</small></h3>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan of ${esc(w.name)}"><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#cfe2f0" stroke-opacity=".25" stroke-width="2"/></pattern></defs>${extra}${rooms}<g id="pins"></g></svg>`;
}

function paintPlan() {
  const ctx = G.puzzle.ctx, n = ctx.n, d = derive(G.marks, n, G.opts);
  const pins = document.getElementById('pins');
  if (!pins) return;
  let out = '';
  for (let r = 0; r < n; r++) {
    const g = document.querySelector(`#plan .room[data-ent="r${r}"]`);
    if (!g) continue;
    const gx = +g.dataset.x, gy = +g.dataset.y, gw = +g.dataset.w, gh = +g.dataset.h;
    let k = 0;
    for (let s = 0; s < n; s++) if (d.sr[s][r] === 2 || d.sr[s][r] === 4) {
      const cx = gx + 20 + k * 24, cy = gy + gh - 20; k++;
      const su = ctx.suspects[s];
      out += `<g class="pin"><circle cx="${cx}" cy="${cy}" r="10.5" fill="hsl(${su.hue} 50% 38%)" stroke="#f3e6d2" stroke-width="1.2"/><text x="${cx}" y="${cy + 3.5}">${initials(su.name)}</text></g>`;
    }
  }
  pins.innerHTML = out;
}

// ---- the notebook: three blocks (who/what, who/where, what/where) in one L-shaped grid on wide
// screens, or one block at a time on a phone.
function chooseGridMode() {
  const nb = document.getElementById('nb');
  if (!nb) return;
  const mode = nb.clientWidth >= 560 ? 'L' : G.tab;
  if (mode !== G.gridMode) { buildGrid(); paintAll(); }
}

function buildGrid() {
  const nb = document.getElementById('nb');
  const wide = nb.clientWidth >= 560 || nb.clientWidth === 0;
  G.gridMode = wide ? 'L' : G.tab;
  nb.classList.toggle('tabbed', !wide);
  const ctx = G.puzzle.ctx, n = ctx.n, m = G.gridMode;
  const showSW = m === 'L' || m === 'sw', showSR = m === 'L' || m === 'sr', showWR = m === 'L' || m === 'wr';
  const colsW = showSW || showWR, colsR = showSR, rowsS = showSW || showSR, rowsR = showWR;
  const cols = (colsW ? n : 0) + (colsR ? n : 0);
  const lg = document.getElementById('lg');
  lg.style.gridTemplateColumns = `var(--rhw) repeat(${cols}, var(--cell))`;
  const ch = (kind, i, name, extra) => `<div class="ch" data-ent="${kind}${i}"><span>${esc(name)}</span>${extra || ''}</div>`;
  let h = '<div></div>';
  if (colsW) for (let w = 0; w < n; w++) h += ch('w', w, ctx.weapons[w].name);
  if (colsR) for (let r = 0; r < n; r++) h += ch('r', r, ctx.rooms[r].name);
  const cell = (b, i, j, cls, label) => `<button type="button" class="cell ${cls}" data-b="${b}" data-i="${i}" data-j="${j}" data-v="0" aria-label="${esc(label)}"></button>`;
  if (rowsS) for (let s = 0; s < n; s++) {
    const S = ctx.suspects[s];
    h += `<div class="rh" data-ent="s${s}"><span>${esc(S.short)}</span>${seal(S)}</div>`;
    if (showSW) for (let w = 0; w < n; w++) h += cell('sw', s, w, w === 0 ? 'bl' : '', `${S.short}, ${ctx.weapons[w].name}`);
    if (showSR) for (let r = 0; r < n; r++) h += cell('sr', s, r, r === 0 ? 'bl' : '', `${S.short}, ${ctx.rooms[r].name}`);
  }
  if (rowsR) for (let r = 0; r < n; r++) {
    h += `<div class="rh" data-ent="r${r}"><span>${esc(ctx.rooms[r].name)}</span></div>`;
    if (showWR) for (let w = 0; w < n; w++) h += cell('wr', w, r, (w === 0 ? 'bl ' : '') + (r === 0 && m === 'L' ? 'bt' : ''), `${ctx.weapons[w].name}, ${ctx.rooms[r].name}`);
    if (showSR && m === 'L') for (let k = 0; k < n; k++) h += '<div class="dead"></div>';
  }
  lg.innerHTML = h;
  document.querySelectorAll('#nb-tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === G.tab)));
}

function paintCell(el, d) {
  const b = el.dataset.b, i = +el.dataset.i, j = +el.dataset.j;
  el.dataset.v = d[b][i][j];
}
function paintAll() {
  const d = derive(G.marks, G.puzzle.n, G.opts);
  document.querySelectorAll('#lg .cell').forEach((c) => paintCell(c, d));
  paintPlan();
}

function setMark(b, i, j, v) {
  G.marks[b][i][j] = v;
  persist();
  paintAll();
}

const cellInfo = (el) => ({ b: el.dataset.b, i: +el.dataset.i, j: +el.dataset.j });
// which suspect/weapon/room entities a cell sits between (for highlighting headers)
function cellEnts(el) {
  const { b, i, j } = cellInfo(el);
  return b === 'sw' ? [`s${i}`, `w${j}`] : b === 'sr' ? [`s${i}`, `r${j}`] : [`w${i}`, `r${j}`];
}
function lightEnts(ents, on) {
  ents.forEach((e) => document.querySelectorAll(`[data-ent="${e}"]`).forEach((x) => x.classList.toggle('hl-ent', on)));
}

let drag = null, lastTouch = null;
function wireGrid() {
  const lg = document.getElementById('lg');
  if (!lg || lg._wired) return;
  lg._wired = true;
  lg.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.cell');
    if (!c || G.solved) return;
    const { b, i, j } = cellInfo(c);
    if (e.pointerType === 'mouse') {
      e.preventDefault();
      const next = (G.marks[b][i][j] + 1) % 3;
      drag = { v: next };
      setMark(b, i, j, next);
    } else {
      lastTouch = { c, x: e.clientX, y: e.clientY };
    }
  });
  lg.addEventListener('pointerover', (e) => {
    const c = e.target.closest('.cell');
    if (!c) return;
    lightEnts(cellEnts(c), true);
    if (drag && e.buttons === 1) { const { b, i, j } = cellInfo(c); if (G.marks[b][i][j] !== drag.v) setMark(b, i, j, drag.v); }
  });
  lg.addEventListener('pointerout', (e) => {
    const c = e.target.closest('.cell');
    if (c) lightEnts(cellEnts(c), false);
  });
  lg.addEventListener('pointerup', (e) => {
    if (e.pointerType !== 'mouse' && lastTouch && !G.solved) {
      const c = e.target.closest('.cell');
      if (c && c === lastTouch.c && Math.abs(e.clientX - lastTouch.x) < 8 && Math.abs(e.clientY - lastTouch.y) < 8) {
        const { b, i, j } = cellInfo(c);
        setMark(b, i, j, (G.marks[b][i][j] + 1) % 3);
      }
    }
    lastTouch = null;
  });
  lg.addEventListener('click', (e) => { // keyboard activation only
    const c = e.target.closest('.cell');
    if (!c || e.detail !== 0 || G.solved) return;
    const { b, i, j } = cellInfo(c);
    setMark(b, i, j, (G.marks[b][i][j] + 1) % 3);
  });
  lg.addEventListener('keydown', (e) => {
    const c = e.target.closest('.cell');
    if (!c) return;
    let d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!d) return;
    e.preventDefault();
    const { b, i, j } = cellInfo(c);
    if (b === 'wr') d = [d[1], d[0]]; // this block is drawn with rooms down the side
    const t = lg.querySelector(`.cell[data-b="${b}"][data-i="${i + d[0]}"][data-j="${j + d[1]}"]`);
    if (t) t.focus();
  });
}
window.addEventListener('pointerup', () => { drag = null; });

let modalReturn = null;
function openModal(html, cls) {
  closeModal();
  modalReturn = document.activeElement;
  const s = document.createElement('div');
  s.className = 'scrim'; s.id = 'scrim';
  s.innerHTML = `<div class="sheetbox paper ${cls || ''}" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Close">&times;</button>${html}</div>`;
  document.body.appendChild(s);
  const f = s.querySelector('.opt, .btn, button:not(.x)');
  if (f) f.focus();
}
function closeModal() {
  const s = document.getElementById('scrim');
  if (s) s.remove();
  if (modalReturn && modalReturn.focus && document.contains(modalReturn)) modalReturn.focus();
  modalReturn = null;
}
let toastTimer = null;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

// ---- accusation
function openAccuse() {
  const ctx = G.puzzle.ctx;
  const group = (title, key, items) => `<div class="pick"><h4>${title}</h4><div class="opts">${items.map((it, i) => `<button type="button" class="opt" data-pick="${key}" data-v="${i}" aria-pressed="${G.pick[key] === i}">${it}</button>`).join('')}</div></div>`;
  openModal(`<h2>Make an accusation</h2>
    <p>Name the killer, the weapon and the room. A wrong accusation goes on your record.</p>
    ${group('Who did it?', 'killer', ctx.suspects.map((s) => `${seal(s)}${esc(s.name)}`))}
    ${group('With what?', 'weapon', ctx.weapons.map((w) => `${glyph(w.type)}${esc(w.name)}`))}
    ${group('Where?', 'room', ctx.rooms.map((r) => esc(r.name)))}
    <p class="said" id="said"></p>
    <div id="accuse-result"></div>
    <div class="actions"><button class="btn red" id="do-accuse" data-act="submit-accuse">Accuse</button><button class="btn ghost" data-act="close">Not yet</button></div>`);
  updateSaid();
}
function updateSaid() {
  const ctx = G.puzzle.ctx, p = G.pick;
  const b = (t) => `<b>${esc(t)}</b>`;
  const who = p.killer === null ? '…' : b(ctx.suspects[p.killer].name);
  const wp = p.weapon === null ? '…' : b(ctx.weapons[p.weapon].name);
  const rm = p.room === null ? '…' : b(ctx.rooms[p.room].name);
  const el = document.getElementById('said');
  if (el) el.innerHTML = `I accuse ${who}, in the ${rm}, with the ${wp}.`;
  const btn = document.getElementById('do-accuse');
  if (btn) btn.disabled = p.killer === null || p.weapon === null || p.room === null;
}

// Which statement first rules out this exact accusation?
function firstContradiction(P, acc) {
  const { perms, inv } = permutations(P.n);
  const A = [], B = [];
  perms.forEach((p, a) => { if (p[acc.killer] === acc.weapon) A.push(a); if (p[acc.killer] === acc.room) B.push(a); });
  let alive = [];
  for (const a of A) for (const b of B) alive.push([a, b]);
  for (let k = 0; k < P.clues.length; k++) {
    const c = P.clues[k];
    alive = alive.filter(([a, b]) => {
      const v = c.test(perms[a], inv[a], perms[b], inv[b]);
      return c.kind === 'M' ? (v & (1 << acc.killer)) !== 0 : v;
    });
    if (!alive.length) return k + 1;
  }
  return null;
}

function submitAccuse() {
  const p = G.pick;
  if (p.killer === null || p.weapon === null || p.room === null) return;
  const res = checkAccusation(G.puzzle, p);
  if (res.killer && res.weapon && res.room) { closeModal(); solveCase(); return; }
  G.wrong++; persist();
  const k = firstContradiction(G.puzzle, p);
  const box = document.getElementById('accuse-result');
  box.innerHTML = `<div class="stampbox" style="margin:12px 0 0"><span class="stamp slam">Not quite</span></div>
    <p>${k ? `That story breaks against statement <b>${k}</b>.` : 'The statements do not support that.'} Wrong accusations so far: ${G.wrong}.</p>`;
}

function solveCase() {
  const first = !G.solved && !(LS.get(G.key, {}) || {}).solved;
  G.solved = true; persist();
  if (first) {
    const st = loadStats(), t = G.puzzle.tier;
    st.solved[t] = (st.solved[t] || 0) + 1;
    st.best[t] = st.best[t] ? Math.min(st.best[t], G.elapsed) : G.elapsed;
    if (G.mode === 'daily') {
      const today = dayNumber();
      if (st.lastDay !== today) { st.streak = st.lastDay === today - 1 ? st.streak + 1 : 1; st.lastDay = today; }
      st.bestStreak = Math.max(st.bestStreak, st.streak);
    }
    LS.set('inq1:stats', st);
  }
  openVerdict();
}

function shareText() {
  const P = G.puzzle;
  const head = G.mode === 'daily' ? `INQUEST No. ${dayNumber()}` : 'INQUEST, cold case';
  const wrong = G.wrong === 1 ? '1 wrong accusation' : `${G.wrong} wrong accusations`;
  const hints = G.hints === 1 ? '1 hint' : `${G.hints} hints`;
  return `${head}  ${'★'.repeat(P.rating)}${'☆'.repeat(5 - P.rating)}\n${P.tierName}: ${P.title}\nClosed in ${fmtTime(G.elapsed)}, ${hints}, ${wrong}.`;
}

function openVerdict() {
  const P = G.puzzle, ctx = P.ctx, s = P.solution, t = P.truth;
  const rows = ctx.suspects.map((su, i) => `<tr class="${i === s.killer ? 'killer' : ''}"><td>${seal(su)} ${esc(su.name)}</td><td>${esc(ctx.rooms[t.pr[i]].name)}</td><td>${esc(ctx.weapons[t.pw[i]].name)}</td></tr>`).join('');
  openModal(`<div class="verdict"><h2>${esc(P.title)}</h2>
    <div class="stampbox"><span class="stamp slam">Case closed</span></div>
    <p class="tale">It was <b>${esc(ctx.suspects[s.killer].name)}</b>, in the <b>${esc(ctx.rooms[s.room].name)}</b>, with the <b>${esc(ctx.weapons[s.weapon].name)}</b>.</p>
    <p>Closed in ${fmtTime(G.elapsed)}. ${G.hints} hint${G.hints === 1 ? '' : 's'}, ${G.wrong} wrong accusation${G.wrong === 1 ? '' : 's'}.</p>
    <details><summary>The night as it really happened</summary>
      <table><thead><tr><td></td><td>Was in</td><td>Held</td></tr></thead><tbody>${rows}</tbody></table>
      <p style="font-size:13px;color:var(--ink-soft)">Only the killer's row can be proved from the statements. The rest is one story that fits.</p></details>
    <div class="share" id="share">${esc(shareText())}</div>
    <div class="actions"><button class="btn" data-act="copy-share">Copy result</button><button class="btn ghost" data-act="home">Back to the cases</button><button class="btn ghost" data-act="random">Another case</button></div></div>`);
}

async function copyShare() {
  const txt = shareText();
  try { await navigator.clipboard.writeText(txt); toast('Result copied'); }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents(document.getElementById('share'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast('Press copy to take the selected text');
  }
}

// ---- hints from Inspector Mallory
function nextHint() {
  const P = G.puzzle, n = P.n;
  if (!G.csp) G.csp = buildCSP(P.ctx, P.clues);
  const csp = G.csp;
  const d = derive(G.marks, n, G.opts);
  const done = (b, i, j) => d[b][i][j] === 1 || d[b][i][j] === 3;
  const dom = new Array(csp.nv).fill((1 << n) - 1), trace = [];
  propagate(csp, dom, trace);
  for (const ev of trace) {
    if (ev.v >= 2 * n) continue;
    for (let x = 0; x < n; x++) {
      if (!(ev.removed & (1 << x))) continue;
      const b = ev.v < n ? 'sw' : 'sr', i = ev.v < n ? ev.v : ev.v - n;
      if (!done(b, i, x)) return { type: 'elim', b, i, j: x, clue: ev.clue };
    }
  }
  if (answered(csp, dom) && !dom.slice(0, 2 * n).some((m) => popcount(m) > 1)) return { type: 'ready' };
  for (let v = 0; v < 2 * n; v++) for (let x = 0; x < n; x++) {
    if (!(dom[v] & (1 << x)) || popcount(dom[v]) === 1) continue;
    const trial = dom.slice(); trial[v] = 1 << x;
    if (!propagate(csp, trial)) {
      const b = v < n ? 'sw' : 'sr', i = v < n ? v : v - n;
      if (!done(b, i, x)) return { type: 'whatif', b, i, j: x, clue: -1 };
    }
  }
  return { type: 'ready' };
}

let hintNow = null;
function hintNames(h) {
  const ctx = G.puzzle.ctx;
  const S = ctx.suspects[h.i].short;
  const X = h.b === 'sw' ? ctx.weapons[h.j].name : ctx.rooms[h.j].name;
  return { S, X, what: h.b === 'sw' ? `holding the ${X}` : `in the ${X}` };
}
function openHint() {
  const h = nextHint();
  hintNow = h;
  if (h.type === 'ready') {
    openModal(`<h2>Inspector Mallory</h2><div class="hintbox">Your notes already settle it. Nothing left to look up, so make your accusation.</div><div class="actions"><button class="btn red" data-act="accuse">Accuse</button><button class="btn ghost" data-act="close">Keep looking</button></div>`);
    return;
  }
  G.hints++; persist();
  const { S, what } = hintNames(h);
  let nudge;
  if (h.type === 'whatif') nudge = `Test a theory. Could ${esc(S)} be ${esc(what)}? Follow that through the statements and see whether anything survives.`;
  else if (h.clue >= 0) nudge = `Read statement <b>${h.clue + 1}</b> again. It tells you something about ${esc(S)}.`;
  else nudge = `Look along ${esc(S)}'s row in the notebook. The squares you have already crossed out leave only one way for this to go.`;
  openModal(`<h2>Inspector Mallory</h2><div class="hintbox" id="hintbox">${nudge}</div>
    <div class="actions"><button class="btn" data-act="hint-more">Spell it out</button><button class="btn ghost" data-act="close">I'll take it from here</button></div>`);
  if (h.clue >= 0) {
    const li = document.querySelector(`.stmt[data-i="${h.clue}"]`);
    if (li) { li.classList.add('nudge'); setTimeout(() => li.classList.remove('nudge'), 5000); }
  }
}
function hintMore() {
  const h = hintNow; if (!h || h.type === 'ready') return;
  G.hints++;
  const { S, what } = hintNames(h);
  const why = h.type === 'whatif' ? 'Assume it and the statements contradict each other.' : h.clue >= 0 ? `Statement ${h.clue + 1} rules it out.` : 'The rest of the grid leaves no room for it.';
  if (G.marks[h.b][h.i][h.j] === 0) G.marks[h.b][h.i][h.j] = 1;
  persist(); paintAll();
  document.getElementById('hintbox').innerHTML = `${esc(S)} was not ${esc(what)}. ${why} I have crossed it out for you.`;
  document.querySelector('[data-act="hint-more"]').remove();
}

function openStats() {
  const st = loadStats();
  const row = (t) => `<tr><td>${TIERS[t].name}</td><td>${st.solved[t] || 0}</td><td>${st.best[t] ? fmtTime(st.best[t]) : 'none yet'}</td></tr>`;
  openModal(`<h2>Your record</h2><div class="stats"><div><b>${st.streak}</b><span>day streak</span></div><div><b>${st.bestStreak}</b><span>best streak</span></div><div><b>${Object.values(st.solved).reduce((a, b) => a + b, 0)}</b><span>cases closed</span></div></div>
    <table class="verdict" style="width:100%"><thead><tr><td></td><td>Closed</td><td>Best time</td></tr></thead><tbody>${TIER_ORDER.map(row).join('')}</tbody></table>`, 'verdict');
}

// ---- events
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act;
    if (act === 'open-daily') openCase(dailySpec(a.dataset.tier), 'daily');
    else if (act === 'home') { closeModal(); renderHome(); }
    else if (act === 'how') openModal(howToHTML());
    else if (act === 'stats') openStats();
    else if (act === 'random') {
      closeModal();
      const t = G ? G.puzzle.tier : TIER_ORDER[Math.floor(Math.random() * 3)];
      pickRandom(t);
    }
    else if (act === 'close') closeModal();
    else if (act === 'accuse') { closeModal(); openAccuse(); }
    else if (act === 'submit-accuse') submitAccuse();
    else if (act === 'jump') { const nb = document.getElementById('nb'); if (nb) nb.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (act === 'hint') openHint();
    else if (act === 'hint-more') hintMore();
    else if (act === 'copy-share') copyShare();
    else if (act === 'pick-tier') { closeModal(); openCase(randomSpec(a.dataset.tier), 'random'); }
    return;
  }
  const pk = e.target.closest('[data-pick]');
  if (pk) {
    const key = pk.dataset.pick, v = +pk.dataset.v;
    G.pick[key] = G.pick[key] === v ? null : v;
    document.querySelectorAll(`[data-pick="${key}"]`).forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.v === G.pick[key])));
    updateSaid();
    return;
  }
  const st = e.target.closest('.stmt > button');
  if (st) {
    const li = st.parentElement, i = +li.dataset.i, on = li.dataset.struck !== '1';
    li.dataset.struck = on ? '1' : '0'; st.setAttribute('aria-pressed', String(on));
    G.struck = on ? G.struck.concat(i) : G.struck.filter((x) => x !== i);
    persist();
    return;
  }
  if (e.target.id === 'scrim') closeModal();
  const tab = e.target.closest('#nb-tabs button');
  if (tab) { G.tab = tab.dataset.tab; buildGrid(); paintAll(); wireGrid(); }
});

function pickRandom(tier) {
  closeModal();
  openRandomChoice(tier);
}
function openRandomChoice(tier) {
  openModal(`<h2>Open a different case</h2><p>Pick a level. You will get a case you have not closed yet, when there is one.</p>
    <div class="actions">${TIER_ORDER.map((t) => `<button class="btn ${t === tier ? '' : 'ghost'}" data-act="pick-tier" data-tier="${t}">${TIERS[t].name}</button>`).join('')}</div>`);
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('change', (e) => {
  if (e.target.id === 'opt-cross') { G.opts.cross = e.target.checked; persist(); paintAll(); }
  if (e.target.id === 'opt-chain') { G.opts.chain = e.target.checked; persist(); paintAll(); }
});
document.addEventListener('mouseover', (e) => { const t = e.target.closest('.tk'); if (t) lightEnts([t.dataset.ent], true); });
document.addEventListener('mouseout', (e) => { const t = e.target.closest('.tk'); if (t) lightEnts([t.dataset.ent], false); });

setInterval(() => {
  if (VIEW !== 'case' || !G || G.solved || document.hidden) return;
  G.elapsed++;
  const c = document.getElementById('clock'); if (c) c.textContent = fmtTime(G.elapsed);
  if (G.elapsed % 5 === 0) persist();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (VIEW === 'case') chooseGridMode(); }, 120); });

renderHome();

</script>
