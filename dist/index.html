// light up everything the statement in hand talks about
function applyFocus() {
  document.querySelectorAll('.hl').forEach((e) => e.classList.remove('hl'));
  if (!G) return;
  const ctx = G.puzzle.ctx, f = clueFocus(G.puzzle.clues[G.cur]);
  const lit = (sel) => document.querySelectorAll(sel).forEach((e) => e.classList.add('hl'));
  f.s.forEach((s) => lit(`[data-row="s${s}"]`));
  const ws = f.w.concat(f.kind ? ctx.types.map((t, i) => (t === f.kind ? i : -1)).filter((i) => i >= 0) : []);
  ws.forEach((w) => lit(`[data-col="w${w}"]`));
  if (f.kind) lit(`[data-kind="${f.kind}"]`);
  const rs = f.r.concat(f.floor === null ? [] : ctx.floor.map((fl, i) => (fl === f.floor ? i : -1)).filter((i) => i >= 0));
  rs.forEach((r) => { lit(`[data-col="r${r}"]`); lit(`[data-row="r${r}"]`); lit(`[data-room="${r}"]`); });
  if (f.floor !== null) lit(`[data-floor="${f.floor}"]`);
  if (f.k) lit('[data-col="k"]');
}

// ---- the notebook: one table. A row per person; their weapon (grouped by kind, in the words the statements use),
// their room (grouped by floor, or front to back on the train), and "Did it?". Which weapon was in which room
// lives on the floor plan (45-plan.js), or in a table under it for those who prefer one.
const KIND_ORDER = ['blade', 'blunt', 'poison', 'cord', 'firearm'];
const isLine = (ctx) => ctx.world.layoutKind === 'line';
function weaponOrder(ctx) {
  return [...Array(ctx.n).keys()].sort((a, b) => KIND_ORDER.indexOf(ctx.types[a]) - KIND_ORDER.indexOf(ctx.types[b]) || a - b);
}
// rooms as you would read the plan: top floor first, left to right; carriages from the engine back
function roomOrder(ctx) {
  return [...Array(ctx.n).keys()].sort((a, b) => (isLine(ctx) ? 0 : ctx.floor[b] - ctx.floor[a]) || ctx.rooms[a].rect.x - ctx.rooms[b].rect.x);
}
function groupsOf(order, keyOf) {
  const g = [];
  order.forEach((x) => { const k = keyOf(x); if (!g.length || g[g.length - 1].key !== k) g.push({ key: k, items: [] }); g[g.length - 1].items.push(x); });
  return g;
}
// "in the cellar" -> "Cellar"; long single words get a place to break in a narrow column
const floorLabel = (ctx, f) => cap(ctx.world.floors[f].replace(/^(in|on) the /, '')).replace('Upstairs', 'Up&shy;stairs');

// one square: a button that holds a pen mark. data-r / data-c place it for the arrow keys.
function cellHTML(grid, b, i, j, label, r, c, tdCls, col) {
  return `<td class="sq ${tdCls}" data-col="${col}"><button type="button" class="cell" data-grid="${grid}" data-r="${r}" data-c="${c}" data-b="${b}" data-i="${i}" data-j="${j}" data-v="-1" data-label="${esc(label)}" tabindex="${r === 0 && c === 0 ? 0 : -1}"></button></td>`;
}

function buildGrid() {
  const ctx = G.puzzle.ctx, el = document.getElementById('grid');
  if (!el) return;
  const WO = weaponOrder(ctx), RO = roomOrder(ctx), line = isLine(ctx);
  const wg = groupsOf(WO, (w) => ctx.types[w]), rg = groupsOf(RO, (r) => (line ? 'line' : ctx.floor[r]));
  const grp = (g, cls, attr, label) => `<th scope="colgroup" colspan="${g.items.length}" class="grp ${cls}" ${attr}><span>${label}</span></th>`;
  let h = '<thead><tr class="grps"><td class="corner"></td>';
  h += wg.map((g) => grp(g, 'wpart', `data-kind="${g.key}"`, KIND_WORD[g.key])).join('') + '<td class="gap wpart"></td>';
  h += rg.map((g) => grp(g, 'rpart', line ? '' : `data-floor="${g.key}"`, line ? 'From the engine back' : floorLabel(ctx, g.key))).join('');
  h += '<td class="gap rpart"></td><td class="kpart"></td></tr><tr class="names"><td class="corner"><span class="sr">Suspect</span></td>';
  h += WO.map((w) => `<th scope="col" class="c wpart" data-col="w${w}" title="${esc(ctx.weapons[w].name)}">${glyph(ctx.types[w])}<span>${shortName(ctx.weapons[w])}</span></th>`).join('') + '<td class="gap wpart"></td>';
  h += RO.map((r) => `<th scope="col" class="c rpart" data-col="r${r}" title="${esc(ctx.rooms[r].name)}"><span>${shortName(ctx.rooms[r])}</span></th>`).join('');
  h += '<td class="gap rpart"></td><th scope="col" class="c kpart" data-col="k"><span>Did it?</span></th></tr></thead><tbody>';
  ctx.suspects.forEach((S, s) => {
    let c = 0;
    h += `<tr><th scope="row" data-row="s${s}"><span class="dot" style="--h:${S.hue}"></span><span class="who">${esc(S.short)}</span></th>`;
    h += WO.map((w) => cellHTML('grid', 'sw', s, w, `${S.short} with the ${ctx.weapons[w].name}`, s, c++, 'wpart', `w${w}`)).join('') + '<td class="gap wpart"></td>';
    h += RO.map((r) => cellHTML('grid', 'sr', s, r, `${S.short} in the ${ctx.rooms[r].name}`, s, c++, 'rpart', `r${r}`)).join('') + '<td class="gap rpart"></td>';
    h += cellHTML('grid', 'k', s, 0, `${S.short} did it`, s, c++, 'kpart', 'k') + '</tr>';
  });
  el.innerHTML = h + '</tbody>';
}

// six suspects make thirteen columns. Shrink the squares until the notebook fits its column (never below
// 30px, still a fair tap), and if that is not enough, set the labels smaller.
function fitGrid() {
  const g = document.getElementById('grid');
  if (!g || !g.parentElement.clientWidth) return;
  g.classList.remove('tight');
  g.style.removeProperty('--cell');
  const avail = g.parentElement.clientWidth, sq = [...g.querySelectorAll('td.sq')].find((x) => x.getClientRects().length);
  if (!sq) return;
  let c = Math.floor(sq.getBoundingClientRect().width);
  for (const tight of [false, true]) {
    g.classList.toggle('tight', tight);
    while (g.offsetWidth > avail && c > 30) g.style.setProperty('--cell', --c + 'px');
    if (g.offsetWidth <= avail) return;
  }
}

function setTab(tab) {
  G.tab = tab;
  const nb = document.getElementById('nb');
  if (nb) nb.dataset.tab = tab;
  document.querySelectorAll('[data-act="nbtab"]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  fitGrid();
}

// ---- marks
const markOf = (d, b, i, j) => (b === 'k' ? d.k[i] : d[b][i][j]);
const MARK_WORD = ['open', 'ruled out', 'a match', 'ruled out, follows from your marks', 'a match, follows from your marks'];
function paintAll() {
  if (!G) return;
  const d = derive(G.marks, G.puzzle.n, G.opts);
  document.querySelectorAll('.cell').forEach((el) => {
    const v = markOf(d, el.dataset.b, +el.dataset.i, +el.dataset.j);
    if (+el.dataset.v === v) return;
    el.dataset.v = v;
    const key = el.dataset.b + el.dataset.i + '-' + el.dataset.j;
    if (el.dataset.cs) el.querySelector('.mk').innerHTML = penMark(v, key, +el.dataset.cs).replace('<svg class="pen"', `<svg width="${el.dataset.cs}" height="${el.dataset.cs}"`);
    else el.innerHTML = penMark(v, key, 46);
    el.setAttribute('aria-label', `${el.dataset.label}: ${MARK_WORD[v]}`);
  });
  paintPins(d);
}
function userMark(b, i, j) { return b === 'k' ? G.marks.k[i] : G.marks[b][i][j]; }
function setMark(b, i, j, v) {
  if (G.mode === 'tutorial' && !coachAllows(b, i, j)) return;
  if (b === 'k') G.marks.k[i] = v; else G.marks[b][i][j] = v;
  persist();
  paintAll();
  if (G.mode === 'tutorial') coachCheck();
}
const cellInfo = (el) => ({ b: el.dataset.b, i: +el.dataset.i, j: +el.dataset.j });
const cycle = (el) => { const { b, i, j } = cellInfo(el); setMark(b, i, j, (userMark(b, i, j) + 1) % 3); };

// ---- input, wired once for every square on the page (notebook, plan, table, room sheet).
// Mouse: press to mark, drag to paint the same mark along a row. Touch: a tap, not a scroll. Keys: Space/Enter, arrows.
let drag = null, lastTouch = null;
function wireGrid() {
  document.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.cell');
    if (!c || !G || G.solved) return;
    if (e.pointerType === 'mouse') {
      if (e.button !== 0) return;
      e.preventDefault();
      const { b, i, j } = cellInfo(c), next = (userMark(b, i, j) + 1) % 3;
      drag = { v: next, b };
      setMark(b, i, j, next);
      if (c.focus) c.focus({ preventScroll: true });
    } else lastTouch = { c, x: e.clientX, y: e.clientY };
  });
  document.addEventListener('pointerover', (e) => {
    const c = e.target.closest('.cell');
    if (!c || !drag || e.buttons !== 1 || c.dataset.b !== drag.b) return;
    const { b, i, j } = cellInfo(c);
    if (userMark(b, i, j) !== drag.v) setMark(b, i, j, drag.v);
  });
  document.addEventListener('pointerup', (e) => {
    drag = null;
    if (e.pointerType === 'mouse' || !lastTouch || !G || G.solved) { lastTouch = null; return; }
    const c = e.target.closest('.cell');
    if (c && c === lastTouch.c && Math.abs(e.clientX - lastTouch.x) < 8 && Math.abs(e.clientY - lastTouch.y) < 8) cycle(c);
    lastTouch = null;
  });
  document.addEventListener('click', (e) => { // keyboard activation only (pointer input is handled above)
    const c = e.target.closest('.cell');
    if (c && e.detail === 0 && G && !G.solved) cycle(c);
  });
  document.addEventListener('keydown', (e) => {
    const c = e.target.closest && e.target.closest('.cell[data-grid]');
    if (!c) return;
    const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!d) return;
    e.preventDefault();
    const all = [...document.querySelectorAll(`.cell[data-grid="${c.dataset.grid}"]`)].filter((x) => x.getClientRects().length);
    let r = +c.dataset.r, col = +c.dataset.c, t = null;
    for (let step = 0; step < 40 && !t; step++) {
      r += d[0]; col += d[1];
      t = all.find((x) => +x.dataset.r === r && +x.dataset.c === col);
      if (r < -1 || col < -1 || r > 40 || col > 40) break;
    }
    if (!t) return;
    c.tabIndex = -1; t.tabIndex = 0; t.focus();
  });
}

// ---- the floor plan. It shows what "next to" means (a doorway or a stair between two rooms, a coupling between
// two carriages), drawn from the same adjacency the statements use (ctx.adj), so the picture can't disagree with
// the clues. Each room carries a row of weapon chips: which weapon was in which room is worked out here, where
// the doors are. Wide screens mark the chips directly; on a phone a tap on a room opens its weapons at full size.
// "Show as a table" swaps the plan for the same marks as a plain rooms-by-weapons table.
const SVGNS = 'http://www.w3.org/2000/svg';
const svgText = (s) => esc(String(s).replace(/&shy;/g, ''));
// a room name that will not fit its room on a phone breaks where its short name allows: "Conser-" / "vatory"
function roomLabel(room, x, y, fs, width) {
  const parts = room.name.length * fs * 0.5 > width && room.short.includes('&shy;') ? room.short.split('&shy;') : null;
  if (!parts) return `<text class="room-name" x="${x}" y="${y}" style="font-size:${fs}px">${svgText(room.name)}</text>`;
  return `<text class="room-name" x="${x}" y="${y}" style="font-size:${fs}px"><tspan>${svgText(parts[0])}-</tspan><tspan x="${x}" dy="${fs * 1.1}">${svgText(parts[1])}</tspan></text>`;
}

function buildPlan() {
  const el = document.getElementById('plan');
  if (!el) return;
  const ctx = G.puzzle.ctx, w = ctx.world, line = isLine(ctx), table = G.wrView === 'table';
  const unit = line ? 'carriage' : 'room';
  const key = table
    ? `Which weapon was in which ${unit}. A square fills in by itself once you have circled a person's weapon and their ${unit}.`
    : line
      ? `Carriages are <i>next to</i> each other when they are coupled together. A sealed carriage in between keeps them apart. The engine is at the top. Each carriage lists the weapons that could have been in it.`
      : `Rooms are <i>next to</i> each other where a doorway or a stair joins them, upstairs and down included. Each room lists the weapons that could have been in it.`;
  el.innerHTML = `<div class="nb-head"><p class="label">${esc(w.name)}</p>
      <button type="button" class="quiet" data-act="wrview">${table ? 'Show on the plan' : 'Show as a table'}</button></div>
    <p class="plan-key">${key}<span class="tapnote"> Tap a ${unit} to mark its weapons.</span></p>
    <div class="house" id="house">${table ? wrTableHTML(ctx) : line ? trainSVG(ctx) : manorSVG(ctx)}</div>`;
}

// weapon chips for one room: small marked squares, drawn with their kind
function chipsSVG(ctx, r, x0, y0, cs, gap, perRow) {
  return weaponOrder(ctx).map((w, k) => {
    const x = x0 + (k % perRow) * (cs + gap), y = y0 + Math.floor(k / perRow) * (cs + gap);
    return `<g class="cell chip" transform="translate(${x} ${y})" data-b="wr" data-i="${w}" data-j="${r}" data-v="-1" data-cs="${cs}" data-label="${esc(`The ${ctx.weapons[w].name} in the ${ctx.rooms[r].name}`)}" aria-hidden="true">
      <rect width="${cs}" height="${cs}"/><use href="#k-${ctx.types[w]}" x="${cs * 0.2}" y="${cs * 0.2}" width="${cs * 0.6}" height="${cs * 0.6}"/><g class="mk"></g></g>`;
  }).join('');
}

function manorSVG(ctx) {
  const w = ctx.world, narrow = PHONE.matches;
  const u = narrow ? 38 : 70, rowH = narrow ? 92 : 100, padL = narrow ? 0 : 96;
  const inPlay = new Map(ctx.roomIdx.map((wi, li) => [wi, li]));
  let cols = 0, rows = 0;
  w.rooms.forEach((r) => { cols = Math.max(cols, r.rect.x + r.rect.w); rows = Math.max(rows, r.rect.y + r.rect.h); });
  const box = (r) => ({ x: padL + r.rect.x * u, y: r.rect.y * rowH, w: r.rect.w * u, h: r.rect.h * rowH });
  const fs = narrow ? 11 : 14, cs = narrow ? 11 : 18, gap = narrow ? 1.5 : 3;
  let g = '';
  if (!narrow) for (let y = 0; y < rows; y++) g += `<text class="floor-name" x="0" y="${y * rowH + 22}">${svgText(cap(w.floors[rows - 1 - y].replace(/^(in|on) the /, '')))}</text>`;
  w.rooms.forEach((room, wi) => {
    const b = box(room), r = inPlay.get(wi);
    if (r === undefined) {
      g += `<rect class="ghost" x="${b.x + 3}" y="${b.y + 3}" width="${b.w - 6}" height="${b.h - 6}"/><text class="ghost-name" x="${b.x + 9}" y="${b.y + 20}" style="font-size:${fs}px">${svgText(room.name)}</text>`;
      return;
    }
    const perRow = Math.max(1, Math.floor((b.w - 12 + gap) / (cs + gap))), chipRows = Math.ceil(ctx.n / perRow);
    g += `<g class="room" data-room="${r}" role="button" tabindex="0" aria-label="${esc(room.name)}: mark its weapons">
      <rect class="floorspace" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>
      ${roomLabel(room, b.x + (narrow ? 5 : 9), b.y + (narrow ? 16 : 21), fs, b.w - (narrow ? 12 : 18))}
      <g class="pins" data-pins="${r}" transform="translate(${b.x + (narrow ? 5 : 9)} ${b.y + (narrow ? 42 : 44)})"></g>
      ${chipsSVG(ctx, r, b.x + 6, b.y + b.h - 7 - chipRows * (cs + gap) + gap, cs, gap, perRow)}</g>`;
  });
  // walls on top of the rooms, then the openings cut into them
  w.rooms.forEach((room, wi) => { if (inPlay.has(wi)) { const b = box(room); g += `<rect class="wall" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`; } });
  for (let i = 0; i < ctx.n; i++) for (let j = i + 1; j < ctx.n; j++) {
    if (!ctx.adj[i][j]) continue;
    const a = box(ctx.rooms[i]), b = box(ctx.rooms[j]);
    if (a.y === b.y) { // side by side: a doorway in the shared wall
      const x = a.x + a.w === b.x ? b.x : a.x, ym = a.y + a.h / 2;
      g += `<line class="door" x1="${x}" y1="${ym - 13}" x2="${x}" y2="${ym + 13}"/>`;
    } else { // one above the other: a stair through the floor, near the right end of the overlap
      const top = a.y < b.y ? a : b, bot = a.y < b.y ? b : a;
      const hi = Math.min(top.x + top.w, bot.x + bot.w), mx = hi - (narrow ? 14 : 22), y = bot.y;
      g += `<line class="door" x1="${mx - 12}" y1="${y}" x2="${mx + 12}" y2="${y}"/><path class="stair" d="M${mx - 9} ${y + 9}h6v-6h6v-6h6v-6"/>`;
    }
  }
  const W = padL + cols * u, H = rows * rowH;
  return `<svg class="plan-svg${narrow ? ' narrow' : ''}" viewBox="-2 -2 ${W + 4} ${H + 4}" role="group" aria-label="Plan of ${esc(w.name)}">${g}</svg>`;
}

function trainSVG(ctx) {
  const w = ctx.world, narrow = PHONE.matches;
  const W = narrow ? 340 : 640, rowH = narrow ? 62 : 58, h = rowH - 14, top = 30, cs = narrow ? 14 : 18, gap = narrow ? 2 : 3;
  const inPlay = new Map(ctx.roomIdx.map((wi, li) => [wi, li]));
  const order = w.rooms.map((r, wi) => wi).sort((a, b) => w.rooms[a].rect.x - w.rooms[b].rect.x);
  let g = `<text class="floor-name" x="0" y="16">The engine</text><path class="stair" d="M${W / 2 - 40} ${top - 4}h80"/>`;
  order.forEach((wi, k) => {
    const room = w.rooms[wi], r = inPlay.get(wi), y = top + k * rowH;
    if (k) g += `<line class="coupling" x1="${W / 2}" y1="${y - 14}" x2="${W / 2}" y2="${y}"/>`;
    if (r === undefined) {
      g += `<rect class="ghost" x="3" y="${y + 3}" width="${W - 6}" height="${h - 6}"/><text class="ghost-name" x="12" y="${y + h / 2 + 5}">${svgText(room.name)}, sealed</text>`;
      return;
    }
    const chipsW = ctx.n * (cs + gap) - gap;
    g += `<g class="room" data-room="${r}" role="button" tabindex="0" aria-label="${esc(room.name)}: mark its weapons">
      <rect class="floorspace" x="0" y="${y}" width="${W}" height="${h}"/><rect class="wall" x="0" y="${y}" width="${W}" height="${h}" rx="6"/>
      <text class="room-name" x="12" y="${y + (narrow ? 18 : h / 2 + 5)}" style="font-size:${narrow ? 13 : 15}px">${svgText(room.name)}</text>
      <g class="pins" data-pins="${r}" transform="translate(${narrow ? 12 : W * 0.36} ${y + (narrow ? 36 : h / 2 - 4)})"></g>
      ${chipsSVG(ctx, r, W - 10 - chipsW, y + (h - cs) / 2, cs, gap, ctx.n)}</g>`;
  });
  const H = top + order.length * rowH - 14;
  return `<svg class="plan-svg train${narrow ? ' narrow' : ''}" viewBox="-2 -2 ${W + 4} ${H + 4}" role="group" aria-label="${esc(w.name)}, from the engine back">${g}</svg>`;
}

// who is placed in each room: once a person's room is circled, their name appears there
function paintPins(d) {
  const ctx = G.puzzle.ctx;
  document.querySelectorAll('[data-pins]').forEach((p) => {
    const r = +p.dataset.pins, who = ctx.suspects.map((s, i) => i).filter((s) => d.sr[s][r] === 2 || d.sr[s][r] === 4);
    p.innerHTML = who.map((s, k) => `<g transform="translate(0 ${k * 15})"><circle cx="4" cy="-4" r="4" style="fill:hsl(${ctx.suspects[s].hue} 34% 52%)"/><text class="pin" x="12" y="0">${esc(ctx.suspects[s].short)}</text></g>`).join('');
  });
}

// the fallback: the same marks as a rooms-by-weapons table
function wrTableHTML(ctx) {
  const WO = weaponOrder(ctx);
  let h = `<table class="grid wr"><thead><tr class="names"><td class="corner"><span class="sr">${isLine(ctx) ? 'Carriage' : 'Room'}</span></td>`;
  h += WO.map((w) => `<th scope="col" class="c" data-col="w${w}" title="${esc(ctx.weapons[w].name)}">${glyph(ctx.types[w])}<span>${shortName(ctx.weapons[w])}</span></th>`).join('') + '</tr></thead><tbody>';

  });

// a room's weapons at full size: the phone's way to work the plan, and the keyboard's
function openRoomSheet(r) {

  const rows = weaponOrder(ctx).map((w, k) => `<li><button type="button" class="cell" data-grid="room" data-r="${k}" data-c="0" data-b="wr" data-i="${w}" data-j="${r}" data-v="-1" data-label="${esc(`The ${ctx.weapons[w].name} in the ${room.name}`)}" tabindex="${k ? -1 : 0}"></button>
    <span class="wname">${glyph(ctx.types[w])}${esc(ctx.weapons[w].name)} <i>${KIND_WORD[ctx.types[w]].toLowerCase()}</i></span></li>`).join('');

    <ul class="wr-list">${rows}</ul><div class="actions"><button type="button" class="btn" data-act="close">Done</button></div>`, 'roomsheet');

}

let modalReturn = null;

let toastTimer = null;

// ---- accusation
function openAccuse() {
  const ctx = G.puzzle.ctx;
  const group = (title, key, items) => `<div class="pick"><h4>${title}</h4><div class="opts">${items.map((it, i) => `<button type="button" class="opt" data-pick="${key}" data-v="${i}" aria-pressed="${G.pick[key] === i}">${it}</button>`).join('')}</div></div>`;
  openModal(`<h2>Name the killer</h2>
    <p>Who did it, with what, and where. A wrong guess goes on your record.</p>
    ${group('Who did it?', 'killer', ctx.suspects.map((s) => `${seal(s)}${esc(s.name)}`))}
    ${group('With what?', 'weapon', ctx.weapons.map((w) => `${glyph(w.type)}${esc(w.name)}`))}
    ${group('Where?', 'room', ctx.rooms.map((r) => esc(r.name)))}
    <p class="said" id="said"></p>
    <div id="accuse-result"></div>
    <div class="actions"><button class="btn" id="do-accuse" data-act="submit-accuse">Name them</button><button class="btn ghost" data-act="close">Not yet</button></div>`);
  updateSaid();
}
function updateSaid() {
  const ctx = G.puzzle.ctx, p = G.pick;
  const b = (t) => `<b>${esc(t)}</b>`;
  const who = p.killer === null ? '…' : b(ctx.suspects[p.killer].name);
  const wp = p.weapon === null ? '…' : b(ctx.weapons[p.weapon].name);
  const rm = p.room === null ? '…' : b(ctx.rooms[p.room].name);
  const el = document.getElementById('said');
  if (el) el.innerHTML = `I accuse ${who}, in the ${rm}, with the ${wp}.`;
  const btn = document.getElementById('do-accuse');
  if (btn) btn.disabled = p.killer === null || p.weapon === null || p.room === null;
}

// Which statement first rules out this exact accusation?
function firstContradiction(P, acc) {
  const { perms, inv } = permutations(P.n);
  const A = [], B = [];
  perms.forEach((p, a) => { if (p[acc.killer] === acc.weapon) A.push(a); if (p[acc.killer] === acc.room) B.push(a); });
  let alive = [];
  for (const a of A) for (const b of B) alive.push([a, b]);
  for (let k = 0; k < P.clues.length; k++) {
    const c = P.clues[k];
    alive = alive.filter(([a, b]) => {
      const v = c.test(perms[a], inv[a], perms[b], inv[b]);
      return c.kind === 'M' ? (v & (1 << acc.killer)) !== 0 : v;
    });
    if (!alive.length) return k + 1;
  }
  return null;
}

function submitAccuse() {
  const p = G.pick;
  if (p.killer === null || p.weapon === null || p.room === null) return;
  const res = checkAccusation(G.puzzle, p);
  if (res.killer && res.weapon && res.room) { closeModal(); solveCase(); return; }
  G.wrong++; persist();
  const k = firstContradiction(G.puzzle, p);
  const box = document.getElementById('accuse-result');
  box.innerHTML = `<p class="miss"><b>Not quite.</b> ${k ? `That story breaks against statement <b>${k}</b>.` : 'The statements do not support that.'} Wrong accusations so far: ${G.wrong}.</p>`;
}

function solveCase() {
  if (G.mode === 'tutorial') { G.solved = true; finishTutorial(); return; }
  const first = !G.solved && !(LS.get(G.key, {}) || {}).solved;
  G.solved = true; persist();
  if (first) {
    const st = loadStats(), t = G.puzzle.tier;
    st.solved[t] = (st.solved[t] || 0) + 1;
    st.best[t] = st.best[t] ? Math.min(st.best[t], G.elapsed) : G.elapsed;
    if (G.mode === 'daily') {
      const today = dayNumber();
      if (st.lastDay !== today) { st.streak = st.lastDay === today - 1 ? st.streak + 1 : 1; st.lastDay = today; }
      st.bestStreak = Math.max(st.bestStreak, st.streak);
    }
    LS.set('inq1:stats', st);
  }
  const cs = document.getElementById('closed-stamp');
  if (cs) cs.textContent = 'Case closed.';
  openVerdict();
}

function shareText() {
  const P = G.puzzle;
  const head = G.mode === 'daily' ? `INQUEST No. ${dayNumber()}` : 'INQUEST, cold case';
  const wrong = G.wrong === 1 ? '1 wrong accusation' : `${G.wrong} wrong accusations`;
  const hints = G.hints === 1 ? '1 hint' : `${G.hints} hints`;
  return `${head}  ${'★'.repeat(P.rating)}${'☆'.repeat(5 - P.rating)}\n${P.tierName}: ${P.title}\nClosed in ${fmtTime(G.elapsed)}, ${hints}, ${wrong}.`;
}

function openVerdict() {
  const P = G.puzzle, ctx = P.ctx, s = P.solution, t = P.truth;
  const rows = ctx.suspects.map((su, i) => `<tr class="${i === s.killer ? 'killer' : ''}"><td>${seal(su)} ${esc(su.name)}</td><td>${esc(ctx.rooms[t.pr[i]].name)}</td><td>${esc(ctx.weapons[t.pw[i]].name)}</td></tr>`).join('');
  openModal(`<div class="verdict"><h2>${esc(P.title)}</h2>
    <p class="closed">Case closed.</p>
    <p class="tale">It was <b>${esc(ctx.suspects[s.killer].name)}</b>, in the <b>${esc(ctx.rooms[s.room].name)}</b>, with the <b>${esc(ctx.weapons[s.weapon].name)}</b>.</p>
    <p>Closed in ${fmtTime(G.elapsed)}. ${G.hints} hint${G.hints === 1 ? '' : 's'}, ${G.wrong} wrong accusation${G.wrong === 1 ? '' : 's'}.</p>
    <details><summary>The night as it really happened</summary>
      <table><thead><tr><td></td><td>Was in</td><td>Held</td></tr></thead><tbody>${rows}</tbody></table>
      <p class="soft">Only the killer's row can be proved from the statements. The rest is one story that fits.</p></details>
    <div class="share" id="share">${esc(shareText())}</div>

}

function nextStepHTML() {
  const st = loadStats(), closed = Object.values(st.solved).reduce((a, b) => a + b, 0);

// ---- hints from Inspector Mallory
function nextHint() {
  const P = G.puzzle, n = P.n;
  if (!G.csp) G.csp = buildCSP(P.ctx, P.clues);
  const csp = G.csp;
  const d = derive(G.marks, n, G.opts);
  const done = (b, i, j) => d[b][i][j] === 1 || d[b][i][j] === 3;
  // a square the player marked that the statements contradict: a circle on something impossible,
  // or a cross on something that has to be true
  if (!G.marg) G.marg = marginals(P.ctx, P.clues);
  const M = G.marg;
  for (const b of ['sw', 'sr', 'wr']) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = G.marks[b][i][j];
    if (v === 2 && !M[b][i][j]) return { type: 'mistake', b, i, j, v };
    if (v === 1) {
      let rowAlt = false, colAlt = false;
      for (let k = 0; k < n; k++) { if (k !== j && M[b][i][k]) rowAlt = true; if (k !== i && M[b][k][j]) colAlt = true; }
      if (!rowAlt || !colAlt) return { type: 'mistake', b, i, j, v };
    }
  }
  const dom = new Array(csp.nv).fill((1 << n) - 1), trace = [];
  propagate(csp, dom, trace);
  for (const ev of trace) {
    if (ev.v >= 2 * n) continue;
    for (let x = 0; x < n; x++) {
      if (!(ev.removed & (1 << x))) continue;
      const b = ev.v < n ? 'sw' : 'sr', i = ev.v < n ? ev.v : ev.v - n;
      if (!done(b, i, x)) return { type: 'elim', b, i, j: x, clue: ev.clue };
    }
  }
  if (answered(csp, dom) && !dom.slice(0, 2 * n).some((m) => popcount(m) > 1)) return { type: 'ready' };
  for (let v = 0; v < 2 * n; v++) for (let x = 0; x < n; x++) {
    if (!(dom[v] & (1 << x)) || popcount(dom[v]) === 1) continue;
    const trial = dom.slice(); trial[v] = 1 << x;
    if (!propagate(csp, trial)) {
      const b = v < n ? 'sw' : 'sr', i = v < n ? v : v - n;
      if (!done(b, i, x)) return { type: 'whatif', b, i, j: x, clue: -1 };
    }
  }
  return { type: 'ready' };
}

let hintNow = null;
function hintNames(h) {
  const ctx = G.puzzle.ctx;
  if (h.b === 'wr') return { S: `the ${ctx.weapons[h.i].name}`, what: `in the ${ctx.rooms[h.j].name}`, pair: `the ${ctx.weapons[h.i].name} and the ${ctx.rooms[h.j].name}` };
  const S = ctx.suspects[h.i].short;
  const X = h.b === 'sw' ? ctx.weapons[h.j].name : ctx.rooms[h.j].name;
  return { S, X, what: h.b === 'sw' ? `holding the ${X}` : `in the ${X}`, pair: `${S} and the ${X}` };
}
function openHint() {
  const h = nextHint();
  hintNow = h;
  if (h.type === 'ready') {
    openModal(`<h2>Inspector Mallory</h2><div class="hintbox">Your notes already settle it. Nothing left to look up, so name the killer.</div><div class="actions"><button class="btn" data-act="accuse">Name the killer</button><button class="btn ghost" data-act="close">Keep looking</button></div>`);
    return;
  }
  G.hints++; persist();
  const { S, what } = hintNames(h);
  let nudge;
  if (h.type === 'mistake') nudge = `Something in your notebook doesn't fit the statements. Look again at the square for ${esc(hintNames(h).pair)}.`;
  else if (h.type === 'whatif') nudge = `Test a theory. Could ${esc(S)} be ${esc(what)}? Follow that through the statements and see whether anything survives.`;
  else if (h.clue >= 0) nudge = `Read statement <b>${h.clue + 1}</b> again, alongside what your notebook already says about ${esc(S)}.`;
  else nudge = `Look along ${esc(S)}'s row in the notebook. The squares you have already crossed out leave only one way for this to go.`;
  openModal(`<h2>Inspector Mallory</h2><div class="hintbox" id="hintbox">${nudge}</div>
    <div class="actions"><button class="btn" data-act="hint-more">Spell it out</button><button class="btn ghost" data-act="close">I'll take it from here</button></div>`);
  if (h.clue >= 0) {
    selectStatement(h.clue);
    const li = document.querySelector(`.stmt[data-i="${h.clue}"]`);
    if (li) { li.classList.add('nudge'); setTimeout(() => li.classList.remove('nudge'), 5000); }
  }
}
function hintMore() {
  const h = hintNow; if (!h || h.type === 'ready') return;
  G.hints++;
  const { S, what, pair } = hintNames(h);
  if (h.type === 'mistake') {
    G.marks[h.b][h.i][h.j] = 0;
    persist(); paintAll();
    document.getElementById('hintbox').innerHTML = `You ${h.v === 2 ? 'circled' : 'crossed out'} ${esc(pair)}, but the statements ${h.v === 2 ? 'rule that out' : 'say it has to be true'}. I have cleared that square for you.`;
    document.querySelector('[data-act="hint-more"]').remove();
    return;
  }
  const why = h.type === 'whatif' ? 'Assume it and the statements contradict each other.' : h.clue >= 0 ? `Statement ${h.clue + 1} rules it out, given what you already know.` : 'The rest of the grid leaves no room for it.';
  if (G.marks[h.b][h.i][h.j] === 0) G.marks[h.b][h.i][h.j] = 1;
  persist(); paintAll();
  document.getElementById('hintbox').innerHTML = `${esc(S)} was not ${esc(what)}. ${why} I have crossed it out for you.`;
  document.querySelector('[data-act="hint-more"]').remove();
}

function openStats() {
  const st = loadStats();
  const row = (t) => `<tr><td>${TIERS[t].name}</td><td>${st.solved[t] || 0}</td><td>${st.best[t] ? fmtTime(st.best[t]) : 'none yet'}</td></tr>`;
  openModal(`<h2>Your record</h2><div class="stats"><div><b>${st.streak}</b><span>day streak</span></div><div><b>${st.bestStreak}</b><span>best streak</span></div><div><b>${Object.values(st.solved).reduce((a, b) => a + b, 0)}</b><span>cases closed</span></div></div>
    <table class="verdict" style="width:100%"><thead><tr><td></td><td>Closed</td><td>Best time</td></tr></thead><tbody>${TIER_ORDER.map(row).join('')}</tbody></table>`, 'verdict');
}

// ---- the guided first case. A coach card walks through TUTORIAL (src/46-tutorial.js) one move at a time:
// read a statement, cross out, circle a match, watch the plan, use the last open square, accuse.
// While it runs, only the square the coach points at can be marked.
const COACH = { on: false, step: 0, timer: null };

function tutSteps() {
  const ctx = G.puzzle.ctx;
  const S = (i) => `<b>${esc(ctx.suspects[i].short)}</b>`, W = (i) => `the <b>${esc(ctx.weapons[i].name)}</b>`, R = (i) => `the <b>${esc(ctx.rooms[i].name)}</b>`;
  return [
    { say: `${esc(ctx.world.victim.name)} is dead, and one of three guests did it. Your job is to name <b>who</b>, <b>with what</b>, and <b>where</b>.</p><p>Everything in the case file is true. Let's solve this one together; it takes about two minutes.`,
      button: 'Start the lesson', skip: 'Skip, I know how to play' },
    { stmt: 0, tab: 'sw', cell: ['sw', 0, 1, 1],
      say: `<b>Statement 1</b>: ${S(0)} never touched ${W(1)}.</p><p>In the notebook, find ${S(0)}'s row and the ${esc(ctx.weapons[1].name)} column. Tap that square <b>once</b> to cross it out.` },
    { stmt: 1, tab: 'sr', cell: ['sr', 2, 0, 2],
      say: `<b>Statement 2</b> puts ${S(2)} in ${R(0)}. That's a match.</p><p>That goes in the notebook's room columns. Tap ${S(2)}'s ${esc(ctx.rooms[0].name)} square <b>twice</b>: once to cross, again to circle.` },
    { plan: true, button: 'Next',
      say: `See the faint crosses? Each person was in one room and each room held one person, so the notebook crossed out the rest of that row and column for you.</p><p>${S(2)} is now pinned on the floor plan, too.` },
    { stmt: 2, tab: 'sr', cell: ['sr', 1, 2, 1],
      say: `<b>Statement 3</b>: ${S(1)} was nowhere near ${R(2)}. Cross it out.` },
    { tab: 'sr', cell: ['sr', 1, 1, 2],
      say: `Look along ${S(1)}'s row. Only one room is still open.</p><p>When a row has one square left, that's the answer. Circle it.` },
    { tab: 'sr', cell: ['sr', 0, 2, 2],
      say: `${S(0)} has one room left too. Circle it.` },
    { stmt: 3, tab: 'sw', cell: ['sw', 2, 0, 2],
      say: `<b>Statement 4</b>: ${S(2)} was carrying something heavy and blunt.</p><p>The notebook groups the weapons by kind, and only ${W(0)} is under <i>Blunt</i>. Circle ${S(2)} and the ${esc(ctx.weapons[0].name)}.` },
    { tab: 'sw', cell: ['sw', 0, 2, 2],
      say: `${S(0)} never touched ${W(1)} (statement 1), and ${W(0)} is taken. Circle the only weapon left for ${S(0)}.` },
    { tab: 'sw', cell: ['sw', 1, 1, 2],
      say: `And ${S(1)} gets the weapon that's left. Circle it.` },
    { plan: true, button: 'Next',
      say: `Now look at the floor plan. ${S(1)} had ${W(1)} and was in ${R(1)}, so the plan has put ${W(1)} in ${R(1)} for you, in fainter ink.</p><p>Each room lists the weapons that could have been in it. Some statements are about those.` },
    { stmt: 4, plan: true, accuse: true,
      say: `<b>Statement 5</b>: the body was found on the ground floor.</p><p>On the floor plan, ${R(1)} is the only ground-floor room in this case. So who is the killer, and with what? Press <b>Name the killer</b> when you know.` },
  ];
}

function startTutorial() {
  closeModal();
  newGame(TUTORIAL, 'tutorial');
  G.opts = { cross: true, chain: false };
  renderCase();
  COACH.on = true; COACH.step = 0;
  document.body.classList.add('coached');
  showStep();
}

function endCoach() {
  COACH.on = false; clearTimeout(COACH.timer);
  const c = document.getElementById('coach'); if (c) c.remove();
  document.body.classList.remove('coached');
  document.querySelectorAll('.coach-target').forEach((x) => x.classList.remove('coach-target'));
}

function showStep() {
  const steps = tutSteps(), st = steps[COACH.step];
  if (!st) return;
  document.querySelectorAll('.coach-target').forEach((x) => x.classList.remove('coach-target'));
  if (st.tab && G.tab !== st.tab) setTab(st.tab);
  if (st.stmt !== undefined && G.cur !== st.stmt) selectStatement(st.stmt);
  let c = document.getElementById('coach');
  if (!c) { c = document.createElement('aside'); c.id = 'coach'; c.className = 'coach paper'; c.setAttribute('aria-label', 'Tutorial'); document.body.appendChild(c); }
  const buttons = (st.button ? `<button class="btn red" data-act="coach-next">${st.button}</button>` : '') + (st.skip ? `<button class="btn ghost" data-act="coach-skip">${st.skip}</button>` : '');
  c.innerHTML = `<div class="coach-top"><span>${COACH.step ? `Step ${COACH.step} of ${steps.length - 1}` : 'Welcome to Inquest'}</span>${st.skip ? '' : '<button data-act="coach-skip">Skip tutorial</button>'}</div>
    <div role="status" aria-live="polite"><p>${st.say}</p></div><p class="warn" id="coach-warn"></p>${buttons ? `<div class="actions">${buttons}</div>` : ''}`;
  if (st.stmt !== undefined) { const li = document.querySelector(`.stmt[data-i="${st.stmt}"]`); if (li) li.classList.add('coach-target'); }
  const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  let target = null;
  if (st.cell) {
    target = visibleCell(st.cell[0], st.cell[1], st.cell[2]);
    if (target) target.classList.add('coach-target');
  }
  if (st.plan) {
    const pl = document.getElementById('plan');
    if (pl) { pl.classList.remove('flash'); void pl.offsetWidth; pl.classList.add('flash'); target = target || pl; }
  }
  if (st.accuse) document.querySelector('.bar .accuse').classList.add('coach-target');
  if (target && target.scrollIntoView) target.scrollIntoView({ block: 'center', behavior: smooth });
  const first = c.querySelector('.actions .btn');
  if (first) first.focus({ preventScroll: true });
  else if (target && target.classList.contains('cell')) target.focus({ preventScroll: true });
}

// the square the coach means, wherever it is showing right now
function visibleCell(b, i, j) {
  return [...document.querySelectorAll(`.cell[data-b="${b}"][data-i="${i}"][data-j="${j}"]`)].find((x) => x.getClientRects().length) || document.querySelector(`.cell[data-b="${b}"][data-i="${i}"][data-j="${j}"]`);
}
// after part of the page is redrawn (a tab, the room sheet), point at the square again
function coachHighlight() {
  const st = tutSteps()[COACH.step];
  if (!st || !st.cell) return;
  const t = visibleCell(st.cell[0], st.cell[1], st.cell[2]);
  if (t) t.classList.add('coach-target');
  else coachWarn(`The square you need is under ${st.cell[0] === 'sw' ? 'Weapons' : 'Rooms'}.`);
}

function coachWarn(msg) {
  const w = document.getElementById('coach-warn');
  if (w) w.textContent = msg;
}

function coachAllows(b, i, j) {
  if (!COACH.on) return true;
  const st = tutSteps()[COACH.step];
  if (st && st.cell && st.cell[0] === b && st.cell[1] === i && st.cell[2] === j) return true;
  coachWarn(st && st.cell ? 'For now, use the square with the red outline.' : st && st.accuse ? 'Your notebook is done. Press Name the killer.' : 'Press the button below to carry on.');
  return false;
}

function coachCheck() {
  if (!COACH.on) return;
  const st = tutSteps()[COACH.step];
  if (!st || !st.cell) return;
  const [b, i, j, want] = st.cell, v = G.marks[b][i][j];
  if (v === want) { coachWarn(''); clearTimeout(COACH.timer); COACH.timer = setTimeout(coachNext, 550); return; }
  if (want === 2 && v === 1) coachWarn('That is a cross. Tap the same square once more to circle it.');
  else if (want === 1 && v === 2) coachWarn('That is a circle, which means a match. Tap again to clear it, then once more to cross it out.');
  else coachWarn(want === 2 ? 'Tap it twice: once to cross, again to circle.' : 'Tap it once to cross it out.');
}

function coachNext() {
  if (!COACH.on) return;
  COACH.step++;
  showStep();
}

function finishTutorial() {
  LS.set('inq1:tutorial', 1);
  endCoach();
  const ctx = G.puzzle.ctx, s = G.puzzle.solution;
  openModal(`<div class="verdict"><h2>You've got it</h2>
    <p class="closed">Case closed.</p>
    <p class="tale">It was <b>${esc(ctx.suspects[s.killer].name)}</b>, in the <b>${esc(ctx.rooms[s.room].name)}</b>, with the <b>${esc(ctx.weapons[s.weapon].name)}</b>.</p>
    <p>That's the whole game. Real cases have more suspects and trickier statements, but every one is solved the same way: read a statement, cross out what it rules out, circle what it proves, then accuse.</p>
    <p class="soft">If you get stuck, the <b>Hint</b> button points you to the next step, and tells you if a square in your notebook doesn't add up.</p>
    <div class="actions"><button class="btn red" data-act="open-daily" data-tier="constable">Start your first real case</button><button class="btn ghost" data-act="home">Back to the cases</button></div></div>`);
  const cs = document.getElementById('closed-stamp');
  if (cs) cs.textContent = 'Case closed.';
}

// first visit: go straight into the guided case (it opens with a welcome and a way to skip)
function homeOrLesson() {
  renderHome();
  if (!tutorialDone() && !Object.keys(loadStats().solved).length) startTutorial();
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act, i = +a.dataset.i;
    if (act === 'open-daily') openCase(dailySpec(a.dataset.tier), 'daily');
    else if (act === 'home') { closeModal(); homeOrLesson(); }
    else if (act === 'how') openModal(howToHTML());
    else if (act === 'theme') toggleTheme();
    else if (act === 'tutorial') startTutorial();
    else if (act === 'coach-next') coachNext();
    else if (act === 'coach-skip') { LS.set('inq1:tutorial', 1); endCoach(); homeOrLesson(); }
    else if (act === 'stats') openStats();
    else if (act === 'random') {
      closeModal();
      const t = G ? G.puzzle.tier : TIER_ORDER[Math.floor(Math.random() * TIER_ORDER.length)];
      pickRandom(t);
    }
    else if (act === 'close') closeModal();
    else if (act === 'accuse') { closeModal(); openAccuse(); }
    else if (act === 'submit-accuse') submitAccuse();
    else if (act === 'hint') openHint();
    else if (act === 'hint-more') hintMore();
    else if (act === 'copy-share') copyShare();
    else if (act === 'pick-tier') { closeModal(); openCase(randomSpec(a.dataset.tier), 'random'); }
    // the case screen
    else if (act === 'pick-stmt') { closeModal(); selectStatement(i); }
    else if (act === 'use') toggleUsed(i);
    else if (act === 'stmt-step') stepStatement(+a.dataset.d);
    else if (act === 'all-stmts') openAllStatements();
    else if (act === 'nbtab') setTab(a.dataset.tab);
    else if (act === 'wrview') {
      G.wrView = G.wrView === 'table' ? 'plan' : 'table';
      LS.set('inq1:wrview', G.wrView);
      buildPlan(); paintAll(); applyFocus();
    }
    return;
  }
  const pk = e.target.closest('[data-pick]');
  if (pk) {
    const key = pk.dataset.pick, v = +pk.dataset.v;
    G.pick[key] = G.pick[key] === v ? null : v;
    document.querySelectorAll(`[data-pick="${key}"]`).forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.v === G.pick[key])));
    updateSaid();
    return;
  }
  // a room on the plan opens its weapons at full size (a chip itself is marked where it is, on wide screens)
  const room = e.target.closest('.room[data-room]');
  if (room && !e.target.closest('.cell') && G) { openRoomSheet(+room.dataset.room); return; }
  if (e.target.id === 'scrim') closeModal();
});
