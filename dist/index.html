        : n(`A witness saw a ${a.v} figure hurry from the scene. The killer is ${a.v}.`, `The killer is ${a.v}. A witness saw the figure leave.`, `Whoever did it was ${a.v}, according to the only witness who was sober.`);
    case 'holdsAttr': return n(`${S(a.s)}'s weapon was ${A}.`, `${S(a.s)} was carrying ${A}. It showed.`, `A search of ${S(a.s)}'s luggage settles it: ${S(a.s)}'s weapon was ${A}.`);
    case 'attrInRoom': return n(`Whoever was in the ${R(a.r)} had ${A}.`, `The person in the ${R(a.r)} was carrying ${A}.`, `The weapon in the ${R(a.r)} was ${Aadj}: the marks on the floor say so.`);
    case 'murderAttr': return n(`The murder weapon was ${Aadj}.`, `The coroner says the murder weapon was ${Aadj}.`, `Whatever the killer used, it was ${Aadj}.`);
    case 'inLight': return n(`${S(a.s)} was in ${L}.`, `Wherever ${S(a.s)} was, it was ${Lword}.`,
      a.v === 'dark' ? `${S(a.s)} was in ${L}: there are cobwebs on the cuffs to prove it.` : `${S(a.s)} was in ${L}: there's candle wax on the sleeve.`);
    case 'weaponLight': return n(`The ${W(a.w)} was in ${L}.`, `Whoever had the ${W(a.w)} was in ${L}.`, `The ${W(a.w)} spent the evening in ${L}.`);
    case 'murderLight': return n(`The body was found in ${L}.`, `It happened in ${L}.`, a.v === 'dark' ? `It happened in the dark: the body was in ${L}.` : `It happened in ${L}, in plain view of nobody.`);
    case 'hasMotive': return n(`${S(a.s)}'s motive was ${M(a.m)}.`, `If ${S(a.s)} had a reason, it was ${M(a.m)}.`, `${S(a.s)} had a motive: ${M(a.m)}. Doesn't everyone?`);
    case 'notMotive': return n(`${S(a.s)}'s motive was not ${M(a.m)}.`, `Whatever drove ${S(a.s)}, it wasn't ${M(a.m)}.`, `Rule out ${M(a.m)} for ${S(a.s)}.`);
    case 'eitherMotive': return n(`${cap(M(a.m))} was the motive of ${S(a.a)} or of ${S(a.b)}.`, `Either ${S(a.a)} or ${S(a.b)} had ${M(a.m)} as a motive.`, `Look for ${M(a.m)}, and you'll find ${S(a.a)} or ${S(a.b)}.`);
    case 'motiveWeapon': return n(`Whoever had ${M(a.m)} as a motive had the ${W(a.w)}.`, `The ${W(a.w)} belonged to whoever's motive was ${M(a.m)}.`, `Find the motive ${M(a.m)} and you find the ${W(a.w)}: they go together.`);
    case 'motiveNotWeapon': return n(`Whoever's motive was ${M(a.m)} didn't have the ${W(a.w)}.`, `The ${W(a.w)} and ${M(a.m)} don't go together.`, `Whoever had ${M(a.m)} as a motive, it wasn't the ${W(a.w)} they carried.`);
    case 'motiveRoom': return n(`Whoever had ${M(a.m)} as a motive was in the ${R(a.r)}.`, `The ${R(a.r)} held whoever's motive was ${M(a.m)}.`, `Find the motive ${M(a.m)} and you find the ${R(a.r)}: they go together.`);
    case 'motiveNotRoom': return n(`Whoever's motive was ${M(a.m)} wasn't in the ${R(a.r)}.`, `The ${R(a.r)} and ${M(a.m)} don't go together.`, `Whoever had ${M(a.m)} as a motive, it wasn't the ${R(a.r)} they were in.`);
    case 'murderMotive': return n(`The killer's motive was ${M(a.m)}.`, `Mallory is sure of the why: ${M(a.m)}.`, `The motive was ${M(a.m)}. It usually is.`);
    case 'murderNotMotive': return n(`The motive was not ${M(a.m)}.`, `Rule out ${M(a.m)} as the motive.`, `Whatever the killer's reason, it wasn't ${M(a.m)}.`);
  }
  throw new Error('no text for clue type ' + c.type);
}

// ---- Inspector Mallory: opens every case with a line, and closes it with another
const MALLORY_OPEN = [
  'I’ve asked everyone to stay exactly where they are. They have all agreed, which is suspicious in itself.',
  'Somebody here is lying to me. Only one of them, for once.',
  'Every statement I’ve taken is true but one. That’s a better ratio than Scotland Yard.',
  'Nobody leaves until I know who did it. Nobody has offered to make tea, either.',
  'Everyone saw nothing, heard nothing, and has a very good reason to be glad about it.',
  'I was promised a quiet weekend.',
  'Write everything down. People lie; notebooks don’t.',
  'The evidence is honest. The suspects are honest too, all but one.',
  'One of them will say something that cannot be true. Listen for it.',
  'Somebody in this case is very calm. Too calm.',
  'I’ve seen tidier crime scenes, and I’ve seen tidier suspects.',
  'Mind the evidence. And mind the suspects even more.',
];
const MALLORY_CLOSE = [
  'Case closed. Somebody fetch the tea.',
  'Another one for the files.',
  'I’ll have the paperwork done by breakfast. Probably.',
  'That’s the trouble with lying: you have to remember everything.',
  'The truth will out. Usually with a little help.',
  'Lovely work. I shall take all the credit, naturally.',
  'And they say the countryside is restful.',
  'Somebody call a cab. Somebody else call a lawyer.',
];

// In the house, "next to" is spelled out as "a door or a stair". A case can hold several such clues, so every
// second one, in statement order, says "a doorway or a flight of stairs" instead. Wording only: types and variants stay.
const DOOR_WORDS = /\b(a|one|single) door or (a |one )?stair\b/g;
function varyWording(clues) {
  let k = 0;
  for (const c of clues) {
    if (!c.text.match(DOOR_WORDS)) continue;
    if (k++ % 2) c.text = c.text.replace(DOOR_WORDS, '$1 doorway or $2flight of stairs');
  }
  return clues;
}

// Which suspects does a clue talk about?
function clueSuspects(c) {
  const a = c.args, out = [];
  for (const k of ['s', 'a', 'b']) if (a[k] !== undefined) out.push(a[k]);
  return out;
}

// The case's story: who died, on what occasion, and how they were found. {v} is the victim's short name.
function caseStory(world, story) {
  const [vi, oi, fi, mi] = story;
  const v = world.victims[vi], put = (s) => s.replace(/\{v\}/g, v.short);
  const capFirst = (s) => s[0].toUpperCase() + s.slice(1);
  const m = mi || 0;
  return { victim: v, occasion: capFirst(put(world.occasions[oi])), found: capFirst(put(world.found[fi])),
    mallory: MALLORY_OPEN[m % MALLORY_OPEN.length], close: MALLORY_CLOSE[m % MALLORY_CLOSE.length] };
}
function pickStory(rng, world) {
  return [rng.int(world.victims.length), rng.int(world.occasions.length), rng.int(world.found.length), rng.int(MALLORY_OPEN.length * MALLORY_CLOSE.length)];
}

// Plain-text rendering (tests, share text). The UI renders tokens itself.
function plainText(str, ctx) {
  return str.replace(/\{([swrmM]):(\d+)\}/g, (_, k, i) => {
    i = +i;
    if (k === 'm') return ctx.motives[i].name.toLowerCase();
    if (k === 'M') return ctx.motives[i].name;
    return k === 's' ? ctx.suspects[i].short : k === 'w' ? ctx.weapons[i].name : ctx.rooms[i].name;
  });
}

// ---- 30-solver.js
// Exhaustive logic solver. A world is a whole story: every suspect's weapon (a permutation), room (another) and,
// in cases with motives, motive (a third), plus the killer. Weapon-only, room-only and motive-only clues are
// applied to the permutation lists first, so the expensive cross product only runs over what survives. A puzzle
// is fair only if exactly one world survives, so the whole notebook can be filled in, not just the answer.
// Every clue test takes (pw, pwi, pr, pri, pm, pmi); pm and pmi are null in a case without motives.

// the motive arrangements to walk: all of them, or a single "none" when the case has no motives
function motivePerms(ctx) {
  return ctx.motives ? permutations(ctx.n) : { perms: [null], inv: [null] };
}
// the arrangements that pass every one-dimensional clue of a kind (W weapons, R rooms, P motives)
function passing(ctx, clues, kind) {
  const { perms, inv } = kind === 'P' ? motivePerms(ctx) : permutations(ctx.n);
  const cs = clues.filter((c) => c.kind === kind), out = [];
  for (let i = 0; i < perms.length; i++) {
    const p = perms[i], q = inv[i];
    if (cs.every((c) => (kind === 'W' ? c.test(p, q) : kind === 'R' ? c.test(null, null, p, q) : c.test(null, null, null, null, p, q)))) out.push(i);
  }
  return out;
}

// Walk every world that fits the clues, calling visit(pw, pwi, pr, pri, pm, pmi, killerMask); stop when it returns true.
function eachWorld(ctx, clues, visit) {
  const { n } = ctx, { perms, inv } = permutations(n), MP = motivePerms(ctx);
  const FULL = (1 << n) - 1;
  const xClues = clues.filter((c) => c.kind === 'X'), mClues = clues.filter((c) => c.kind === 'M');
  const LA = passing(ctx, clues, 'W'), LB = passing(ctx, clues, 'R'), LC = passing(ctx, clues, 'P');
  for (const a of LA) {
    const pw = perms[a], pwi = inv[a];
    for (const b of LB) {
      const pr = perms[b], pri = inv[b];
      for (const c of LC) {
        const pm = MP.perms[c], pmi = MP.inv[c];
        let ok = true;
        for (let k = 0; k < xClues.length; k++) if (!xClues[k].test(pw, pwi, pr, pri, pm, pmi)) { ok = false; break; }
        if (!ok) continue;
        let mask = FULL;
        for (let k = 0; k < mClues.length && mask; k++) mask &= mClues[k].test(pw, pwi, pr, pri, pm, pmi);
        if (mask && visit(pw, pwi, pr, pri, pm, pmi, mask)) return;
      }
    }
  }
}

function solveCount(ctx, clues, limit) {
  const { n } = ctx;
  const seen = new Uint8Array(n * n * n);
  const answers = [], worlds = [];
  const lim = limit === undefined ? Infinity : limit;
  let capped = false;
  eachWorld(ctx, clues, (pw, pwi, pr, pri, pm, pmi, mask) => {
    for (let m = 0; m < n; m++) {
      if (!(mask & (1 << m))) continue;
      worlds.push({ pw, pr, pm, m });
      const key = (m * n + pw[m]) * n + pr[m];
      if (!seen[key]) { seen[key] = 1; answers.push({ killer: m, weapon: pw[m], room: pr[m], motive: pm ? pm[m] : null }); }
      if (worlds.length > lim) { capped = true; return true; }
    }
    return false;
  });
  return { count: worlds.length, worlds, answers, capped };
}

// Every full arrangement that fits the clues (used for hints and for checking player grids).
// Returns the marginal "possible" matrices: which cells survive in at least one consistent world.
function marginals(ctx, clues) {
  const { n } = ctx;
  const mat = () => Array.from({ length: n }, () => new Uint8Array(n));
  const sw = mat(), sr = mat(), wr = mat(), sm = mat();
  const killer = new Uint8Array(n);
  let worlds = 0;
  eachWorld(ctx, clues, (pw, pwi, pr, pri, pm, pmi, mask) => {
    worlds++;
    for (let s = 0; s < n; s++) { sw[s][pw[s]] = 1; sr[s][pr[s]] = 1; wr[pw[s]][pr[s]] = 1; if (pm) sm[s][pm[s]] = 1; }
    for (let m = 0; m < n; m++) if (mask & (1 << m)) killer[m] = 1;
    return false;
  });
  return { sw, sr, wr, sm, killer, worlds };
}

// ---- 32-survivors.js
// Incremental candidate set used while building a case: every (weapon arrangement, room arrangement, motive
// arrangement) triple that still fits the clues so far, with a bitmask of who could be the killer in each.
// Adding a clue only ever shrinks the set, so building costs little more than one full scan.
function newSurvivors(ctx) {
  const n = ctx.n, N = permutations(n).perms.length, NC = motivePerms(ctx).perms.length, FULL = (1 << n) - 1;
  const size = N * N * NC;
  const A = new Uint16Array(size), B = new Uint16Array(size), Cc = new Uint16Array(size), M = new Uint8Array(size).fill(FULL);
  let k = 0;
  for (let a = 0; a < N; a++) for (let b = 0; b < N; b++) for (let c = 0; c < NC; c++) { A[k] = a; B[k] = b; Cc[k] = c; k++; }
  return { A, B, C: Cc, M, size };
}

// Applies `clue` to `src`, writing survivors into `dst`. Returns dst.
function narrow(ctx, src, clue, dst) {
  const { perms, inv } = permutations(ctx.n), MP = motivePerms(ctx);
  let out = 0;
  const keep = (i, m) => { dst.A[out] = src.A[i]; dst.B[out] = src.B[i]; dst.C[out] = src.C[i]; dst.M[out] = m; out++; };
  if (clue.kind === 'W' || clue.kind === 'R' || clue.kind === 'P') {
    const list = clue.kind === 'P' ? MP : { perms, inv };
    const pass = new Uint8Array(list.perms.length);
    for (let p = 0; p < list.perms.length; p++) {
      const x = list.perms[p], y = list.inv[p];
      pass[p] = (clue.kind === 'W' ? clue.test(x, y) : clue.kind === 'R' ? clue.test(null, null, x, y) : clue.test(null, null, null, null, x, y)) ? 1 : 0;
    }
    const key = clue.kind === 'W' ? src.A : clue.kind === 'R' ? src.B : src.C;
    for (let i = 0; i < src.size; i++) if (pass[key[i]]) keep(i, src.M[i]);
  } else {
    for (let i = 0; i < src.size; i++) {
      const a = src.A[i], b = src.B[i], c = src.C[i];
      const v = clue.test(perms[a], inv[a], perms[b], inv[b], MP.perms[c], MP.inv[c]);
      if (clue.kind === 'X') { if (v) keep(i, src.M[i]); } else { const m = src.M[i] & v; if (m) keep(i, m); }
    }
  }
  dst.size = out;
  return dst;
}

// How many whole worlds (weapons, rooms, motives and killer) survive?
function countSurvivingWorlds(ctx, set) {
  let count = 0;
  for (let i = 0; i < set.size; i++) count += popcount(set.M[i]);
  return count;
}

// ---- 35-human.js
// A "human" solver: candidate lists for every suspect's weapon and room, plus the killer, the
// murder weapon and the murder room. Each clue becomes small local constraints; each deduction
// is a candidate being crossed out. Where plain elimination stalls, it tries one "what if?" at a
// time (depth 1), or a what-if inside a what-if (depth 2). That depth is how hard the case feels.
//
// Variables: 0..n-1 weapon of suspect s | n..2n-1 room of suspect s | (with motives) 2n..3n-1 motive of suspect s |
// then the killer, the murder weapon, the murder room and (with motives) the killer's motive. varsOf() names them.
function varsOf(ctx) {
  const n = ctx.n, mot = !!ctx.motives, K = mot ? 3 * n : 2 * n;
  return { n, PW: (s) => s, PR: (s) => n + s, PM: (s) => 2 * n + s, K, MW: K + 1, MR: K + 2, MM: mot ? K + 3 : -1, nv: K + (mot ? 4 : 3), mot };
}

// The constraints a clue puts on the variables: a list of { vars, pred }.
function clueCons(ctx, type, a) {
  const n = ctx.n, { adj, floor, pos, types, traits, wattr, light } = ctx;
  const { PW, PR, PM, K, MW, MR, MM } = varsOf(ctx);
  const out = [];
  const add = (vars, pred) => out.push({ vars, pred });
  const each = (f) => { for (let s = 0; s < n; s++) f(s); };
  switch (type) {
    case 'has': add([PW(a.s)], (x) => x === a.w); break;
    case 'notHas': add([PW(a.s)], (x) => x !== a.w); break;
    case 'in': add([PR(a.s)], (x) => x === a.r); break;
    case 'notIn': add([PR(a.s)], (x) => x !== a.r); break;
    case 'eitherHas': add([PW(a.a), PW(a.b)], (x, y) => x === a.w || y === a.w); break;
    case 'eitherIn': add([PR(a.a), PR(a.b)], (x, y) => x === a.r || y === a.r); break;
    case 'holdsType': add([PW(a.s)], (x) => types[x] === a.t); break;
    case 'notHoldsType': add([PW(a.s)], (x) => types[x] !== a.t); break;
    case 'sameType': add([PW(a.a), PW(a.b)], (x, y) => types[x] === types[y]); break;
    case 'diffType': add([PW(a.a), PW(a.b)], (x, y) => types[x] !== types[y]); break;
    case 'adjacent': add([PR(a.a), PR(a.b)], (x, y) => adj[x][y]); break;
    case 'notAdjacent': add([PR(a.a), PR(a.b)], (x, y) => !adj[x][y]); break;
    case 'sameFloor': add([PR(a.a), PR(a.b)], (x, y) => floor[x] === floor[y]); break;
    case 'diffFloor': add([PR(a.a), PR(a.b)], (x, y) => floor[x] !== floor[y]); break;
    case 'ahead': add([PR(a.a), PR(a.b)], (x, y) => pos[x] < pos[y]); break;
    case 'weaponIn': each((s) => add([PW(s), PR(s)], (x, y) => (x === a.w) === (y === a.r))); break;
    case 'weaponNotIn': each((s) => add([PW(s), PR(s)], (x, y) => !(x === a.w && y === a.r))); break;
    case 'weaponNear': each((s) => add([PW(s), PR(s)], (x, y) => x !== a.w || adj[y][a.r])); break;
    case 'typeInRoom': each((s) => add([PW(s), PR(s)], (x, y) => y !== a.r || types[x] === a.t)); break;
    case 'notTypeInRoom': each((s) => add([PW(s), PR(s)], (x, y) => y !== a.r || types[x] !== a.t)); break;
    case 'traitWeapon': each((s) => { if (traits[s][a.k] !== a.v) add([PW(s)], (x) => x !== a.w); }); break;
    case 'traitRoom': each((s) => { if (traits[s][a.k] !== a.v) add([PR(s)], (x) => x !== a.r); }); break;
    case 'murderType': add([MW], (x) => types[x] === a.t); break;
    case 'murderNotType': add([MW], (x) => types[x] !== a.t); break;
    case 'murderNotSuspect': add([K], (x) => x !== a.s); break;
    case 'murderNextTo': add([K], (x) => x !== a.s); add([MR, PR(a.s)], (x, y) => adj[x][y]); break;
    case 'murderFarFrom': add([K], (x) => x !== a.s); add([MR, PR(a.s)], (x, y) => !adj[x][y]); break;
    case 'murderSameFloor': add([K], (x) => x !== a.s); add([MR, PR(a.s)], (x, y) => floor[x] === floor[y]); break;
    case 'murderAheadOf': add([MR, PR(a.s)], (x, y) => pos[x] < pos[y]); break;
    case 'murderBehind': add([MR, PR(a.s)], (x, y) => pos[x] > pos[y]); break;
    case 'murderNotWeapon': add([MW], (x) => x !== a.w); break;
    case 'murderNotRoom': add([MR], (x) => x !== a.r); break;
    case 'murderAdjRoom': add([MR], (x) => adj[x][a.r]); break;
    case 'murderNotAdjRoom': add([MR], (x) => x !== a.r && !adj[x][a.r]); break;
    case 'murderFloor': add([MR], (x) => floor[x] === a.f); break;
    case 'murderNotFloor': add([MR], (x) => floor[x] !== a.f); break;
    case 'murderTrait': add([K], (x) => traits[x][a.k] === a.v); break;
    case 'holdsAttr': add([PW(a.s)], (x) => wattr[a.k][x] === a.v); break;
    case 'attrInRoom': each((s) => add([PW(s), PR(s)], (x, y) => y !== a.r || wattr[a.k][x] === a.v)); break;
    case 'murderAttr': add([MW], (x) => wattr[a.k][x] === a.v); break;
    case 'inLight': add([PR(a.s)], (x) => light[x] === a.v); break;
    case 'weaponLight': each((s) => add([PW(s), PR(s)], (x, y) => x !== a.w || light[y] === a.v)); break;
    case 'murderLight': add([MR], (x) => light[x] === a.v); break;
    case 'hasMotive': add([PM(a.s)], (x) => x === a.m); break;
    case 'notMotive': add([PM(a.s)], (x) => x !== a.m); break;
    case 'eitherMotive': add([PM(a.a), PM(a.b)], (x, y) => x === a.m || y === a.m); break;
    case 'motiveWeapon': each((s) => add([PM(s), PW(s)], (x, y) => (x === a.m) === (y === a.w))); break;
    case 'motiveNotWeapon': each((s) => add([PM(s), PW(s)], (x, y) => !(x === a.m && y === a.w))); break;
    case 'motiveRoom': each((s) => add([PM(s), PR(s)], (x, y) => (x === a.m) === (y === a.r))); break;
    case 'motiveNotRoom': each((s) => add([PM(s), PR(s)], (x, y) => !(x === a.m && y === a.r))); break;
    case 'murderMotive': add([MM], (x) => x === a.m); break;
    case 'murderNotMotive': add([MM], (x) => x !== a.m); break;
    default: throw new Error('human solver: unknown clue ' + type);
  }
  return out;
}

function buildCSP(ctx, clues) {
  const V = varsOf(ctx), { n, PW, PR, PM, K, MW, MR, MM } = V;
  const cons = [];
  const each = (f) => { for (let s = 0; s < n; s++) f(s); };
  clues.forEach((c, ci) => {
    const list = clueCons(ctx, c.type, c.args);
    if (c.speaker === null || c.speaker === undefined) { list.forEach((x) => cons.push({ clue: ci, vars: x.vars, pred: x.pred })); return; }
    // testimony: true unless the speaker is the killer, in which case it is false
    if (list.length !== 1) throw new Error('testimony must be one constraint: ' + c.type);
    const { vars, pred } = list[0], sp = c.speaker;
    if (vars.includes(K)) cons.push({ clue: ci, vars: [K], pred: (k) => (k === sp) !== pred(k) });
    else cons.push({ clue: ci, vars: [K, ...vars], pred: (k, x, y) => (k === sp) !== pred(x, y) });
  });
  // the killer is whoever holds the murder weapon, stands in the murder room and (with motives) had the motive
  each((s) => {
    cons.push({ clue: -1, vars: [K, PW(s), MW], pred: (k, w, mw) => (k === s) === (w === mw) });
    cons.push({ clue: -1, vars: [K, PR(s), MR], pred: (k, r, mr) => (k === s) === (r === mr) });
    if (V.mot) cons.push({ clue: -1, vars: [K, PM(s), MM], pred: (k, m, mm) => (k === s) === (m === mm) });
  });
  const groups = [[...Array(n).keys()].map(PW), [...Array(n).keys()].map(PR)];
  if (V.mot) groups.push([...Array(n).keys()].map(PM));
  return Object.assign({ cons, groups }, V);
}

const popcount = (x) => { let c = 0; while (x) { x &= x - 1; c++; } return c; };

// Remove candidates until nothing more follows. Returns false on contradiction.
function propagate(csp, dom, trace) {
  const { n, cons, groups } = csp;
  const full = (1 << n) - 1;
  const note = (v, removed, clue) => { if (trace && removed) trace.push({ v, removed, clue }); };
  let changed = true;
  while (changed) {
    changed = false;
    for (const con of cons) {
      const vs = con.vars, k = vs.length;
      const sup = [0, 0, 0];
      const d0 = dom[vs[0]], d1 = k > 1 ? dom[vs[1]] : 1, d2 = k > 2 ? dom[vs[2]] : 1;
      for (let x = 0; x < n; x++) {
        if (!(d0 & (1 << x))) continue;
        if (k === 1) { if (con.pred(x)) sup[0] |= 1 << x; continue; }
        for (let y = 0; y < n; y++) {
          if (!(d1 & (1 << y))) continue;
          if (k === 2) { if (con.pred(x, y)) { sup[0] |= 1 << x; sup[1] |= 1 << y; } continue; }
          for (let z = 0; z < n; z++) {
            if (!(d2 & (1 << z))) continue;
            if (con.pred(x, y, z)) { sup[0] |= 1 << x; sup[1] |= 1 << y; sup[2] |= 1 << z; }
          }
        }
      }
      for (let i = 0; i < k; i++) {
        const nd = dom[vs[i]] & sup[i];
        if (nd !== dom[vs[i]]) {
          note(vs[i], dom[vs[i]] & ~nd, con.clue);
          dom[vs[i]] = nd; changed = true;
          if (!nd) return false;
        }
      }
    }
    // each weapon / room is used exactly once
    for (const g of groups) {
      for (const v of g) {
        if (popcount(dom[v]) === 1) {
          for (const u of g) if (u !== v && (dom[u] & dom[v])) {
            note(u, dom[u] & dom[v], -1);
            dom[u] &= ~dom[v]; changed = true;
            if (!dom[u]) return false;
          }
        }
      }
      for (let x = 0; x < n; x++) {
        let only = -1, cnt = 0;
        for (const v of g) if (dom[v] & (1 << x)) { cnt++; only = v; }
        if (cnt === 0) return false;
        if (cnt === 1 && popcount(dom[only]) > 1) {
          note(only, dom[only] & ~(1 << x), -1);
          dom[only] = 1 << x; changed = true;
        }
      }
    }
  }
  return true;
}

// solved: every suspect's weapon and room, and the killer, are settled (the whole notebook, not just the answer)
const answered = (csp, dom) => dom.every((d) => popcount(d) === 1);

// Probing: assume a candidate; if that leads to a contradiction, it can be crossed out.
function probe(csp, dom, depth, stats) {
  let progress = true;
  while (progress && !answered(csp, dom)) {
    progress = false;
    for (let v = 0; v < csp.nv; v++) {
      for (let x = 0; x < csp.n; x++) {
        if (!(dom[v] & (1 << x)) || popcount(dom[v]) === 1) continue;
        const trial = dom.slice();
        trial[v] = 1 << x;
        stats.probes++;
        let ok = propagate(csp, trial);
        if (ok && depth > 1 && !answered(csp, trial)) ok = probe(csp, trial, depth - 1, stats);
        if (!ok) {
          dom[v] &= ~(1 << x);
          if (!dom[v] || !propagate(csp, dom)) return false;
          progress = true;
        }
      }
    }
  }
  return true;
}

// How hard is this case for a careful human? depth 0 = elimination only, 1 = needs a what-if, 2 = nested what-ifs.
function humanDifficulty(ctx, clues, maxDepth) {
  const csp = buildCSP(ctx, clues);
  const dom = new Array(csp.nv).fill((1 << ctx.n) - 1);
  const stats = { probes: 0 };
  if (!propagate(csp, dom)) return { depth: -1, probes: 0 };
  // how many could still be the killer (the liar) once plain elimination stalls
  const open = popcount(dom[csp.K]);
  if (answered(csp, dom)) return { depth: 0, probes: 0, open, dom };
  for (let d = 1; d <= (maxDepth || 2); d++) {
    const t = dom.slice(); stats.probes = 0;
    if (probe(csp, t, d, stats) && answered(csp, t)) return { depth: d, probes: stats.probes, open, dom: t };
  }
  return { depth: 99, probes: stats.probes, open };
}

// ---- 40-generate.js
// Difficulty tiers. Every case has one statement per suspect (the killer's is a lie) plus a few pieces of
// evidence, which are always true. `ev` bounds the evidence after squeezing; `weights` steer which evidence is
// drawn (by family); `say` steers testimony; `avoid` keeps clue shapes out of a tier (for evidence and testimony).
const SPATIAL = ['murderFarFrom', 'murderNotAdjRoom', 'murderNextTo', 'murderAdjRoom', 'murderAheadOf', 'murderBehind', 'murderSameFloor',
  'notAdjacent', 'adjacent', 'weaponNear', 'diffFloor', 'ahead'];
const TIERS = {
  // The on-ramp: three suspects, plain evidence, and a lie that shows at a glance.
  constable: {
    id: 'constable', name: 'Constable', blurb: 'Three suspects. A gentle start.',
    n: 3, ev: [1, 4], maxDirect: 1, minTypes: 2,
    weights: { direct: 1.2, neg: 1.3, link: 1.0, rel: 0.4, murder: 1.3, trait: 1.4 },
    avoid: SPATIAL.concat(['diffType', 'notTypeInRoom', 'weaponNotIn', 'eitherIn', 'eitherHas', 'diffFloor', 'sameFloor', 'murderNotAdjRoom']),
    accept: (h) => h.depth === 0 || (h.depth === 1 && h.probes <= 8), stars: 1,
  },
  detective: {
    id: 'detective', name: 'Detective', blurb: 'Four suspects. Patient reasoning.',
    n: 4, ev: [2, 6], maxDirect: 1, minTypes: 3,
    weights: { direct: 0.5, neg: 1.0, link: 1.2, rel: 0.9, murder: 1.4, trait: 1.4 },
    // easy days keep "next to" for the evidence and keep it plain
    avoid: ['murderFarFrom', 'murderNotAdjRoom', 'murderNextTo', 'weaponNear', 'murderAheadOf', 'murderBehind', 'notAdjacent', 'murderAdjRoom'],
    accept: (h) => h.depth === 1 && h.probes <= 30, stars: 2,
  },
  inspector: {
    id: 'inspector', name: 'Inspector', blurb: 'Four suspects. Fewer gifts.',
    n: 4, ev: [2, 7], maxDirect: 0, minTypes: 3,
    weights: { direct: 0, neg: 1.0, link: 1.3, rel: 1.3, murder: 1.4, trait: 1.3 },
    accept: (h) => h.depth === 1 && h.probes >= 15 && h.probes <= 70 && h.open > 1, stars: 3,
  },
  // Sundays ask why as well: four suspects, and a motive each
  mastermind: {
    id: 'mastermind', name: 'Mastermind', blurb: 'Four suspects, four motives. Nothing given away.',
    n: 4, motives: true, ev: [3, 10], maxDirect: 0, minTypes: 4,
    weights: { direct: 0, neg: 0.9, link: 1.4, rel: 1.4, murder: 1.4, trait: 1.2 },
    accept: (h) => h.open > 1 && (h.depth === 2 || (h.depth === 1 && h.probes >= 25)), stars: 4,
  },
};

// How likely a suspect is to say each kind of thing. People mostly talk about where they were and what they
// held; liars mostly lie about themselves.
const SAY_WEIGHT = {
  has: 1.0, notHas: 1.0, in: 1.2, notIn: 1.0, eitherHas: 0.6, eitherIn: 0.6, holdsType: 0.9, notHoldsType: 0.9, sameType: 0.6, diffType: 0.5,
  adjacent: 0.6, notAdjacent: 0.5, sameFloor: 0.6, diffFloor: 0.5, ahead: 0.7, murderNotSuspect: 0.6, murderType: 0.7, murderNotType: 0.6,
  murderNotWeapon: 0.6, murderNotRoom: 0.7, murderFloor: 0.6, murderNotFloor: 0.5, murderAdjRoom: 0.4, murderNotAdjRoom: 0.3, murderTrait: 0.7,
  holdsAttr: 0.8, inLight: 0.8, murderAttr: 0.7, murderLight: 0.7, hasMotive: 0.9, notMotive: 0.9, eitherMotive: 0.6, murderMotive: 0.7, murderNotMotive: 0.6,
};

function pickN(rng, count, n) {
  return rng.shuffle([...Array(count).keys()]).slice(0, n).sort((a, b) => a - b);
}

function validPicks(world, ctx) {
  const types = ctx.types;
  const distinct = new Set(types).size;
  const dup = types.length - distinct;
  if (distinct < Math.min(3, ctx.n - 1) || (ctx.n >= 4 && dup < 1)) return false;
  if (world.relations.includes('floor') && new Set(ctx.floor).size < 2) return false;
  // at least two traits must tell tonight's suspects apart, or the cards are dead weight
  if (TRAIT_KEYS.filter((k) => new Set(ctx.traits.map((t) => t[k])).size > 1).length < 2) return false;
  // there must be some adjacency among the rooms in play, or the layout clues are dead weight
  let edges = 0;
  for (let i = 0; i < ctx.n; i++) for (let j = i + 1; j < ctx.n; j++) if (ctx.adj[i][j]) edges++;
  return edges >= (ctx.n >= 4 ? 2 : 1);
}

function attempt(rng, tier, worldId) {
  const world = WORLDS[worldId];
  const n = tier.n;
  let ctx, tries = 0;
  do {
    ctx = buildCtx(world, pickN(rng, world.suspects.length, n), pickN(rng, world.weapons.length, n), pickN(rng, world.rooms.length, n),
      tier.motives ? pickN(rng, MOTIVES.length, n) : null);
  } while (!validPicks(world, ctx) && ++tries < 200);

  const { perms, inv } = permutations(n), MP = motivePerms(ctx);
  const pw = perms[rng.int(perms.length)], pr = perms[rng.int(perms.length)];
  const truth = { pw, pr, m: rng.int(n) };
  if (ctx.motives) truth.pm = perms[rng.int(perms.length)];
  const avoid = (c) => tier.avoid && tier.avoid.includes(c.type);
  const all = enumerateClues(ctx);
  // a statement that is true (or false) whatever happened gives itself away: nobody says one
  const informative = (c) => {
    let yes = false, no = false;
    for (let a = 0; a < perms.length; a++) for (let b = 0; b < perms.length; b++) for (let k = 0; k < MP.perms.length; k++) {
      const v = c.test(perms[a], inv[a], perms[b], inv[b], MP.perms[k], MP.inv[k]);
      if (c.kind === 'M') { if (v) yes = true; if (v !== (1 << n) - 1) no = true; } else if (v) yes = true; else no = true;
      if (yes && no) return true;
    }
    return false;
  };

  // ---- testimony: one statement each. The innocent say something true, the killer something false.
  const says = [], usedKey = new Set();
  let directSaid = 0;
  for (let sp = 0; sp < n; sp++) {
    const liar = sp === truth.m;
    const cands = all.filter((c) => TESTIMONY_TYPES.includes(c.type) && !avoid(c) && !usedKey.has(c.type + JSON.stringify(c.args))
      && !(c.type === 'murderNotSuspect' && c.args.s === sp) && statementTrue(c, truth) !== liar
      && !(c.family === 'direct' && !liar && directSaid >= 1) && informative(c));
    if (!cands.length) return null;
    const perType = {};
    cands.forEach((c) => { perType[c.type] = (perType[c.type] || 0) + 1; });
    const w = cands.map((c) => {
      const self = clueSuspects(c).includes(sp);
      return (SAY_WEIGHT[c.type] || 0.5) / perType[c.type] * (self ? (liar ? 3 : 1.6) : 1);
    });
    const c = cands[rng.weighted(w)];
    usedKey.add(c.type + JSON.stringify(c.args));
    if (c.family === 'direct' && !liar) directSaid++;
    says.push(testimony(c, sp, n));
  }

  // ---- evidence: always true. Draw until exactly one world is left, then squeeze out what isn't needed.
  const pool = all.filter((c) => clueHolds(c, truth) && !avoid(c));
  const perType = {};
  pool.forEach((c) => { perType[c.type] = (perType[c.type] || 0) + 1; });
  const alive = pool.map(() => true);
  const usedType = {};
  let chosen = [];
  let direct = 0;
  let cur = newSurvivors(ctx), spare = newSurvivors(ctx);
  for (const t of says) { narrow(ctx, cur, t, spare); [cur, spare] = [spare, cur]; }
  let count = countSurvivingWorlds(ctx, cur);
  while (count > 1 && chosen.length < tier.ev[1] + 10) {
    // every kind of clue gets a fair turn, however many instances of it happen to be true
    const w = pool.map((c, j) => alive[j] ? (tier.weights[c.family] || 0) / perType[c.type] * Math.pow(0.3, usedType[c.type] || 0) : 0);
    const i = rng.weighted(w);
    if (i < 0) return null;
    alive[i] = false;
    const c = pool[i];
    if (c.family === 'direct' && direct >= tier.maxDirect) continue;
    narrow(ctx, cur, c, spare);
    const cnt = countSurvivingWorlds(ctx, spare);
    if (cnt >= count) continue; // adds nothing right now
    [cur, spare] = [spare, cur];
    chosen.push(c);
    usedType[c.type] = (usedType[c.type] || 0) + 1;
    if (c.family === 'direct') direct++;
    count = cnt;
  }
  if (count !== 1) return null;
  for (const c of rng.shuffle(chosen)) {
    const rest = chosen.filter((x) => x !== c);
    if (solveCount(ctx, says.concat(rest), 1).count === 1) chosen = rest;
  }
  if (chosen.length < tier.ev[0] || chosen.length > tier.ev[1]) return null;
  const typeCount = {};
  chosen.forEach((c) => { typeCount[c.type] = (typeCount[c.type] || 0) + 1; });
  if (Object.keys(typeCount).length < Math.min(tier.minTypes, chosen.length) || Math.max(...Object.values(typeCount)) > 2) return null;
  // the testimony has to matter: the evidence alone leaves more than one story
  if (solveCount(ctx, chosen, 1).count < 2) return null;
  // and the lie has to show: taken at their word, the statements and the evidence cannot all be true
  if (solveCount(ctx, says.map((t) => t.base).concat(chosen), 0).count !== 0) return null;
  const clues = says.concat(chosen);
  const human = humanDifficulty(ctx, clues, 2);
  if (human.depth < 0 || human.depth > 2) return null; // needs more than nested what-ifs: not a fair puzzle
  return { ctx, truth, says, chosen, human };
}

function generatePuzzle(seed, tierId, opts) {
  opts = opts || {};
  const tier = TIERS[tierId];
  const rng = makeRng(`${seed}|${tierId}`);
  const worldId = opts.world || rng.pick(Object.keys(WORLDS));
  let got = null, best = null, tries = 0;
  const maxTries = opts.maxTries || 120;
  while (!got && tries < maxTries) {
    const g = attempt(rng, tier, worldId);
    tries++;
    if (!g) continue;
    if (tier.accept(g.human)) got = g;
    else if (!best) best = g; // keep something fair in case the tier's taste is never met
  }
  const strict = !!got;
  got = got || best;
  if (!got) throw new Error(`could not build a ${tierId} case for seed ${seed}`);
  const { ctx, truth, says, chosen, human } = got;

  const word = (c, sp) => {
    const variants = clueVariants(c.base || c, ctx, sp);
    const vi = rng.int(variants.length);
    return Object.assign(c, { voice: variants[vi][0], text: variants[vi][1], vi, speaker: sp === undefined ? null : sp });
  };
  const clues = varyWording(says.map((t) => word(t, t.speaker)).concat(rng.shuffle(chosen).map((c) => word(Object.assign({}, c)))));
  const solution = { killer: truth.m, weapon: truth.pw[truth.m], room: truth.pr[truth.m], motive: truth.pm ? truth.pm[truth.m] : null };
  const rating = Math.max(1, Math.min(5, tier.stars + (human.probes >= 45 ? 1 : 0) - (human.depth === 0 ? 1 : 0)));
  return {
    seed: String(seed), tier: tierId, tierName: tier.name, worldId, n: ctx.n, ctx, clues,
    solution, truth, rating, human: { depth: human.depth, probes: human.probes }, tries, strict,
    story: pickStory(rng, ctx.world),
    title: rng.pick(titlePool(worldId)), // one draw; node retitle.js makes banked titles unique
  };
}

// ---- 45-bank.js
// Cases can be saved as small specs (what was picked, the hidden truth, the story, which clues in which wording)
// and rebuilt instantly, so curated cases ship with the page and load with no searching.
// A clue is [type, args, variant, speaker]: a speaker means testimony (true unless the speaker is the killer).
function exportPuzzle(p) {
  const { ctx } = p;
  return {
    s: p.seed, t: p.tier, w: p.worldId, ti: p.title, r: p.rating, h: [p.human.depth, p.human.probes], y: p.story,
    S: ctx.suspectIdx, W: ctx.weaponIdx, R: ctx.roomIdx, ...(ctx.motives ? { M: ctx.motiveIdx, pm: p.truth.pm } : {}),
    pw: p.truth.pw, pr: p.truth.pr, m: p.truth.m,
    c: p.clues.map((c) => [c.type, c.args, c.vi, c.speaker]),
  };
}

function importPuzzle(spec) {
  const world = WORLDS[spec.w];
  const ctx = buildCtx(world, spec.S, spec.W, spec.R, spec.M || null);
  const pool = enumerateClues(ctx);
  const key = (type, args) => type + JSON.stringify(args);
  const byKey = new Map(pool.map((c) => [key(c.type, c.args), c]));
  const clues = varyWording(spec.c.map(([type, args, vi, speaker]) => {
    const c = byKey.get(key(type, args));
    if (!c) throw new Error('bank clue not found: ' + type);
    const say = speaker !== null && speaker !== undefined;
    const v = clueVariants(c, ctx, say ? speaker : null)[vi];
    if (!v) throw new Error('bank clue variant not found: ' + type + ' ' + vi);
    const base = say ? testimony(c, speaker, ctx.n) : c;
    return Object.assign({}, base, { voice: v[0], speaker: say ? speaker : null, text: v[1], vi });
  }));
  const truth = { pw: spec.pw, pr: spec.pr, m: spec.m };
  if (spec.pm) truth.pm = spec.pm;
  const tier = TIERS[spec.t];
  return {
    seed: spec.s, tier: spec.t, tierName: tier.name, worldId: spec.w, n: ctx.n, ctx, clues,
    solution: { killer: truth.m, weapon: truth.pw[truth.m], room: truth.pr[truth.m], motive: truth.pm ? truth.pm[truth.m] : null },
    truth, rating: spec.r, human: { depth: spec.h[0], probes: spec.h[1] }, title: spec.ti, strict: true,
    story: spec.y || [0, 0, 0],
  };
}

  for (const s of W.suspects) for (const w of titleWords(`${s.name} ${s.short} ${s.role}`)) out.add(w);
  for (const r of W.rooms) for (const w of titleWords(`${r.name} ${r.short}`)) out.add(w);
  for (const x of W.weapons) for (const w of titleWords(`${x.name} ${x.short} ${x.note} ${x.type}`)) out.add(w);
  return out;
}
// the first banned word in a title, or null
function titleClash(worldId, title) {
  const ban = titleBanned(worldId);
  return titleWords(title).find((w) => ban.has(w) || ban.has(w + 's') || ban.has(w.replace(/s$/, '')) || ban.has(w.replace(/e?s$/, ''))) || null;
}
// every allowed title for a setting, in a fixed shuffled order so neighbouring days read differently
const TITLE_POOLS = {};
function titlePool(worldId) {
  if (TITLE_POOLS[worldId]) return TITLE_POOLS[worldId];
  const P = TITLE_PLACE[worldId], all = [];
  all.push(...TITLE_THE);
  for (const p of TITLE_PHRASE) for (const t of P.tails) all.push(`${p} ${t}`);
  for (const n of TITLE_OF) for (const o of P.owners) all.push(`The ${n} of ${o}`);
  const ok = [...new Set(all)].filter((t) => !titleClash(worldId, t));
  return (TITLE_POOLS[worldId] = makeRng('titles-' + worldId).shuffle(ok));
}

const LAUNCH = Date.UTC(2026, 9, 15); // Case No. 1

  set(k, v) { try { localStorage.setItem(STORE + ':' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },

function dayNumber(d) {
  d = d || new Date();
  return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - LAUNCH) / 864e5) + 1;
}
// ---- the daily rhythm. Everyone gets the same case each day, and the week has a shape, like a crossword:
// Monday three suspects, Tuesday to Saturday four (Thursday on, with fewer gifts), Sunday four with a motive each.
// Each kind of day takes the next case of its tier in bank order, so nothing repeats until a bank wraps round.
const WEEK_TIER = ['mastermind', 'constable', 'detective', 'detective', 'inspector', 'inspector', 'inspector']; // by getDay(): Sunday first
const TIER_LEVEL = { constable: 1, detective: 2, inspector: 3, mastermind: 4 };
const DAY_FEEL = {
  constable: 'The gentlest day: three suspects, and a lie that shows.',
  detective: 'Four suspects. Every statement earns its place.',
  inspector: 'Four suspects, fewer gifts. Expect to test a theory.',
  mastermind: 'Four suspects, four motives: find out why, as well as who.',
};
const DAY_GROUP = { constable: 'Mondays', detective: 'Tuesdays and Wednesdays', inspector: 'Thursdays to Saturdays', mastermind: 'Sundays' };
const todayN = () => Math.max(1, dayNumber());
// the calendar date of case No. n, at local midnight
function dateOfDay(n) {
  const L = new Date(LAUNCH);
  return new Date(L.getUTCFullYear(), L.getUTCMonth(), L.getUTCDate() + n - 1);
}
const weekdayOf = (n) => (((new Date(LAUNCH).getUTCDay() + n - 1) % 7) + 7) % 7;
// case No. n: its date, its kind of day, and which case of that tier it gets
function dailyFor(n) {
  const tier = WEEK_TIER[weekdayOf(n)], list = BANK[tier];
  const weeks = Math.floor((n - 1) / 7);
  let idx = weeks * WEEK_TIER.filter((t) => t === tier).length;
  for (let m = 1 + weeks * 7; m < n; m++) if (WEEK_TIER[weekdayOf(m)] === tier) idx++;
  return { n, date: dateOfDay(n), tier, idx, spec: list[idx % list.length] };
}
const dayName = (n, opts) => dateOfDay(n).toLocaleDateString('en-GB', opts || { weekday: 'long', day: 'numeric', month: 'long' });
// a gentle first case for someone new: the latest Monday not yet closed, or (before the first Monday) a practice
// case taken from the far end of the Monday bank, years away from being anyone's Monday
function gentleStart() {
  for (let n = todayN(); n >= 1; n--) if (weekdayOf(n) === 1 && !caseState(dailyFor(n).spec).solved) return { n };
  const list = BANK.constable;
  for (let i = list.length - 1; i >= 0; i--) if (!caseState(list[i]).solved) return { spec: list[i] };
  return { spec: list[list.length - 1] };
}

// ---- the pen: every mark is drawn by hand, slightly differently for each square, and the same way every time
function penRng(key) {
  let h = 2166136261;
  for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
}
// v: 1 your cross, 2 your circle, 3 a cross that follows, 4 a circle that follows (fainter). size: the square's side.
function penMark(v, key, size) {
  if (!v) return '';
  const r = penRng(key), j = (a) => (r() - 0.5) * a, c = size / 2, faint = v >= 3;
  const sw = (faint ? 1.7 : 2.5) * Math.max(0.55, Math.min(1, size / 40));
  let d;
  if (v === 1 || v === 3) {
    const p = size * 0.28, q = size - p, w = size / 46;
    d = `M${p + j(4 * w)} ${p + j(4 * w)} Q${c + j(5 * w)} ${c + j(5 * w)} ${q + j(4 * w)} ${q + j(3 * w)} M${q + j(4 * w)} ${p + j(4 * w)} Q${c + j(5 * w)} ${c + j(5 * w)} ${p + j(3 * w)} ${q + j(4 * w)}`;
  } else {
    const rad = size * 0.3, a0 = r() * 6.28, pts = [];
    for (let i = 0; i <= 26; i++) {
      const a = a0 + (i / 24) * 6.28, rr = rad * (1 + j(0.12) + (i > 23 ? 0.08 : 0));
      pts.push(`${(c + Math.cos(a) * rr * 1.06).toFixed(1)} ${(c + Math.sin(a) * rr).toFixed(1)}`);
    }
    d = 'M' + pts.join(' L');
  }
  return `<svg class="pen" viewBox="0 0 ${size} ${size}" aria-hidden="true"><path d="${d}" pathLength="1" fill="none" stroke="${faint ? 'var(--pen-faint)' : 'var(--pen)'}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
// a ring round an answer square, drawn when the case is closed
function penRing(key) {
  const r = penRng(key), j = (a) => (r() - 0.5) * a, a0 = r() * 6.28, pts = [];
  for (let i = 0; i <= 28; i++) {
    const a = a0 + (i / 25) * 6.28, rr = 19 * (1 + j(0.1) + (i > 25 ? 0.07 : 0));
    pts.push(`${(23 + Math.cos(a) * rr * 1.08).toFixed(1)} ${(23 + Math.sin(a) * rr).toFixed(1)}`);
  }
  return `<svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><path d="M${pts.join(' L')}" pathLength="1" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
// a tick: this piece of evidence has been used
function penTick(key) {
  const r = penRng(key), j = (a) => (r() - 0.5) * a;
  return `<svg class="tick" viewBox="0 0 22 20" aria-hidden="true"><path d="M3 ${11 + j(2)} Q7 ${15 + j(2)} 8.5 ${17 + j(1)} Q12 ${8 + j(3)} 19 ${3 + j(2)}" fill="none" stroke="var(--pen)" stroke-width="2.3" stroke-linecap="round"/></svg>`;
}

// Turns {s:i} {w:i} {r:i} in a clue into highlightable spans.
function tokens(text, ctx) {
  return esc(text).replace(/\{([swrmM]):(\d+)\}/g, (_, k, i) => {
    i = +i;
    if (k === 'm' || k === 'M') { const n = ctx.motives[i].name; return `<span class="tk m" data-ent="m${i}">${esc(k === 'm' ? n.toLowerCase() : n)}</span>`; }
    if (k === 's') return `<span class="tk s" data-ent="s${i}" style="--h:${ctx.suspects[i].hue}">${esc(ctx.suspects[i].short)}</span>`;
    if (k === 'w') return `<span class="tk w" data-ent="w${i}">${esc(ctx.weapons[i].name)}</span>`;
    return `<span class="tk r" data-ent="r${i}">${esc(ctx.rooms[i].name)}</span>`;
  });
}

// Marks you made: 0 blank, 1 crossed out, 2 confirmed. The notebook adds faint marks (3, 4) that follow:
// a circle crosses out the rest of its row and column; two circles that share a person or a weapon give the
// third square of the triangle (who, what, where); a statement marked as a lie circles its speaker under
// "Did it?", and one marked as true crosses them out.
const BLOCKS = ['sw', 'sr', 'wr', 'sm']; // who-what, who-where, what-where, who-why (all zeros without motives)
function derive(marks, n, say) {
  const d = { sw: marks.sw.map((r) => r.slice()), sr: marks.sr.map((r) => r.slice()), wr: marks.wr.map((r) => r.slice()), sm: marks.sm.map((r) => r.slice()), k: marks.k.slice() };
  const yes = (v) => v === 2 || v === 4, no = (v) => v === 1 || v === 3;
  if (say) say.forEach((v, s) => { if (d.k[s] === 0 && v) d.k[s] = v === 2 ? 4 : 3; });
  let changed = true, guard = 0;
  while (changed && guard++ < 40) {
    changed = false;
    const set = (b, i, j, v) => { if (d[b][i][j] === 0) { d[b][i][j] = v; changed = true; } };
    const killer = d.k.findIndex(yes);
    if (killer >= 0) for (let i = 0; i < n; i++) if (i !== killer && d.k[i] === 0) { d.k[i] = 3; changed = true; }
    if (killer < 0 && d.k.filter(no).length === n - 1) { const i = d.k.findIndex((v) => v === 0); if (i >= 0) { d.k[i] = 4; changed = true; } }
    for (const b of BLOCKS) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (yes(d[b][i][j])) {
      for (let k = 0; k < n; k++) { if (k !== j) set(b, i, k, 3); if (k !== i) set(b, k, j, 3); }
    }
    for (let s = 0; s < n; s++) for (let w = 0; w < n; w++) for (let r = 0; r < n; r++) {
      const a = d.sw[s][w], b = d.sr[s][r], c = d.wr[w][r];
      if (yes(a) && yes(b)) set('wr', w, r, 4);
      if (yes(a) && yes(c)) set('sr', s, r, 4);
      if (yes(b) && yes(c)) set('sw', s, w, 4);
      if (yes(a) && no(b)) set('wr', w, r, 3);
      if (yes(a) && no(c)) set('sr', s, r, 3);
      if (yes(b) && no(a)) set('wr', w, r, 3);
      if (yes(b) && no(c)) set('sw', s, w, 3);
      if (yes(c) && no(a)) set('sr', s, r, 3);
      if (yes(c) && no(b)) set('sw', s, w, 3);
    }
    // a row or column with one open square left and no circle: that square is the one
    for (const b of BLOCKS) for (let i = 0; i < n; i++) {
      const row = d[b][i];
      if (!row.some(yes) && row.filter((v) => v === 0).length === 1) set(b, i, row.indexOf(0), 4);
      const col = d[b].map((r) => r[i]);
      if (!col.some(yes) && col.filter((v) => v === 0).length === 1) set(b, col.indexOf(0), i, 4);
    }
  }
  return d;
}

// this week, Monday to Sunday: each day's difficulty, and a tick for the ones you closed
function weekHTML(n) {
  const mon = n - ((weekdayOf(n) + 6) % 7);
  const days = [...Array(7).keys()].map((k) => {
    const m = mon + k, wd = weekdayOf(m), tier = WEEK_TIER[wd];
    const short = WEEKDAY[wd].slice(0, 3), date = dateOfDay(m).getDate();
    const inner = `<span class="dname">${short}</span><span class="dnum">${date}</span>${dayDots(tier)}`;
    if (m < 1) return `<li><span class="day before" aria-hidden="true"><span class="dname">${short}</span><span class="dnum">${date}</span></span></li>`;
    if (m > n) return `<li><span class="day future" title="Opens at midnight on ${esc(dayName(m))}">${inner}<span class="sr">${esc(dayName(m))}, not yet</span></span></li>`;
    const s = caseState(dailyFor(m).spec), word = s.solved ? 'closed' : s.elapsed > 20 ? 'started' : 'not played';
    return `<li><button class="day${m === n ? ' is-today' : ''}${s.solved ? ' is-closed' : ''}" data-act="open-day" data-n="${m}" aria-label="${esc(dayName(m))}, No. ${m}, ${word}">${inner}<span class="dmark">${s.solved ? penTick('d' + m) : ''}</span></button></li>`;
  }).join('');
  return `<section class="week" aria-labelledby="week-label"><h2 id="week-label">This week</h2><ol class="days">${days}</ol>
    <p class="soft weekline">The week rises like a crossword: Monday is the gentlest, Sunday the hardest.</p></section>`;
}

// ---- the case screen: the story, the suspects (each with a statement), the evidence, the scene (a card for every
// weapon, room and motive, and the map, 45-plan.js) and the notebook (40-grid.js). One statement is always "in hand":
// it is pinned above the notebook, and what it talks about is lit in the notebook, on the cards and on the map.
// Wide screens show everything at once; narrower ones split the case into three panes (clues, notebook, scene)
// with a dock at the bottom.
const WIDE = matchMedia('(min-width: 1100px)');
const PHONE = matchMedia('(max-width: 760px)');
const SEAL = '<svg class="seal" viewBox="0 0 32 32" aria-hidden="true"><circle cx="13.5" cy="13.5" r="8.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 20L27 27" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="13.5" cy="13.5" r="3.2" fill="#D9452F"/></svg>';

// Inspector Mallory, who opens each case, gives the hints and closes the file
const MALLORY = { name: 'Inspector Mallory', hue: 210, traits: { hair: 'grey' }, look: { skin: '#E3B896', hair: 'short', acc: ['bowler', 'moustache'] } };
const malloryLine = (text, cls) => `<p class="${cls}">${face(MALLORY, 40)}<span><b>Inspector Mallory</b> ${esc(text)}</span></p>`;
const isSay = (c) => c.speaker !== null && c.speaker !== undefined;
// evidence is numbered in the order it is listed; testimony goes by who said it
function evidenceNo(i) { return G.puzzle.clues.slice(0, i + 1).filter((c) => !isSay(c)).length; }
function clueLabel(i) {
  const c = G.puzzle.clues[i];
  return isSay(c) ? `${G.puzzle.ctx.suspects[c.speaker].short}’s statement` : `evidence ${evidenceNo(i)}`;
}
function noteLabel(c) {
  const k = c.args.k;
  if (c.type === 'murderType' || c.type === 'murderNotType' || c.type === 'murderAttr') return ['body', 'The coroner'];
  if (c.type === 'murderTrait') return [k === 'hair' ? 'hair' : k === 'eyes' ? 'eye' : 'body', 'On the body'];
  if (c.type === 'murderNotWeapon') return ['lens', 'Forensics'];
  if (c.type === 'murderNotSuspect') return ['file', 'An alibi'];
  if (c.type.includes('Motive') || c.type.startsWith('motive')) return ['seal', 'The motive'];
  if (c.type.startsWith('murder')) return ['body', 'Police report'];
  if (c.type === 'traitWeapon' || c.type === 'traitRoom') return [k === 'hair' ? 'hair' : k === 'eyes' ? 'eye' : k === 'height' ? 'print' : 'lens', 'Forensics'];
  if (c.type === 'inLight' || c.type === 'weaponLight') return ['lamp', 'The lamps'];
  if (c.type === 'in' || c.type === 'notIn') return ['print', 'Footprints'];
  if (c.type === 'has' || c.type === 'notHas') return ['lens', 'Fingerprints'];
  return ['file', 'Case notes'];
}

// what a statement talks about: people, weapons, rooms, motives, a kind of weapon, a floor, the killer
function clueFocus(c) {
  const a = c.args, ctx = G.puzzle.ctx, idx = (arr, f) => arr.map((x, i) => (f(x) ? i : -1)).filter((i) => i >= 0);
  const f = { s: [], w: [], r: [], m: [], kind: a.t || null, floor: a.f === undefined ? null : a.f, k: c.type.startsWith('murder') };
  for (const k of ['s', 'a', 'b']) if (a[k] !== undefined) f.s.push(a[k]);
  if (a.w !== undefined) f.w.push(a.w);
  if (a.r !== undefined) f.r.push(a.r);
  if (a.m !== undefined) f.m.push(a.m);
  if (a.k && TRAITS[a.k]) ctx.traits.forEach((t, s) => { if (t[a.k] === a.v && !f.s.includes(s)) f.s.push(s); });
  if (a.k && WEAPON_ATTRS[a.k]) f.w.push(...idx(ctx.wattr[a.k], (x) => x === a.v));
  if (/Light$/.test(c.type) || c.type === 'inLight') f.r.push(...idx(ctx.light, (x) => x === a.v));
  if (isSay(c) && !f.s.includes(c.speaker) && ['has', 'notHas', 'in', 'notIn', 'holdsType', 'notHoldsType', 'holdsAttr', 'inLight', 'hasMotive', 'notMotive'].includes(c.type)) f.s.push(c.speaker);
  return f;
}

const TICK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

// a suspect, as a trading card: the portrait on a panel of their colour, their facts, and what they said
function suspectHTML(s, i, ctx) {
  const ci = G.puzzle.clues.findIndex((c) => c.speaker === i), c = G.puzzle.clues[ci];
  const say = G.say[i], on = ci === G.cur;
  const tut = G.mode === 'tutorial';
  return `<article class="suspect${on ? ' on' : ''}${say === 2 ? ' lie' : say === 1 ? ' true' : ''}" data-s="${i}" style="--h:${s.hue}">
    <div class="panel">${face(s, 96)}<span class="tag">Suspect ${'ABCDE'[i]}</span></div>
    <div class="body">
      <h3>${esc(s.name)}</h3><p class="role">${esc(cap(s.role))}</p>
      <ul class="facts" aria-label="${esc(s.short)}: ${TRAIT_KEYS.map((k) => TRAITS[k].values[s.traits[k]]).join(', ')}">${traitChips(s)}</ul>
      <button type="button" class="quote" data-act="pick-stmt" data-i="${ci}" aria-current="${on}"><span class="txt">${tokens(c.text, ctx)}</span></button>
      <div class="saytools" role="group" aria-label="${esc(s.short)}’s statement is">
        <button type="button" data-act="say" data-s="${i}" data-v="1" aria-pressed="${say === 1}">${TICK_SVG}True</button>
        <button type="button" data-act="say" data-s="${i}" data-v="2" aria-pressed="${say === 2}">${CROSS_SVG}A lie</button>
      </div>
      ${tut && on ? tryLine(ci) : ''}
    </div>
    ${say === 2 ? '<span class="stamp" aria-hidden="true">Liar</span>' : ''}
  </article>`;
}

// evidence, as a numbered tag on a string
function evidenceHTML(c, i, ctx) {
  const used = G.struck.includes(i), on = i === G.cur, [icon, label] = noteLabel(c), k = evidenceNo(i);
  return `<li class="ev${used ? ' used' : ''}${on ? ' on' : ''}" data-i="${i}">
    <button type="button" class="use" data-act="use" data-i="${i}" aria-pressed="${used}" aria-label="Evidence ${k}, ${used ? 'used' : 'not used yet'}"><span class="hole" aria-hidden="true"></span>${used ? penTick('t' + i) : `<span class="num">${k}</span>`}</button>
    <button type="button" class="evtext" data-act="pick-stmt" data-i="${i}" aria-current="${on}"><span class="evhead">${evIcon(icon)}${label}</span><span class="txt">${tokens(c.text, ctx)}</span>${G.mode === 'tutorial' && on ? tryLine(i) : ''}</button></li>`;
}

// the scene: a card for every weapon, room and (on Sundays) motive, with the facts the clues use
const chip = (icon, text) => `<li>${icon}${esc(text)}</li>`;
function weaponCardHTML(w, i) {
  return `<li class="tcard weapon" data-w="${i}"><span class="art">${weaponIcon(w, 'wi big')}</span>
    <div><b>${esc(w.name)}</b><span class="note">${esc(cap(w.note))}</span>
    <ul class="facts">${chip(glyph(w.type), KIND_WORD[w.type])}${chip(factIcon('weight'), cap(w.weight))}${chip(factIcon('material'), cap(w.material))}</ul></div></li>`;
}
function roomCardHTML(ctx, r) {
  const room = ctx.rooms[r], line = isLine(ctx);
  const where = line ? `${ordinal(roomOrder(ctx).indexOf(r) + 1)} from the engine` : floorLabel(ctx, ctx.floor[r]);
  return `<li class="tcard place${room.light === 'dark' ? ' dark' : ''}" data-room="${r}"><span class="art">${roomIcon(room, 'ri big')}</span>
    <div><b>${esc(room.name)}</b>
    <ul class="facts">${chip(factIcon('floor'), where)}${chip(factIcon(room.light), cap(LIGHT_WORD[room.light]))}</ul></div></li>`;
}
function motiveCardHTML(m, i) {
  return `<li class="tcard motive" data-m="${i}"><span class="art">${motiveIcon(m, 'mi big')}</span><div><b>${esc(m.name)}</b></div></li>`;
}
const ordinal = (k) => k + (['th', 'st', 'nd', 'rd'][(k % 100 >> 3) ^ 1 && k % 10] || 'th');

// the warm-up says what each statement asks of you
function tryLine(i) {

}

function caseHeadHTML() {

    </div></header>`;
}

          <div class="nb-bar"><div class="tabs" role="tablist" aria-label="Notebook blocks">

      ${dock('notebook', 'Notebook', '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16" stroke="currentColor" stroke-width="1.4"/></svg>')}
      ${dock('scene', 'Scene', '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.4"/></svg>')}</nav>`;

function renderClues() {
  const P = G.puzzle, ctx = P.ctx;
  const sus = document.getElementById('suspects');
  if (sus) sus.innerHTML = ctx.suspects.map((s, i) => suspectHTML(s, i, ctx)).join('');
  const ev = document.getElementById('evidence');
  if (ev) ev.innerHTML = P.clues.map((c, i) => (isSay(c) ? '' : evidenceHTML(c, i, ctx))).join('');
  renderStrip();
}
// the statement in hand, pinned above the notebook
function renderStrip() {
  const strip = document.getElementById('strip');
  if (!strip) return;
  const P = G.puzzle, ctx = P.ctx, i = G.cur, c = P.clues[i], say = isSay(c);
  const who = say ? `${face(ctx.suspects[c.speaker], 30)}<span><b>${esc(ctx.suspects[c.speaker].short)}</b> says</span>` : `${evIcon(noteLabel(c)[0])}<span><b>Evidence ${evidenceNo(i)}</b> · ${noteLabel(c)[1]}</span>`;
  strip.innerHTML = `<div class="nav"><span class="who">${who}</span>
      <button type="button" class="arrow" data-act="stmt-step" data-d="-1" aria-label="Previous statement">&lsaquo;</button>
      <button type="button" class="arrow" data-act="stmt-step" data-d="1" aria-label="Next statement">&rsaquo;</button></div>
    <p class="txt${say ? ' said' : ''}">${tokens(c.text, ctx)}</p>${G.mode === 'tutorial' ? `<p class="wnote" aria-live="polite">${WARM.note}</p>` : ''}`;
}

function selectStatement(i) {
  G.cur = i;
  renderClues();
  autoTab();
  applyFocus();
}
function stepStatement(d) {
  const len = G.puzzle.clues.length;
  selectStatement((G.cur + d + len) % len);
}
function toggleUsed(i) {
  const on = !G.struck.includes(i);
  G.struck = on ? G.struck.concat(i) : G.struck.filter((x) => x !== i);
  persist();
  renderClues();
  applyFocus();
}
// believe a statement, or call it a lie (pressing the same again clears it)
function setSay(s, v) {
  G.say[s] = G.say[s] === v ? 0 : v;
  persist();
  renderClues();
  paintAll();
  applyFocus();
  if (G.mode === 'tutorial') warmSay(s, G.say[s]);
}
function setPane(p) {
  G.pane = p;
  document.body.dataset.pane = p;
  const m = document.getElementById('case');
  if (m) m.dataset.pane = p;
  document.querySelectorAll('[data-act="pane"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pane === p)));
  if (p === 'notebook') fitGrid();
  window.scrollTo(0, 0);
}

// light up everything the statement in hand talks about
function applyFocus() {
  document.querySelectorAll('.hl').forEach((e) => e.classList.remove('hl'));
  if (!G) return;
  const ctx = G.puzzle.ctx, f = clueFocus(G.puzzle.clues[G.cur]);
  const lit = (sel) => document.querySelectorAll(sel).forEach((e) => e.classList.add('hl'));
  f.s.forEach((s) => lit(`[data-row="s${s}"]`));
  const ws = f.w.concat(f.kind ? ctx.types.map((t, i) => (t === f.kind ? i : -1)).filter((i) => i >= 0) : []);
  ws.forEach((w) => { lit(`[data-col="w${w}"]`); lit(`.tcard[data-w="${w}"]`); });
  f.m.forEach((m) => { lit(`[data-col="m${m}"]`); lit(`.tcard[data-m="${m}"]`); });
  if (f.kind) lit(`[data-kind="${f.kind}"]`);
  const rs = f.r.concat(f.floor === null ? [] : ctx.floor.map((fl, i) => (fl === f.floor ? i : -1)).filter((i) => i >= 0));
  rs.forEach((r) => { lit(`[data-col="r${r}"]`); lit(`[data-row="r${r}"]`); lit(`[data-room="${r}"]`); });
  if (f.floor !== null) lit(`[data-floor="${f.floor}"]`);
  if (f.k) lit('[data-col="k"]');
  // on a phone only one block shows: a dot on the others when the statement is about them too
  const touches = { sw: ws.length > 0 || (f.s.length > 0 && !rs.length && !f.m.length), sr: rs.length > 0, sm: f.m.length > 0, wr: ws.length > 0 && rs.length > 0 };
  document.querySelectorAll('[data-act="nbtab"]').forEach((b) => b.classList.toggle('has-cue', b.dataset.tab !== G.tab && touches[b.dataset.tab]));
}
// a statement only about weapons (or only about rooms) turns the phone notebook to that block by itself
function autoTab() {
  if (WIDE.matches) return;
  const f = clueFocus(G.puzzle.clues[G.cur]);
  const w = f.w.length > 0 || !!f.kind, r = f.r.length > 0 || f.floor !== null;
  if (f.m.length && !w && !r) setTab('sm');
  else if (w && r && !f.s.length) setTab('wr');
  else if (w !== r) setTab(w ? 'sw' : 'sr');
}

// ---- the notebook: the classic logic grid, as an L. A row per person: their weapon (grouped by kind, in the words
// the statements use), their room (grouped by floor, or front to back on the train), and "Did it?". Under the
// weapons, a row per room: which weapon was there. Fill in every square and the whole story is told.
// On a phone it shows one block at a time (who-what, who-where, what-where), chosen with the tabs.
const KIND_ORDER = ['blade', 'blunt', 'poison', 'cord', 'firearm'];
const KIND_WORD = { blade: 'Sharp', blunt: 'Blunt', cord: 'Cord', poison: 'Poison', firearm: 'Gun' };
// motive names, with places to break in a narrow column
const MOTIVE_SHORT = { revenge: 'Re&shy;venge', jealousy: 'Jeal&shy;ousy', blackmail: 'Black&shy;mail', ambition: 'Ambi&shy;tion', inheritance: 'Inheri&shy;tance' };
const isLine = (ctx) => ctx.world.layoutKind === 'line';
function weaponOrder(ctx) {
  return [...Array(ctx.n).keys()].sort((a, b) => KIND_ORDER.indexOf(ctx.types[a]) - KIND_ORDER.indexOf(ctx.types[b]) || a - b);
}
// rooms as you would read the plan: top floor first, left to right; carriages from the engine back
function roomOrder(ctx) {
  return [...Array(ctx.n).keys()].sort((a, b) => (isLine(ctx) ? 0 : ctx.floor[b] - ctx.floor[a]) || ctx.rooms[a].rect.x - ctx.rooms[b].rect.x);
}
function groupsOf(order, keyOf) {
  const g = [];
  order.forEach((x) => { const k = keyOf(x); if (!g.length || g[g.length - 1].key !== k) g.push({ key: k, items: [] }); g[g.length - 1].items.push(x); });
  return g;
}
// "in the cellar" -> "Cellar"
const floorLabel = (ctx, f) => cap(ctx.world.floors[f].replace(/^(in|on) the /, ''));

// one square: a button that holds a pen mark. data-r / data-c place it for the arrow keys.
function cellHTML(b, i, j, label, r, c, tdCls, col) {
  return `<td class="sq ${tdCls}" data-col="${col}"><button type="button" class="cell" data-grid="grid" data-r="${r}" data-c="${c}" data-b="${b}" data-i="${i}" data-j="${j}" data-v="-1" data-label="${esc(label)}" tabindex="${r === 0 && c === 0 ? 0 : -1}"></button></td>`;
}

function buildGrid() {
  const ctx = G.puzzle.ctx, el = document.getElementById('grid');
  if (!el) return;
  const WO = weaponOrder(ctx), RO = roomOrder(ctx), line = isLine(ctx), n = ctx.n, mot = !!ctx.motives;
  const wg = groupsOf(WO, (w) => ctx.types[w]), rg = groupsOf(RO, (r) => (line ? 'line' : ctx.floor[r]));
  const grp = (g, cls, attr, label) => `<th scope="colgroup" colspan="${g.items.length}" class="grp ${cls}" ${attr}><span>${label}</span></th>`;
  let h = '<thead><tr class="grps"><td class="corner"></td>';
  h += wg.map((g) => grp(g, 'wpart', `data-kind="${g.key}"`, KIND_WORD[g.key])).join('') + '<td class="gap"></td>';
  h += rg.map((g) => grp(g, 'rpart', line ? '' : `data-floor="${g.key}"`, line ? 'Engine end first' : floorLabel(ctx, g.key))).join('') + '<td class="gap rpart"></td>';
  if (mot) h += `<th scope="colgroup" colspan="${n}" class="grp mpart"><span>Motive</span></th><td class="gap mpart"></td>`;
  h += '<td class="kpart"></td></tr><tr class="names"><td class="corner"><span class="sr">Suspect</span></td>';
  h += WO.map((w) => `<th scope="col" class="c wpart" data-col="w${w}" title="${esc(ctx.weapons[w].name)}">${weaponIcon(ctx.weapons[w])}<span>${shortName(ctx.weapons[w])}</span></th>`).join('') + '<td class="gap"></td>';
  h += RO.map((r) => `<th scope="col" class="c rpart${ctx.rooms[r].light === 'dark' ? ' dark' : ''}" data-col="r${r}" title="${esc(ctx.rooms[r].name)}">${roomIcon(ctx.rooms[r])}<span>${shortName(ctx.rooms[r])}</span></th>`).join('') + '<td class="gap rpart"></td>';
  if (mot) h += ctx.motives.map((m, i) => `<th scope="col" class="c mpart" data-col="m${i}" title="${esc(m.name)}">${motiveIcon(m)}<span>${MOTIVE_SHORT[m.id] || esc(m.name)}</span></th>`).join('') + '<td class="gap mpart"></td>';
  h += '<th scope="col" class="c kpart" data-col="k"><svg class="ki" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M14.5 14.5L20 20" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span>Did it?</span></th></tr></thead><tbody>';
  ctx.suspects.forEach((S, s) => {
    let c = 0;
    h += `<tr class="srow"><th scope="row" data-row="s${s}">${face(S, 26)}<span class="who">${esc(S.short)}</span></th>`;
    h += WO.map((w) => cellHTML('sw', s, w, `${S.short} with the ${ctx.weapons[w].name}`, s, c++, 'wpart', `w${w}`)).join('') + '<td class="gap"></td>';
    h += RO.map((r) => cellHTML('sr', s, r, `${S.short} in the ${ctx.rooms[r].name}`, s, c++, 'rpart', `r${r}`)).join('') + '<td class="gap rpart"></td>';
    if (mot) h += ctx.motives.map((m, i) => cellHTML('sm', s, i, `${S.short}, motive ${m.name.toLowerCase()}`, s, c++, 'mpart', `m${i}`)).join('') + '<td class="gap mpart"></td>';
    h += cellHTML('k', s, 0, `${S.short} did it`, s, c++, 'kpart', 'k') + '</tr>';
  });
  // what was where: a row per room under the weapons
  const span = mot ? 3 * n + 4 : 2 * n + 3;
  h += `<tr class="rsep"><td colspan="${span + 1}"><span>${line ? 'Which weapon was in which carriage' : 'Which weapon was in which room'}</span></td></tr>`;
  RO.forEach((r, k) => {
    let c = 0;
    h += `<tr class="rrow"><th scope="row" data-row="r${r}">${roomIcon(ctx.rooms[r])}<span class="who">${esc(ctx.rooms[r].name)}</span></th>`;
    h += WO.map((w) => cellHTML('wr', w, r, `The ${ctx.weapons[w].name} in the ${ctx.rooms[r].name}`, n + 1 + k, c++, 'wpart', `w${w}`)).join('');
    h += `<td class="gap"></td><td class="void rpart" colspan="${span - n - 1}"></td></tr>`;
  });
  el.innerHTML = h + '</tbody>';
}

// Shrink the squares until the notebook fits its column (never below 30px, still a fair tap),
// and if that is not enough, set the labels smaller.
function fitGrid() {
  const g = document.getElementById('grid');
  if (!g || !g.parentElement.clientWidth) return;
  g.classList.remove('tight');
  g.style.removeProperty('--cell');
  const avail = g.parentElement.clientWidth, sq = [...g.querySelectorAll('td.sq')].find((x) => x.getClientRects().length);
  if (!sq) return;
  let c = Math.floor(sq.getBoundingClientRect().width);
  for (const tight of [false, true]) {
    g.classList.toggle('tight', tight);
    while (g.offsetWidth > avail && c > 30) g.style.setProperty('--cell', --c + 'px');
    if (g.offsetWidth <= avail) return;
  }
}

function setTab(tab) {
  G.tab = tab;
  const nb = document.getElementById('nb');
  if (nb) nb.dataset.tab = tab;
  document.querySelectorAll('[data-act="nbtab"]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  applyFocus();
  fitGrid();
}

// ---- marks
const markOf = (d, b, i, j) => (b === 'k' ? d.k[i] : d[b][i][j]);
const MARK_WORD = ['open', 'ruled out', 'a match', 'ruled out, follows from your marks', 'a match, follows from your marks'];
function paintAll() {
  if (!G) return;
  // in the warm-up, a mark the statements don't prove yet stays in pencil: drawn, but nothing follows from it
  const pencil = G.mode === 'tutorial' ? warmPencil() : null;
  const d = pencil && pencil.size ? stripPencil() : derive(G.marks, G.puzzle.n, G.say);
  document.querySelectorAll('.cell').forEach((el) => {
    const b = el.dataset.b, i = +el.dataset.i, j = +el.dataset.j, p = !!pencil && pencil.has(b + i + '-' + j);
    const v = p ? userMark(b, i, j) : markOf(d, b, i, j);
    const was = +el.dataset.v;
    if (was === v && (el.dataset.p === '1') === p) return;
    el.classList.toggle('fresh', was >= 0 && v > 0); // the pen draws a mark that has just appeared
    el.dataset.v = v;
    el.dataset.p = p ? '1' : '0';
    el.classList.toggle('pencil', p);

}
// once the case is closed, the killer's three squares are ringed in ink: did it, the weapon, the room
function paintAnswer() {
  const s = G.puzzle.solution, want = G.solved && G.mode !== 'tutorial' ? [['k', s.killer, 0], ['sw', s.killer, s.weapon], ['sr', s.killer, s.room], ['wr', s.weapon, s.room]].concat(s.motive === null ? [] : [['sm', s.killer, s.motive]]) : [];
  document.querySelectorAll('#grid .cell.answer').forEach((el) => { el.classList.remove('answer'); const r = el.parentNode.querySelector('.ring'); if (r) r.remove(); });
  for (const [b, i, j] of want) {
    const el = document.querySelector(`#grid .cell[data-b="${b}"][data-i="${i}"][data-j="${j}"]`);
    if (!el) continue;

function userMark(b, i, j) { return b === 'k' ? G.marks.k[i] : b === 'say' ? G.say[i] : G.marks[b][i][j]; }
// every change can be taken back. One step of Undo is one tap, one drag along a row, or one Clear all.
let undoStep = null; // the step being recorded while a drag is under way
function writeMark(b, i, j, v) { if (b === 'k') G.marks.k[i] = v; else if (b === 'say') G.say[i] = v; else G.marks[b][i][j] = v; }
function setMark(b, i, j, v) {
  const prev = userMark(b, i, j);
  if (prev === v) return;
  (undoStep || newUndoStep()).push([b, i, j, prev]);
  writeMark(b, i, j, v);
  persist();
  paintAll();
  if (G.mode === 'tutorial') warmAfter(b, i, j, v);
}
function newUndoStep() {
  const s = [];
  G.undo.push(s);
  if (G.undo.length > 300) G.undo.shift();
  return s;
}
function undo() {
  while (G.undo.length && !G.undo[G.undo.length - 1].length) G.undo.pop();
  const s = G.undo.pop();
  if (!s || G.solved) return;
  for (let k = s.length - 1; k >= 0; k--) writeMark(...s[k]);
  persist();
  if (s.some((x) => x[0] === 'say')) renderClues();
  paintAll();
  if (G.mode === 'tutorial') setWarmNote(s.length > 1 ? 'Those marks are back.' : 'Undone.');
}
function clearAll() {
  if (G.solved) return;
  const s = [], n = G.puzzle.n;
  for (const b of BLOCKS) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (G.marks[b][i][j]) s.push([b, i, j, G.marks[b][i][j]]);
  for (let i = 0; i < n; i++) if (G.marks.k[i]) s.push(['k', i, 0, G.marks.k[i]]);
  for (let i = 0; i < n; i++) if (G.say[i]) s.push(['say', i, 0, G.say[i]]);

  s.forEach(([b, i, j]) => writeMark(b, i, j, 0));

}
const cellInfo = (el) => ({ b: el.dataset.b, i: +el.dataset.i, j: +el.dataset.j });
const cycle = (el) => { const { b, i, j } = cellInfo(el); setMark(b, i, j, (userMark(b, i, j) + 1) % 3); };

// ---- input, wired once for every square on the page (notebook, plan, table, room sheet).
// Mouse: press to mark, drag to paint the same mark along a row. Touch: a tap, not a scroll. Keys: Space/Enter, arrows.
let drag = null, lastTouch = null;
function wireGrid() {
  document.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.cell');
    if (!c || !G || G.solved) return;
    if (e.pointerType === 'mouse') {
      if (e.button !== 0) return;
      e.preventDefault();
      const { b, i, j } = cellInfo(c), next = (userMark(b, i, j) + 1) % 3;
      drag = { v: next, b };
      undoStep = newUndoStep();
      setMark(b, i, j, next);
      if (c.focus) c.focus({ preventScroll: true });
    } else lastTouch = { c, x: e.clientX, y: e.clientY };
  });
  document.addEventListener('pointerover', (e) => {
    const c = e.target.closest('.cell');
    if (!c || !drag || e.buttons !== 1 || c.dataset.b !== drag.b) return;
    const { b, i, j } = cellInfo(c);
    if (userMark(b, i, j) !== drag.v) setMark(b, i, j, drag.v);
  });
  document.addEventListener('pointerup', (e) => {
    drag = null;
    undoStep = null;
    if (e.pointerType === 'mouse' || !lastTouch || !G || G.solved) { lastTouch = null; return; }
    const c = e.target.closest('.cell');
    if (c && c === lastTouch.c && Math.abs(e.clientX - lastTouch.x) < 8 && Math.abs(e.clientY - lastTouch.y) < 8) cycle(c);
    lastTouch = null;
  });
  document.addEventListener('click', (e) => { // keyboard activation only (pointer input is handled above)
    const c = e.target.closest('.cell');
    if (c && e.detail === 0 && G && !G.solved) cycle(c);
  });
  document.addEventListener('keydown', (e) => {
    const c = e.target.closest && e.target.closest('.cell[data-grid]');
    if (!c) return;
    const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!d) return;
    e.preventDefault();
    const all = [...document.querySelectorAll(`.cell[data-grid="${c.dataset.grid}"]`)].filter((x) => x.getClientRects().length);
    let r = +c.dataset.r, col = +c.dataset.c, t = null;
    for (let step = 0; step < 40 && !t; step++) {
      r += d[0]; col += d[1];
      t = all.find((x) => +x.dataset.r === r && +x.dataset.c === col);
      if (r < -1 || col < -1 || r > 40 || col > 40) break;
    }
    if (!t) return;
    c.tabIndex = -1; t.tabIndex = 0; t.focus();
  });
}

// ---- the map. It shows what "next to" means (a doorway or a stair between two rooms, a coupling between two

  return `<text class="room-name" x="${x}" y="${y}" style="font-size:${fs}px"><tspan>${svgText(parts[0])}-</tspan><tspan x="${x}" dy="${fs * 1.1}">${svgText(parts[1])}</tspan></text>`;

function buildPlan() {

function houseSVG(ctx) {
  const w = ctx.world, narrow = PHONE.matches;
  const u = narrow ? 40 : 72, rowH = narrow ? 104 : 118, padL = narrow ? 0 : 128;
  const inPlay = new Map(ctx.roomIdx.map((wi, li) => [wi, li]));
  let cols = 0, rows = 0;
  w.rooms.forEach((r) => { cols = Math.max(cols, r.rect.x + r.rect.w); rows = Math.max(rows, r.rect.y + r.rect.h); });
  const box = (r) => ({ x: padL + r.rect.x * u, y: r.rect.y * rowH, w: r.rect.w * u, h: r.rect.h * rowH });
  const fs = narrow ? 11.5 : 14.5;
  let g = '';
  for (let y = 0; y < rows; y++) {
    const f = rows - 1 - y;
    if (!narrow) g += `<text class="floor-name" data-floor="${f}" x="0" y="${y * rowH + 24}">${svgText(cap(w.floors[f].replace(/^(in|on) the /, '')))}</text>`;
  }
  w.rooms.forEach((room, wi) => {
    const b = box(room), r = inPlay.get(wi);
    if (r === undefined) {
      g += `<rect class="ghost" x="${b.x + 3}" y="${b.y + 3}" width="${b.w - 6}" height="${b.h - 6}" rx="4"/><text class="ghost-name" x="${b.x + 10}" y="${b.y + 22}" style="font-size:${fs - 1}px">${svgText(room.name)}</text>`;
      return;
    }
    const is = narrow ? 20 : 30;
    g += `<g class="room${room.light === 'dark' ? ' dark' : ''}" data-room="${r}">
      <rect class="floorspace" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="url(#pt-${room.pattern})"/>
      <rect class="shade" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>
      <rect class="lit" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>
      <svg class="ricon" x="${b.x + b.w - is - (narrow ? 5 : 9)}" y="${b.y + (narrow ? 5 : 8)}" width="${is}" height="${is}" viewBox="0 0 24 24" fill="currentColor">${ROOM_ICONS[room.id] || ''}</svg>
      ${roomLabel(room, b.x + (narrow ? 6 : 10), b.y + (narrow ? 17 : 23), fs, b.w - 14)}
      <g class="occupants" data-occ="${r}" transform="translate(${b.x + (narrow ? 5 : 9)} ${b.y + b.h - (narrow ? 34 : 44)})"></g></g>`;
  });
  // walls on top of the rooms, then the openings cut into them
  w.rooms.forEach((room, wi) => { if (inPlay.has(wi)) { const b = box(room); g += `<rect class="wall" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`; } });
  for (let i = 0; i < ctx.n; i++) for (let j = i + 1; j < ctx.n; j++) {
    if (!ctx.adj[i][j]) continue;
    const a = box(ctx.rooms[i]), b = box(ctx.rooms[j]);
    if (a.y === b.y) { // side by side: a doorway in the shared wall
      const x = a.x + a.w === b.x ? b.x : a.x, ym = a.y + a.h / 2;
      g += `<line class="door" x1="${x}" y1="${ym - 15}" x2="${x}" y2="${ym + 15}"/><path class="swing" d="M${x} ${ym - 15}A30 30 0 0 1 ${x + 15} ${ym + 11}"/>`;
    } else { // one above the other: a stair through the floor, near the right end of the overlap
      const top = a.y < b.y ? a : b, bot = a.y < b.y ? b : a;
      const hi = Math.min(top.x + top.w, bot.x + bot.w), mx = hi - (narrow ? 16 : 26), y = bot.y;
      g += `<line class="door" x1="${mx - 13}" y1="${y}" x2="${mx + 13}" y2="${y}"/><path class="stair" d="M${mx - 10} ${y + 10}h6.5v-6.5h6.5v-6.5h6.5v-6.5"/>`;
    }
  }

function trainSVG(ctx) {

  const inPlay = new Map(ctx.roomIdx.map((wi, li) => [wi, li]));

function updateSaid() {
  const ctx = G.puzzle.ctx, p = G.pick;
  const b = (t) => `<b>${esc(t)}</b>`;
  const who = p.killer === null ? '…' : b(ctx.suspects[p.killer].name);

const picked = () => { const p = G.pick; return p.killer !== null && p.weapon !== null && p.room !== null && (!G.puzzle.ctx.motives || (p.motive !== null && p.motive !== undefined)); };

// Which statement first rules out this exact accusation?
function firstContradiction(P, acc) {
  const { perms, inv } = permutations(P.n), MP = motivePerms(P.ctx);
  const A = [], B = [], Cm = [];
  perms.forEach((p, a) => { if (p[acc.killer] === acc.weapon) A.push(a); if (p[acc.killer] === acc.room) B.push(a); });
  MP.perms.forEach((p, c) => { if (!p || p[acc.killer] === acc.motive) Cm.push(c); });
  let alive = [];
  for (const a of A) for (const b of B) for (const c of Cm) alive.push([a, b, c]);
  for (let k = 0; k < P.clues.length; k++) {
    const cl = P.clues[k];
    alive = alive.filter(([a, b, c]) => {
      const v = cl.test(perms[a], inv[a], perms[b], inv[b], MP.perms[c], MP.inv[c]);
      return cl.kind === 'M' ? (v & (1 << acc.killer)) !== 0 : v;
    });
    if (!alive.length) return k + 1;
  }
  return null;
}

function submitAccuse() {
  const p = G.pick;
  if (!picked()) return;
  const res = checkAccusation(G.puzzle, p);
  if (res.killer && res.weapon && res.room && res.motive) { closeModal(); solveCase(); return; }
  G.wrong++; persist();
  const k = firstContradiction(G.puzzle, p);
  const box = document.getElementById('accuse-result');
  box.innerHTML = `<p class="miss"><b>Not quite.</b> ${k ? `That story breaks against <b>${esc(clueLabel(k - 1))}</b>.` : 'The statements do not support that.'} Wrong accusations so far: ${G.wrong}.</p>`;
}

function solveCase() {
  if (G.mode === 'tutorial') { G.solved = true; finishWarmup(); return; }
  const first = !G.solved && !(LS.get(G.key, {}) || {}).solved;
  G.solved = true; persist();
  if (first) {
    const st = loadStats(), t = G.puzzle.tier;
    st.solved[t] = (st.solved[t] || 0) + 1;
    st.best[t] = st.best[t] ? Math.min(st.best[t], G.elapsed) : G.elapsed;

function liarCore(P) {

  const plain = (i) => P.clues[i].base || P.clues[i];

  let core = P.clues.map((c, i) => i).filter((i) => i !== lieI);

  return { lieI, core };
}

function nextHint() {

    const v = G.marks[b][i][j];
    if (v === 2 && !M[b][i][j]) return { type: 'mistake', b, i, j, v };
    if (v === 1) {
      let rowAlt = false, colAlt = false;
      for (let k = 0; k < n; k++) { if (k !== j && M[b][i][k]) rowAlt = true; if (k !== i && M[b][k][j]) colAlt = true; }
      if (!rowAlt || !colAlt) return { type: 'mistake', b, i, j, v };
    }
  }
  const only = M.killer.reduce((a, x) => a + x, 0) === 1 ? M.killer.indexOf(1) : -1;
  for (let i = 0; i < n; i++) {
    if ((G.marks.k[i] === 2 || G.say[i] === 2) && !M.killer[i]) return { type: 'mistake', b: G.marks.k[i] === 2 ? 'k' : 'say', i, j: 0, v: 2 };

  const square = (v, x) => (v === csp.K ? ['k', x, 0] : v < n ? ['sw', v, x] : v < 2 * n ? ['sr', v - n, x] : v < csp.K ? ['sm', v - 2 * n, x] : null);

}
