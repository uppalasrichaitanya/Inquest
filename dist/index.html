<style>
/* Inquest, second edition: a green-and-cream crime paperback. A deep green band carries the name and the case;
   cream cards carry the suspects, the evidence and the notebook. Red is the pen (your marks) and the accusation;
   gold is the statement in hand and the solved answer. Fraunces for anything said aloud, Instrument Sans for the rest. */
:root {
  --bg: #EDE5D5;
  --card: #FBF8F1;
  --card-2: #F4EEE2;
  --ink: #1D1B17;
  --muted: #6A6358;
  --rule: #DCD2C0;
  --wash: #EFE6D3;
  --green: #1D5641;
  --green-2: #16473A;
  --on-green: #F4EEDF;
  --on-green-muted: #B9CDBF;
  --red: #BF3527;
  --pen: #C23526;
  --pen-faint: rgba(194, 53, 38, .36);
  --gold: #D99A1E;
  --gold-wash: #F7E5B9;
  --shadow: 0 1px 0 rgba(60, 45, 20, .06), 0 8px 24px -14px rgba(60, 45, 20, .35);
  --scrim: rgba(18, 28, 23, .5);
  --face-l: 82%;
  --fl-carpet: #E7D3C3; --fl-rug: #E3D7C2; --fl-tile: #F2EDE4; --fl-wood: #E2CBA6; --fl-green: #D7E3CB; --fl-leaf: #B8CCA6; --fl-stone: #D8D4CC; --fl-mark: rgba(70, 50, 30, .13);
  --serif: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --sans: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --gutter: 32px;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0E1512; --card: #172420; --card-2: #1B2A25; --ink: #ECE5D6; --muted: #9DA79F; --rule: #2C3B35; --wash: #20302A;
    --green: #143B2E; --green-2: #0F3026; --on-green: #F1EBDD; --on-green-muted: #9DB8A9;
    --red: #E2563F; --pen: #F06A50; --pen-faint: rgba(240, 106, 80, .4); --gold: #E9B44C; --gold-wash: #3A3220;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -14px rgba(0, 0, 0, .8); --scrim: rgba(0, 0, 0, .62); --face-l: 64%;
    --fl-carpet: #3B2F2B; --fl-rug: #36302A; --fl-tile: #2E3230; --fl-wood: #3A3125; --fl-green: #263428; --fl-leaf: #33462E; --fl-stone: #2E2F2D; --fl-mark: rgba(255, 240, 220, .08);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0E1512; --card: #172420; --card-2: #1B2A25; --ink: #ECE5D6; --muted: #9DA79F; --rule: #2C3B35; --wash: #20302A;
  --green: #143B2E; --green-2: #0F3026; --on-green: #F1EBDD; --on-green-muted: #9DB8A9;
  --red: #E2563F; --pen: #F06A50; --pen-faint: rgba(240, 106, 80, .4); --gold: #E9B44C; --gold-wash: #3A3220;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -14px rgba(0, 0, 0, .8); --scrim: rgba(0, 0, 0, .62); --face-l: 64%;
  --fl-carpet: #3B2F2B; --fl-rug: #36302A; --fl-tile: #2E3230; --fl-wood: #3A3125; --fl-green: #263428; --fl-leaf: #33462E; --fl-stone: #2E2F2D; --fl-mark: rgba(255, 240, 220, .08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
button, .cell { -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--sans);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 var(--gutter); }
.soft { color: var(--muted); font-size: 14.5px; }
.kicker { margin: 0; font: 600 12.5px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---- the band: the name, and a few tools. Every screen opens on it. */
.band { background: var(--green); color: var(--on-green); }
.bar { position: sticky; top: 0; z-index: 30; background: var(--green); color: var(--on-green); padding-top: env(safe-area-inset-top, 0px); }
.bar .wrap { display: flex; align-items: center; gap: 8px 14px; min-height: 60px; }
.wordmark { margin-right: auto; display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; color: var(--on-green); font: 700 21px/1 var(--serif); letter-spacing: .16em; text-transform: uppercase; font-variation-settings: 'opsz' 40, 'SOFT' 50; }
.wordmark .seal { width: 26px; height: 26px; flex: none; }
.navlink { white-space: nowrap; background: none; border: 0; padding: 8px 4px; color: var(--on-green-muted); font: 500 15px/1 var(--sans); }
.navlink:hover { color: var(--on-green); }
.iconbtn { width: 38px; height: 38px; padding: 0; border: 1px solid rgba(255, 255, 255, .22); border-radius: 50%; background: none; display: inline-grid; place-items: center; color: var(--on-green); }
.iconbtn:hover { border-color: var(--on-green); }
.iconbtn svg { width: 18px; height: 18px; }

/* ---- buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--green); color: var(--on-green); border: 0; border-radius: 999px; padding: 12px 22px; font: 600 16px/1.1 var(--sans); letter-spacing: .01em; box-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
.btn:hover { filter: brightness(1.08); }
.btn.red { background: var(--red); color: #FFF8F0; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rule); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1.5px var(--ink); filter: none; }
.btn.big { padding: 15px 30px; font-size: 18px; }
.btn[disabled], .btn[aria-disabled='true'] { opacity: .45; cursor: not-allowed; }
.band .btn.ghost { color: var(--on-green); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .3); }
.link { background: none; border: 0; padding: 4px 0; color: inherit; font: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.link:hover { text-decoration-color: currentColor; }

/* ---- a suspect's face, in a disc of their colour */
.face { --h: 20; --fs: 48px; display: inline-grid; flex: none; width: var(--fs); height: var(--fs); border-radius: 50%; overflow: hidden; background: hsl(var(--h) 42% var(--face-l)); box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .06); }
.face svg { width: 100%; height: 100%; display: block; }
.wi { width: 1.25em; height: 1.25em; flex: none; vertical-align: -.25em; }
.kg { width: 1em; height: 1em; flex: none; vertical-align: -.12em; color: var(--muted); }
.evi { width: 22px; height: 22px; flex: none; color: var(--green); }
.pen { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.level { display: inline-flex; gap: 4px; vertical-align: .05em; }
.level i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; opacity: .8; }
.level i.on { background: currentColor; opacity: 1; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -.05em; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .2); }

.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; max-width: min(520px, calc(100vw - 32px)); font-size: 15px; box-shadow: var(--shadow); }

@media (max-width: 760px) {
  :root { --gutter: 16px; }
  .bar .wrap { min-height: 54px; gap: 4px 6px; }
  .wordmark { font-size: 18px; letter-spacing: .12em; }
  .wordmark .seal { width: 22px; height: 22px; }
  .navlink { font-size: 14px; padding: 8px 3px; }
  .iconbtn { width: 34px; height: 34px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

/* ---- home and past cases */
.hero { padding: 34px 0 96px; }
.hero h1 { margin: 10px 0 14px; max-width: 15em; font: 600 clamp(36px, 5.6vw, 66px)/1.02 var(--serif); letter-spacing: -.02em; font-variation-settings: 'opsz' 144, 'SOFT' 30; text-wrap: balance; }
.hero h1 em { font-style: italic; color: var(--gold); font-weight: 500; }
.hero .kicker { color: var(--on-green-muted); }
.hero .lede { margin: 0; max-width: 40em; color: var(--on-green-muted); font-size: 17.5px; }
.hero .cta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 22px; color: var(--on-green-muted); font-size: 15px; }
.hero.slim { padding-bottom: 72px; }
.hero.slim h1 { font-size: clamp(34px, 4.6vw, 52px); }
.hero.slim .link { color: var(--on-green); }

.home { position: relative; margin-top: -64px; padding-bottom: 72px; }
.today { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px 40px; align-items: center; padding: 34px 38px; }
.today h2 { margin: 8px 0 8px; font: 600 clamp(30px, 3.6vw, 44px)/1.05 var(--serif); letter-spacing: -.01em; font-variation-settings: 'opsz' 96; text-wrap: balance; }
.today .where { margin: 0; color: var(--muted); max-width: 36em; }
.today .feel { margin: 10px 0 0; font: italic 500 18px/1.4 var(--serif); }
.today .go { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 22px; }
.state { font-size: 14.5px; color: var(--muted); }
.state.done { color: var(--green); font-weight: 600; }
.gentle { margin: 18px 0 0; padding: 12px 16px; background: var(--wash); border-radius: 10px; font-size: 15px; }
.gentle .link { margin-left: 6px; font-weight: 600; }
.lineup { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--cols, 3), auto); gap: 14px 16px; justify-content: end; }
.lineup:has(li:nth-child(4)) { --cols: 2; }
.lineup:has(li:nth-child(5)) { --cols: 3; }
.lineup li { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--muted); }

.week { margin-top: 30px; }
.week h2, .wk h2 { margin: 0 0 12px; font: 600 22px/1.2 var(--serif); }
.days { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.day { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 4px 14px; border: 0; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); color: var(--ink); }
.day .dname { font: 600 12px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.day .dnum { font: 600 24px/1.1 var(--serif); }
.day .level { color: var(--green); }
.day.is-today { background: var(--green); color: var(--on-green); }
.day.is-today .dname { color: var(--on-green-muted); }
.day.is-today .level { color: var(--gold); }
.day.future, .day.before { opacity: .45; box-shadow: none; background: transparent; outline: 1.5px dashed var(--rule); outline-offset: -1.5px; }
.day .dmark { position: absolute; top: 6px; right: 6px; width: 22px; height: 20px; }
.day .tick { width: 22px; height: 20px; }
button.day:hover { transform: translateY(-1px); }
.weekline { margin: 12px 0 0; }
.home .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin-top: 30px; }
.home .row .grow { flex: 1; }

/* past cases */
.archive .filters { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 20px; }
.archive .filters button { border: 0; border-radius: 999px; padding: 8px 15px; background: var(--card); box-shadow: var(--shadow); font: 500 14.5px/1 var(--sans); }
.archive .filters button[aria-pressed='true'] { background: var(--ink); color: var(--bg); }
.wk { margin-top: 30px; }
.cases { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.case-row { width: 100%; display: grid; grid-template-columns: 170px auto minmax(0, 1fr) auto; gap: 8px 20px; align-items: center; padding: 14px 20px; border: 0; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); text-align: left; color: var(--ink); }
.case-row:hover { box-shadow: var(--shadow), inset 0 0 0 1.5px var(--green); }
.case-row .who, .case-row .today, .case-row .how { display: flex; flex-direction: column; gap: 2px; }
.case-row .day-name { font-weight: 600; }
.case-row .line { font-size: 14px; color: var(--muted); }
.case-row .title { font: 600 18px/1.25 var(--serif); }
.case-row .faces { display: flex; }
.case-row .faces .face { margin-left: -6px; box-shadow: 0 0 0 2px var(--card); }
.case-row .faces .face:first-child { margin-left: 0; }
.case-row .how { align-items: flex-end; color: var(--green); }

@media (max-width: 860px) {
  .today { grid-template-columns: 1fr; padding: 26px 22px; }
  .lineup { justify-content: start; grid-template-columns: repeat(5, auto); }
  .lineup .face { --fs: 64px !important; }
}
@media (max-width: 760px) {
  .hero { padding: 24px 0 84px; }
  .hero .lede { font-size: 16px; }
  .home { margin-top: -60px; }
  .today h2 { font-size: 30px; }
  .lineup { gap: 10px 10px; }
  .lineup .face { --fs: 54px !important; }
  .lineup li { font-size: 12px; }
  .days { gap: 5px; }
  .day { padding: 9px 2px 10px; border-radius: 10px; }
  .day .dname { font-size: 10.5px; letter-spacing: .05em; }
  .day .dnum { font-size: 19px; }
  .day .level { gap: 2px; }
  .day .level i { width: 6px; height: 6px; }
  .day .dmark { top: 2px; right: 2px; width: 16px; height: 15px; }
  .case-row { grid-template-columns: minmax(0, 1fr) auto; padding: 14px 16px; }
  .case-row .who { grid-column: 1; }
  .case-row .faces { grid-column: 2; grid-row: 1; }
  .case-row .today { grid-column: 1 / -1; }
  .case-row .how { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
}

/* ---- the case screen */
.bar .accuse { margin-left: 6px; padding: 10px 20px; }
.case-head { padding: 26px 0 92px; }
.case-head .kicker { color: var(--on-green-muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.case-head .kicker .level { color: var(--gold); }
.sep { display: inline-block; width: 4px; height: 4px; margin: 0 8px; vertical-align: .2em; border-radius: 50%; background: currentColor; opacity: .5; }
.case-head .kicker .sep { margin: 0; }
.case-head h1 { margin: 10px 0 0; font: 600 clamp(36px, 5vw, 62px)/1.02 var(--serif); letter-spacing: -.02em; font-variation-settings: 'opsz' 144, 'SOFT' 30; text-wrap: balance; max-width: 18em; }
.case-head .closed { margin: 10px 0 0; display: inline-block; padding: 4px 12px; border: 2px solid var(--gold); border-radius: 4px; color: var(--gold); font: 700 13px/1.2 var(--sans); letter-spacing: .16em; text-transform: uppercase; transform: rotate(-2deg); }
.case-head .closed:empty { display: none; }
.story { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px 48px; margin-top: 18px; }
.story .scene { margin: 0; font: 400 19px/1.5 var(--serif); font-variation-settings: 'opsz' 24; max-width: 36em; }
.story .victim { margin: 0; color: var(--on-green-muted); font-size: 15.5px; align-self: end; }
.story .victim .kicker { display: block; margin-bottom: 4px; color: var(--gold); }
.mallory-line { display: flex; align-items: center; gap: 12px; margin: 18px 0 0; max-width: 46em; font: italic 400 16.5px/1.45 var(--serif); color: var(--on-green); }
.mallory-line b { font: 700 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; font-style: normal; color: var(--gold); margin-right: 6px; }
.signoff { display: flex; align-items: center; gap: 12px; margin: 0 0 14px !important; padding: 12px 14px; border-radius: 12px; background: var(--wash); text-align: left; font: italic 400 16.5px/1.4 var(--serif); }
.signoff b { display: block; font: 700 11.5px/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; font-style: normal; color: var(--green); }
.case-head .rule { margin: 18px 0 0; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, .16); color: var(--on-green-muted); font-size: 15.5px; max-width: 58em; }
.case-head .rule b { color: var(--on-green); }
.case-head .rule em { color: var(--gold); font-style: normal; font-weight: 600; }

.case { position: relative; margin-top: -64px; padding-bottom: 80px; display: grid; grid-template-columns: minmax(0, 470px) minmax(0, 1fr); gap: 28px; align-items: start; }
.col-work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; position: sticky; top: 76px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 30px 0 12px; }
.col-clues > .sec-head:first-child { margin-top: 0; }
.col-clues > .sec-head:first-child h2 { color: var(--on-green); }
.col-clues > .sec-head:first-child .soft { color: var(--on-green-muted); }
.sec-head h2, .nb-head h2 { margin: 0; font: 600 23px/1.2 var(--serif); }
.sec-head .soft { margin: 0; }

/* suspects: a card each, with their statement in a speech bubble */
.suspects { display: grid; gap: 14px; }
.suspect { position: relative; overflow: hidden; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px 14px; border-left: 5px solid hsl(var(--h) 40% 55%); }
.suspect header { display: flex; gap: 14px; align-items: center; }
.suspect h3 { margin: 0; font: 600 19px/1.15 var(--serif); }
.suspect .role { margin: 3px 0 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
.traits { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.traits li { padding: 3px 10px; border-radius: 999px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--rule); font-size: 13px; font-weight: 600; color: var(--muted); }
.traits li.hl, .suspect.hl-trait .traits li { color: var(--ink); }
.quote { position: relative; display: block; width: 100%; margin: 14px 0 0; padding: 12px 16px; border: 0; border-radius: 4px 14px 14px 14px; background: var(--wash); text-align: left; font: italic 400 18px/1.45 var(--serif); font-variation-settings: 'opsz' 24; color: var(--ink); }
.quote::before { content: '“'; position: absolute; left: -2px; top: -16px; font: 700 46px/1 var(--serif); color: hsl(var(--h) 40% 55%); }
.quote:hover { box-shadow: inset 0 0 0 1.5px var(--rule); }
.suspect.on .quote { background: var(--gold-wash); box-shadow: inset 0 0 0 2px var(--gold); }
.saytools { display: flex; gap: 8px; margin-top: 10px; }
.saytools button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border: 0; border-radius: 999px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--rule); font: 600 13.5px/1 var(--sans); color: var(--muted); }
.saytools button svg { width: 14px; height: 14px; }
.saytools button:hover { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.saytools button[data-v='1'][aria-pressed='true'] { background: var(--green); color: var(--on-green); box-shadow: none; }
.saytools button[data-v='2'][aria-pressed='true'] { background: var(--red); color: #FFF8F0; box-shadow: none; }
.suspect.true .quote { opacity: .85; }
.suspect.lie .quote .txt { text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 2px; }
.stamp { position: absolute; right: 14px; top: 14px; padding: 3px 10px; border: 2.5px solid var(--red); border-radius: 4px; color: var(--red); font: 800 15px/1.1 var(--sans); letter-spacing: .18em; text-transform: uppercase; transform: rotate(8deg); opacity: .9; pointer-events: none; }
.suspect .try, .ev .try { display: block; margin-top: 10px; padding: 9px 12px; border-radius: 10px; background: var(--gold-wash); font: 500 14.5px/1.4 var(--sans); color: var(--ink); }
.nudge { animation: nudge 1.4s ease 2; }
@keyframes nudge { 50% { box-shadow: 0 0 0 4px var(--gold); } }

/* the evidence */
.evidence { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ev { display: grid; grid-template-columns: 40px minmax(0, 1fr); background: var(--card); border-radius: 12px; box-shadow: var(--shadow); }
.ev .use { position: relative; align-self: stretch; padding: 14px 0 0; border: 0; border-right: 1px dashed var(--rule); background: none; color: var(--muted); font: 700 15px/1 var(--sans); }
.ev .use .tick { width: 22px; height: 20px; }
.ev .evtext { display: block; width: 100%; padding: 12px 16px 14px; border: 0; background: none; text-align: left; font: 400 16.5px/1.45 var(--sans); color: var(--ink); }
.ev .evhead { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; font: 700 12px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--green); }
.ev .evhead .evi { width: 18px; height: 18px; }
.ev.used .txt { color: var(--muted); }
.ev.on { box-shadow: var(--shadow), inset 0 0 0 2px var(--gold); background: var(--gold-wash); }
.tk.s { font-weight: 600; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: hsl(var(--h) 45% 55% / .8); }
.tk.w { font-weight: 600; }
.tk.r { font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: .03em; }
.quote .tk { font-style: italic; }

.weapons { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.weapons li { display: flex; gap: 12px; align-items: center; padding: 10px 14px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); }
.weapons li .wi { width: 30px; height: 30px; color: var(--green); }
.weapons li > span { display: flex; flex-direction: column; line-height: 1.3; }
.weapons li b { font-size: 15px; }
.weapons li .soft { font-size: 13px; }
.weapons li.hl { box-shadow: var(--shadow), inset 0 0 0 2px var(--gold); }

/* the notebook */
.notebook, .map { padding: 20px 22px 22px; }
.nb-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; }
.howmark { margin: 0; color: var(--muted); font-size: 14px; }
.mini { position: relative; display: inline-block; width: 18px; height: 18px; vertical-align: -4px; }
.nb-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
.nbtools { display: flex; gap: 16px; margin-left: auto; font-size: 14.5px; }
.nbtools .link[disabled] { opacity: .4; cursor: default; }
.tabs { display: none; }
.wnote { margin: 12px 0 0; padding: 11px 14px; border-radius: 10px; background: var(--gold-wash); font-size: 15px; line-height: 1.45; }
.wnote:empty { display: none; }
.wnote .aside { display: block; margin-top: 4px; color: var(--muted); }
.tablewrap { margin-top: 10px; overflow-x: auto; }
.grid { --cell: 46px; border-collapse: separate; border-spacing: 0; }
.grid th, .grid td { padding: 0; font-weight: 400; }
.grid .gap { width: 10px; min-width: 10px; }
.grid .grps .grp { vertical-align: bottom; text-align: left; padding-right: 4px; }
.grid .grps .grp span { display: block; padding: 0 0 3px 2px; border-bottom: 2px solid var(--rule); font: 700 11px/1.15 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.grid .grps .grp.hl span { color: var(--ink); border-bottom-color: var(--gold); }
.grid .names th.c { width: var(--cell); min-width: var(--cell); vertical-align: bottom; text-align: center; padding: 8px 1px 7px; font-size: 12px; font-weight: 600; line-height: 1.12; hyphens: manual; color: var(--muted); }
.grid .names th.c .wi { display: block; margin: 0 auto 4px; width: 22px; height: 22px; color: var(--green); }
.grid .names th.c.hl, .grid td.sq.hl { background: var(--gold-wash); }
.grid .names th.c.hl { color: var(--ink); }
.grid tbody th { text-align: left; padding-right: 10px; font-size: 15px; font-weight: 600; white-space: nowrap; }
.grid tbody th .face { --fs: 26px; vertical-align: middle; margin-right: 8px; }
.grid tbody th.hl .who { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 3px; text-underline-offset: 4px; }
.grid td.sq { width: var(--cell); min-width: var(--cell); height: var(--cell); position: relative; background: var(--card); border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.grid tbody tr.srow:first-child td.sq, .grid tr.rsep + tr.rrow td.sq { border-top: 1px solid var(--rule); }
.grid td.sq:first-of-type, .grid td.gap + td.sq { border-left: 1px solid var(--rule); }
.grid td.sq.kpart { border-left: 2px solid var(--ink); background: var(--card-2); }
.grid .cell { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; }
.grid .cell:hover { background: var(--wash); }
.grid .cell:focus-visible { outline-offset: -3px; }
.grid .cell.pencil .pen { opacity: .45; filter: grayscale(1); }
.grid .ring { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); pointer-events: none; }
.grid tr.rsep td { padding: 18px 0 6px; }
.grid tr.rsep span { font: 700 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.grid tr.rrow th { font-weight: 500; font-size: 14px; }
.grid td.void { border: 0; }
.grid.tight .names th.c { font-size: 10.5px; }
.grid.tight tbody th { white-space: normal; line-height: 1.1; max-width: 96px; font-size: 13px; }
.grid.tight tbody th .face { display: none; }

/* the map */
.house { margin-top: 12px; }
.plan-svg { display: block; width: 100%; height: auto; font-family: var(--sans); }
.plan-svg .floor-name { font: 700 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; fill: var(--muted); }
.plan-svg .floor-name.hl { fill: var(--ink); }
.plan-svg .room .lit { fill: var(--gold); opacity: 0; transition: opacity .2s; }
.plan-svg .room.hl .lit { opacity: .28; }
.plan-svg .room.scene .lit { fill: var(--red); opacity: .2; }
.plan-svg .wall { fill: none; stroke: var(--ink); stroke-width: 3; }
.plan-svg .door { stroke: var(--card); stroke-width: 6; }
.plan-svg .swing { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.plan-svg .stair { fill: none; stroke: var(--ink); stroke-width: 2; }
.plan-svg .room-name { font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.plan-svg .ghost { fill: none; stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 4 4; }
.plan-svg .ghost-name { fill: var(--muted); opacity: .7; font-size: 13px; font-style: italic; }
.plan-svg .coupling { stroke: var(--ink); stroke-width: 4; }
.plan-svg .engine { fill: var(--green); }
.plan-svg .engine circle { fill: var(--ink); }
.plan-svg .pin-ring { fill: none; stroke: var(--card); stroke-width: 2; }
.plan-svg .pin-w circle { fill: var(--card); stroke: var(--green); stroke-width: 1.5; }
.plan-svg .pin-w { color: var(--green); }

/* the statement in hand, above the notebook (narrow screens only) */
.strip { display: none; }
.dock { display: none; }

/* ---- narrow: three panes and a dock */
@media (max-width: 1099px) {
  .case { display: block; margin-top: -56px; padding-bottom: 110px; }
  .col-work { position: static; gap: 14px; }
  .case[data-pane='clues'] .col-work, .case:not([data-pane='clues']) .col-clues { display: none; }
  .case[data-pane='notebook'] .map, .case[data-pane='map'] .notebook { display: none; }
  .strip { display: block; position: sticky; top: 60px; z-index: 15; padding: 12px 16px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border-top: 3px solid var(--gold); }
  .strip .nav { display: flex; align-items: center; gap: 8px; }
  .strip .who { display: flex; align-items: center; gap: 8px; margin-right: auto; font-size: 14px; color: var(--muted); }
  .strip .who b { color: var(--ink); }
  .strip .arrow { width: 38px; height: 34px; border: 0; border-radius: 999px; background: var(--wash); font-size: 22px; line-height: 1; }
  .strip .txt { margin: 8px 0 0; font-size: 16px; line-height: 1.45; }
  .strip .txt.said { font: italic 400 17.5px/1.45 var(--serif); }
  .strip .wnote { margin-top: 10px; }
  .notebook .wnote { display: none; }
  .tabs { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--wash); }
  .tabs button { position: relative; border: 0; border-radius: 999px; padding: 7px 12px; background: none; font: 600 13.5px/1 var(--sans); color: var(--muted); white-space: nowrap; }
  .tabs button[aria-selected='true'] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .tabs button.has-cue::after { content: ''; position: absolute; top: 3px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
  .nb-bar { flex-wrap: wrap; }
  #nb[data-tab='sw'] .rpart, #nb[data-tab='sw'] tr.rrow, #nb[data-tab='sw'] tr.rsep,
  #nb[data-tab='sr'] .wpart, #nb[data-tab='sr'] tr.rrow, #nb[data-tab='sr'] tr.rsep,
  #nb[data-tab='wr'] .rpart, #nb[data-tab='wr'] .kpart, #nb[data-tab='wr'] tr.srow, #nb[data-tab='wr'] tr.rsep { display: none; }
  #nb[data-tab='sr'] .gap:not(.rpart) { display: none; }
  #nb[data-tab='wr'] .gap { display: none; }
  #nb[data-tab='wr'] tr.rrow:nth-child(n) td.sq { border-top: 0; }
  #nb[data-tab='wr'] tr.rsep + tr.rrow td.sq { border-top: 1px solid var(--rule); }
  .dock { display: flex; position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; gap: 4px; padding: 6px; border-radius: 999px; background: var(--ink); box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .5); }
  .dock button { display: flex; align-items: center; gap: 7px; padding: 10px 16px; border: 0; border-radius: 999px; background: none; color: var(--bg); opacity: .7; font: 600 14.5px/1 var(--sans); }
  .dock button svg { width: 20px; height: 20px; }
  .dock button[aria-pressed='true'] { background: var(--bg); color: var(--ink); opacity: 1; }
  .story { grid-template-columns: 1fr; }
  /* working in the notebook or on the map, the story folds away so the squares are in view */
  body:not([data-pane='clues']) .case-head .story, body:not([data-pane='clues']) .case-head .mallory-line, body:not([data-pane='clues']) .case-head .rule, body:not([data-pane='clues']) .case-head .warm-head { display: none; }
  body:not([data-pane='clues']) .case-head h1 { font-size: 28px; }
}
@media (max-width: 760px) {
  .case-bar .navlink[data-act='how'] { display: none; }
  .bar .accuse { padding: 9px 15px; font-size: 15px; }
  .case-head { padding: 18px 0 74px; }
  .case-head h1 { font-size: 34px; }
  .story .scene { font-size: 17px; }
  .case-head .rule { font-size: 14.5px; }
  .suspect { padding: 14px 14px 12px; }
  .suspect .face { --fs: 56px !important; }
  .quote { font-size: 17px; }
  .notebook, .map { padding: 16px 12px 16px; border-radius: 12px; }
  .grid { --cell: 40px; }
  .grid tbody th { font-size: 13.5px; padding-right: 6px; }
  .grid tbody th .face { --fs: 22px !important; margin-right: 5px; }
  .dock button { padding: 10px 13px; }
  .strip { top: 54px; }
  .weapons { grid-template-columns: 1fr; }
}

/* ---- dialogs: a card that rises from the bottom on a phone and sits in the middle on a wide screen */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 20px; overflow-y: auto; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } }
.sheetbox { position: relative; width: min(600px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; padding: 30px 32px 28px; background: var(--card); border-radius: 18px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .5); animation: rise .22s ease; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.sheetbox h2 { margin: 6px 0 12px; font: 600 30px/1.1 var(--serif); letter-spacing: -.01em; }
.sheetbox p { margin: 0 0 14px; }
.sheetbox .x { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--wash); font-size: 22px; line-height: 1; color: var(--muted); }
.sheetbox .x:hover { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

/* accuse */
.pick { margin-top: 16px; }
.pick h4 { margin: 0 0 8px; font: 700 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 8px; border: 0; border-radius: 999px; background: var(--card-2); box-shadow: inset 0 0 0 1.5px var(--rule); font: 600 14.5px/1.2 var(--sans); }
.opt .wi { width: 22px; height: 22px; color: var(--green); }
.opt > span:only-child { padding-left: 6px; }
.opt:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.opt[aria-pressed='true'] { background: var(--ink); color: var(--bg); box-shadow: none; }
.opt[aria-pressed='true'] .wi { color: var(--gold); }
.said { margin-top: 18px !important; padding: 14px 16px; border-radius: 12px; background: var(--wash); font: italic 400 19px/1.4 var(--serif); }
.miss { padding: 12px 14px; border-radius: 10px; background: color-mix(in srgb, var(--red) 12%, var(--card)); }

/* the verdict */
.verdict { text-align: center; }
.verdict .reveal { position: relative; display: inline-block; margin: 4px auto 10px; }
.verdict .reveal .face { box-shadow: 0 0 0 5px var(--card), 0 0 0 8px hsl(var(--h) 40% 55%); }
.stamp.big { top: auto; bottom: 2px; right: -46px; font-size: 18px; padding: 4px 12px; background: var(--card); transform: rotate(-10deg); animation: thump .5s cubic-bezier(.2, 1.6, .4, 1) .25s both; }
@keyframes thump { from { transform: rotate(-10deg) scale(2.2); opacity: 0; } }
.verdict .kicker { margin-bottom: 6px; }
.verdict .tale { font-size: 28px; text-wrap: balance; }
.verdict .motive { font: italic 400 18px/1.45 var(--serif); color: var(--ink); }
.thelie { margin: 0 0 16px; padding: 14px 18px; border-radius: 12px; background: var(--wash); text-align: left; }
.thelie .kicker { display: block; color: var(--red); margin-bottom: 4px; }
.thelie .txt { font: italic 400 17.5px/1.45 var(--serif); text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 2px; }
.went { color: var(--muted); }
.verdict .how, .verdict .sharebox, .verdict .next { text-align: left; }
.how summary { cursor: pointer; font-weight: 600; margin-bottom: 10px; }
.how table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin-bottom: 10px; }
.how td { padding: 7px 6px; border-bottom: 1px solid var(--rule); }
.how td:first-child { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.how thead td { font: 700 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.how tr.killer td { background: var(--gold-wash); }
.how .wi { color: var(--green); }
.sharebox { margin-top: 18px; }
.share { margin: 0 0 6px; padding: 14px 16px; border-radius: 12px; background: var(--green); color: var(--on-green); font: 500 16px/1.5 var(--sans); white-space: pre-wrap; }
.verdict .actions { justify-content: center; }
.next { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
.next .links { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; }

/* hints */
.mallory { display: flex; align-items: center; gap: 14px; }
.mallory h2 { margin: 2px 0 0; }
.hintbox { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--wash); font-size: 16.5px; line-height: 1.5; }

/* the record */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 18px; }
.stats div { padding: 14px 10px; border-radius: 12px; background: var(--wash); text-align: center; }
.stats b { display: block; font: 600 32px/1 var(--serif); }
.stats span { font-size: 13px; color: var(--muted); }
table.verdict { border-collapse: collapse; text-align: left; font-size: 14.5px; }
table.verdict td { padding: 7px 4px; border-bottom: 1px solid var(--rule); }
table.verdict thead td { font: 700 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* the three rules, with pictures */
.rules3 { list-style: none; margin: 14px 0 18px; padding: 0; display: grid; gap: 12px; }
.rules3 li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--card-2); color: var(--ink); text-align: left; }
.rules3 .pic { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.rsq { position: relative; display: inline-block; width: 26px; height: 26px; background: var(--card); box-shadow: inset 0 0 0 1px var(--rule); }
.rlab { font-weight: 700; font-size: 13px; margin-right: 6px; }
.rlab3 { display: flex; width: 100%; gap: 4px; }
.rlab3 i { width: 26px; font-size: 10px; text-align: center; color: var(--muted); }
.bubble { padding: 3px 9px; border-radius: 3px 10px 10px 10px; background: var(--wash); font: italic 400 13px/1.3 var(--serif); }
.bubble.no { text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 2px; }
.rules3 .more { color: var(--muted); }

/* the warm-up's rules sit on the green band */
.warm-head { margin-top: 18px; }
.warm-lede { margin: 0; color: var(--on-green-muted); }
.warm-skip { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.warm-skip .link, .warm-fold .link { color: var(--on-green); }
.warm-fold { display: flex; gap: 18px; margin: 12px 0 0; }

@media (max-width: 760px) {
  .scrim { padding: 0; place-items: end stretch; }
  .sheetbox { width: 100%; max-height: 92vh; padding: 26px 18px calc(22px + env(safe-area-inset-bottom, 0px)); border-radius: 20px 20px 0 0; }
  .sheetbox h2 { font-size: 26px; }
  .verdict .tale { font-size: 23px; }
  .rules3 li { grid-template-columns: 1fr; gap: 8px; }
  .stamp.big { right: -34px; font-size: 15px; }
}

</style>
</head>

// ---- 00-rng.js
// Seeded randomness. Same seed -> same case on every device.
function hashString(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeRng(seed) {
  const r = mulberry32(hashString(String(seed))());
  const rng = {
    next: r,
    int: (n) => Math.floor(r() * n),
    chance: (p) => r() < p,
    pick: (a) => a[Math.floor(r() * a.length)],
    shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    // pick one index according to non-negative weights
    weighted(weights) {
      let total = 0;
      for (const w of weights) total += w;
      if (total <= 0) return -1;
      let x = r() * total;
      for (let i = 0; i < weights.length; i++) {
        x -= weights[i];
        if (x < 0) return i;
      }
      return weights.length - 1;
    },
  };
  return rng;
}

// All permutations of 0..n-1 plus their inverses (inv[value] = position).
const _permCache = {};
function permutations(n) {
  if (_permCache[n]) return _permCache[n];
  const out = [];
  const cur = [];
  const used = new Array(n).fill(false);
  (function rec() {
    if (cur.length === n) { out.push(cur.slice()); return; }
    for (let i = 0; i < n; i++) {
      if (used[i]) continue;
      used[i] = true; cur.push(i);
      rec();
      cur.pop(); used[i] = false;
    }
  })();
  const inv = out.map((p) => {
    const q = new Array(n);
    for (let i = 0; i < n; i++) q[p[i]] = i;
    return q;
  });
  return (_permCache[n] = { perms: out, inv });
}

// ---- 20-clues.js
// A "case context" is the slice of a world in play tonight: n suspects, n weapons, n rooms.
// Every clue is a small closure over the context that can be tested against any candidate
// arrangement (pw: suspect->weapon, pwi: weapon->suspect, pr: suspect->room, pri: room->suspect).

function rectsAdjacent(a, b) {
  const horiz = (a.x + a.w === b.x || b.x + b.w === a.x) && a.y < b.y + b.h && b.y < a.y + a.h;
  const vert = (a.y + a.h === b.y || b.y + b.h === a.y) && a.x < b.x + b.w && b.x < a.x + a.w;
  return horiz || vert;
}

function buildCtx(world, suspectPick, weaponPick, roomPick) {
  const n = suspectPick.length;
  const rooms = roomPick.map((i) => world.rooms[i]);
  const adj = rooms.map((a) => rooms.map((b) => a !== b && rectsAdjacent(a.rect, b.rect)));
  const maxY = Math.max(...world.rooms.map((r) => r.rect.y));
  const floor = rooms.map((r) => (world.floors ? maxY - r.rect.y : 0));
  const pos = rooms.map((r) => r.rect.x);
  const suspects = suspectPick.map((i) => world.suspects[i]);
  return {
    world, n, suspects,
    weapons: weaponPick.map((i) => world.weapons[i]),
    rooms, adj, floor, pos,
    types: weaponPick.map((i) => world.weapons[i].type),
    traits: suspects.map((s) => s.traits),
    roomIdx: roomPick, suspectIdx: suspectPick, weaponIdx: weaponPick,
  };
}

// kind: W = weapons only, R = rooms only, X = both, M = murder (returns a bitmask of possible killers)
// family: direct | neg | link | rel | murder | trait -- used to tune difficulty
function C(type, kind, family, args, test) {
  return { type, kind, family, args, test };
}

function enumerateClues(ctx) {
  const { n, adj, floor, pos, types, traits, world } = ctx;
  const S = [...Array(n).keys()];
  const out = [];
  const typeSet = [...new Set(types)];
  const floorSet = [...new Set(floor)];
  const hasFloors = world.relations.includes('floor');
  const hasAhead = world.relations.includes('ahead');
  const FULL = (1 << n) - 1;
  const maskOf = (f) => { let m = 0; for (const s of S) if (f(s)) m |= 1 << s; return m; };
  // trait values that split tonight's suspects (a trait everyone shares tells nobody anything)
  const traitVals = [];
  for (const k of TRAIT_KEYS) {
    const vals = [...new Set(traits.map((t) => t[k]))];
    if (vals.length > 1) for (const v of vals) traitVals.push([k, v]);
  }

  for (const s of S) for (const w of S) {
    out.push(C('has', 'W', 'direct', { s, w }, (pw) => pw[s] === w));
    out.push(C('notHas', 'W', 'neg', { s, w }, (pw) => pw[s] !== w));
  }
  for (const s of S) for (const r of S) {
    out.push(C('in', 'R', 'direct', { s, r }, (pw, pwi, pr) => pr[s] === r));
    out.push(C('notIn', 'R', 'neg', { s, r }, (pw, pwi, pr) => pr[s] !== r));
  }
  for (const w of S) for (const a of S) for (const b of S) if (a < b) {
    out.push(C('eitherHas', 'W', 'rel', { w, a, b }, (pw, pwi) => pwi[w] === a || pwi[w] === b));
  }
  for (const r of S) for (const a of S) for (const b of S) if (a < b) {
    out.push(C('eitherIn', 'R', 'rel', { r, a, b }, (pw, pwi, pr, pri) => pri[r] === a || pri[r] === b));
  }
  for (const s of S) for (const t of typeSet) {
    out.push(C('holdsType', 'W', 'link', { s, t }, (pw) => types[pw[s]] === t));
    out.push(C('notHoldsType', 'W', 'neg', { s, t }, (pw) => types[pw[s]] !== t));
  }
  for (const a of S) for (const b of S) if (a < b) {
    out.push(C('sameType', 'W', 'rel', { a, b }, (pw) => types[pw[a]] === types[pw[b]]));
    out.push(C('diffType', 'W', 'rel', { a, b }, (pw) => types[pw[a]] !== types[pw[b]]));
    out.push(C('adjacent', 'R', 'rel', { a, b }, (pw, pwi, pr) => adj[pr[a]][pr[b]]));
    out.push(C('notAdjacent', 'R', 'rel', { a, b }, (pw, pwi, pr) => !adj[pr[a]][pr[b]]));
    if (hasFloors) {
      out.push(C('sameFloor', 'R', 'rel', { a, b }, (pw, pwi, pr) => floor[pr[a]] === floor[pr[b]]));
      out.push(C('diffFloor', 'R', 'rel', { a, b }, (pw, pwi, pr) => floor[pr[a]] !== floor[pr[b]]));
    }
  }
  if (hasAhead) for (const a of S) for (const b of S) if (a !== b) {
    out.push(C('ahead', 'R', 'rel', { a, b }, (pw, pwi, pr) => pos[pr[a]] < pos[pr[b]]));
  }
  for (const w of S) for (const r of S) {
    out.push(C('weaponIn', 'X', 'link', { w, r }, (pw, pwi, pr) => pr[pwi[w]] === r));
    out.push(C('weaponNotIn', 'X', 'neg', { w, r }, (pw, pwi, pr) => pr[pwi[w]] !== r));
    out.push(C('weaponNear', 'X', 'link', { w, r }, (pw, pwi, pr) => adj[pr[pwi[w]]][r]));
  }
  for (const r of S) for (const t of typeSet) {
    out.push(C('typeInRoom', 'X', 'link', { r, t }, (pw, pwi, pr, pri) => types[pw[pri[r]]] === t));
    out.push(C('notTypeInRoom', 'X', 'neg', { r, t }, (pw, pwi, pr, pri) => types[pw[pri[r]]] !== t));
  }
  // ---- traits: a hair on the weapon, a footprint in the room. Read them off the suspects' cards.
  for (const [k, v] of traitVals) {
    for (const w of S) out.push(C('traitWeapon', 'W', 'trait', { w, k, v }, (pw, pwi) => traits[pwi[w]][k] === v));
    for (const r of S) out.push(C('traitRoom', 'R', 'trait', { r, k, v }, (pw, pwi, pr, pri) => traits[pri[r]][k] === v));
  }

  // ---- murder clues: each returns the set of suspects who could still be the killer
  for (const t of typeSet) {
    out.push(C('murderType', 'M', 'murder', { t }, (pw) => maskOf((m) => types[pw[m]] === t)));
    out.push(C('murderNotType', 'M', 'murder', { t }, (pw) => maskOf((m) => types[pw[m]] !== t)));
  }
  for (const s of S) {
    out.push(C('murderNotSuspect', 'M', 'murder', { s }, () => FULL & ~(1 << s)));
    out.push(C('murderNextTo', 'M', 'murder', { s }, (pw, pwi, pr) => maskOf((m) => m !== s && adj[pr[m]][pr[s]])));
    out.push(C('murderFarFrom', 'M', 'murder', { s }, (pw, pwi, pr) => maskOf((m) => m !== s && !adj[pr[m]][pr[s]])));
    if (hasFloors) out.push(C('murderSameFloor', 'M', 'murder', { s }, (pw, pwi, pr) => maskOf((m) => m !== s && floor[pr[m]] === floor[pr[s]])));
    if (hasAhead) {
      out.push(C('murderAheadOf', 'M', 'murder', { s }, (pw, pwi, pr) => maskOf((m) => pos[pr[m]] < pos[pr[s]])));
      out.push(C('murderBehind', 'M', 'murder', { s }, (pw, pwi, pr) => maskOf((m) => pos[pr[m]] > pos[pr[s]])));
    }
  }
  for (const w of S) out.push(C('murderNotWeapon', 'M', 'murder', { w }, (pw) => maskOf((m) => pw[m] !== w)));
  for (const r of S) {
    out.push(C('murderNotRoom', 'M', 'murder', { r }, (pw, pwi, pr) => maskOf((m) => pr[m] !== r)));
    out.push(C('murderAdjRoom', 'M', 'murder', { r }, (pw, pwi, pr) => maskOf((m) => adj[pr[m]][r])));
    out.push(C('murderNotAdjRoom', 'M', 'murder', { r }, (pw, pwi, pr) => maskOf((m) => pr[m] !== r && !adj[pr[m]][r])));
  }
  if (hasFloors) for (const f of floorSet) {
    out.push(C('murderFloor', 'M', 'murder', { f }, (pw, pwi, pr) => maskOf((m) => floor[pr[m]] === f)));
    out.push(C('murderNotFloor', 'M', 'murder', { f }, (pw, pwi, pr) => maskOf((m) => floor[pr[m]] !== f)));
  }
  for (const [k, v] of traitVals) out.push(C('murderTrait', 'M', 'murder', { k, v }, () => maskOf((m) => traits[m][k] === v)));
  return out;
}

// ---- testimony. Every suspect says one thing. The innocent tell the truth; the killer lies.
// Only statements a person could sensibly make, and that the human solver can turn into one small constraint
// (so it can also be negated), can be testimony. Everything else is evidence, which is always true.
const TESTIMONY_TYPES = ['has', 'notHas', 'in', 'notIn', 'eitherHas', 'eitherIn', 'holdsType', 'notHoldsType', 'sameType', 'diffType',
  'adjacent', 'notAdjacent', 'sameFloor', 'diffFloor', 'ahead', 'murderNotSuspect', 'murderType', 'murderNotType', 'murderNotWeapon',
  'murderNotRoom', 'murderFloor', 'murderNotFloor', 'murderAdjRoom', 'murderNotAdjRoom', 'murderTrait'];

// A statement by `sp`, as a murder clue: in each arrangement, the killers it allows are those for whom it is
// consistent (the statement is true and sp is not the killer, or it is false and sp is).
function testimony(c, sp, n) {
  const FULL = (1 << n) - 1, me = 1 << sp, base = c.test, M = c.kind === 'M';
  const test = (pw, pwi, pr, pri) => ((M ? base(pw, pwi, pr, pri) : base(pw, pwi, pr, pri) ? FULL : 0) ^ me) & FULL;
  return { type: c.type, kind: 'M', baseKind: c.kind, family: c.family, args: c.args, speaker: sp, test, base: c };
}
// Is the statement itself true in this arrangement (ignoring who said it)?
function statementTrue(c, truth, pwi, pri) {
  const b = c.base || c, v = b.test(truth.pw, pwi, truth.pr, pri);
  return b.kind === 'M' ? (v & (1 << truth.m)) !== 0 : v;
}

// Does the clue hold for the hidden truth {pw, pr, m}?
function clueHolds(clue, truth, pwi, pri) {
  const v = clue.test(truth.pw, pwi, truth.pr, pri);
  return clue.kind === 'M' ? (v & (1 << truth.m)) !== 0 : v;
}

// ---- 25-text.js
// Turns a clue into words. Tokens {s:i} {w:i} {r:i} are swapped for names by the renderer,
// so the UI can highlight and cross-reference them.
// Every clue has three wordings. Evidence ('note') is always true. Testimony ('say') is spoken by a suspect, in
// their own voice ("I was in the Library"), and is true unless the speaker is the killer. The logic always comes
// first and plainly; any joke rides on the end and never changes what the clue means.
// Banked cases store the variant index, so keep three wordings per type when rewording (test-variants.js checks it).
const HAIR_WORD = { dark: 'dark', fair: 'fair', red: 'red', grey: 'grey' };
const traitWord = (k, v) => TRAITS[k].values[v];

function clueVariants(c, ctx, sp) {
  const a = c.args;
  const line = ctx.world.layoutKind === 'line';
  const unit = line ? 'carriage' : 'room';
  const S = (i) => `{s:${i}}`, W = (i) => `{w:${i}}`, R = (i) => `{r:${i}}`;
  const T = (t) => WEAPON_TYPES[t];
  const floorWord = (f) => ctx.world.floors[f];
  const join = line ? 'a coupling' : 'a door or a stair';
  const away = line ? 'coupled to it' : 'a door or a stair away';
  const cap = (s) => (s[0] === '{' ? s : s[0].toUpperCase() + s.slice(1));
  const three = (voice, v0, v1, v2) => [[voice, v0], [voice, v1], [voice, v2]];
  const say = sp !== undefined && sp !== null;
  if (say) {
    const me = (i) => i === sp;
    const subj = (i) => (me(i) ? 'I' : S(i)), obj = (i) => (me(i) ? 'me' : S(i));

// ---- Inspector Mallory: opens every case with a line, and closes it with another
const MALLORY_OPEN = [
  'I’ve asked everyone to stay exactly where they are. They have all agreed, which is suspicious in itself.',
  'Somebody here is lying to me. Only one of them, for once.',
  'Every statement I’ve taken is true but one. That’s a better ratio than Scotland Yard.',
  'Nobody leaves until I know who did it. Nobody has offered to make tea, either.',
  'Everyone saw nothing, heard nothing, and has a very good reason to be glad about it.',
  'I was promised a quiet weekend.',
  'Write everything down. People lie; notebooks don’t.',
  'The evidence is honest. The suspects are honest too, all but one.',
  'One of them will say something that cannot be true. Listen for it.',
  'Somebody in this case is very calm. Too calm.',
  'I’ve seen tidier crime scenes, and I’ve seen tidier suspects.',
  'Mind the evidence. And mind the suspects even more.',
];
const MALLORY_CLOSE = [
  'Case closed. Somebody fetch the tea.',
  'Another one for the files.',
  'I’ll have the paperwork done by breakfast. Probably.',
  'That’s the trouble with lying: you have to remember everything.',
  'The truth will out. Usually with a little help.',
  'Lovely work. I shall take all the credit, naturally.',
  'And they say the countryside is restful.',
  'Somebody call a cab. Somebody else call a lawyer.',
];

// In the house, "next to" is spelled out as "a door or a stair". A case can hold several such clues, so every
// second one, in statement order, says "a doorway or a flight of stairs" instead. Wording only: types and variants stay.
const DOOR_WORDS = /\b(a|one|single) door or (a |one )?stair\b/g;
function varyWording(clues) {
  let k = 0;
  for (const c of clues) {
    if (!c.text.match(DOOR_WORDS)) continue;
    if (k++ % 2) c.text = c.text.replace(DOOR_WORDS, '$1 doorway or $2flight of stairs');
  }
  return clues;
}

// Which suspects does a clue talk about?
function clueSuspects(c) {
  const a = c.args, out = [];
  for (const k of ['s', 'a', 'b']) if (a[k] !== undefined) out.push(a[k]);
  return out;
}

// The case's story: who died, on what occasion, and how they were found. {v} is the victim's short name.
function caseStory(world, story) {
  const [vi, oi, fi, mi] = story;
  const v = world.victims[vi], put = (s) => s.replace(/\{v\}/g, v.short);
  const capFirst = (s) => s[0].toUpperCase() + s.slice(1);
  const m = mi || 0;
  return { victim: v, occasion: capFirst(put(world.occasions[oi])), found: capFirst(put(world.found[fi])),
    mallory: MALLORY_OPEN[m % MALLORY_OPEN.length], close: MALLORY_CLOSE[m % MALLORY_CLOSE.length] };
}
function pickStory(rng, world) {
  return [rng.int(world.victims.length), rng.int(world.occasions.length), rng.int(world.found.length), rng.int(MALLORY_OPEN.length * MALLORY_CLOSE.length)];
}

// Plain-text rendering (tests, share text). The UI renders tokens itself.
function plainText(str, ctx) {
  return str.replace(/\{([swr]):(\d+)\}/g, (_, k, i) => {
    i = +i;
    return k === 's' ? ctx.suspects[i].short : k === 'w' ? ctx.weapons[i].name : ctx.rooms[i].name;
  });
}

// ---- 30-solver.js
// Exhaustive logic solver. Weapon-only and room-only clues are applied to the permutation lists
// first, so the expensive cross product only runs over what survives. A world is a whole story: every
// suspect's weapon and room, and the killer. A puzzle is fair only if exactly one world survives, so the
// whole notebook can be filled in, not just the answer. `answers` lists the distinct (killer, weapon, room).
function solveCount(ctx, clues, limit) {
  const { n } = ctx;
  const { perms, inv } = permutations(n);
  const FULL = (1 << n) - 1;
  const wClues = clues.filter((c) => c.kind === 'W');
  const rClues = clues.filter((c) => c.kind === 'R');
  const xClues = clues.filter((c) => c.kind === 'X');
  const mClues = clues.filter((c) => c.kind === 'M');

  const LA = [];
  for (let a = 0; a < perms.length; a++) {
    let ok = true;
    for (const c of wClues) if (!c.test(perms[a], inv[a], null, null)) { ok = false; break; }
    if (ok) LA.push(a);
  }
  const LB = [];
  for (let b = 0; b < perms.length; b++) {
    let ok = true;
    for (const c of rClues) if (!c.test(null, null, perms[b], inv[b])) { ok = false; break; }
    if (ok) LB.push(b);
  }

  const seen = new Uint8Array(n * n * n);
  const answers = [], worlds = [];
  const lim = limit === undefined ? Infinity : limit;
  for (let ia = 0; ia < LA.length; ia++) {
    const pw = perms[LA[ia]], pwi = inv[LA[ia]];
    for (let ib = 0; ib < LB.length; ib++) {
      const pr = perms[LB[ib]], pri = inv[LB[ib]];
      let ok = true;
      for (let k = 0; k < xClues.length; k++) {
        if (!xClues[k].test(pw, pwi, pr, pri)) { ok = false; break; }
      }
      if (!ok) continue;
      let mask = FULL;
      for (let k = 0; k < mClues.length && mask; k++) mask &= mClues[k].test(pw, pwi, pr, pri);
      if (!mask) continue;
      for (let m = 0; m < n; m++) {
        if (!(mask & (1 << m))) continue;
        worlds.push({ pw, pr, m });
        const key = (m * n + pw[m]) * n + pr[m];
        if (!seen[key]) { seen[key] = 1; answers.push({ killer: m, weapon: pw[m], room: pr[m] }); }
        if (worlds.length > lim) return { count: worlds.length, worlds, answers, capped: true };
      }
    }
  }
  return { count: worlds.length, worlds, answers, capped: false };
}

// Every full arrangement that fits the clues (used for hints and for checking player grids).
// Returns the marginal "possible" matrices: which suspect/weapon/room cells survive in at least
// one consistent world.
function marginals(ctx, clues) {
  const { n } = ctx;
  const { perms, inv } = permutations(n);
  const FULL = (1 << n) - 1;
  const wClues = clues.filter((c) => c.kind === 'W');
  const rClues = clues.filter((c) => c.kind === 'R');
  const xClues = clues.filter((c) => c.kind === 'X');
  const mClues = clues.filter((c) => c.kind === 'M');
  const sw = Array.from({ length: n }, () => new Uint8Array(n));
  const sr = Array.from({ length: n }, () => new Uint8Array(n));
  const wr = Array.from({ length: n }, () => new Uint8Array(n));
  const killer = new Uint8Array(n);
  let worlds = 0;
  const LA = [], LB = [];
  for (let a = 0; a < perms.length; a++) if (wClues.every((c) => c.test(perms[a], inv[a], null, null))) LA.push(a);
  for (let b = 0; b < perms.length; b++) if (rClues.every((c) => c.test(null, null, perms[b], inv[b]))) LB.push(b);
  for (const a of LA) {
    const pw = perms[a], pwi = inv[a];
    for (const b of LB) {
      const pr = perms[b], pri = inv[b];
      if (!xClues.every((c) => c.test(pw, pwi, pr, pri))) continue;
      let mask = FULL;
      for (const c of mClues) mask &= c.test(pw, pwi, pr, pri);
      if (!mask) continue;
      worlds++;
      for (let s = 0; s < n; s++) { sw[s][pw[s]] = 1; sr[s][pr[s]] = 1; wr[pw[s]][pr[s]] = 1; }
      for (let m = 0; m < n; m++) if (mask & (1 << m)) killer[m] = 1;
    }
  }
  return { sw, sr, wr, killer, worlds };
}

// ---- 32-survivors.js
// Incremental candidate set used while building a case: every (weapon arrangement, room arrangement)
// pair that still fits the clues so far, with a bitmask of who could be the killer in each.
// Adding a clue only ever shrinks the set, so building costs little more than one full scan.
function newSurvivors(ctx) {
  const n = ctx.n, N = permutations(n).perms.length, FULL = (1 << n) - 1;
  const size = N * N;
  const A = new Uint16Array(size), B = new Uint16Array(size), M = new Uint8Array(size).fill(FULL);
  let k = 0;
  for (let a = 0; a < N; a++) for (let b = 0; b < N; b++) { A[k] = a; B[k] = b; k++; }
  return { A, B, M, size };
}

// Applies `clue` to `src`, writing survivors into `dst`. Returns dst.
function narrow(ctx, src, clue, dst) {
  const { perms, inv } = permutations(ctx.n);
  const N = perms.length;
  let out = 0;
  if (clue.kind === 'W' || clue.kind === 'R') {
    const pass = new Uint8Array(N);
    for (let p = 0; p < N; p++) {
      pass[p] = clue.kind === 'W' ? (clue.test(perms[p], inv[p], null, null) ? 1 : 0) : (clue.test(null, null, perms[p], inv[p]) ? 1 : 0);
    }
    const key = clue.kind === 'W' ? src.A : src.B;
    for (let i = 0; i < src.size; i++) {
      if (!pass[key[i]]) continue;
      dst.A[out] = src.A[i]; dst.B[out] = src.B[i]; dst.M[out] = src.M[i]; out++;
    }
  } else if (clue.kind === 'X') {
    for (let i = 0; i < src.size; i++) {
      const a = src.A[i], b = src.B[i];
      if (!clue.test(perms[a], inv[a], perms[b], inv[b])) continue;
      dst.A[out] = a; dst.B[out] = b; dst.M[out] = src.M[i]; out++;
    }
  } else {
    for (let i = 0; i < src.size; i++) {
      const a = src.A[i], b = src.B[i];
      const m = src.M[i] & clue.test(perms[a], inv[a], perms[b], inv[b]);
      if (!m) continue;
      dst.A[out] = a; dst.B[out] = b; dst.M[out] = m; out++;
    }
  }
  dst.size = out;
  return dst;
}

// How many whole worlds (weapons, rooms and killer) survive?
function countSurvivingWorlds(ctx, set) {
  let count = 0;
  for (let i = 0; i < set.size; i++) count += popcount(set.M[i]);
  return count;
}

// ---- 35-human.js
// A "human" solver: candidate lists for every suspect's weapon and room, plus the killer, the
// murder weapon and the murder room. Each clue becomes small local constraints; each deduction
// is a candidate being crossed out. Where plain elimination stalls, it tries one "what if?" at a
// time (depth 1), or a what-if inside a what-if (depth 2). That depth is how hard the case feels.
//
// Variables: 0..n-1 weapon of suspect s | n..2n-1 room of suspect s | 2n killer | 2n+1 murder weapon | 2n+2 murder room

// The constraints a clue puts on the variables: a list of { vars, pred }.
function clueCons(ctx, type, a) {
  const n = ctx.n, { adj, floor, pos, types, traits } = ctx;
  const PW = (s) => s, PR = (s) => n + s, K = 2 * n, MW = 2 * n + 1, MR = 2 * n + 2;
  const out = [];
  const add = (vars, pred) => out.push({ vars, pred });
  const each = (f) => { for (let s = 0; s < n; s++) f(s); };
  switch (type) {
    case 'has': add([PW(a.s)], (x) => x === a.w); break;
    case 'notHas': add([PW(a.s)], (x) => x !== a.w); break;
    case 'in': add([PR(a.s)], (x) => x === a.r); break;
    case 'notIn': add([PR(a.s)], (x) => x !== a.r); break;
    case 'eitherHas': add([PW(a.a), PW(a.b)], (x, y) => x === a.w || y === a.w); break;
    case 'eitherIn': add([PR(a.a), PR(a.b)], (x, y) => x === a.r || y === a.r); break;
    case 'holdsType': add([PW(a.s)], (x) => types[x] === a.t); break;
    case 'notHoldsType': add([PW(a.s)], (x) => types[x] !== a.t); break;
    case 'sameType': add([PW(a.a), PW(a.b)], (x, y) => types[x] === types[y]); break;
    case 'diffType': add([PW(a.a), PW(a.b)], (x, y) => types[x] !== types[y]); break;
    case 'adjacent': add([PR(a.a), PR(a.b)], (x, y) => adj[x][y]); break;
    case 'notAdjacent': add([PR(a.a), PR(a.b)], (x, y) => !adj[x][y]); break;
    case 'sameFloor': add([PR(a.a), PR(a.b)], (x, y) => floor[x] === floor[y]); break;
    case 'diffFloor': add([PR(a.a), PR(a.b)], (x, y) => floor[x] !== floor[y]); break;
    case 'ahead': add([PR(a.a), PR(a.b)], (x, y) => pos[x] < pos[y]); break;
    case 'weaponIn': each((s) => add([PW(s), PR(s)], (x, y) => (x === a.w) === (y === a.r))); break;
    case 'weaponNotIn': each((s) => add([PW(s), PR(s)], (x, y) => !(x === a.w && y === a.r))); break;
    case 'weaponNear': each((s) => add([PW(s), PR(s)], (x, y) => x !== a.w || adj[y][a.r])); break;
    case 'typeInRoom': each((s) => add([PW(s), PR(s)], (x, y) => y !== a.r || types[x] === a.t)); break;
    case 'notTypeInRoom': each((s) => add([PW(s), PR(s)], (x, y) => y !== a.r || types[x] !== a.t)); break;
    case 'traitWeapon': each((s) => { if (traits[s][a.k] !== a.v) add([PW(s)], (x) => x !== a.w); }); break;
    case 'traitRoom': each((s) => { if (traits[s][a.k] !== a.v) add([PR(s)], (x) => x !== a.r); }); break;
    case 'murderType': add([MW], (x) => types[x] === a.t); break;
    case 'murderNotType': add([MW], (x) => types[x] !== a.t); break;
    case 'murderNotSuspect': add([K], (x) => x !== a.s); break;
    case 'murderNextTo': add([K], (x) => x !== a.s); add([MR, PR(a.s)], (x, y) => adj[x][y]); break;
    case 'murderFarFrom': add([K], (x) => x !== a.s); add([MR, PR(a.s)], (x, y) => !adj[x][y]); break;
    case 'murderSameFloor': add([K], (x) => x !== a.s); add([MR, PR(a.s)], (x, y) => floor[x] === floor[y]); break;
    case 'murderAheadOf': add([MR, PR(a.s)], (x, y) => pos[x] < pos[y]); break;
    case 'murderBehind': add([MR, PR(a.s)], (x, y) => pos[x] > pos[y]); break;
    case 'murderNotWeapon': add([MW], (x) => x !== a.w); break;
    case 'murderNotRoom': add([MR], (x) => x !== a.r); break;
    case 'murderAdjRoom': add([MR], (x) => adj[x][a.r]); break;
    case 'murderNotAdjRoom': add([MR], (x) => x !== a.r && !adj[x][a.r]); break;
    case 'murderFloor': add([MR], (x) => floor[x] === a.f); break;
    case 'murderNotFloor': add([MR], (x) => floor[x] !== a.f); break;
    case 'murderTrait': add([K], (x) => traits[x][a.k] === a.v); break;
    default: throw new Error('human solver: unknown clue ' + type);
  }
  return out;
}

function buildCSP(ctx, clues) {
  const n = ctx.n;
  const PW = (s) => s, PR = (s) => n + s, K = 2 * n, MW = 2 * n + 1, MR = 2 * n + 2;
  const cons = [];
  const each = (f) => { for (let s = 0; s < n; s++) f(s); };
  clues.forEach((c, ci) => {
    const list = clueCons(ctx, c.type, c.args);
    if (c.speaker === null || c.speaker === undefined) { list.forEach((x) => cons.push({ clue: ci, vars: x.vars, pred: x.pred })); return; }
    // testimony: true unless the speaker is the killer, in which case it is false
    if (list.length !== 1) throw new Error('testimony must be one constraint: ' + c.type);
    const { vars, pred } = list[0], sp = c.speaker;
    if (vars.includes(K)) cons.push({ clue: ci, vars: [K], pred: (k) => (k === sp) !== pred(k) });
    else cons.push({ clue: ci, vars: [K, ...vars], pred: (k, x, y) => (k === sp) !== pred(x, y) });
  });
  // the killer is whoever holds the murder weapon and stands in the murder room
  each((s) => {
    cons.push({ clue: -1, vars: [K, PW(s), MW], pred: (k, w, mw) => (k === s) === (w === mw) });
    cons.push({ clue: -1, vars: [K, PR(s), MR], pred: (k, r, mr) => (k === s) === (r === mr) });
  });
  const groups = [[...Array(n).keys()].map(PW), [...Array(n).keys()].map(PR)];
  return { n, cons, groups, nv: 2 * n + 3, K, MW, MR, PW, PR };
}

const popcount = (x) => { let c = 0; while (x) { x &= x - 1; c++; } return c; };

// Remove candidates until nothing more follows. Returns false on contradiction.
function propagate(csp, dom, trace) {
  const { n, cons, groups } = csp;
  const full = (1 << n) - 1;
  const note = (v, removed, clue) => { if (trace && removed) trace.push({ v, removed, clue }); };
  let changed = true;
  while (changed) {
    changed = false;
    for (const con of cons) {
      const vs = con.vars, k = vs.length;
      const sup = [0, 0, 0];
      const d0 = dom[vs[0]], d1 = k > 1 ? dom[vs[1]] : 1, d2 = k > 2 ? dom[vs[2]] : 1;
      for (let x = 0; x < n; x++) {
        if (!(d0 & (1 << x))) continue;
        if (k === 1) { if (con.pred(x)) sup[0] |= 1 << x; continue; }
        for (let y = 0; y < n; y++) {
          if (!(d1 & (1 << y))) continue;
          if (k === 2) { if (con.pred(x, y)) { sup[0] |= 1 << x; sup[1] |= 1 << y; } continue; }
          for (let z = 0; z < n; z++) {
            if (!(d2 & (1 << z))) continue;
            if (con.pred(x, y, z)) { sup[0] |= 1 << x; sup[1] |= 1 << y; sup[2] |= 1 << z; }
          }
        }
      }
      for (let i = 0; i < k; i++) {
        const nd = dom[vs[i]] & sup[i];
        if (nd !== dom[vs[i]]) {
          note(vs[i], dom[vs[i]] & ~nd, con.clue);
          dom[vs[i]] = nd; changed = true;
          if (!nd) return false;
        }
      }
    }
    // each weapon / room is used exactly once
    for (const g of groups) {
      for (const v of g) {
        if (popcount(dom[v]) === 1) {
          for (const u of g) if (u !== v && (dom[u] & dom[v])) {
            note(u, dom[u] & dom[v], -1);
            dom[u] &= ~dom[v]; changed = true;
            if (!dom[u]) return false;
          }
        }
      }
      for (let x = 0; x < n; x++) {
        let only = -1, cnt = 0;
        for (const v of g) if (dom[v] & (1 << x)) { cnt++; only = v; }
        if (cnt === 0) return false;
        if (cnt === 1 && popcount(dom[only]) > 1) {
          note(only, dom[only] & ~(1 << x), -1);
          dom[only] = 1 << x; changed = true;
        }
      }
    }
  }
  return true;
}

// solved: every suspect's weapon and room, and the killer, are settled (the whole notebook, not just the answer)
const answered = (csp, dom) => dom.every((d) => popcount(d) === 1);

// Probing: assume a candidate; if that leads to a contradiction, it can be crossed out.
function probe(csp, dom, depth, stats) {
  let progress = true;
  while (progress && !answered(csp, dom)) {
    progress = false;
    for (let v = 0; v < csp.nv; v++) {
      for (let x = 0; x < csp.n; x++) {
        if (!(dom[v] & (1 << x)) || popcount(dom[v]) === 1) continue;
        const trial = dom.slice();
        trial[v] = 1 << x;
        stats.probes++;
        let ok = propagate(csp, trial);
        if (ok && depth > 1 && !answered(csp, trial)) ok = probe(csp, trial, depth - 1, stats);
        if (!ok) {
          dom[v] &= ~(1 << x);
          if (!dom[v] || !propagate(csp, dom)) return false;
          progress = true;
        }
      }
    }
  }
  return true;
}

// How hard is this case for a careful human? depth 0 = elimination only, 1 = needs a what-if, 2 = nested what-ifs.
function humanDifficulty(ctx, clues, maxDepth) {
  const csp = buildCSP(ctx, clues);
  const dom = new Array(csp.nv).fill((1 << ctx.n) - 1);
  const stats = { probes: 0 };
  if (!propagate(csp, dom)) return { depth: -1, probes: 0 };
  // how many could still be the killer (the liar) once plain elimination stalls
  const open = popcount(dom[csp.K]);
  if (answered(csp, dom)) return { depth: 0, probes: 0, open, dom };
  for (let d = 1; d <= (maxDepth || 2); d++) {
    const t = dom.slice(); stats.probes = 0;
    if (probe(csp, t, d, stats) && answered(csp, t)) return { depth: d, probes: stats.probes, open, dom: t };
  }
  return { depth: 99, probes: stats.probes, open };
}

// ---- 40-generate.js
// Difficulty tiers. Every case has one statement per suspect (the killer's is a lie) plus a few pieces of
// evidence, which are always true. `ev` bounds the evidence after squeezing; `weights` steer which evidence is
// drawn (by family); `say` steers testimony; `avoid` keeps clue shapes out of a tier (for evidence and testimony).
const SPATIAL = ['murderFarFrom', 'murderNotAdjRoom', 'murderNextTo', 'murderAdjRoom', 'murderAheadOf', 'murderBehind', 'murderSameFloor',
  'notAdjacent', 'adjacent', 'weaponNear', 'diffFloor', 'ahead'];
const TIERS = {
  // The on-ramp: three suspects, plain evidence, and a lie that shows at a glance.
  constable: {
    id: 'constable', name: 'Constable', blurb: 'Three suspects. A gentle start.',
    n: 3, ev: [1, 4], maxDirect: 1, minTypes: 2,
    weights: { direct: 1.2, neg: 1.3, link: 1.0, rel: 0.4, murder: 1.3, trait: 1.4 },
    avoid: SPATIAL.concat(['diffType', 'notTypeInRoom', 'weaponNotIn', 'eitherIn', 'eitherHas', 'diffFloor', 'sameFloor', 'murderNotAdjRoom']),
    accept: (h) => h.depth === 0 || (h.depth === 1 && h.probes <= 8), stars: 1,
  },
  detective: {
    id: 'detective', name: 'Detective', blurb: 'Four suspects. Patient reasoning.',
    n: 4, ev: [2, 6], maxDirect: 1, minTypes: 3,
    weights: { direct: 0.5, neg: 1.0, link: 1.2, rel: 0.9, murder: 1.4, trait: 1.4 },
    avoid: ['murderFarFrom', 'murderNotAdjRoom', 'weaponNear', 'murderAheadOf', 'murderBehind'],
    accept: (h) => h.depth === 1 && h.probes <= 30, stars: 2,
  },
  inspector: {
    id: 'inspector', name: 'Inspector', blurb: 'Four suspects. Fewer gifts.',
    n: 4, ev: [2, 7], maxDirect: 0, minTypes: 3,
    weights: { direct: 0, neg: 1.0, link: 1.3, rel: 1.3, murder: 1.4, trait: 1.3 },
    accept: (h) => h.depth === 1 && h.probes >= 15 && h.probes <= 70 && h.open > 1, stars: 3,
  },
  mastermind: {
    id: 'mastermind', name: 'Mastermind', blurb: 'Five suspects. Nothing given away.',
    n: 5, ev: [3, 9], maxDirect: 0, minTypes: 4,
    weights: { direct: 0, neg: 0.8, link: 1.4, rel: 1.6, murder: 1.4, trait: 1.2 },
    accept: (h) => h.open > 1 && (h.depth === 2 || (h.depth === 1 && h.probes >= 30)), stars: 4,
  },
};

// How likely a suspect is to say each kind of thing. People mostly talk about where they were and what they
// held; liars mostly lie about themselves.
const SAY_WEIGHT = {
  has: 1.0, notHas: 1.0, in: 1.2, notIn: 1.0, eitherHas: 0.6, eitherIn: 0.6, holdsType: 0.9, notHoldsType: 0.9, sameType: 0.6, diffType: 0.5,
  adjacent: 0.6, notAdjacent: 0.5, sameFloor: 0.6, diffFloor: 0.5, ahead: 0.7, murderNotSuspect: 0.6, murderType: 0.7, murderNotType: 0.6,
  murderNotWeapon: 0.6, murderNotRoom: 0.7, murderFloor: 0.6, murderNotFloor: 0.5, murderAdjRoom: 0.4, murderNotAdjRoom: 0.3, murderTrait: 0.7,
};

function pickN(rng, count, n) {
  return rng.shuffle([...Array(count).keys()]).slice(0, n).sort((a, b) => a - b);
}

function validPicks(world, ctx) {
  const types = ctx.types;
  const distinct = new Set(types).size;
  const dup = types.length - distinct;
  if (distinct < Math.min(3, ctx.n - 1) || (ctx.n >= 4 && dup < 1)) return false;
  if (world.relations.includes('floor') && new Set(ctx.floor).size < 2) return false;
  // at least two traits must tell tonight's suspects apart, or the cards are dead weight
  if (TRAIT_KEYS.filter((k) => new Set(ctx.traits.map((t) => t[k])).size > 1).length < 2) return false;
  // there must be some adjacency among the rooms in play, or the layout clues are dead weight
  let edges = 0;
  for (let i = 0; i < ctx.n; i++) for (let j = i + 1; j < ctx.n; j++) if (ctx.adj[i][j]) edges++;
  return edges >= (ctx.n >= 4 ? 2 : 1);
}

function attempt(rng, tier, worldId) {
  const world = WORLDS[worldId];
  const n = tier.n;
  let ctx, tries = 0;
  do {
    ctx = buildCtx(world, pickN(rng, world.suspects.length, n), pickN(rng, world.weapons.length, n), pickN(rng, world.rooms.length, n));
  } while (!validPicks(world, ctx) && ++tries < 200);

  const { perms, inv } = permutations(n);
  const pw = perms[rng.int(perms.length)], pr = perms[rng.int(perms.length)];
  const pwi = inv[perms.indexOf(pw)], pri = inv[perms.indexOf(pr)];
  const truth = { pw, pr, m: rng.int(n) };
  const avoid = (c) => tier.avoid && tier.avoid.includes(c.type);
  const all = enumerateClues(ctx);
  // a statement that is true (or false) whatever happened gives itself away: nobody says one
  const informative = (c) => {
    let yes = false, no = false;
    for (let a = 0; a < perms.length; a++) for (let b = 0; b < perms.length; b++) {
      const v = c.test(perms[a], inv[a], perms[b], inv[b]);
      if (c.kind === 'M') { if (v) yes = true; if (v !== (1 << n) - 1) no = true; } else if (v) yes = true; else no = true;
      if (yes && no) return true;
    }
    return false;
  };

  // ---- testimony: one statement each. The innocent say something true, the killer something false.
  const says = [], usedKey = new Set();
  let directSaid = 0;
  for (let sp = 0; sp < n; sp++) {
    const liar = sp === truth.m;
    const cands = all.filter((c) => TESTIMONY_TYPES.includes(c.type) && !avoid(c) && !usedKey.has(c.type + JSON.stringify(c.args))
      && !(c.type === 'murderNotSuspect' && c.args.s === sp) && statementTrue(c, truth, pwi, pri) !== liar
      && !(c.family === 'direct' && !liar && directSaid >= 1) && informative(c));
    if (!cands.length) return null;
    const perType = {};
    cands.forEach((c) => { perType[c.type] = (perType[c.type] || 0) + 1; });
    const w = cands.map((c) => {
      const self = clueSuspects(c).includes(sp);
      return (SAY_WEIGHT[c.type] || 0.5) / perType[c.type] * (self ? (liar ? 3 : 1.6) : 1);
    });
    const c = cands[rng.weighted(w)];
    usedKey.add(c.type + JSON.stringify(c.args));
    if (c.family === 'direct' && !liar) directSaid++;
    says.push(testimony(c, sp, n));
  }

  // ---- evidence: always true. Draw until exactly one world is left, then squeeze out what isn't needed.
  const pool = all.filter((c) => clueHolds(c, truth, pwi, pri) && !avoid(c));
  const perType = {};
  pool.forEach((c) => { perType[c.type] = (perType[c.type] || 0) + 1; });
  const alive = pool.map(() => true);
  const usedType = {};
  let chosen = [];
  let direct = 0;
  let cur = newSurvivors(ctx), spare = newSurvivors(ctx);
  for (const t of says) { narrow(ctx, cur, t, spare); [cur, spare] = [spare, cur]; }
  let count = countSurvivingWorlds(ctx, cur);
  while (count > 1 && chosen.length < tier.ev[1] + 10) {
    // every kind of clue gets a fair turn, however many instances of it happen to be true
    const w = pool.map((c, j) => alive[j] ? (tier.weights[c.family] || 0) / perType[c.type] * Math.pow(0.3, usedType[c.type] || 0) : 0);
    const i = rng.weighted(w);
    if (i < 0) return null;
    alive[i] = false;
    const c = pool[i];
    if (c.family === 'direct' && direct >= tier.maxDirect) continue;
    narrow(ctx, cur, c, spare);
    const cnt = countSurvivingWorlds(ctx, spare);
    if (cnt >= count) continue; // adds nothing right now
    [cur, spare] = [spare, cur];
    chosen.push(c);
    usedType[c.type] = (usedType[c.type] || 0) + 1;
    if (c.family === 'direct') direct++;
    count = cnt;
  }
  if (count !== 1) return null;
  for (const c of rng.shuffle(chosen)) {
    const rest = chosen.filter((x) => x !== c);
    if (solveCount(ctx, says.concat(rest), 1).count === 1) chosen = rest;
  }
  if (chosen.length < tier.ev[0] || chosen.length > tier.ev[1]) return null;
  const typeCount = {};
  chosen.forEach((c) => { typeCount[c.type] = (typeCount[c.type] || 0) + 1; });
  if (Object.keys(typeCount).length < Math.min(tier.minTypes, chosen.length) || Math.max(...Object.values(typeCount)) > 2) return null;
  // the testimony has to matter: the evidence alone leaves more than one story
  if (solveCount(ctx, chosen, 1).count < 2) return null;
  // and the lie has to show: taken at their word, the statements and the evidence cannot all be true
  if (solveCount(ctx, says.map((t) => t.base).concat(chosen), 0).count !== 0) return null;
  const clues = says.concat(chosen);
  const human = humanDifficulty(ctx, clues, 2);
  if (human.depth < 0 || human.depth > 2) return null; // needs more than nested what-ifs: not a fair puzzle
  return { ctx, truth, says, chosen, human };
}

function generatePuzzle(seed, tierId, opts) {
  opts = opts || {};
  const tier = TIERS[tierId];
  const rng = makeRng(`${seed}|${tierId}`);
  const worldId = opts.world || rng.pick(Object.keys(WORLDS));
  let got = null, best = null, tries = 0;
  const maxTries = opts.maxTries || 120;
  while (!got && tries < maxTries) {
    const g = attempt(rng, tier, worldId);
    tries++;
    if (!g) continue;
    if (tier.accept(g.human)) got = g;
    else if (!best) best = g; // keep something fair in case the tier's taste is never met
  }
  const strict = !!got;
  got = got || best;
  if (!got) throw new Error(`could not build a ${tierId} case for seed ${seed}`);
  const { ctx, truth, says, chosen, human } = got;

  const word = (c, sp) => {
    const variants = clueVariants(c.base || c, ctx, sp);
    const vi = rng.int(variants.length);
    return Object.assign(c, { voice: variants[vi][0], text: variants[vi][1], vi, speaker: sp === undefined ? null : sp });
  };
  const clues = varyWording(says.map((t) => word(t, t.speaker)).concat(rng.shuffle(chosen).map((c) => word(Object.assign({}, c)))));
  const solution = { killer: truth.m, weapon: truth.pw[truth.m], room: truth.pr[truth.m] };
  const rating = Math.max(1, Math.min(5, tier.stars + (human.probes >= 45 ? 1 : 0) - (human.depth === 0 ? 1 : 0)));
  return {
    seed: String(seed), tier: tierId, tierName: tier.name, worldId, n: ctx.n, ctx, clues,
    solution, truth, rating, human: { depth: human.depth, probes: human.probes }, tries, strict,
    story: pickStory(rng, ctx.world),
    title: rng.pick(titlePool(worldId)), // one draw; node retitle.js makes banked titles unique
  };
}

// ---- 45-bank.js
// Cases can be saved as small specs (what was picked, the hidden truth, the story, which clues in which wording)
// and rebuilt instantly, so curated cases ship with the page and load with no searching.
// A clue is [type, args, variant, speaker]: a speaker means testimony (true unless the speaker is the killer).
function exportPuzzle(p) {
  const { ctx } = p;
  return {
    s: p.seed, t: p.tier, w: p.worldId, ti: p.title, r: p.rating, h: [p.human.depth, p.human.probes], y: p.story,
    S: ctx.suspectIdx, W: ctx.weaponIdx, R: ctx.roomIdx,
    pw: p.truth.pw, pr: p.truth.pr, m: p.truth.m,
    c: p.clues.map((c) => [c.type, c.args, c.vi, c.speaker]),
  };
}

function importPuzzle(spec) {
  const world = WORLDS[spec.w];
  const ctx = buildCtx(world, spec.S, spec.W, spec.R);
  const pool = enumerateClues(ctx);
  const key = (type, args) => type + JSON.stringify(args);
  const byKey = new Map(pool.map((c) => [key(c.type, c.args), c]));
  const clues = varyWording(spec.c.map(([type, args, vi, speaker]) => {
    const c = byKey.get(key(type, args));
    if (!c) throw new Error('bank clue not found: ' + type);
    const say = speaker !== null && speaker !== undefined;
    const v = clueVariants(c, ctx, say ? speaker : null)[vi];
    if (!v) throw new Error('bank clue variant not found: ' + type + ' ' + vi);
    const base = say ? testimony(c, speaker, ctx.n) : c;
    return Object.assign({}, base, { voice: v[0], speaker: say ? speaker : null, text: v[1], vi });
  }));
  const truth = { pw: spec.pw, pr: spec.pr, m: spec.m };
  const tier = TIERS[spec.t];
  return {
    seed: spec.s, tier: spec.t, tierName: tier.name, worldId: spec.w, n: ctx.n, ctx, clues,
    solution: { killer: truth.m, weapon: truth.pw[truth.m], room: truth.pr[truth.m] },
    truth, rating: spec.r, human: { depth: spec.h[0], probes: spec.h[1] }, title: spec.ti, strict: true,
    story: spec.y || [0, 0, 0],
  };
}
