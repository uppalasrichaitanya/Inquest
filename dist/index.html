<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inquest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
<style>
/* Casebook: a printed page. Everything printed is ink on paper and keeps still; the only colour that moves is
   the vermilion pen, and it is used only for what the player does (marks, ticks, the statement in hand).
   One typeface, Newsreader, in its optical sizes. Labels are italic, as a book would set them. */
:root {
  --paper: #F1F2EE;
  --ink: #1D2430;
  --muted: #5D6571;
  --rule: #CDD1CB;
  --wash: #E3E6E0;
  --ghost: #B4B9B3;
  --pen: #CF3F28;
  --pen-faint: rgba(207, 63, 40, .34);
  --scrim: rgba(29, 36, 48, .42);
  --serif: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --gutter: 40px;
  color-scheme: light;
}
/* Night: a redrawn page, not a dimmed one. The pen lightens so it still reads as the warm thing on the page. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --paper: #15181D; --ink: #E5E2D9; --muted: #9AA0A8; --rule: #343841; --wash: #23272E; --ghost: #4A4F58;
    --pen: #F0694E; --pen-faint: rgba(240, 105, 78, .38); --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --paper: #15181D; --ink: #E5E2D9; --muted: #9AA0A8; --rule: #343841; --wash: #23272E; --ghost: #4A4F58;
  --pen: #F0694E; --pen-faint: rgba(240, 105, 78, .38); --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 400 18px/1.5 var(--serif); font-optical-sizing: auto;
  font-variant-numeric: oldstyle-nums proportional-nums;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  min-height: 100vh;
}
#app { max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter) 64px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.label { margin: 0; font-style: italic; font-weight: 400; color: var(--muted); font-size: 16px; }
.soft { color: var(--muted); font-size: 15.5px; }

/* the top line of every screen: the name, and a few quiet tools */
.bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px 18px; padding: calc(14px + env(safe-area-inset-top, 0px)) 0 12px; background: var(--paper); }
.bar .mark { margin-right: auto; background: none; border: 0; padding: 4px 0; font-size: 24px; font-weight: 600; font-variation-settings: 'opsz' 72; letter-spacing: .005em; color: var(--ink); }
.quiet, .tool { background: none; border: 0; padding: 6px 2px; color: var(--muted); font-size: 17px; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
.quiet:hover, .tool:hover { color: var(--ink); text-decoration-color: currentColor; }
.theme { width: 36px; height: 36px; padding: 0; border: 1px solid var(--rule); border-radius: 50%; background: none; display: inline-grid; place-items: center; color: var(--muted); }
.theme:hover { color: var(--ink); border-color: var(--ink); }
.theme svg { width: 18px; height: 18px; }

/* buttons: ink is the only fill; the pen never fills a button */
.btn { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: 2px; padding: 11px 22px 12px; font-size: 18px; font-weight: 500; line-height: 1.2; }
.btn:hover { opacity: .88; }
.btn.ghost { background: none; color: var(--ink); border-color: var(--rule); }
.btn.ghost:hover { border-color: var(--ink); opacity: 1; }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.link { background: none; border: 0; padding: 4px 0; color: var(--ink); font-size: 17px; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
.link:hover { text-decoration-color: currentColor; }

/* a suspect's colour: a small printed dot, nothing more */
.dot { --h: 20; display: inline-block; flex: none; width: .5em; height: .5em; border-radius: 50%; background: hsl(var(--h) 34% 52%); vertical-align: .08em; margin-right: .45em; }
/* weapon kinds: printer's marks, drawn from the symbols in KIND_DEFS */
.kg { width: 1em; height: 1em; flex: none; vertical-align: -.12em; color: var(--muted); }
/* the pen */
.pen { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 2px; max-width: min(520px, calc(100vw - 32px)); font-size: 16px; }

@media (max-width: 760px) {
  :root { --gutter: 16px; }
  body { font-size: 17px; }
  .bar { gap: 4px 14px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; }
  .bar .mark { font-size: 21px; }
  .quiet, .tool { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

.home { padding-top: clamp(24px, 6vw, 56px); display: grid; gap: 44px; max-width: 920px; }
.home .date { margin: 0 0 8px; font-style: italic; color: var(--muted); }
.home h1 { margin: 0; max-width: 15em; font-size: clamp(38px, 6vw, 62px); line-height: 1.02; font-weight: 500; letter-spacing: -.015em; font-variation-settings: 'opsz' 72; text-wrap: balance; }
.home .lede { margin: 18px 0 0; max-width: 34em; font-size: 20px; }
.home .cta { margin: 24px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.cases { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.cases li { border-bottom: 1px solid var(--rule); }
.case-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 6px 28px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: 18px 8px 20px 0; color: var(--ink); }
.case-row:hover { background: linear-gradient(90deg, var(--wash), transparent 90%); }
.case-row .tier { font-size: 26px; font-weight: 500; font-variation-settings: 'opsz' 48; margin-right: 12px; }
.case-row .start { font-style: italic; color: var(--pen); font-size: 16px; }
.case-row .line { display: block; color: var(--muted); font-size: 16px; }
.case-row .title { display: block; font-style: italic; font-size: 18px; }
.case-row .how { display: grid; justify-items: end; gap: 2px; font-size: 15px; color: var(--muted); }
.case-row .state.done { color: var(--ink); }
.level { display: inline-flex; gap: 4px; }
.level i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--muted); }
.level i.on { background: var(--ink); border-color: var(--ink); }
.home .row { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; }
.home .row .grow { flex: 1; min-width: 12px; }
@media (max-width: 760px) {
  .home { gap: 32px; padding-top: 16px; }
  .home .lede { font-size: 18px; }
  .case-row { grid-template-columns: minmax(0, 1fr) auto; padding: 14px 0 16px; }
  .case-row .today { grid-column: 1; grid-row: 2; }
  .case-row .how { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
  .case-row .tier { font-size: 22px; }
}

/* ---- the case screen */
.bar .accuse { margin-left: 8px; padding: 9px 18px 10px; font-size: 17px; }

.case-head { padding: 22px 0 26px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1fr); }
.case-head .date { margin: 0 0 6px; font-style: italic; color: var(--muted); display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; }
.case-head h1 { margin: 0; font-size: clamp(40px, 5.4vw, 64px); line-height: 1; font-weight: 500; letter-spacing: -.015em; font-variation-settings: 'opsz' 72; text-wrap: balance; }
.case-head .closed { margin: 8px 0 0; }
.case-head .closed:empty { display: none; }
.story summary { display: none; }
.story-body { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 48px; align-items: end; margin-top: 16px; }
.story .scene { margin: 0; max-width: 34em; font-size: 19px; }
.story .rules { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
.story .rules b { color: var(--ink); font-weight: 600; }

.case { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 48px; padding-top: 28px; align-items: start; }

/* statements: a numbered list; the pen ticks the used ones and brackets the one in hand */
.stmts-col { position: sticky; top: 66px; max-height: calc(100vh - 80px); overflow-y: auto; padding: 0 6px 12px 20px; margin-left: -20px; }
.stmts { list-style: none; margin: 12px 0 0; padding: 0; }
.stmt { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); border-top: 1px solid var(--rule); }
.stmt:last-child { border-bottom: 1px solid var(--rule); }
.stmt .use { position: relative; align-self: start; width: 30px; height: 36px; margin-top: 8px; padding: 0; background: none; border: 0; color: var(--muted); font-size: 16px; font-variant-numeric: lining-nums; text-align: left; }
.stmt .use:hover span { text-decoration: line-through; text-decoration-color: var(--pen); }
.stmt .use .tick { width: 22px; height: 20px; }
.stmt .say { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 13px 8px 15px 0; font-size: 17.5px; line-height: 1.45; color: var(--ink); }
.stmt .say .who, .strip .who, .allstmts .who { display: block; margin-top: 4px; font-style: italic; color: var(--muted); font-size: 15.5px; }
.stmt.used .txt { color: var(--muted); }
.stmt.on { background: linear-gradient(90deg, var(--wash), transparent 90%); }
.stmt .brace { position: absolute; left: -16px; top: 8px; width: 12px; height: calc(100% - 16px); pointer-events: none; }
.stmt.nudge { animation: nudge 1.4s ease 2; }
@keyframes nudge { 50% { background: var(--wash); } }
.tk.s { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: hsl(var(--h) 38% 55% / .75); }
.tk.w { font-style: italic; }
.tk.r { font-variant-caps: small-caps; letter-spacing: .02em; }

/* the notebook */
.nb-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; }
.howmark { margin: 0; color: var(--muted); font-size: 15px; }
.mini { position: relative; display: inline-block; width: 18px; height: 18px; vertical-align: -4px; }
.tabs { display: none; }
.tablewrap { margin-top: 12px; }
.grid { --cell: 53px; border-collapse: separate; border-spacing: 0; }
.grid th, .grid td { padding: 0; font-weight: 400; }
.grid .gap { width: 14px; min-width: 14px; }
.grid .grps .grp { vertical-align: bottom; text-align: left; padding-right: 4px; }
.grid .grps .grp span { display: block; padding: 0 0 3px 2px; border-bottom: 1px solid var(--rule); font-style: italic; color: var(--muted); font-size: 13.5px; line-height: 1.15; hyphens: manual; }
.grid .grps .grp.hl span { color: var(--ink); border-bottom-color: var(--ink); }
.grid .names th.c { width: var(--cell); min-width: var(--cell); vertical-align: bottom; text-align: center; padding: 8px 2px 7px; font-size: 13.5px; line-height: 1.12; hyphens: manual; }
.grid .names th.c .kg { display: block; margin: 0 auto 5px; width: 15px; height: 15px; }
.grid .names th.c.hl, .grid td.sq.hl { background: var(--wash); }
.grid tbody th { text-align: left; padding-right: 10px; font-size: 17px; white-space: nowrap; }
.grid tbody th.hl .who { text-decoration: underline; text-decoration-color: var(--ink); text-underline-offset: 4px; }
.grid td.sq { width: var(--cell); min-width: var(--cell); height: var(--cell); position: relative; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.grid tbody tr:first-child td.sq { border-top: 1px solid var(--rule); }
.grid td.sq:first-of-type, .grid td.gap + td.sq { border-left: 1px solid var(--rule); }
.grid td.sq.kpart { border-left: 2px solid var(--ink); }
.grid .cell { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; }
.grid .cell:hover { background: var(--wash); }
.grid .cell:focus-visible { outline-offset: -3px; }
.grid.wr { margin-top: 4px; }
/* when the squares alone cannot make it fit (fitGrid): smaller labels, names on two lines */
.grid.tight .names th.c { font-size: 11px; padding-left: 1px; padding-right: 1px; }
.grid.tight tbody th { white-space: normal; line-height: 1.05; max-width: 88px; }
.grid.tight .grps .grp span { font-size: 12px; }

/* the plan */
.plan { margin-top: 36px; }
.plan-key { margin: 4px 0 14px; color: var(--muted); font-size: 15.5px; max-width: 40em; }
.plan-key .tapnote { display: none; }
.plan-svg { display: block; width: 100%; max-width: 720px; height: auto; overflow: visible; font-family: var(--serif); }
.plan-svg.train { max-width: 640px; }
.plan-svg text { fill: var(--ink); }
.plan-svg .floor-name { font-style: italic; fill: var(--muted); font-size: 14px; }
.plan-svg .ghost { fill: none; stroke: var(--ghost); stroke-width: 1; stroke-dasharray: 3 4; }
.plan-svg .ghost-name { fill: var(--ghost); font-style: italic; font-size: 13px; }
.plan-svg .wall { fill: none; stroke: var(--ink); stroke-width: 2; pointer-events: none; }
.plan-svg .floorspace { fill: transparent; }
.plan-svg .room { cursor: pointer; outline: none; }
.plan-svg .room:hover .floorspace, .plan-svg .room.hl .floorspace { fill: var(--wash); }
.plan-svg .room:focus-visible .floorspace { stroke: var(--ink); stroke-width: 4; stroke-dasharray: 2 3; }
.plan-svg .door { stroke: var(--paper); stroke-width: 4; }
.plan-svg .stair, .plan-svg .coupling { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.plan-svg .pin { font-size: 13px; fill: var(--ink); }
.plan-svg.narrow .pin { font-size: 11px; }
.plan-svg .chip rect { fill: var(--paper); stroke: var(--rule); }
.plan-svg .chip use { color: var(--muted); }
.plan-svg .chip:hover rect { stroke: var(--ink); }
.plan-svg.narrow .chip { pointer-events: none; }

/* a room's weapons, full size (phone, keyboard) */
.wr-list { list-style: none; margin: 14px 0 0; padding: 0; }
.wr-list li { display: flex; align-items: center; gap: 14px; padding: 4px 0; border-bottom: 1px solid var(--rule); }
.wr-list .cell { position: relative; flex: none; width: 48px; height: 48px; padding: 0; background: none; border: 1px solid var(--rule); border-radius: 2px; }
.wr-list .kg { margin-right: 8px; }
.wr-list i { color: var(--muted); }
.allstmts { list-style: none; margin: 8px 0 0; padding: 0; }
.allstmts li { border-top: 1px solid var(--rule); }
.allstmts .pickrow { display: grid; grid-template-columns: 30px 1fr; gap: 0; width: 100%; text-align: left; background: none; border: 0; padding: 12px 0; font-size: 17px; line-height: 1.45; color: var(--ink); }
.allstmts .pickrow[aria-current='true'] { background: linear-gradient(90deg, var(--wash), transparent 90%); }
.allstmts .n { position: relative; color: var(--muted); }
.allstmts .tick { width: 20px; height: 18px; }
.allstmts .used .txt { color: var(--muted); }

/* the phone strip: one statement, pinned above the notebook */
.strip { display: none; }

/* the guided lesson */
.coach { position: fixed; z-index: 45; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100vw - 32px)); padding: 16px 18px 18px; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); border-radius: 2px; box-shadow: 0 18px 50px rgba(0, 0, 0, .22); }
.coach .coach-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-style: italic; color: var(--muted); font-size: 15px; }
.coach .coach-top button { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 15px; }
.coach p { margin: 8px 0 0; font-size: 17px; line-height: 1.45; }
.coach .warn { color: var(--pen); font-style: italic; }
.coach .warn:empty { display: none; }
.coach .actions { margin-top: 12px; }
body:has(.scrim) .coach { display: none; }
body.coached { padding-bottom: 280px; }
.coach-target { outline: 3px solid var(--pen) !important; outline-offset: -2px; }
.plan-svg .coach-target rect { stroke: var(--pen); stroke-width: 2.5; }
.stmt.coach-target { outline-offset: 2px; }
.plan.flash { animation: flash 1.2s ease 2; }
@keyframes flash { 50% { background: var(--wash); } }

@media (max-width: 1365px) {
  .story-body { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .case { grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 32px; }
}

/* ---- tablet and phone: one statement in a strip pinned above the notebook, one half of the notebook at a time */
@media (max-width: 1179px) {
  .bar { position: static; }
  .story summary { display: list-item; margin-top: 6px; color: var(--muted); font-style: italic; font-size: 16px; cursor: pointer; }
  .story-body { margin-top: 8px; }
  .case { display: block; padding-top: 0; }
  .stmts-col { display: none; }
  .strip { display: block; position: sticky; top: 0; z-index: 10; background: var(--paper); margin: 0 calc(-1 * var(--gutter)); padding: 8px var(--gutter) 10px; border-bottom: 1px solid var(--rule); }
  .strip .nav { display: flex; align-items: center; gap: 4px; }
  .strip .count { margin-right: auto; font-style: italic; color: var(--muted); font-size: 15px; }
  .strip .quiet { font-size: 15px; margin-right: 6px; }
  .strip .arrow { width: 44px; height: 38px; border: 1px solid var(--rule); background: none; border-radius: 2px; font-size: 22px; line-height: 1; color: var(--ink); }
  .strip .txt { position: relative; margin: 6px 0 0; padding-left: 12px; font-size: 17px; line-height: 1.42; }
  .strip .txt::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; border-radius: 2px; background: var(--pen); }
  .strip .txt.used { color: var(--muted); }
  .strip .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 2px; padding-left: 12px; }
  .strip .who { margin: 0; font-size: 15px; }
  .usebtn { position: relative; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; background: none; border: 0; padding: 0 2px; color: var(--muted); font-size: 15px; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; white-space: nowrap; }
  .usebtn .tick { width: 18px; height: 16px; }
  .notebook { margin-top: 12px; }
  .notebook .nb-head > .label { display: none; }
  .tabs { display: flex; margin-top: 10px; max-width: 560px; border: 1px solid var(--rule); border-radius: 2px; }
  .tabs button { flex: 1; min-height: 40px; background: none; border: 0; font-size: 16px; color: var(--muted); }
  .tabs button[aria-selected='true'] { background: var(--ink); color: var(--paper); }
  .notebook[data-tab='sw'] .rpart, .notebook[data-tab='sr'] .wpart { display: none; }
  .grid { --cell: 53px; }
  .plan { margin-top: 28px; }
}

/* ---- phone: a compressed header so the first screen shows the statement and the notebook; the button at the bottom */
@media (max-width: 760px) {
  .bar .accuse { position: fixed; z-index: 30; left: 16px; right: 16px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); margin: 0; padding: 13px 0 14px; font-size: 18px; }
  body:has(.bar .accuse)::after { content: ''; position: fixed; z-index: 29; left: 0; right: 0; bottom: 0; height: calc(70px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: 1px solid var(--rule); }
  #app:has(.case) { padding-bottom: 96px; }
  .case-head { padding: 6px 0 10px; }
  .case-head .date { font-size: 15px; margin-bottom: 2px; }
  .case-head h1 { font-size: 30px; line-height: 1.08; }
  .story .scene { font-size: 17px; }
  .story .rules { font-size: 15px; }
  .nb-head .howmark { font-size: 14.5px; }
  .grid { --cell: 40px; }
  .grid .gap { width: 8px; min-width: 8px; }
  .grid tbody th { font-size: 15px; padding-right: 6px; white-space: normal; line-height: 1.05; max-width: 92px; }
  .grid tbody th .dot { width: 8px; height: 8px; margin-right: 5px; }
  .grid .names th.c { font-size: 11.5px; padding: 6px 2px; }
  .grid .grps .grp span { font-size: 13px; }
  .plan-key { font-size: 14.5px; }
  .plan-key .tapnote { display: inline; }
}
@media (max-width: 380px) {
  .grid { --cell: 34px; }
  .grid tbody th { font-size: 13.5px; max-width: 66px; }
  .grid tbody th .dot { display: none; }
  .grid .names th.c { font-size: 10.5px; padding: 6px 1px; }
  .grid .gap { width: 4px; min-width: 4px; }
  .grid.tight .names th.c { font-size: 10px; }
  .grid.tight tbody th { max-width: 62px; }
  .grid .grps .grp span { font-size: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .stmt, .grid .cell { transition: background-color .15s; }
}

.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.sheetbox { width: min(620px, 100%); padding: 26px 30px 26px; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 2px; position: relative; max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 24px 60px rgba(0, 0, 0, .18); }

.sheetbox .x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; background: none; border: 0; font-size: 26px; line-height: 1; color: var(--muted); }
.sheetbox .x:hover { color: var(--ink); }
.sheetbox p { margin: 10px 0; max-width: 34em; }
.sheetbox ol { padding-left: 22px; margin: 10px 0; }
.sheetbox li { margin: 8px 0; }
.btn.red { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pick { margin: 18px 0 0; }
.pick h4 { margin: 0 0 8px; font-weight: 400; font-style: italic; color: var(--muted); font-size: 16px; }

.opt { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; background: none; border: 1px solid var(--rule); padding: 8px 14px; font-size: 17px; color: var(--ink); border-radius: 2px; text-align: left; }
.opt .kg { margin-right: 6px; }
.opt:hover { border-color: var(--ink); }
.opt[aria-pressed='true'] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.opt[aria-pressed='true'] .kg { color: var(--paper); }
.said { margin: 20px 0 4px; padding: 12px 0 0; border-top: 1px solid var(--rule); min-height: 3.2em; font-style: italic; }
.said b { font-style: normal; font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 18px; }
.closed { margin: 4px 0 14px; font-style: italic; color: var(--pen); font-size: 20px; }
.miss { margin: 14px 0 0; }

.verdict .tale { margin: 10px 0; font-size: 21px; line-height: 1.4; }
.verdict .tale b { font-weight: 600; }
.verdict table { border-collapse: collapse; width: 100%; font-size: 16px; margin-top: 8px; }
.verdict td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.verdict thead td { font-style: italic; color: var(--muted); }

.verdict summary { cursor: pointer; color: var(--muted); font-style: italic; }
.share { white-space: pre-wrap; border-left: 2px solid var(--rule); padding: 4px 0 4px 14px; margin: 16px 0 0; font-size: 16px; font-variant-numeric: lining-nums tabular-nums; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
.stats div { border-top: 1px solid var(--rule); padding: 8px 0 0; }
.stats b { display: block; font-size: 34px; line-height: 1.1; font-weight: 500; font-variant-numeric: lining-nums; }

// ---- 00-rng.js
// Seeded randomness. Same seed -> same case on every device.
function hashString(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeRng(seed) {
  const r = mulberry32(hashString(String(seed))());
  const rng = {
    next: r,
    int: (n) => Math.floor(r() * n),
    chance: (p) => r() < p,
    pick: (a) => a[Math.floor(r() * a.length)],
    shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    // pick one index according to non-negative weights
    weighted(weights) {
      let total = 0;
      for (const w of weights) total += w;
      if (total <= 0) return -1;
      let x = r() * total;
      for (let i = 0; i < weights.length; i++) {
        x -= weights[i];
        if (x < 0) return i;
      }
      return weights.length - 1;
    },
  };
  return rng;
}

// All permutations of 0..n-1 plus their inverses (inv[value] = position).
const _permCache = {};
function permutations(n) {
  if (_permCache[n]) return _permCache[n];
  const out = [];
  const cur = [];
  const used = new Array(n).fill(false);
  (function rec() {
    if (cur.length === n) { out.push(cur.slice()); return; }
    for (let i = 0; i < n; i++) {
      if (used[i]) continue;
      used[i] = true; cur.push(i);
      rec();
      cur.pop(); used[i] = false;
    }
  })();
  const inv = out.map((p) => {
    const q = new Array(n);
    for (let i = 0; i < n; i++) q[p[i]] = i;
    return q;
  });
  return (_permCache[n] = { perms: out, inv });
}

// ---- 20-clues.js
// A "case context" is the slice of a world in play tonight: n suspects, n weapons, n rooms.
// Every clue is a small closure over the context that can be tested against any candidate
// arrangement (pw: suspect->weapon, pwi: weapon->suspect, pr: suspect->room, pri: room->suspect).

function rectsAdjacent(a, b) {
  const horiz = (a.x + a.w === b.x || b.x + b.w === a.x) && a.y < b.y + b.h && b.y < a.y + a.h;
  const vert = (a.y + a.h === b.y || b.y + b.h === a.y) && a.x < b.x + b.w && b.x < a.x + a.w;
  return horiz || vert;
}

function buildCtx(world, suspectPick, weaponPick, roomPick) {
  const n = suspectPick.length;
  const rooms = roomPick.map((i) => world.rooms[i]);
  const adj = rooms.map((a) => rooms.map((b) => a !== b && rectsAdjacent(a.rect, b.rect)));
  const maxY = Math.max(...world.rooms.map((r) => r.rect.y));
  const floor = rooms.map((r) => (world.floors ? maxY - r.rect.y : 0));
  const pos = rooms.map((r) => r.rect.x);
  return {
    world, n,
    suspects: suspectPick.map((i) => world.suspects[i]),
    weapons: weaponPick.map((i) => world.weapons[i]),
    rooms, adj, floor, pos,
    types: weaponPick.map((i) => world.weapons[i].type),
    roomIdx: roomPick, suspectIdx: suspectPick, weaponIdx: weaponPick,
  };
}

// kind: W = weapons only, R = rooms only, X = both, M = murder (returns a bitmask of possible killers)
// family: direct | neg | link | rel | murder -- used to tune difficulty
function C(type, kind, family, args, test) {
  return { type, kind, family, args, test };
}

function enumerateClues(ctx) {
  const { n, adj, floor, pos, types, world } = ctx;
  const S = [...Array(n).keys()];
  const out = [];
  const typeSet = [...new Set(types)];
  const floorSet = [...new Set(floor)];
  const hasFloors = world.relations.includes('floor');
  const hasAhead = world.relations.includes('ahead');
  const FULL = (1 << n) - 1;
  const maskOf = (f) => { let m = 0; for (const s of S) if (f(s)) m |= 1 << s; return m; };

  for (const s of S) for (const w of S) {
    out.push(C('has', 'W', 'direct', { s, w }, (pw) => pw[s] === w));
    out.push(C('notHas', 'W', 'neg', { s, w }, (pw) => pw[s] !== w));
  }
  for (const s of S) for (const r of S) {
    out.push(C('in', 'R', 'direct', { s, r }, (pw, pwi, pr) => pr[s] === r));
    out.push(C('notIn', 'R', 'neg', { s, r }, (pw, pwi, pr) => pr[s] !== r));
  }
  for (const w of S) for (const a of S) for (const b of S) if (a < b) {
    out.push(C('eitherHas', 'W', 'rel', { w, a, b }, (pw, pwi) => pwi[w] === a || pwi[w] === b));
  }
  for (const r of S) for (const a of S) for (const b of S) if (a < b) {
    out.push(C('eitherIn', 'R', 'rel', { r, a, b }, (pw, pwi, pr, pri) => pri[r] === a || pri[r] === b));
  }
  for (const s of S) for (const t of typeSet) {
    out.push(C('holdsType', 'W', 'link', { s, t }, (pw) => types[pw[s]] === t));
    out.push(C('notHoldsType', 'W', 'neg', { s, t }, (pw) => types[pw[s]] !== t));
  }
  for (const a of S) for (const b of S) if (a < b) {
    out.push(C('sameType', 'W', 'rel', { a, b }, (pw) => types[pw[a]] === types[pw[b]]));
    out.push(C('diffType', 'W', 'rel', { a, b }, (pw) => types[pw[a]] !== types[pw[b]]));
    out.push(C('adjacent', 'R', 'rel', { a, b }, (pw, pwi, pr) => adj[pr[a]][pr[b]]));
    out.push(C('notAdjacent', 'R', 'rel', { a, b }, (pw, pwi, pr) => !adj[pr[a]][pr[b]]));
    if (hasFloors) {
      out.push(C('sameFloor', 'R', 'rel', { a, b }, (pw, pwi, pr) => floor[pr[a]] === floor[pr[b]]));
      out.push(C('diffFloor', 'R', 'rel', { a, b }, (pw, pwi, pr) => floor[pr[a]] !== floor[pr[b]]));
    }
  }
  if (hasAhead) for (const a of S) for (const b of S) if (a !== b) {
    out.push(C('ahead', 'R', 'rel', { a, b }, (pw, pwi, pr) => pos[pr[a]] < pos[pr[b]]));
  }
  for (const w of S) for (const r of S) {
    out.push(C('weaponIn', 'X', 'link', { w, r }, (pw, pwi, pr) => pr[pwi[w]] === r));
    out.push(C('weaponNotIn', 'X', 'neg', { w, r }, (pw, pwi, pr) => pr[pwi[w]] !== r));
    out.push(C('weaponNear', 'X', 'link', { w, r }, (pw, pwi, pr) => adj[pr[pwi[w]]][r]));
  }
  for (const r of S) for (const t of typeSet) {
    out.push(C('typeInRoom', 'X', 'link', { r, t }, (pw, pwi, pr, pri) => types[pw[pri[r]]] === t));
    out.push(C('notTypeInRoom', 'X', 'neg', { r, t }, (pw, pwi, pr, pri) => types[pw[pri[r]]] !== t));
  }

  // ---- murder clues: each returns the set of suspects who could still be the killer
  for (const t of typeSet) {
    out.push(C('murderType', 'M', 'murder', { t }, (pw) => maskOf((m) => types[pw[m]] === t)));
    out.push(C('murderNotType', 'M', 'murder', { t }, (pw) => maskOf((m) => types[pw[m]] !== t)));
  }
  for (const s of S) {
    out.push(C('murderNotSuspect', 'M', 'murder', { s }, () => FULL & ~(1 << s)));
    out.push(C('murderNextTo', 'M', 'murder', { s }, (pw, pwi, pr) => maskOf((m) => m !== s && adj[pr[m]][pr[s]])));
    out.push(C('murderFarFrom', 'M', 'murder', { s }, (pw, pwi, pr) => maskOf((m) => m !== s && !adj[pr[m]][pr[s]])));
    if (hasFloors) out.push(C('murderSameFloor', 'M', 'murder', { s }, (pw, pwi, pr) => maskOf((m) => m !== s && floor[pr[m]] === floor[pr[s]])));
    if (hasAhead) {
      out.push(C('murderAheadOf', 'M', 'murder', { s }, (pw, pwi, pr) => maskOf((m) => pos[pr[m]] < pos[pr[s]])));
      out.push(C('murderBehind', 'M', 'murder', { s }, (pw, pwi, pr) => maskOf((m) => pos[pr[m]] > pos[pr[s]])));
    }
  }
  for (const w of S) out.push(C('murderNotWeapon', 'M', 'murder', { w }, (pw) => maskOf((m) => pw[m] !== w)));
  for (const r of S) {
    out.push(C('murderNotRoom', 'M', 'murder', { r }, (pw, pwi, pr) => maskOf((m) => pr[m] !== r)));
    out.push(C('murderAdjRoom', 'M', 'murder', { r }, (pw, pwi, pr) => maskOf((m) => adj[pr[m]][r])));
    out.push(C('murderNotAdjRoom', 'M', 'murder', { r }, (pw, pwi, pr) => maskOf((m) => pr[m] !== r && !adj[pr[m]][r])));
  }
  if (hasFloors) for (const f of floorSet) {
    out.push(C('murderFloor', 'M', 'murder', { f }, (pw, pwi, pr) => maskOf((m) => floor[pr[m]] === f)));
    out.push(C('murderNotFloor', 'M', 'murder', { f }, (pw, pwi, pr) => maskOf((m) => floor[pr[m]] !== f)));
  }
  return out;
}

// Does the clue hold for the hidden truth {pw, pr, m}?
function clueHolds(clue, truth, pwi, pri) {
  const v = clue.test(truth.pw, pwi, truth.pr, pri);
  return clue.kind === 'M' ? (v & (1 << truth.m)) !== 0 : v;
}

// ---- 25-text.js
// Turns a clue into words. Tokens {s:i} {w:i} {r:i} are swapped for names by the renderer,
// so the UI can highlight and cross-reference them. Everyone tells the truth.
// Banked cases store the variant index, so keep the number of variants and their voice
// ('say' or 'note') per type exactly as they are when rewording.
function clueVariants(c, ctx) {
  const a = c.args;
  const line = ctx.world.layoutKind === 'line';
  const unit = line ? 'carriage' : 'room';
  const S = (i) => `{s:${i}}`, W = (i) => `{w:${i}}`, R = (i) => `{r:${i}}`;
  const T = (t) => WEAPON_TYPES[t];
  const floorWord = (f) => ctx.world.floors[f];
  switch (c.type) {
    case 'has': return [
      ['say', `I saw ${S(a.s)} with the ${W(a.w)} in hand. I'm certain of it.`],
      ['note', `The ${W(a.w)} was last seen in ${S(a.s)}'s hands.`]];
    case 'notHas': return [
      ['say', `${S(a.s)} never touched the ${W(a.w)}. I'd swear to it.`],
      ['note', `${S(a.s)}'s prints are nowhere on the ${W(a.w)}.`]];
    case 'in': return [
      ['say', `${S(a.s)} was in the ${R(a.r)} when the clock struck. I heard them through the door.`],
      ['note', `A witness puts ${S(a.s)} in the ${R(a.r)} at the time of the murder.`]];
    case 'notIn': return [
      ['say', `${S(a.s)} was nowhere near the ${R(a.r)} that night.`],
      ['note', `${S(a.s)} was not in the ${R(a.r)}.`]];
    case 'eitherHas': return [
      ['say', `Either ${S(a.a)} or ${S(a.b)} had the ${W(a.w)}. I couldn't tell you which.`],
      ['note', `The ${W(a.w)} was held by ${S(a.a)} or by ${S(a.b)}.`]];
    case 'eitherIn': return [
      ['say', `Someone was in the ${R(a.r)}: ${S(a.a)} or ${S(a.b)}. It was too dark to see which.`],
      ['note', `Whoever was in the ${R(a.r)}, it was ${S(a.a)} or ${S(a.b)}.`]];
    case 'holdsType': return [
      ['say', `${S(a.s)} was carrying ${T(a.t).held}. I noticed it straight away.`],
      ['note', `${S(a.s)} was carrying ${T(a.t).held}.`]];
    case 'notHoldsType': return [
      ['say', `${S(a.s)} wasn't carrying ${T(a.t).any}. I checked.`],
      ['note', `Whatever ${S(a.s)} was carrying, it wasn't ${T(a.t).label}.`]];
    case 'sameType': return [
      ['say', `${S(a.a)} and ${S(a.b)} were carrying the same kind of weapon. I thought that was odd.`],
      ['note', `${S(a.a)} and ${S(a.b)} carried the same kind of weapon.`]];
    case 'diffType': return [
      ['say', `${S(a.a)} and ${S(a.b)} weren't carrying the same kind of weapon. Not even close.`],
      ['note', `${S(a.a)} and ${S(a.b)} carried different kinds of weapon.`]];
    case 'adjacent': return [
      ['say', `${S(a.a)} and ${S(a.b)} were in ${unit}s right next to each other. I could hear them both.`],
      ['note', `${S(a.a)}'s ${unit} was right next to ${S(a.b)}'s.`]];
    case 'notAdjacent': return [
      ['say', `${S(a.a)} and ${S(a.b)} weren't in ${unit}s next to each other. Not even close.`],
      ['note', `${S(a.a)}'s ${unit} was not next to ${S(a.b)}'s.`]];
    case 'sameFloor': return [
      ['say', `${S(a.a)} and ${S(a.b)} were on the same floor. I heard the boards creak under both of them.`],
      ['note', `${S(a.a)} and ${S(a.b)} were on the same floor.`]];
    case 'diffFloor': return [
      ['say', `${S(a.a)} and ${S(a.b)} weren't on the same floor. I'm sure of that.`],
      ['note', `${S(a.a)} and ${S(a.b)} were on different floors.`]];
    case 'ahead': return [
      ['say', `${S(a.a)} was in a carriage closer to the engine than ${S(a.b)}.`],
      ['note', `${S(a.a)}'s carriage was nearer the engine than ${S(a.b)}'s.`]];
    case 'weaponIn': return [
      ['say', `The ${W(a.w)} was in the ${R(a.r)}. I saw it in someone's hand.`],
      ['note', `Whoever was in the ${R(a.r)} was holding the ${W(a.w)}.`]];
    case 'weaponNotIn': return [
      ['say', `The ${W(a.w)} was never in the ${R(a.r)}.`],
      ['note', `Whoever was in the ${R(a.r)}, they weren't holding the ${W(a.w)}.`]];
    case 'weaponNear': return [
      ['say', `I saw the ${W(a.w)} in a ${unit} next to the ${R(a.r)}.`],
      ['note', `The ${W(a.w)} was in a ${unit} next to the ${R(a.r)}, not in the ${R(a.r)} itself.`]];
    case 'typeInRoom': return [
      ['say', `Whoever was in the ${R(a.r)} had ${T(a.t).held}. I saw it myself.`],
      ['note', `The person in the ${R(a.r)} was carrying ${T(a.t).held}.`]];
    case 'notTypeInRoom': return [
      ['say', `Whoever was in the ${R(a.r)} didn't have ${T(a.t).any}. I'd have noticed.`],
      ['note', `The person in the ${R(a.r)} wasn't carrying ${T(a.t).label}.`]];
    // ---- the body
    case 'murderType': return [
      ['note', `The coroner is certain: the cause of death was ${T(a.t).cause}.`]];
    case 'murderNotType': return [
      ['note', `The coroner is clear: he was not killed with ${T(a.t).label}.`]];
    case 'murderNotSuspect': return [
      ['note', `${S(a.s)} has a solid alibi and can be ruled out as the killer.`]];
    case 'murderNextTo': return [
      ['note', `The killer was in a ${unit} right next to ${S(a.s)}'s.`]];
    case 'murderFarFrom': return [
      ['note', `It wasn't ${S(a.s)}, and it wasn't anyone in a ${unit} next to ${S(a.s)}'s.`]];
    case 'murderSameFloor': return [
      ['note', `The killer was on the same floor as ${S(a.s)}, but it wasn't ${S(a.s)}.`]];
    case 'murderAheadOf': return [
      ['note', `The killer's carriage was nearer the engine than ${S(a.s)}'s.`]];
    case 'murderBehind': return [
      ['note', `The killer's carriage was further from the engine than ${S(a.s)}'s.`]];
    case 'murderNotWeapon': return [
      ['note', `Forensics cleared the ${W(a.w)}. It is not the murder weapon.`]];
    case 'murderNotRoom': return [
      ['note', `The body was not found in the ${R(a.r)}.`]];
    case 'murderAdjRoom': return [
      ['note', `The body was found in a ${unit} next to the ${R(a.r)}.`]];
    case 'murderNotAdjRoom': return [
      ['note', `The body was not in the ${R(a.r)}, and not in any ${unit} next to it.`]];
    case 'murderFloor': return [
      ['note', `The body was found ${floorWord(a.f)}.`]];
    case 'murderNotFloor': return [
      ['note', `The body was not found ${floorWord(a.f)}.`]];
  }
  throw new Error('no text for clue type ' + c.type);
}

// Which suspects does a clue talk about? (so a witness is never the subject of their own statement)
function clueSuspects(c) {
  const a = c.args, out = [];
  for (const k of ['s', 'a', 'b']) if (a[k] !== undefined) out.push(a[k]);
  return out;
}

// Plain-text rendering (tests, share text). The UI renders tokens itself.
function plainText(str, ctx) {
  return str.replace(/\{([swr]):(\d+)\}/g, (_, k, i) => {
    i = +i;
    return k === 's' ? ctx.suspects[i].short : k === 'w' ? ctx.weapons[i].name : ctx.rooms[i].name;
  });
}

// ---- 30-solver.js
// Exhaustive logic solver. Weapon-only and room-only clues are applied to the permutation lists
// first, so the expensive cross product only runs over what survives. The answer is the triple
// (killer, weapon, room); a puzzle is fair only if exactly one triple survives.
function solveCount(ctx, clues, limit) {
  const { n } = ctx;
  const { perms, inv } = permutations(n);
  const FULL = (1 << n) - 1;
  const wClues = clues.filter((c) => c.kind === 'W');
  const rClues = clues.filter((c) => c.kind === 'R');
  const xClues = clues.filter((c) => c.kind === 'X');
  const mClues = clues.filter((c) => c.kind === 'M');

  const LA = [];
  for (let a = 0; a < perms.length; a++) {
    let ok = true;
    for (const c of wClues) if (!c.test(perms[a], inv[a], null, null)) { ok = false; break; }
    if (ok) LA.push(a);
  }
  const LB = [];
  for (let b = 0; b < perms.length; b++) {
    let ok = true;
    for (const c of rClues) if (!c.test(null, null, perms[b], inv[b])) { ok = false; break; }
    if (ok) LB.push(b);
  }

  const seen = new Uint8Array(n * n * n);
  const answers = [];
  const lim = limit === undefined ? Infinity : limit;
  for (let ia = 0; ia < LA.length; ia++) {
    const pw = perms[LA[ia]], pwi = inv[LA[ia]];
    for (let ib = 0; ib < LB.length; ib++) {
      const pr = perms[LB[ib]], pri = inv[LB[ib]];
      let ok = true;
      for (let k = 0; k < xClues.length; k++) {
        if (!xClues[k].test(pw, pwi, pr, pri)) { ok = false; break; }
      }
      if (!ok) continue;
      let mask = FULL;
      for (let k = 0; k < mClues.length && mask; k++) mask &= mClues[k].test(pw, pwi, pr, pri);
      if (!mask) continue;
      for (let m = 0; m < n; m++) {
        if (!(mask & (1 << m))) continue;
        const key = (m * n + pw[m]) * n + pr[m];
        if (!seen[key]) {
          seen[key] = 1;
          answers.push({ killer: m, weapon: pw[m], room: pr[m] });
          if (answers.length > lim) return { count: answers.length, answers, capped: true };
        }
      }
    }
  }
  return { count: answers.length, answers, capped: false };
}

// Every full arrangement that fits the clues (used for hints and for checking player grids).
// Returns the marginal "possible" matrices: which suspect/weapon/room cells survive in at least
// one consistent world.
function marginals(ctx, clues) {
  const { n } = ctx;
  const { perms, inv } = permutations(n);
  const FULL = (1 << n) - 1;
  const wClues = clues.filter((c) => c.kind === 'W');
  const rClues = clues.filter((c) => c.kind === 'R');
  const xClues = clues.filter((c) => c.kind === 'X');
  const mClues = clues.filter((c) => c.kind === 'M');
  const sw = Array.from({ length: n }, () => new Uint8Array(n));
  const sr = Array.from({ length: n }, () => new Uint8Array(n));
  const wr = Array.from({ length: n }, () => new Uint8Array(n));
  const killer = new Uint8Array(n);
  let worlds = 0;
  const LA = [], LB = [];
  for (let a = 0; a < perms.length; a++) if (wClues.every((c) => c.test(perms[a], inv[a], null, null))) LA.push(a);
  for (let b = 0; b < perms.length; b++) if (rClues.every((c) => c.test(null, null, perms[b], inv[b]))) LB.push(b);
  for (const a of LA) {
    const pw = perms[a], pwi = inv[a];
    for (const b of LB) {
      const pr = perms[b], pri = inv[b];
      if (!xClues.every((c) => c.test(pw, pwi, pr, pri))) continue;
      let mask = FULL;
      for (const c of mClues) mask &= c.test(pw, pwi, pr, pri);
      if (!mask) continue;
      worlds++;
      for (let s = 0; s < n; s++) { sw[s][pw[s]] = 1; sr[s][pr[s]] = 1; wr[pw[s]][pr[s]] = 1; }
      for (let m = 0; m < n; m++) if (mask & (1 << m)) killer[m] = 1;
    }
  }
  return { sw, sr, wr, killer, worlds };
}

// ---- 32-survivors.js
// Incremental candidate set used while building a case: every (weapon arrangement, room arrangement)
// pair that still fits the clues so far, with a bitmask of who could be the killer in each.
// Adding a clue only ever shrinks the set, so building costs little more than one full scan.
function newSurvivors(ctx) {
  const n = ctx.n, N = permutations(n).perms.length, FULL = (1 << n) - 1;
  const size = N * N;
  const A = new Uint16Array(size), B = new Uint16Array(size), M = new Uint8Array(size).fill(FULL);
  let k = 0;
  for (let a = 0; a < N; a++) for (let b = 0; b < N; b++) { A[k] = a; B[k] = b; k++; }
  return { A, B, M, size };
}

// Applies `clue` to `src`, writing survivors into `dst`. Returns dst.
function narrow(ctx, src, clue, dst) {
  const { perms, inv } = permutations(ctx.n);
  const N = perms.length;
  let out = 0;
  if (clue.kind === 'W' || clue.kind === 'R') {
    const pass = new Uint8Array(N);
    for (let p = 0; p < N; p++) {
      pass[p] = clue.kind === 'W' ? (clue.test(perms[p], inv[p], null, null) ? 1 : 0) : (clue.test(null, null, perms[p], inv[p]) ? 1 : 0);
    }
    const key = clue.kind === 'W' ? src.A : src.B;
    for (let i = 0; i < src.size; i++) {
      if (!pass[key[i]]) continue;
      dst.A[out] = src.A[i]; dst.B[out] = src.B[i]; dst.M[out] = src.M[i]; out++;
    }
  } else if (clue.kind === 'X') {
    for (let i = 0; i < src.size; i++) {
      const a = src.A[i], b = src.B[i];
      if (!clue.test(perms[a], inv[a], perms[b], inv[b])) continue;
      dst.A[out] = a; dst.B[out] = b; dst.M[out] = src.M[i]; out++;
    }
  } else {
    for (let i = 0; i < src.size; i++) {
      const a = src.A[i], b = src.B[i];
      const m = src.M[i] & clue.test(perms[a], inv[a], perms[b], inv[b]);
      if (!m) continue;
      dst.A[out] = a; dst.B[out] = b; dst.M[out] = m; out++;
    }
  }
  dst.size = out;
  return dst;
}

// How many distinct (killer, weapon, room) answers survive?
function countSurvivingAnswers(ctx, set) {
  const n = ctx.n, { perms } = permutations(n);
  const seen = new Uint8Array(n * n * n);
  let count = 0;
  for (let i = 0; i < set.size; i++) {
    const pw = perms[set.A[i]], pr = perms[set.B[i]], mask = set.M[i];
    for (let m = 0; m < n; m++) {
      if (!(mask & (1 << m))) continue;
      const key = (m * n + pw[m]) * n + pr[m];
      if (!seen[key]) { seen[key] = 1; count++; }
    }
  }
  return count;
}

// ---- 35-human.js
// A "human" solver: candidate lists for every suspect's weapon and room, plus the killer, the
// murder weapon and the murder room. Each clue becomes small local constraints; each deduction
// is a candidate being crossed out. Where plain elimination stalls, it tries one "what if?" at a
// time (depth 1), or a what-if inside a what-if (depth 2). That depth is how hard the case feels.
//
// Variables: 0..n-1 weapon of suspect s | n..2n-1 room of suspect s | 2n killer | 2n+1 murder weapon | 2n+2 murder room

function buildCSP(ctx, clues) {
  const n = ctx.n, { adj, floor, pos, types } = ctx;
  const PW = (s) => s, PR = (s) => n + s, K = 2 * n, MW = 2 * n + 1, MR = 2 * n + 2;
  const cons = [];
  const add = (clue, vars, pred) => cons.push({ clue, vars, pred });
  const each = (f) => { for (let s = 0; s < n; s++) f(s); };
  clues.forEach((c, ci) => {
    const a = c.args;
    switch (c.type) {
      case 'has': add(ci, [PW(a.s)], (x) => x === a.w); break;
      case 'notHas': add(ci, [PW(a.s)], (x) => x !== a.w); break;
      case 'in': add(ci, [PR(a.s)], (x) => x === a.r); break;
      case 'notIn': add(ci, [PR(a.s)], (x) => x !== a.r); break;
      case 'eitherHas': add(ci, [PW(a.a), PW(a.b)], (x, y) => x === a.w || y === a.w); break;
      case 'eitherIn': add(ci, [PR(a.a), PR(a.b)], (x, y) => x === a.r || y === a.r); break;
      case 'holdsType': add(ci, [PW(a.s)], (x) => types[x] === a.t); break;
      case 'notHoldsType': add(ci, [PW(a.s)], (x) => types[x] !== a.t); break;
      case 'sameType': add(ci, [PW(a.a), PW(a.b)], (x, y) => types[x] === types[y]); break;
      case 'diffType': add(ci, [PW(a.a), PW(a.b)], (x, y) => types[x] !== types[y]); break;
      case 'adjacent': add(ci, [PR(a.a), PR(a.b)], (x, y) => adj[x][y]); break;
      case 'notAdjacent': add(ci, [PR(a.a), PR(a.b)], (x, y) => !adj[x][y]); break;
      case 'sameFloor': add(ci, [PR(a.a), PR(a.b)], (x, y) => floor[x] === floor[y]); break;
      case 'diffFloor': add(ci, [PR(a.a), PR(a.b)], (x, y) => floor[x] !== floor[y]); break;
      case 'ahead': add(ci, [PR(a.a), PR(a.b)], (x, y) => pos[x] < pos[y]); break;
      case 'weaponIn': each((s) => add(ci, [PW(s), PR(s)], (x, y) => (x === a.w) === (y === a.r))); break;
      case 'weaponNotIn': each((s) => add(ci, [PW(s), PR(s)], (x, y) => !(x === a.w && y === a.r))); break;
      case 'weaponNear': each((s) => add(ci, [PW(s), PR(s)], (x, y) => x !== a.w || adj[y][a.r])); break;
      case 'typeInRoom': each((s) => add(ci, [PW(s), PR(s)], (x, y) => y !== a.r || types[x] === a.t)); break;
      case 'notTypeInRoom': each((s) => add(ci, [PW(s), PR(s)], (x, y) => y !== a.r || types[x] !== a.t)); break;
      case 'murderType': add(ci, [MW], (x) => types[x] === a.t); break;
      case 'murderNotType': add(ci, [MW], (x) => types[x] !== a.t); break;
      case 'murderNotSuspect': add(ci, [K], (x) => x !== a.s); break;
      case 'murderNextTo': add(ci, [K], (x) => x !== a.s); add(ci, [MR, PR(a.s)], (x, y) => adj[x][y]); break;
      case 'murderFarFrom': add(ci, [K], (x) => x !== a.s); add(ci, [MR, PR(a.s)], (x, y) => !adj[x][y]); break;
      case 'murderSameFloor': add(ci, [K], (x) => x !== a.s); add(ci, [MR, PR(a.s)], (x, y) => floor[x] === floor[y]); break;
      case 'murderAheadOf': add(ci, [MR, PR(a.s)], (x, y) => pos[x] < pos[y]); break;
      case 'murderBehind': add(ci, [MR, PR(a.s)], (x, y) => pos[x] > pos[y]); break;
      case 'murderNotWeapon': add(ci, [MW], (x) => x !== a.w); break;
      case 'murderNotRoom': add(ci, [MR], (x) => x !== a.r); break;
      case 'murderAdjRoom': add(ci, [MR], (x) => adj[x][a.r]); break;
      case 'murderNotAdjRoom': add(ci, [MR], (x) => x !== a.r && !adj[x][a.r]); break;
      case 'murderFloor': add(ci, [MR], (x) => floor[x] === a.f); break;
      case 'murderNotFloor': add(ci, [MR], (x) => floor[x] !== a.f); break;
      default: throw new Error('human solver: unknown clue ' + c.type);
    }
  });
  // the killer is whoever holds the murder weapon and stands in the murder room
  each((s) => {
    add(-1, [K, PW(s), MW], (k, w, mw) => (k === s) === (w === mw));
    add(-1, [K, PR(s), MR], (k, r, mr) => (k === s) === (r === mr));
  });
  const groups = [[...Array(n).keys()].map(PW), [...Array(n).keys()].map(PR)];
  return { n, cons, groups, nv: 2 * n + 3, K, MW, MR, PW, PR };
}

const popcount = (x) => { let c = 0; while (x) { x &= x - 1; c++; } return c; };

// Remove candidates until nothing more follows. Returns false on contradiction.
function propagate(csp, dom, trace) {
  const { n, cons, groups } = csp;
  const full = (1 << n) - 1;
  const note = (v, removed, clue) => { if (trace && removed) trace.push({ v, removed, clue }); };
  let changed = true;
  while (changed) {
    changed = false;
    for (const con of cons) {
      const vs = con.vars, k = vs.length;
      const sup = [0, 0, 0];
      const d0 = dom[vs[0]], d1 = k > 1 ? dom[vs[1]] : 1, d2 = k > 2 ? dom[vs[2]] : 1;
      for (let x = 0; x < n; x++) {
        if (!(d0 & (1 << x))) continue;
        if (k === 1) { if (con.pred(x)) sup[0] |= 1 << x; continue; }
        for (let y = 0; y < n; y++) {
          if (!(d1 & (1 << y))) continue;
          if (k === 2) { if (con.pred(x, y)) { sup[0] |= 1 << x; sup[1] |= 1 << y; } continue; }
          for (let z = 0; z < n; z++) {
            if (!(d2 & (1 << z))) continue;
            if (con.pred(x, y, z)) { sup[0] |= 1 << x; sup[1] |= 1 << y; sup[2] |= 1 << z; }
          }
        }
      }
      for (let i = 0; i < k; i++) {
        const nd = dom[vs[i]] & sup[i];
        if (nd !== dom[vs[i]]) {
          note(vs[i], dom[vs[i]] & ~nd, con.clue);
          dom[vs[i]] = nd; changed = true;
          if (!nd) return false;
        }
      }
    }
    // each weapon / room is used exactly once
    for (const g of groups) {
      for (const v of g) {
        if (popcount(dom[v]) === 1) {
          for (const u of g) if (u !== v && (dom[u] & dom[v])) {
            note(u, dom[u] & dom[v], -1);
            dom[u] &= ~dom[v]; changed = true;
            if (!dom[u]) return false;
          }
        }
      }
      for (let x = 0; x < n; x++) {
        let only = -1, cnt = 0;
        for (const v of g) if (dom[v] & (1 << x)) { cnt++; only = v; }
        if (cnt === 0) return false;
        if (cnt === 1 && popcount(dom[only]) > 1) {
          note(only, dom[only] & ~(1 << x), -1);
          dom[only] = 1 << x; changed = true;
        }
      }
    }
  }
  return true;
}

const answered = (csp, dom) => popcount(dom[csp.K]) === 1 && popcount(dom[csp.MW]) === 1 && popcount(dom[csp.MR]) === 1;

// Probing: assume a candidate; if that leads to a contradiction, it can be crossed out.
function probe(csp, dom, depth, stats) {
  let progress = true;
  while (progress && !answered(csp, dom)) {
    progress = false;
    for (let v = 0; v < csp.nv; v++) {
      for (let x = 0; x < csp.n; x++) {
        if (!(dom[v] & (1 << x)) || popcount(dom[v]) === 1) continue;
        const trial = dom.slice();
        trial[v] = 1 << x;
        stats.probes++;
        let ok = propagate(csp, trial);
        if (ok && depth > 1 && !answered(csp, trial)) ok = probe(csp, trial, depth - 1, stats);
        if (!ok) {
          dom[v] &= ~(1 << x);
          if (!dom[v] || !propagate(csp, dom)) return false;
          progress = true;
        }
      }
    }
  }
  return true;
}

// How hard is this case for a careful human? depth 0 = elimination only, 1 = needs a what-if, 2 = nested what-ifs.
function humanDifficulty(ctx, clues, maxDepth) {
  const csp = buildCSP(ctx, clues);
  const dom = new Array(csp.nv).fill((1 << ctx.n) - 1);
  const stats = { probes: 0 };
  if (!propagate(csp, dom)) return { depth: -1, probes: 0 };
  if (answered(csp, dom)) return { depth: 0, probes: 0, dom };
  for (let d = 1; d <= (maxDepth || 2); d++) {
    const t = dom.slice(); stats.probes = 0;
    if (probe(csp, t, d, stats) && answered(csp, t)) return { depth: d, probes: stats.probes, dom: t };
  }
  return { depth: 99, probes: stats.probes };
}

const TITLES = {
  manor: ['The Blackwood Affair', 'A Quiet Dinner at Blackwood', 'Murder by Candlelight', 'The Storm at Blackwood'],
  train: ['Death on the Meridian', 'The Last Carriage', 'Murder in the Mountains', 'The Night Express'],
};

function pickN(rng, count, n) {
  return rng.shuffle([...Array(count).keys()]).slice(0, n).sort((a, b) => a - b);
}

function validPicks(world, ctx) {
  const types = ctx.types;
  const distinct = new Set(types).size;
  const dup = types.length - distinct;
  if (distinct < 3 || dup < 1) return false;
  if (world.relations.includes('floor') && new Set(ctx.floor).size < 2) return false;
  // there must be some adjacency among the rooms in play, or the layout clues are dead weight
  let edges = 0;
  for (let i = 0; i < ctx.n; i++) for (let j = i + 1; j < ctx.n; j++) if (ctx.adj[i][j]) edges++;
  return edges >= 2;
}

function attempt(rng, tier, worldId) {
  const world = WORLDS[worldId];
  const n = tier.n;
  let ctx, tries = 0;
  do {
    ctx = buildCtx(world, pickN(rng, world.suspects.length, n), pickN(rng, world.weapons.length, n), pickN(rng, world.rooms.length, n));
  } while (!validPicks(world, ctx) && ++tries < 200);

  const { perms, inv } = permutations(n);
  const pw = perms[rng.int(perms.length)], pr = perms[rng.int(perms.length)];
  const pwi = inv[perms.indexOf(pw)], pri = inv[perms.indexOf(pr)];
  const truth = { pw, pr, m: rng.int(n) };

  const pool = enumerateClues(ctx).filter((c) => clueHolds(c, truth, pwi, pri) && !(tier.avoid && tier.avoid.includes(c.type)));
  const perType = {};
  pool.forEach((c) => { perType[c.type] = (perType[c.type] || 0) + 1; });
  const alive = pool.map(() => true);
  const usedType = {};
  const chosen = [];
  let direct = 0, count = n * n * n * 2; // anything above the true maximum
  let cur = newSurvivors(ctx), spare = newSurvivors(ctx);
  while (chosen.length < tier.maxClues + 8) {
    // every kind of clue gets a fair turn, however many instances of it happen to be true
    const w = pool.map((c, j) => alive[j] ? (tier.weights[c.family] || 0) / perType[c.type] * Math.pow(0.3, usedType[c.type] || 0) : 0);
    const i = rng.weighted(w);
    if (i < 0) return null;
    alive[i] = false;
    const c = pool[i];
    if (c.family === 'direct' && direct >= tier.maxDirect) continue;
    narrow(ctx, cur, c, spare);
    const cnt = countSurvivingAnswers(ctx, spare);
    if (cnt >= count) continue; // adds nothing right now
    [cur, spare] = [spare, cur];
    chosen.push(c);
    usedType[c.type] = (usedType[c.type] || 0) + 1;
    if (c.family === 'direct') direct++;
    count = cnt;
    if (count === 1) break;
  }
  if (count !== 1) return null;

  // squeeze out every clue that is not pulling its weight
  for (const c of rng.shuffle(chosen)) {
    const rest = chosen.filter((x) => x !== c);
    if (solveCount(ctx, rest, 1).count === 1) chosen.splice(chosen.indexOf(c), 1);
  }
  const indirect = chosen.filter((c) => c.family !== 'direct' && c.family !== 'neg').length;
  if (chosen.length < tier.minClues || chosen.length > tier.maxClues || indirect < tier.minIndirect) return null;
  const typeCount = {};
  chosen.forEach((c) => { typeCount[c.type] = (typeCount[c.type] || 0) + 1; });
  if (Object.keys(typeCount).length < tier.minTypes || Math.max(...Object.values(typeCount)) > 3) return null;
  const murders = chosen.filter((c) => c.kind === 'M').length;
  if (murders < 2 || murders > Math.ceil(chosen.length * 0.55)) return null;
  const human = humanDifficulty(ctx, chosen, 2);
  if (human.depth < 0 || human.depth > 2) return null; // needs more than nested what-ifs: not a fair puzzle
  return { ctx, truth, chosen, human };
}

function generatePuzzle(seed, tierId, opts) {
  opts = opts || {};
  const tier = TIERS[tierId];
  const rng = makeRng(`${seed}|${tierId}`);
  const worldId = opts.world || rng.pick(Object.keys(WORLDS));
  let got = null, best = null, tries = 0;
  const maxTries = opts.maxTries || 120;
  while (!got && tries < maxTries) {
    const g = attempt(rng, tier, worldId);
    tries++;
    if (!g) continue;
    if (tier.accept(g.human)) got = g;
    else if (!best) best = g; // keep something fair in case the tier's taste is never met
  }
  const strict = !!got;
  got = got || best;
  if (!got) throw new Error(`could not build a ${tierId} case for seed ${seed}`);
  const { ctx, truth, chosen, human } = got;

  const ordered = rng.shuffle(chosen);
  const clues = ordered.map((c) => {
    const variants = clueVariants(c, ctx);
    const say = variants.filter((v) => v[0] === 'say'), note = variants.filter((v) => v[0] === 'note');
    const useSay = say.length && (!note.length || rng.chance(0.62));
    const v = useSay ? rng.pick(say) : rng.pick(note);
    let speaker = null;
    if (v[0] === 'say') {
      const banned = clueSuspects(c);
      speaker = rng.pick([...Array(ctx.n).keys()].filter((i) => !banned.includes(i)));
    }
    return { type: c.type, kind: c.kind, family: c.family, args: c.args, voice: v[0], speaker, text: v[1], vi: variants.indexOf(v), test: c.test };
  });

  const solution = { killer: truth.m, weapon: truth.pw[truth.m], room: truth.pr[truth.m] };
  const rating = Math.max(1, Math.min(5, tier.stars + (human.probes >= 45 ? 1 : 0) - (human.depth === 0 ? 1 : 0)));
  return {
    seed: String(seed), tier: tierId, tierName: tier.name, worldId, n: ctx.n, ctx, clues,
    solution, truth, rating, human: { depth: human.depth, probes: human.probes }, tries, strict,
    title: rng.pick(TITLES[worldId]),
  };
}

// ---- 45-bank.js
// Cases can be saved as small specs (what was picked, the hidden truth, which clues in which wording)
// and rebuilt instantly, so curated cases ship with the page and load with no searching.
function exportPuzzle(p) {
  const { ctx } = p;
  return {
    s: p.seed, t: p.tier, w: p.worldId, ti: p.title, r: p.rating, h: [p.human.depth, p.human.probes],
    S: ctx.suspectIdx, W: ctx.weaponIdx, R: ctx.roomIdx,
    pw: p.truth.pw, pr: p.truth.pr, m: p.truth.m,
    c: p.clues.map((c) => [c.type, c.args, c.vi, c.speaker]),
  };
}

function importPuzzle(spec) {
  const world = WORLDS[spec.w];
  const ctx = buildCtx(world, spec.S, spec.W, spec.R);
  const pool = enumerateClues(ctx);
  const key = (type, args) => type + JSON.stringify(args);
  const byKey = new Map(pool.map((c) => [key(c.type, c.args), c]));
  const clues = spec.c.map(([type, args, vi, speaker]) => {
    const c = byKey.get(key(type, args));
    if (!c) throw new Error('bank clue not found: ' + type);
    const v = clueVariants(c, ctx)[vi];
    return { type, kind: c.kind, family: c.family, args, voice: v[0], speaker, text: v[1], vi, test: c.test };
  });
  const truth = { pw: spec.pw, pr: spec.pr, m: spec.m };
  const tier = TIERS[spec.t];
  return {
    seed: spec.s, tier: spec.t, tierName: tier.name, worldId: spec.w, n: ctx.n, ctx, clues,
    solution: { killer: truth.m, weapon: truth.pw[truth.m], room: truth.pr[truth.m] },
    truth, rating: spec.r, human: { depth: spec.h[0], probes: spec.h[1] }, title: spec.ti, strict: true,
  };
}

// ---- the pen: every mark is drawn by hand, slightly differently for each square, and the same way every time
function penRng(key) {
  let h = 2166136261;
  for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
}
// v: 1 your cross, 2 your circle, 3 a cross that follows, 4 a circle that follows (fainter). size: the square's side.
function penMark(v, key, size) {
  if (!v) return '';
  const r = penRng(key), j = (a) => (r() - 0.5) * a, c = size / 2, faint = v >= 3;
  const sw = (faint ? 1.6 : 2.3) * Math.max(0.55, Math.min(1, size / 40));
  let d;
  if (v === 1 || v === 3) {
    const p = size * 0.27, q = size - p, w = size / 46;
    d = `M${p + j(4 * w)} ${p + j(4 * w)} Q${c + j(5 * w)} ${c + j(5 * w)} ${q + j(4 * w)} ${q + j(3 * w)} M${q + j(4 * w)} ${p + j(4 * w)} Q${c + j(5 * w)} ${c + j(5 * w)} ${p + j(3 * w)} ${q + j(4 * w)}`;
  } else {
    const rad = size * 0.3, a0 = r() * 6.28, pts = [];
    for (let i = 0; i <= 26; i++) {
      const a = a0 + (i / 24) * 6.28, rr = rad * (1 + j(0.12) + (i > 23 ? 0.08 : 0));
      pts.push(`${(c + Math.cos(a) * rr * 1.06).toFixed(1)} ${(c + Math.sin(a) * rr).toFixed(1)}`);
    }
    d = 'M' + pts.join(' L');
  }
  return `<svg class="pen" viewBox="0 0 ${size} ${size}" aria-hidden="true"><path d="${d}" fill="none" stroke="${faint ? 'var(--pen-faint)' : 'var(--pen)'}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
// a tick in the margin: this statement has been used
function penTick(key) {
  const r = penRng(key), j = (a) => (r() - 0.5) * a;
  return `<svg class="tick" viewBox="0 0 22 20" aria-hidden="true"><path d="M3 ${11 + j(2)} Q7 ${15 + j(2)} 8.5 ${17 + j(1)} Q12 ${8 + j(3)} 19 ${3 + j(2)}" fill="none" stroke="var(--pen)" stroke-width="2.1" stroke-linecap="round"/></svg>`;
}
// a bracket in the margin: the statement in hand
const penBrace = () => '<svg class="brace" viewBox="0 0 12 100" preserveAspectRatio="none" aria-hidden="true"><path d="M10 2 Q3 3 3.5 12 L4 88 Q3.5 98 10.5 98" fill="none" stroke="var(--pen)" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';

// ---- light or dark: follows the device until the player picks one, then remembers it
function applyTheme() {
  const t = LS.get('inq1:theme', null);
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function toggleTheme() { LS.set('inq1:theme', isDark() ? 'light' : 'dark'); applyTheme(); refreshThemeButton(); }
function themeButton() {

}

// Turns {s:i} {w:i} {r:i} in a clue into highlightable spans.
function tokens(text, ctx) {
  return esc(text).replace(/\{([swr]):(\d+)\}/g, (_, k, i) => {
    i = +i;
    if (k === 's') return `<span class="tk s" data-ent="s${i}" style="--h:${ctx.suspects[i].hue}">${esc(ctx.suspects[i].short)}</span>`;
    if (k === 'w') return `<span class="tk w" data-ent="w${i}">${esc(ctx.weapons[i].name)}</span>`;
    return `<span class="tk r" data-ent="r${i}">${esc(ctx.rooms[i].name)}</span>`;
  });
}

function newGame(spec, mode) {
  const puzzle = importPuzzle(spec);
  const key = caseKey(spec);
  const saved = mode === 'tutorial' ? {} : LS.get(key, null) || {};
  const n = puzzle.n;
  const marks = saved.marks || { sw: zeros(n), sr: zeros(n), wr: zeros(n) };
  if (!marks.k) marks.k = new Array(n).fill(0); // the "Did it?" column (cases saved before it existed have none)
  const struck = saved.struck || [];
  G = {
    spec, puzzle, key, mode, marks,
    struck,
    elapsed: saved.elapsed || 0,
    hints: saved.hints || 0,
    wrong: saved.wrong || 0,
    solved: !!saved.solved,
    opts: saved.opts || { cross: true, chain: false },
    tab: 'sw', // on a phone the notebook shows weapons (sw) or rooms (sr); wide screens show both
    cur: Math.max(0, puzzle.clues.findIndex((c, i) => !struck.includes(i))), // the statement in hand
    wrView: LS.get('inq1:wrview', 'plan'), // which weapon was where: on the floor plan, or as a table
    pick: { killer: null, weapon: null, room: null },
    csp: null,
  };
}
function persist() {
  if (!G || G.mode === 'tutorial') return;
  LS.set(G.key, { marks: G.marks, struck: G.struck, elapsed: G.elapsed, hints: G.hints, wrong: G.wrong, solved: G.solved, opts: G.opts });
}

// Marks you made: 0 blank, 1 crossed out, 2 confirmed. The notebook can add faint auto marks (3, 4).
// Always: a circle crosses out the rest of its row and column, and a person's weapon and room, once both are
// circled, place that weapon in that room. With opts.chain, more follows between the blocks.
function derive(marks, n, opts) {
  const d = { sw: marks.sw.map((r) => r.slice()), sr: marks.sr.map((r) => r.slice()), wr: marks.wr.map((r) => r.slice()), k: (marks.k || new Array(n).fill(0)).slice() };
  const yes = (v) => v === 2 || v === 4, no = (v) => v === 1 || v === 3;
  const B = ['sw', 'sr', 'wr'];
  let changed = true, guard = 0;
  const killer = d.k.findIndex(yes);
  if (killer >= 0) for (let i = 0; i < n; i++) if (i !== killer && d.k[i] === 0) d.k[i] = 3;
  while (changed && guard++ < 40) {
    changed = false;
    for (let s = 0; s < n; s++) {
      const w = d.sw[s].findIndex(yes), r = d.sr[s].findIndex(yes);
      if (w >= 0 && r >= 0 && d.wr[w][r] === 0) { d.wr[w][r] = 4; changed = true; }
    }
    if (opts.cross || opts.chain) {
      for (const b of B) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (yes(d[b][i][j])) {
        for (let k = 0; k < n; k++) {
          if (k !== j && d[b][i][k] === 0) { d[b][i][k] = 3; changed = true; }
          if (k !== i && d[b][k][j] === 0) { d[b][k][j] = 3; changed = true; }
        }
      }
    }
    if (opts.chain) {
      for (let s = 0; s < n; s++) for (let w = 0; w < n; w++) for (let r = 0; r < n; r++) {
        const t = [['sw', s, w], ['sr', s, r], ['wr', w, r]];
        const v = t.map(([b, i, j]) => d[b][i][j]);
        const ys = v.filter(yes).length, ns = v.filter(no).length, zi = v.indexOf(0);
        if (v.filter((x) => x === 0).length !== 1) continue;
        const [b, i, j] = t[zi];
        if (ys === 2) { d[b][i][j] = 4; changed = true; }
        else if (ys === 1 && ns === 1) { d[b][i][j] = 3; changed = true; }
      }
      for (const b of B) {
        for (let i = 0; i < n; i++) {
          const row = d[b][i], z = row.map((v, j) => (v === 0 ? j : -1)).filter((j) => j >= 0);
          if (z.length === 1 && row.filter(no).length === n - 1 && !row.some(yes)) { row[z[0]] = 4; changed = true; }
          const col = d[b].map((r) => r[i]), zc = col.map((v, j) => (v === 0 ? j : -1)).filter((j) => j >= 0);
          if (zc.length === 1 && col.filter(no).length === n - 1 && !col.some(yes)) { d[b][zc[0]][i] = 4; changed = true; }
        }
      }
    }
  }
  return d;
}

// ---- the case screen: the story, the statements, the notebook (40-grid.js) and the floor plan (45-plan.js).
// One statement is always "in hand": its names are lit in the notebook and on the plan. On a phone it sits in a
// strip pinned above the notebook, so the statement and the squares it talks about are on screen together.
const NARROW = matchMedia('(max-width: 1179px)'); // one statement at a time, in the strip
const PHONE = matchMedia('(max-width: 760px)'); // the small plan, worked through the room sheet
const NUM_WORD = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight'];
const cap = (s) => s[0].toUpperCase() + s.slice(1);

function noteLabel(c) {
  if (c.type === 'murderType' || c.type === 'murderNotType') return 'Coroner';
  if (c.type === 'murderNotWeapon') return 'Forensics';
  if (c.type === 'murderNotSuspect') return 'Inspector Mallory';
  if (c.type.startsWith('murder')) return 'Police report';
  return 'Case notes';
}

// what a statement talks about: people, weapons, rooms, a kind of weapon, a floor, the killer
function clueFocus(c) {
  const a = c.args, f = { s: [], w: [], r: [], kind: a.t || null, floor: a.f === undefined ? null : a.f, k: c.kind === 'M' };
  for (const k of ['s', 'a', 'b']) if (a[k] !== undefined) f.s.push(a[k]);
  if (a.w !== undefined) f.w.push(a.w);
  if (a.r !== undefined) f.r.push(a.r);
  return f;
}

function stmtParts(c, ctx) {
  const say = c.voice === 'say', body = tokens(c.text, ctx);
  return { text: say ? `&ldquo;${body}&rdquo;` : body, who: say ? esc(ctx.suspects[c.speaker].name) : esc(noteLabel(c)) };
}

function statementHTML(c, i, ctx) {
  const { text, who } = stmtParts(c, ctx);
  const used = G.struck.includes(i), on = i === G.cur;
  return `<li class="stmt${used ? ' used' : ''}${on ? ' on' : ''}" data-i="${i}">${on ? penBrace() : ''}
    <button type="button" class="use" data-act="use" data-i="${i}" aria-pressed="${used}" aria-label="Statement ${i + 1}, ${used ? 'used' : 'not used yet'}">${used ? penTick('t' + i) : `<span>${i + 1}</span>`}</button>
    <button type="button" class="say" data-act="pick-stmt" data-i="${i}" aria-current="${on}"><span class="txt">${text}</span><span class="who">${who}</span></button></li>`;
}

function renderStatements() {

  strip.innerHTML = `<div class="nav"><span class="count">Statement ${i + 1} of ${P.clues.length}</span>

    <div class="foot"><span class="who">${who}</span>

function selectStatement(i) {
  G.cur = i;
  renderStatements();
  applyFocus();
}
function stepStatement(d) {
  const len = G.puzzle.clues.length;
  selectStatement((G.cur + d + len) % len);
}
// tick a statement off (or back on). On a phone, ticking the one in hand moves on to the next one still unused.
function toggleUsed(i) {
  const on = !G.struck.includes(i);
  G.struck = on ? G.struck.concat(i) : G.struck.filter((x) => x !== i);
  persist();
  if (on && i === G.cur && NARROW.matches) {
    const len = G.puzzle.clues.length;
    for (let k = 1; k < len; k++) { const j = (i + k) % len; if (!G.struck.includes(j)) { G.cur = j; break; } }
  }
  renderStatements();
  applyFocus();
}
function openAllStatements() {
  const P = G.puzzle;
  const rows = P.clues.map((c, i) => {
    const { text, who } = stmtParts(c, P.ctx), used = G.struck.includes(i);

      <span class="n">${used ? penTick('a' + i) : i + 1}</span><span><span class="txt">${text}</span><span class="who">${who}</span></span></button></li>`;
  }).join('');
