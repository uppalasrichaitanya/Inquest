function checkAccusation(puzzle, acc) {
  const s = puzzle.solution;
  return { killer: acc.killer === s.killer, weapon: acc.weapon === s.weapon, room: acc.room === s.room };
}


// ---- INQUEST: interface. State, storage and small helpers.
const LAUNCH = Date.UTC(2026, 9, 15); // Case No. 1
const TIER_ORDER = ['constable', 'detective', 'inspector', 'mastermind'];
const TITLES_RANK = ['Lady', 'Dr.', 'Major', 'Miss', 'Reverend', 'Mrs.', 'Mr.', 'Count', 'Professor', 'Madame', 'Captain'];

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

function dayNumber(d) {
  d = d || new Date();
  return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - LAUNCH) / 864e5) + 1;
}
// ---- the daily rhythm. Everyone gets the same case each day, and the week has a shape, like a crossword:
// Monday four guests, Tuesday and Wednesday five, Thursday to Saturday six, Sunday the Mastermind.
// Each kind of day takes the next case of its tier in bank order, so nothing repeats until a bank wraps round.
const WEEK_TIER = ['mastermind', 'constable', 'detective', 'detective', 'inspector', 'inspector', 'inspector']; // by getDay(): Sunday first
const TIER_LEVEL = { constable: 1, detective: 2, inspector: 3, mastermind: 4 };
const DAY_FEEL = {
  constable: 'The gentlest day: plain testimony, nothing to test.',
  detective: 'Every statement earns its place.',
  inspector: 'Fewer gifts. Expect to test a theory.',
  mastermind: 'No direct testimony. Only what the evidence implies.',
};
const DAY_GROUP = { constable: 'Mondays', detective: 'Tuesdays and Wednesdays', inspector: 'Thursdays to Saturdays', mastermind: 'Sundays' };
const todayN = () => Math.max(1, dayNumber());
// the calendar date of case No. n, at local midnight
function dateOfDay(n) {
  const L = new Date(LAUNCH);
  return new Date(L.getUTCFullYear(), L.getUTCMonth(), L.getUTCDate() + n - 1);
}
const weekdayOf = (n) => (((new Date(LAUNCH).getUTCDay() + n - 1) % 7) + 7) % 7;
// case No. n: its date, its kind of day, and which case of that tier it gets
function dailyFor(n) {
  const tier = WEEK_TIER[weekdayOf(n)], list = BANK[tier];
  const weeks = Math.floor((n - 1) / 7);
  let idx = weeks * WEEK_TIER.filter((t) => t === tier).length;
  for (let m = 1 + weeks * 7; m < n; m++) if (WEEK_TIER[weekdayOf(m)] === tier) idx++;
  return { n, date: dateOfDay(n), tier, idx, spec: list[idx % list.length] };
}
const dayName = (n, opts) => dateOfDay(n).toLocaleDateString('en-GB', opts || { weekday: 'long', day: 'numeric', month: 'long' });
// a gentle first case for someone new: the latest Monday not yet closed, or (before the first Monday) a practice
// four-guest case taken from the far end of the bank, years away from being anyone's Monday
function gentleStart() {
  for (let n = todayN(); n >= 1; n--) if (weekdayOf(n) === 1 && !caseState(dailyFor(n).spec).solved) return { n };
  const list = BANK.constable;
  for (let i = list.length - 1; i >= 0; i--) if (!caseState(list[i]).solved) return { spec: list[i] };
  return { spec: list[list.length - 1] };
}
const caseState = (spec) => LS.get(caseKey(spec), null) || {};
// the streak lives only while yesterday's or today's case was closed on its day
function liveStreak(st) { return st.lastDay >= todayN() - 1 ? st.streak : 0; }
const caseKey = (spec) => `inq1:case:${spec.t}:${spec.s}`;
const loadStats = () => LS.get('inq1:stats', { solved: {}, best: {}, streak: 0, bestStreak: 0, lastDay: 0 });

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
const zeros = (n) => Array.from({ length: n }, () => new Array(n).fill(0));
// difficulty as a row of printed dots: filled for each level of five
const stars = (k, of = 5) => `<span class="level" aria-hidden="true">${'<i class="on"></i>'.repeat(k)}${'<i></i>'.repeat(of - k)}</span>`;
// how hard a kind of day is, as four dots: Monday one, Sunday four
const dayDots = (tier) => stars(TIER_LEVEL[tier], 4);

function initials(name) {
  const w = name.split(' ').filter((x) => !TITLES_RANK.includes(x));
  return (w[0][0] + w[w.length - 1][0]).toUpperCase();
}
// a suspect is marked by a small dot in their colour (the name always travels with it)
const seal = (s) => `<span class="dot" style="--h:${s.hue}" aria-hidden="true"></span>`;

// Weapon kinds, as printer's marks: a dagger, a weight, a loop, a drop, a pistol. Defined once, used by reference.
const KIND_DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="k-blade" viewBox="0 0 16 16"><path d="M8 1 10 9.5H6Z" fill="currentColor"/><path d="M4.5 10.5h7M8 11v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="k-blunt" viewBox="0 0 16 16"><circle cx="8" cy="8.5" r="5" fill="currentColor"/></symbol>
  <symbol id="k-cord" viewBox="0 0 16 16"><path d="M2 10c2-6 5-6 6-2s4 4 6-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="k-poison" viewBox="0 0 16 16"><path d="M8 2.5c2.8 3.6 4.2 6 4.2 7.8a4.2 4.2 0 0 1-8.4 0C3.8 8.5 5.2 6.1 8 2.5z" fill="currentColor"/></symbol>
  <symbol id="k-firearm" viewBox="0 0 16 16"><path d="M2 5.5h12v3H7.5l-1 4.5H4l1-4.5H2z" fill="currentColor"/></symbol>
</svg>`;
const glyph = (t) => `<svg class="kg" aria-hidden="true"><use href="#k-${t}"/></svg>`;
// how the notebook names a kind: the words the statements use
const KIND_WORD = { blade: 'Sharp', blunt: 'Blunt', cord: 'Cord', poison: 'Poison', firearm: 'Gun' };
const shortName = (x) => x.short || x.name;

// ---- the pen: every mark is drawn by hand, slightly differently for each square, and the same way every time
function penRng(key) {
  let h = 2166136261;
  for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
}
// v: 1 your cross, 2 your circle, 3 a cross that follows, 4 a circle that follows (fainter). size: the square's side.
function penMark(v, key, size) {
  if (!v) return '';
  const r = penRng(key), j = (a) => (r() - 0.5) * a, c = size / 2, faint = v >= 3;
  const sw = (faint ? 1.6 : 2.3) * Math.max(0.55, Math.min(1, size / 40));
  let d;
  if (v === 1 || v === 3) {
    const p = size * 0.27, q = size - p, w = size / 46;
    d = `M${p + j(4 * w)} ${p + j(4 * w)} Q${c + j(5 * w)} ${c + j(5 * w)} ${q + j(4 * w)} ${q + j(3 * w)} M${q + j(4 * w)} ${p + j(4 * w)} Q${c + j(5 * w)} ${c + j(5 * w)} ${p + j(3 * w)} ${q + j(4 * w)}`;
  } else {
    const rad = size * 0.3, a0 = r() * 6.28, pts = [];
    for (let i = 0; i <= 26; i++) {
      const a = a0 + (i / 24) * 6.28, rr = rad * (1 + j(0.12) + (i > 23 ? 0.08 : 0));
      pts.push(`${(c + Math.cos(a) * rr * 1.06).toFixed(1)} ${(c + Math.sin(a) * rr).toFixed(1)}`);
    }
    d = 'M' + pts.join(' L');
  }
  return `<svg class="pen" viewBox="0 0 ${size} ${size}" aria-hidden="true"><path d="${d}" fill="none" stroke="${faint ? 'var(--pen-faint)' : 'var(--pen)'}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
// a ring round an answer square, drawn when the case is closed
function penRing(key) {
  const r = penRng(key), j = (a) => (r() - 0.5) * a, a0 = r() * 6.28, pts = [];
  for (let i = 0; i <= 28; i++) {
    const a = a0 + (i / 25) * 6.28, rr = 19 * (1 + j(0.1) + (i > 25 ? 0.07 : 0));
    pts.push(`${(23 + Math.cos(a) * rr * 1.08).toFixed(1)} ${(23 + Math.sin(a) * rr).toFixed(1)}`);
  }
  return `<svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><path d="M${pts.join(' L')}" pathLength="1" fill="none" stroke="var(--pen)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
// a tick in the margin: this statement has been used
function penTick(key) {
  const r = penRng(key), j = (a) => (r() - 0.5) * a;
  return `<svg class="tick" viewBox="0 0 22 20" aria-hidden="true"><path d="M3 ${11 + j(2)} Q7 ${15 + j(2)} 8.5 ${17 + j(1)} Q12 ${8 + j(3)} 19 ${3 + j(2)}" fill="none" stroke="var(--pen)" stroke-width="2.1" stroke-linecap="round"/></svg>`;
}
// a bracket in the margin: the statement in hand
const penBrace = () => '<svg class="brace" viewBox="0 0 12 100" preserveAspectRatio="none" aria-hidden="true"><path d="M10 2 Q3 3 3.5 12 L4 88 Q3.5 98 10.5 98" fill="none" stroke="var(--pen)" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';

// ---- light or dark: follows the device until the player picks one, then remembers it
function applyTheme() {
  const t = LS.get('inq1:theme', null);
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function toggleTheme() { LS.set('inq1:theme', isDark() ? 'light' : 'dark'); applyTheme(); refreshThemeButton(); }
function themeButton() {
  return `<button type="button" class="theme" data-act="theme" aria-label="${isDark() ? 'Switch to light pages' : 'Switch to dark pages'}"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg></button>`;
}
function refreshThemeButton() { document.querySelectorAll('[data-act="theme"]').forEach((b) => b.setAttribute('aria-label', isDark() ? 'Switch to light pages' : 'Switch to dark pages')); }

// Turns {s:i} {w:i} {r:i} in a clue into highlightable spans.
function tokens(text, ctx) {
  return esc(text).replace(/\{([swr]):(\d+)\}/g, (_, k, i) => {
    i = +i;
    if (k === 's') return `<span class="tk s" data-ent="s${i}" style="--h:${ctx.suspects[i].hue}">${esc(ctx.suspects[i].short)}</span>`;
    if (k === 'w') return `<span class="tk w" data-ent="w${i}">${esc(ctx.weapons[i].name)}</span>`;
    return `<span class="tk r" data-ent="r${i}">${esc(ctx.rooms[i].name)}</span>`;
  });
}

// ---- the game in progress
let G = null;      // current case
let VIEW = 'home';

function newGame(spec, mode, day) {
  const puzzle = importPuzzle(spec);
  const key = caseKey(spec);
  const saved = mode === 'tutorial' ? {} : LS.get(key, null) || {};
  const n = puzzle.n;
  const marks = saved.marks || { sw: zeros(n), sr: zeros(n), wr: zeros(n) };
  if (!marks.k) marks.k = new Array(n).fill(0); // the "Did it?" column (cases saved before it existed have none)
  const struck = saved.struck || [];
  G = {
    spec, puzzle, key, mode, marks,
    day: day || null, // the case number, for a day's case (today's is mode 'daily', an earlier one 'archive')
    struck,
    elapsed: saved.elapsed || 0,
    hints: saved.hints || 0,
    wrong: saved.wrong || 0,
    solved: !!saved.solved,
    opts: saved.opts || { cross: true, chain: false },
    tab: 'sw', // on a phone the notebook shows weapons (sw) or rooms (sr); wide screens show both
    cur: Math.max(0, puzzle.clues.findIndex((c, i) => !struck.includes(i))), // the statement in hand
    wrView: LS.get('inq1:wrview', 'plan'), // which weapon was where: on the floor plan, or as a table
    pick: { killer: null, weapon: null, room: null },
    undo: [], // steps of [b, i, j, mark before], for Undo (this visit only)
    csp: null,
  };
}
function persist() {
  if (!G || G.mode === 'tutorial') return;
  LS.set(G.key, { marks: G.marks, struck: G.struck, elapsed: G.elapsed, hints: G.hints, wrong: G.wrong, solved: G.solved, opts: G.opts });
}

// Marks you made: 0 blank, 1 crossed out, 2 confirmed. The notebook can add faint auto marks (3, 4).
// Always: a circle crosses out the rest of its row and column, and a person's weapon and room, once both are
// circled, place that weapon in that room. With opts.chain, more follows between the blocks.
function derive(marks, n, opts) {
  const d = { sw: marks.sw.map((r) => r.slice()), sr: marks.sr.map((r) => r.slice()), wr: marks.wr.map((r) => r.slice()), k: (marks.k || new Array(n).fill(0)).slice() };
  const yes = (v) => v === 2 || v === 4, no = (v) => v === 1 || v === 3;
  const B = ['sw', 'sr', 'wr'];
  let changed = true, guard = 0;
  const killer = d.k.findIndex(yes);
  if (killer >= 0) for (let i = 0; i < n; i++) if (i !== killer && d.k[i] === 0) d.k[i] = 3;
  while (changed && guard++ < 40) {
    changed = false;
    for (let s = 0; s < n; s++) {
      const w = d.sw[s].findIndex(yes), r = d.sr[s].findIndex(yes);
      if (w >= 0 && r >= 0 && d.wr[w][r] === 0) { d.wr[w][r] = 4; changed = true; }
    }
    if (opts.cross || opts.chain) {
      for (const b of B) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (yes(d[b][i][j])) {
        for (let k = 0; k < n; k++) {
          if (k !== j && d[b][i][k] === 0) { d[b][i][k] = 3; changed = true; }
          if (k !== i && d[b][k][j] === 0) { d[b][k][j] = 3; changed = true; }
        }
      }
    }
    if (opts.chain) {
      for (let s = 0; s < n; s++) for (let w = 0; w < n; w++) for (let r = 0; r < n; r++) {
        const t = [['sw', s, w], ['sr', s, r], ['wr', w, r]];
        const v = t.map(([b, i, j]) => d[b][i][j]);
        const ys = v.filter(yes).length, ns = v.filter(no).length, zi = v.indexOf(0);
        if (v.filter((x) => x === 0).length !== 1) continue;
        const [b, i, j] = t[zi];
        if (ys === 2) { d[b][i][j] = 4; changed = true; }
        else if (ys === 1 && ns === 1) { d[b][i][j] = 3; changed = true; }
      }
      for (const b of B) {
        for (let i = 0; i < n; i++) {
          const row = d[b][i], z = row.map((v, j) => (v === 0 ? j : -1)).filter((j) => j >= 0);
          if (z.length === 1 && row.filter(no).length === n - 1 && !row.some(yes)) { row[z[0]] = 4; changed = true; }
          const col = d[b].map((r) => r[i]), zc = col.map((v, j) => (v === 0 ? j : -1)).filter((j) => j >= 0);
          if (zc.length === 1 && col.filter(no).length === n - 1 && !col.some(yes)) { d[b][zc[0]][i] = 4; changed = true; }
        }
      }
    }
  }
  return d;
}

const app = () => document.getElementById('app');
const tutorialDone = () => !!LS.get('inq1:tutorial', 0);
const WEEKDAY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function stateWord(spec) {
  const s = caseState(spec);
  if (s.solved) return `Closed in ${fmtTime(s.elapsed || 0)}`;
  if (s.elapsed > 20 || (s.struck && s.struck.length)) return 'Started';
  return '';
}
const closedCount = (st) => Object.values(st.solved).reduce((a, b) => a + b, 0);
const guestWord = { constable: 'Four guests', detective: 'Five guests', inspector: 'Six guests', mastermind: 'Six guests' };

// ---- home: today's case, this week, and a way into the past
function renderHome() {
  VIEW = 'home'; G = null;
  const st = loadStats(), n = todayN(), D = dailyFor(n), w = WORLDS[D.spec.w], s = caseState(D.spec);
  const closed = closedCount(st), streak = liveStreak(st);
  const go = s.solved ? 'See it again' : s.elapsed > 20 || (s.struck && s.struck.length) ? 'Carry on' : 'Play today’s case';
  // someone new, on a day that isn't Monday, is offered a gentler first case
  let gentle = '';
  if (!closed && weekdayOf(n) !== 1) {
    const g = gentleStart();
    gentle = `<p class="gentle">New here? ${g.n ? `${esc(dayName(g.n, { weekday: 'long', day: 'numeric', month: 'long' }))}’s case is a gentle one to start.` : 'Mondays are the gentlest day; until the first one, here is a gentle practice case.'}
      <button class="link" data-act="gentle">Start there</button></p>`;
  }
  app().innerHTML = `
    <div class="bar"><button class="mark" data-act="home">Inquest</button>
      <button class="quiet" data-act="how">How to play</button><button class="quiet" data-act="stats">Your record</button>${themeButton()}</div>
    <main class="home">
      <header>
        <p class="date">${esc(dayName(n))}</p>
        <h1>One murder. A few true statements. Exactly one answer.</h1>
        ${tutorialDone() ? '' : '<div class="cta"><button class="btn ghost" data-act="tutorial">Learn to play</button><span class="soft">A three-guest warm-up. About a minute.</span></div>'}
      </header>
      <section class="today-case" aria-labelledby="today-label">
        <p class="label" id="today-label">Today’s case, No. ${n}<span class="sep"></span><span aria-label="${WEEKDAY[weekdayOf(n)]}, difficulty ${TIER_LEVEL[D.tier]} of 4">${dayDots(D.tier)}</span></p>
        <h2>${esc(D.spec.ti)}</h2>
        <p class="line">${esc(w.name)}, ${w.year}. ${guestWord[D.tier]}. <span class="feel">${esc(DAY_FEEL[D.tier])}</span></p>
        <div class="go"><button class="btn big" data-act="open-day" data-n="${n}">${go}</button>${s.solved ? `<span class="state done">${stateWord(D.spec)}</span>` : ''}</div>
        ${gentle}
      </section>
      ${weekHTML(n)}
      <div class="row">
        <button class="link" data-act="archive">Past cases</button>
        ${tutorialDone() ? '<button class="link" data-act="tutorial">Replay the warm-up</button>' : ''}
        <span class="grow"></span>
        <span class="soft">${streak ? `A ${streak}-day streak` : 'No streak yet'}${st.bestStreak > 1 ? ` (best ${st.bestStreak})` : ''}${closed ? `, ${closed} closed` : ''}.</span>
      </div>
    </main>`;
  window.scrollTo(0, 0);
}

// this week, Monday to Sunday: each day's difficulty, and a tick for the ones you closed
function weekHTML(n) {
  const mon = n - ((weekdayOf(n) + 6) % 7);
  const days = [...Array(7).keys()].map((k) => {
    const m = mon + k, wd = weekdayOf(m), tier = WEEK_TIER[wd];
    const short = WEEKDAY[wd].slice(0, 3), date = dateOfDay(m).getDate();
    const inner = `<span class="dname">${short}</span><span class="dnum">${date}</span>${dayDots(tier)}`;
    if (m < 1) return `<li><span class="day before" aria-hidden="true"><span class="dname">${short}</span><span class="dnum">${date}</span></span></li>`;
    if (m > n) return `<li><span class="day future" title="Opens at midnight on ${esc(dayName(m))}">${inner}<span class="sr">${esc(dayName(m))}, not yet</span></span></li>`;
    const s = caseState(dailyFor(m).spec), word = s.solved ? 'closed' : s.elapsed > 20 ? 'started' : 'not played';
    return `<li><button class="day${m === n ? ' is-today' : ''}${s.solved ? ' is-closed' : ''}" data-act="open-day" data-n="${m}" aria-label="${esc(dayName(m))}, No. ${m}, ${word}">${inner}<span class="dmark">${s.solved ? penTick('d' + m) : ''}</span></button></li>`;
  }).join('');
  return `<section class="week" aria-labelledby="week-label"><p class="label" id="week-label">This week</p><ol class="days">${days}</ol>
    <p class="soft weekline">The week rises like a crossword: Monday is the gentlest, Sunday the hardest.</p></section>`;
}

// ---- past cases: every day since No. 1, newest first, a week at a time
const ARCH = { weeks: 6 };
const ARCH_FILTERS = [['all', 'All days'], ['constable', 'Mondays'], ['detective', 'Tue & Wed'], ['inspector', 'Thu to Sat'], ['mastermind', 'Sundays']];
function renderArchive() {
  VIEW = 'archive'; G = null;
  const n = todayN(), f = LS.get('inq1:archfilter', 'all');
  const days = [];
  for (let m = n - 1; m >= 1; m--) if (f === 'all' || WEEK_TIER[weekdayOf(m)] === f) days.push(m);
  // group by week (Monday first), and show only the latest ARCH.weeks of them
  const weeks = [];
  for (const m of days) {
    const mon = m - ((weekdayOf(m) + 6) % 7);
    if (!weeks.length || weeks[weeks.length - 1].mon !== mon) weeks.push({ mon, days: [] });
    weeks[weeks.length - 1].days.push(m);
  }
  const shown = weeks.slice(0, ARCH.weeks);
  const row = (m) => {
    const D = dailyFor(m), w = WORLDS[D.spec.w], word = stateWord(D.spec);
    return `<li><button class="case-row" data-act="open-day" data-n="${m}">
      <span class="who"><span class="day-name">${esc(dayName(m))}</span><span class="line">No. ${m}</span></span>
      <span class="today"><span class="title">${esc(D.spec.ti)}</span><span class="line">${esc(w.name)}, ${w.year}</span></span>
      <span class="how"><span aria-label="Difficulty ${TIER_LEVEL[D.tier]} of 4">${dayDots(D.tier)}</span><span class="state${caseState(D.spec).solved ? ' done' : ''}">${word || 'Not played'}</span></span>
    </button></li>`;
  };
  const firstOf = (tier) => { for (let m = n; m < n + 7; m++) if (WEEK_TIER[weekdayOf(m)] === tier) return m; return n; };
  const empty = f === 'all' ? 'No past cases yet: No. 1 is today.'
    : `No ${DAY_GROUP[f].replace('Tuesdays and Wednesdays', 'Tuesdays or Wednesdays').replace('Thursdays to Saturdays', 'Thursdays, Fridays or Saturdays')} yet. The first is ${esc(dayName(firstOf(f)))}.`;
  app().innerHTML = `
    <div class="bar"><button class="mark" data-act="home" aria-label="Inquest: back to today">Inquest</button>
      <button class="quiet" data-act="how">How to play</button><button class="quiet" data-act="stats">Your record</button>${themeButton()}</div>
    <main class="home archive">
      <header>
        <p class="date"><button class="link" data-act="home">Back to today</button></p>
        <h1>Past cases</h1>

// open a day's case: today's counts towards the streak, an earlier one is from the archive

function howToHTML() {

// ---- the case screen: the story, the statements, the notebook (40-grid.js) and the floor plan (45-plan.js).
// One statement is always "in hand": its names are lit in the notebook and on the plan. On a phone it sits in a
// strip pinned above the notebook, so the statement and the squares it talks about are on screen together.
const NARROW = matchMedia('(max-width: 1179px)'); // one statement at a time, in the strip
const PHONE = matchMedia('(max-width: 760px)'); // the small plan, worked through the room sheet
const NUM_WORD = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight'];
const cap = (s) => s[0].toUpperCase() + s.slice(1);

function noteLabel(c) {
  if (c.type === 'murderType' || c.type === 'murderNotType') return 'Coroner';
  if (c.type === 'murderNotWeapon') return 'Forensics';
  if (c.type === 'murderNotSuspect') return 'Inspector Mallory';
  if (c.type.startsWith('murder')) return 'Police report';
  return 'Case notes';
}

// what a statement talks about: people, weapons, rooms, a kind of weapon, a floor, the killer
function clueFocus(c) {
  const a = c.args, f = { s: [], w: [], r: [], kind: a.t || null, floor: a.f === undefined ? null : a.f, k: c.kind === 'M' };
  for (const k of ['s', 'a', 'b']) if (a[k] !== undefined) f.s.push(a[k]);
  if (a.w !== undefined) f.w.push(a.w);
  if (a.r !== undefined) f.r.push(a.r);
  return f;
}

function stmtParts(c, ctx) {
  const say = c.voice === 'say', body = tokens(c.text, ctx);
  return { text: say ? `&ldquo;${body}&rdquo;` : body, who: say ? esc(ctx.suspects[c.speaker].name) : esc(noteLabel(c)) };
}

function statementHTML(c, i, ctx) {
  const { text, who } = stmtParts(c, ctx);
  const used = G.struck.includes(i), on = i === G.cur;
  return `<li class="stmt${used ? ' used' : ''}${on ? ' on' : ''}" data-i="${i}">${on ? penBrace() : ''}
    <button type="button" class="use" data-act="use" data-i="${i}" aria-pressed="${used}" aria-label="Statement ${i + 1}, ${used ? 'used' : 'not used yet'}">${used ? penTick('t' + i) : `<span>${i + 1}</span>`}</button>
    <button type="button" class="say" data-act="pick-stmt" data-i="${i}" aria-current="${on}"><span class="txt">${text}</span><span class="who">${who}</span>${on ? tryLine(i, 'span') : ''}</button></li>`;
}
// the warm-up says what each statement asks of you
function tryLine(i, tag) {
  return G.mode === 'tutorial' && WARM_TRY[i] ? `<${tag} class="try">${WARM_TRY[i]}</${tag}>` : '';
}

function renderCase() {

  const unit = w.layoutKind === 'line' ? 'carriage' : 'room';
  const when = tut ? 'The warm-up' : G.day ? `${esc(dayName(G.day))}, No. ${G.day}${G.mode === 'daily' ? '' : ' <span class="soft">(past case)</span>'}` : 'A practice case';
  const mk = (v, k) => `<span class="mini">${penMark(v, k, 18)}</span>`;

    <div class="bar"><button class="mark" data-act="home" aria-label="Inquest: back to the cases">Inquest</button>

    <header class="case-head">

      <p class="closed" id="closed-stamp">${G.solved ? 'Case closed.' : ''}</p>
      ${tut ? warmHeadHTML() : ''}
      <details class="story"${tut ? ' hidden' : ''}${NARROW.matches ? '' : ' open'}><summary>The story and the rules</summary>
        <div class="story-body">
          <p class="scene">${w.scene.map(esc).join(' ')} ${cap(NUM_WORD[n])} guests, ${NUM_WORD[n]} ${unit}s, ${NUM_WORD[n]} weapons. One of them did it.</p>
          <p class="rules"><b>Each guest</b> had one weapon and was in one ${unit}; no two shared. <b>Every statement is true.</b> <b>The killer</b> held the murder weapon in the ${unit} where the body was found.</p>

    </header>
    <main class="case" id="case">
      <section class="stmts-col" aria-labelledby="stmts-label">

          ${tut ? `<p class="wnote wide" aria-live="polite">${WARM.note}</p>` : ''}
          <div class="nb-bar"><div class="tabs" role="tablist" aria-label="Notebook columns">
            <button type="button" role="tab" data-act="nbtab" data-tab="sw" aria-selected="${G.tab === 'sw'}">Weapons<span class="cue" aria-hidden="true"></span><span class="sr cue-word">, in this statement</span></button>
            <button type="button" role="tab" data-act="nbtab" data-tab="sr" aria-selected="${G.tab === 'sr'}">${cap(unit)}s<span class="cue" aria-hidden="true"></span><span class="sr cue-word">, in this statement</span></button>
          </div>

          <div class="tablewrap"><table class="grid" id="grid"></table></div>

  renderStatements();
  buildGrid();
  buildPlan();
  paintAll();

  applyFocus();

  if (document.fonts) document.fonts.ready.then(fitGrid);
  window.scrollTo(0, 0);

function renderStatements() {
  const P = G.puzzle, list = document.getElementById('stmts');
  if (list) list.innerHTML = P.clues.map((c, i) => statementHTML(c, i, P.ctx)).join('');
  const strip = document.getElementById('strip');
  if (!strip) return;
  const i = G.cur, c = P.clues[i], used = G.struck.includes(i), { text, who } = stmtParts(c, P.ctx);
  strip.innerHTML = `<div class="nav"><span class="count">Statement ${i + 1} of ${P.clues.length}</span>
      <button type="button" class="quiet" data-act="all-stmts" aria-label="All statements">All</button>
      <button type="button" class="arrow" data-act="stmt-step" data-d="-1" aria-label="Previous statement">&lsaquo;</button>
      <button type="button" class="arrow" data-act="stmt-step" data-d="1" aria-label="Next statement">&rsaquo;</button></div>
    <p class="txt${used ? ' used' : ''}" data-i="${i}">${text}</p>${tryLine(i, 'p')}
    <div class="foot"><span class="who">${who}</span>
      <button type="button" class="usebtn" data-act="use" data-i="${i}" aria-pressed="${used}">${used ? `${penTick('s' + i)}Used` : 'Done with this one'}</button></div>${G.mode === 'tutorial' ? `<p class="wnote" aria-live="polite">${WARM.note}</p>` : ''}`;
}

function selectStatement(i) {
  G.cur = i;
  renderStatements();
  autoTab();
  applyFocus();
  if (G.mode === 'tutorial') paintAll(); // a pencil mark may be proven now
}
function stepStatement(d) {
  const len = G.puzzle.clues.length;
  selectStatement((G.cur + d + len) % len);
}
// tick a statement off (or back on). On a phone, ticking the one in hand moves on to the next one still unused.
function toggleUsed(i) {
  const on = !G.struck.includes(i);
  G.struck = on ? G.struck.concat(i) : G.struck.filter((x) => x !== i);
  persist();
  if (on && i === G.cur && NARROW.matches) {
    const len = G.puzzle.clues.length;
    for (let k = 1; k < len; k++) { const j = (i + k) % len; if (!G.struck.includes(j)) { G.cur = j; break; } }
  }
  renderStatements();
  autoTab();
  applyFocus();
}
function openAllStatements() {
  const P = G.puzzle;
  const rows = P.clues.map((c, i) => {
    const { text, who } = stmtParts(c, P.ctx), used = G.struck.includes(i);
    return `<li class="${used ? 'used' : ''}"><button type="button" class="pickrow" data-act="pick-stmt" data-i="${i}" aria-current="${i === G.cur}">
      <span class="n">${used ? penTick('a' + i) : i + 1}</span><span><span class="txt">${text}</span><span class="who">${who}</span></span></button></li>`;
  }).join('');
  openModal(`<h2>Statements</h2><ol class="allstmts">${rows}</ol>`, 'listsheet');
}

// light up everything the statement in hand talks about
function applyFocus() {
  document.querySelectorAll('.hl').forEach((e) => e.classList.remove('hl'));
  if (!G) return;
  const ctx = G.puzzle.ctx, f = clueFocus(G.puzzle.clues[G.cur]);
  const lit = (sel) => document.querySelectorAll(sel).forEach((e) => e.classList.add('hl'));
  f.s.forEach((s) => lit(`[data-row="s${s}"]`));
  const ws = f.w.concat(f.kind ? ctx.types.map((t, i) => (t === f.kind ? i : -1)).filter((i) => i >= 0) : []);
  ws.forEach((w) => lit(`[data-col="w${w}"]`));
  if (f.kind) lit(`[data-kind="${f.kind}"]`);
  const rs = f.r.concat(f.floor === null ? [] : ctx.floor.map((fl, i) => (fl === f.floor ? i : -1)).filter((i) => i >= 0));
  rs.forEach((r) => { lit(`[data-col="r${r}"]`); lit(`[data-row="r${r}"]`); lit(`[data-room="${r}"]`); });
  if (f.floor !== null) lit(`[data-floor="${f.floor}"]`);
  if (f.k) lit('[data-col="k"]');
  // on a phone only half the notebook shows: a dot on the other tab when the statement is about it too
  const touches = { sw: ws.length > 0, sr: rs.length > 0 };
  document.querySelectorAll('[data-act="nbtab"]').forEach((b) => b.classList.toggle('has-cue', b.dataset.tab !== G.tab && touches[b.dataset.tab]));
}
// a statement only about weapons (or only about rooms) turns the phone notebook to that half by itself
function autoTab() {
  if (!NARROW.matches) return;
  const f = clueFocus(G.puzzle.clues[G.cur]);
  const w = f.w.length > 0 || !!f.kind, r = f.r.length > 0 || f.floor !== null;
  if (w !== r) setTab(w ? 'sw' : 'sr');
}

// ---- the notebook: one table. A row per person; their weapon (grouped by kind, in the words the statements use),
// their room (grouped by floor, or front to back on the train), and "Did it?". Which weapon was in which room
// lives on the floor plan (45-plan.js), or in a table under it for those who prefer one.
const KIND_ORDER = ['blade', 'blunt', 'poison', 'cord', 'firearm'];
const isLine = (ctx) => ctx.world.layoutKind === 'line';
function weaponOrder(ctx) {
  return [...Array(ctx.n).keys()].sort((a, b) => KIND_ORDER.indexOf(ctx.types[a]) - KIND_ORDER.indexOf(ctx.types[b]) || a - b);
}
// rooms as you would read the plan: top floor first, left to right; carriages from the engine back
function roomOrder(ctx) {
  return [...Array(ctx.n).keys()].sort((a, b) => (isLine(ctx) ? 0 : ctx.floor[b] - ctx.floor[a]) || ctx.rooms[a].rect.x - ctx.rooms[b].rect.x);
}
function groupsOf(order, keyOf) {
  const g = [];
  order.forEach((x) => { const k = keyOf(x); if (!g.length || g[g.length - 1].key !== k) g.push({ key: k, items: [] }); g[g.length - 1].items.push(x); });
  return g;
}
// "in the cellar" -> "Cellar"; long single words get a place to break in a narrow column
const floorLabel = (ctx, f) => cap(ctx.world.floors[f].replace(/^(in|on) the /, '')).replace('Upstairs', 'Up&shy;stairs');

// one square: a button that holds a pen mark. data-r / data-c place it for the arrow keys.
function cellHTML(grid, b, i, j, label, r, c, tdCls, col) {
  return `<td class="sq ${tdCls}" data-col="${col}"><button type="button" class="cell" data-grid="${grid}" data-r="${r}" data-c="${c}" data-b="${b}" data-i="${i}" data-j="${j}" data-v="-1" data-label="${esc(label)}" tabindex="${r === 0 && c === 0 ? 0 : -1}"></button></td>`;
}

function buildGrid() {
  const ctx = G.puzzle.ctx, el = document.getElementById('grid');
  if (!el) return;
  const WO = weaponOrder(ctx), RO = roomOrder(ctx), line = isLine(ctx);
  const wg = groupsOf(WO, (w) => ctx.types[w]), rg = groupsOf(RO, (r) => (line ? 'line' : ctx.floor[r]));
  const grp = (g, cls, attr, label) => `<th scope="colgroup" colspan="${g.items.length}" class="grp ${cls}" ${attr}><span>${label}</span></th>`;
  let h = '<thead><tr class="grps"><td class="corner"></td>';
  h += wg.map((g) => grp(g, 'wpart', `data-kind="${g.key}"`, KIND_WORD[g.key])).join('') + '<td class="gap wpart"></td>';
  h += rg.map((g) => grp(g, 'rpart', line ? '' : `data-floor="${g.key}"`, line ? 'From the engine back' : floorLabel(ctx, g.key))).join('');
  h += '<td class="gap rpart"></td><td class="kpart"></td></tr><tr class="names"><td class="corner"><span class="sr">Suspect</span></td>';
  h += WO.map((w) => `<th scope="col" class="c wpart" data-col="w${w}" title="${esc(ctx.weapons[w].name)}">${glyph(ctx.types[w])}<span>${shortName(ctx.weapons[w])}</span></th>`).join('') + '<td class="gap wpart"></td>';
  h += RO.map((r) => `<th scope="col" class="c rpart" data-col="r${r}" title="${esc(ctx.rooms[r].name)}"><span>${shortName(ctx.rooms[r])}</span></th>`).join('');
  h += '<td class="gap rpart"></td><th scope="col" class="c kpart" data-col="k"><span>Did it?</span></th></tr></thead><tbody>';
  ctx.suspects.forEach((S, s) => {
    let c = 0;
    h += `<tr><th scope="row" data-row="s${s}"><span class="dot" style="--h:${S.hue}"></span><span class="who">${esc(S.short)}</span></th>`;
    h += WO.map((w) => cellHTML('grid', 'sw', s, w, `${S.short} with the ${ctx.weapons[w].name}`, s, c++, 'wpart', `w${w}`)).join('') + '<td class="gap wpart"></td>';
    h += RO.map((r) => cellHTML('grid', 'sr', s, r, `${S.short} in the ${ctx.rooms[r].name}`, s, c++, 'rpart', `r${r}`)).join('') + '<td class="gap rpart"></td>';
    h += cellHTML('grid', 'k', s, 0, `${S.short} did it`, s, c++, 'kpart', 'k') + '</tr>';
  });
  el.innerHTML = h + '</tbody>';
}

// six suspects make thirteen columns. Shrink the squares until the notebook fits its column (never below
// 30px, still a fair tap), and if that is not enough, set the labels smaller.
function fitGrid() {
  const g = document.getElementById('grid');
  if (!g || !g.parentElement.clientWidth) return;
  g.classList.remove('tight');
  g.style.removeProperty('--cell');
  const avail = g.parentElement.clientWidth, sq = [...g.querySelectorAll('td.sq')].find((x) => x.getClientRects().length);
  if (!sq) return;
  let c = Math.floor(sq.getBoundingClientRect().width);
  for (const tight of [false, true]) {
    g.classList.toggle('tight', tight);
    while (g.offsetWidth > avail && c > 30) g.style.setProperty('--cell', --c + 'px');
    if (g.offsetWidth <= avail) return;
  }
}

function setTab(tab) {
  G.tab = tab;
  const nb = document.getElementById('nb');
  if (nb) nb.dataset.tab = tab;
  document.querySelectorAll('[data-act="nbtab"]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  applyFocus();
  fitGrid();
}

// ---- marks
const markOf = (d, b, i, j) => (b === 'k' ? d.k[i] : d[b][i][j]);
const MARK_WORD = ['open', 'ruled out', 'a match', 'ruled out, follows from your marks', 'a match, follows from your marks'];
function paintAll() {
  if (!G) return;
  // in the warm-up, a mark the statements don't prove yet stays in pencil: drawn, but nothing follows from it
  const pencil = G.mode === 'tutorial' ? warmPencil() : null;
  const d = pencil && pencil.size ? stripPencil() : derive(G.marks, G.puzzle.n, G.opts);
  document.querySelectorAll('.cell').forEach((el) => {
    const b = el.dataset.b, i = +el.dataset.i, j = +el.dataset.j, p = !!pencil && pencil.has(b + i + '-' + j);
    const v = p ? userMark(b, i, j) : markOf(d, b, i, j);
    if (+el.dataset.v === v && (el.dataset.p === '1') === p) return;
    el.dataset.v = v;
    el.dataset.p = p ? '1' : '0';
    el.classList.toggle('pencil', p);
    const key = el.dataset.b + el.dataset.i + '-' + el.dataset.j;
    if (el.dataset.cs) el.querySelector('.mk').innerHTML = penMark(v, key, +el.dataset.cs).replace('<svg class="pen"', `<svg width="${el.dataset.cs}" height="${el.dataset.cs}"`);
    else el.innerHTML = penMark(v, key, 46);
    el.setAttribute('aria-label', `${el.dataset.label}: ${MARK_WORD[v]}${p ? ', in pencil' : ''}`);
  });
  paintPins(d);
  paintAnswer();
  const u = document.querySelector('[data-act="undo"]');
  if (u) u.disabled = !G.undo.some((s) => s.length);
  if (G.mode === 'tutorial') warmAccuseState();
}
// once the case is closed, the killer's three squares are ringed in ink: did it, the weapon, the room
function paintAnswer() {
  const s = G.puzzle.solution, want = G.solved && G.mode !== 'tutorial' ? [['k', s.killer, 0], ['sw', s.killer, s.weapon], ['sr', s.killer, s.room]] : [];
  document.querySelectorAll('#grid .cell.answer').forEach((el) => { el.classList.remove('answer'); const r = el.parentNode.querySelector('.ring'); if (r) r.remove(); });
  for (const [b, i, j] of want) {
    const el = document.querySelector(`#grid .cell[data-b="${b}"][data-i="${i}"][data-j="${j}"]`);
    if (!el) continue;
    el.classList.add('answer');
    el.insertAdjacentHTML('afterend', penRing('ring' + b + i + j));
    el.setAttribute('aria-label', el.getAttribute('aria-label') + ', the answer');
  }
}
function userMark(b, i, j) { return b === 'k' ? G.marks.k[i] : G.marks[b][i][j]; }
// every change can be taken back. One step of Undo is one tap, one drag along a row, or one Clear all.
let undoStep = null; // the step being recorded while a drag is under way
function writeMark(b, i, j, v) { if (b === 'k') G.marks.k[i] = v; else G.marks[b][i][j] = v; }
function setMark(b, i, j, v) {
  const prev = userMark(b, i, j);
  if (prev === v) return;
  (undoStep || newUndoStep()).push([b, i, j, prev]);
  writeMark(b, i, j, v);
  persist();
  paintAll();
  if (G.mode === 'tutorial') warmAfter(b, i, j, v);
}
function newUndoStep() {
  const s = [];
  G.undo.push(s);
  if (G.undo.length > 300) G.undo.shift();
  return s;
}
function undo() {
  while (G.undo.length && !G.undo[G.undo.length - 1].length) G.undo.pop();
  const s = G.undo.pop();
  if (!s || G.solved) return;
  for (let k = s.length - 1; k >= 0; k--) writeMark(...s[k]);
  persist();
  paintAll();
  if (G.mode === 'tutorial') setWarmNote(s.length > 1 ? 'Those marks are back.' : 'Undone.');
}
function clearAll() {
  if (G.solved) return;
  const s = [], n = G.puzzle.n;
  for (const b of ['sw', 'sr', 'wr']) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (G.marks[b][i][j]) s.push([b, i, j, G.marks[b][i][j]]);
  for (let i = 0; i < n; i++) if (G.marks.k[i]) s.push(['k', i, 0, G.marks.k[i]]);
  if (!s.length) return;
  s.forEach(([b, i, j]) => writeMark(b, i, j, 0));
  G.undo.push(s);
  persist();
  paintAll();
  toast('Notebook cleared. Undo brings it back.');
}
const cellInfo = (el) => ({ b: el.dataset.b, i: +el.dataset.i, j: +el.dataset.j });
const cycle = (el) => { const { b, i, j } = cellInfo(el); setMark(b, i, j, (userMark(b, i, j) + 1) % 3); };

// ---- input, wired once for every square on the page (notebook, plan, table, room sheet).
// Mouse: press to mark, drag to paint the same mark along a row. Touch: a tap, not a scroll. Keys: Space/Enter, arrows.
let drag = null, lastTouch = null;
function wireGrid() {
  document.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.cell');
    if (!c || !G || G.solved) return;
    if (e.pointerType === 'mouse') {
      if (e.button !== 0) return;
      e.preventDefault();
      const { b, i, j } = cellInfo(c), next = (userMark(b, i, j) + 1) % 3;
      drag = { v: next, b };
      undoStep = newUndoStep();
      setMark(b, i, j, next);
      if (c.focus) c.focus({ preventScroll: true });
    } else lastTouch = { c, x: e.clientX, y: e.clientY };
  });
  document.addEventListener('pointerover', (e) => {
    const c = e.target.closest('.cell');
    if (!c || !drag || e.buttons !== 1 || c.dataset.b !== drag.b) return;
    const { b, i, j } = cellInfo(c);
    if (userMark(b, i, j) !== drag.v) setMark(b, i, j, drag.v);
  });
  document.addEventListener('pointerup', (e) => {
    drag = null;
    undoStep = null;
    if (e.pointerType === 'mouse' || !lastTouch || !G || G.solved) { lastTouch = null; return; }
    const c = e.target.closest('.cell');
    if (c && c === lastTouch.c && Math.abs(e.clientX - lastTouch.x) < 8 && Math.abs(e.clientY - lastTouch.y) < 8) cycle(c);
    lastTouch = null;
  });
  document.addEventListener('click', (e) => { // keyboard activation only (pointer input is handled above)
    const c = e.target.closest('.cell');
    if (c && e.detail === 0 && G && !G.solved) cycle(c);
  });
  document.addEventListener('keydown', (e) => {
    const c = e.target.closest && e.target.closest('.cell[data-grid]');
    if (!c) return;
    const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!d) return;
    e.preventDefault();
    const all = [...document.querySelectorAll(`.cell[data-grid="${c.dataset.grid}"]`)].filter((x) => x.getClientRects().length);
    let r = +c.dataset.r, col = +c.dataset.c, t = null;
    for (let step = 0; step < 40 && !t; step++) {
      r += d[0]; col += d[1];
      t = all.find((x) => +x.dataset.r === r && +x.dataset.c === col);
      if (r < -1 || col < -1 || r > 40 || col > 40) break;
    }
    if (!t) return;
    c.tabIndex = -1; t.tabIndex = 0; t.focus();
  });
}

// ---- the floor plan. It shows what "next to" means (a doorway or a stair between two rooms, a coupling between
// two carriages), drawn from the same adjacency the statements use (ctx.adj), so the picture can't disagree with
// the clues. Each room carries a row of weapon chips: which weapon was in which room is worked out here, where
// the doors are. Wide screens mark the chips directly; on a phone a tap on a room opens its weapons at full size.
// "Show as a table" swaps the plan for the same marks as a plain rooms-by-weapons table.
const SVGNS = 'http://www.w3.org/2000/svg';
const svgText = (s) => esc(String(s).replace(/&shy;/g, ''));
// a room name that will not fit its room on a phone breaks where its short name allows: "Conser-" / "vatory"
function roomLabel(room, x, y, fs, width) {
  const parts = room.name.length * fs * 0.5 > width && room.short.includes('&shy;') ? room.short.split('&shy;') : null;
  if (!parts) return `<text class="room-name" x="${x}" y="${y}" style="font-size:${fs}px">${svgText(room.name)}</text>`;
  return `<text class="room-name" x="${x}" y="${y}" style="font-size:${fs}px"><tspan>${svgText(parts[0])}-</tspan><tspan x="${x}" dy="${fs * 1.1}">${svgText(parts[1])}</tspan></text>`;
}

function buildPlan() {
  const el = document.getElementById('plan');
  if (!el) return;
  const ctx = G.puzzle.ctx, w = ctx.world, line = isLine(ctx), table = G.wrView === 'table';
  const unit = line ? 'carriage' : 'room';
  const key = table
    ? `Which weapon was in which ${unit}. A square fills in by itself once you have circled a person's weapon and their ${unit}.`
    : line
      ? `Carriages are <i>next to</i> each other when they are coupled together. A sealed carriage in between keeps them apart. The engine is at the top. Each carriage lists the weapons that could have been in it.`
      : `Rooms are <i>next to</i> each other where a doorway or a stair joins them, upstairs and down included. Each room lists the weapons that could have been in it.`;
  el.innerHTML = `<div class="nb-head"><p class="label">${esc(w.name)}</p>
      <button type="button" class="quiet" data-act="wrview">${table ? 'Show on the plan' : 'Show as a table'}</button></div>
    <p class="plan-key">${key}<span class="tapnote"> Tap a ${unit} to mark its weapons.</span></p>
    <div class="house" id="house">${table ? wrTableHTML(ctx) : line ? trainSVG(ctx) : manorSVG(ctx)}</div>`;
}

// weapon chips for one room: small marked squares, drawn with their kind
function chipsSVG(ctx, r, x0, y0, cs, gap, perRow) {
  return weaponOrder(ctx).map((w, k) => {
    const x = x0 + (k % perRow) * (cs + gap), y = y0 + Math.floor(k / perRow) * (cs + gap);
    return `<g class="cell chip" transform="translate(${x} ${y})" data-b="wr" data-i="${w}" data-j="${r}" data-v="-1" data-cs="${cs}" data-label="${esc(`The ${ctx.weapons[w].name} in the ${ctx.rooms[r].name}`)}" aria-hidden="true">
      <rect width="${cs}" height="${cs}"/><use href="#k-${ctx.types[w]}" x="${cs * 0.2}" y="${cs * 0.2}" width="${cs * 0.6}" height="${cs * 0.6}"/><g class="mk"></g></g>`;
  }).join('');
}

function manorSVG(ctx) {
  const w = ctx.world, narrow = PHONE.matches;
  const u = narrow ? 38 : 70, rowH = narrow ? 92 : 100, padL = narrow ? 0 : 96;
  const inPlay = new Map(ctx.roomIdx.map((wi, li) => [wi, li]));
  let cols = 0, rows = 0;
  w.rooms.forEach((r) => { cols = Math.max(cols, r.rect.x + r.rect.w); rows = Math.max(rows, r.rect.y + r.rect.h); });
  const box = (r) => ({ x: padL + r.rect.x * u, y: r.rect.y * rowH, w: r.rect.w * u, h: r.rect.h * rowH });
  const fs = narrow ? 11 : 14, cs = narrow ? 11 : 18, gap = narrow ? 1.5 : 3;
  let g = '';
  if (!narrow) for (let y = 0; y < rows; y++) g += `<text class="floor-name" x="0" y="${y * rowH + 22}">${svgText(cap(w.floors[rows - 1 - y].replace(/^(in|on) the /, '')))}</text>`;
  w.rooms.forEach((room, wi) => {
    const b = box(room), r = inPlay.get(wi);
    if (r === undefined) {
      g += `<rect class="ghost" x="${b.x + 3}" y="${b.y + 3}" width="${b.w - 6}" height="${b.h - 6}"/><text class="ghost-name" x="${b.x + 9}" y="${b.y + 20}" style="font-size:${fs}px">${svgText(room.name)}</text>`;
      return;
    }
    const perRow = Math.max(1, Math.floor((b.w - 12 + gap) / (cs + gap))), chipRows = Math.ceil(ctx.n / perRow);
    g += `<g class="room" data-room="${r}" role="button" tabindex="0" aria-label="${esc(room.name)}: mark its weapons">
      <rect class="floorspace" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>
      ${roomLabel(room, b.x + (narrow ? 5 : 9), b.y + (narrow ? 16 : 21), fs, b.w - (narrow ? 12 : 18))}
      <g class="pins" data-pins="${r}" transform="translate(${b.x + (narrow ? 5 : 9)} ${b.y + (narrow ? 42 : 44)})"></g>
      ${chipsSVG(ctx, r, b.x + 6, b.y + b.h - 7 - chipRows * (cs + gap) + gap, cs, gap, perRow)}</g>`;
  });
  // walls on top of the rooms, then the openings cut into them
  w.rooms.forEach((room, wi) => { if (inPlay.has(wi)) { const b = box(room); g += `<rect class="wall" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`; } });
  for (let i = 0; i < ctx.n; i++) for (let j = i + 1; j < ctx.n; j++) {
    if (!ctx.adj[i][j]) continue;
    const a = box(ctx.rooms[i]), b = box(ctx.rooms[j]);
    if (a.y === b.y) { // side by side: a doorway in the shared wall
      const x = a.x + a.w === b.x ? b.x : a.x, ym = a.y + a.h / 2;
      g += `<line class="door" x1="${x}" y1="${ym - 13}" x2="${x}" y2="${ym + 13}"/>`;
    } else { // one above the other: a stair through the floor, near the right end of the overlap
      const top = a.y < b.y ? a : b, bot = a.y < b.y ? b : a;
      const hi = Math.min(top.x + top.w, bot.x + bot.w), mx = hi - (narrow ? 14 : 22), y = bot.y;
      g += `<line class="door" x1="${mx - 12}" y1="${y}" x2="${mx + 12}" y2="${y}"/><path class="stair" d="M${mx - 9} ${y + 9}h6v-6h6v-6h6v-6"/>`;
    }
  }
  const W = padL + cols * u, H = rows * rowH;
  return `<svg class="plan-svg${narrow ? ' narrow' : ''}" viewBox="-2 -2 ${W + 4} ${H + 4}" role="group" aria-label="Plan of ${esc(w.name)}">${g}</svg>`;
}

function trainSVG(ctx) {
  const w = ctx.world, narrow = PHONE.matches;
  const W = narrow ? 340 : 640, rowH = narrow ? 62 : 58, h = rowH - 14, top = 30, cs = narrow ? 14 : 18, gap = narrow ? 2 : 3;
  const inPlay = new Map(ctx.roomIdx.map((wi, li) => [wi, li]));
  const order = w.rooms.map((r, wi) => wi).sort((a, b) => w.rooms[a].rect.x - w.rooms[b].rect.x);
  let g = `<text class="floor-name" x="0" y="16">The engine</text><path class="stair" d="M${W / 2 - 40} ${top - 4}h80"/>`;
  order.forEach((wi, k) => {
    const room = w.rooms[wi], r = inPlay.get(wi), y = top + k * rowH;
    if (k) g += `<line class="coupling" x1="${W / 2}" y1="${y - 14}" x2="${W / 2}" y2="${y}"/>`;
    if (r === undefined) {
      g += `<rect class="ghost" x="3" y="${y + 3}" width="${W - 6}" height="${h - 6}"/><text class="ghost-name" x="12" y="${y + h / 2 + 5}">${svgText(room.name)}, sealed</text>`;
      return;
    }
    const chipsW = ctx.n * (cs + gap) - gap;
    g += `<g class="room" data-room="${r}" role="button" tabindex="0" aria-label="${esc(room.name)}: mark its weapons">
      <rect class="floorspace" x="0" y="${y}" width="${W}" height="${h}"/><rect class="wall" x="0" y="${y}" width="${W}" height="${h}" rx="6"/>
      <text class="room-name" x="12" y="${y + (narrow ? 18 : h / 2 + 5)}" style="font-size:${narrow ? 13 : 15}px">${svgText(room.name)}</text>
      <g class="pins" data-pins="${r}" transform="translate(${narrow ? 12 : W * 0.36} ${y + (narrow ? 36 : h / 2 - 4)})"></g>
      ${chipsSVG(ctx, r, W - 10 - chipsW, y + (h - cs) / 2, cs, gap, ctx.n)}</g>`;
  });
  const H = top + order.length * rowH - 14;
  return `<svg class="plan-svg train${narrow ? ' narrow' : ''}" viewBox="-2 -2 ${W + 4} ${H + 4}" role="group" aria-label="${esc(w.name)}, from the engine back">${g}</svg>`;
}

// who is placed in each room: once a person's room is circled, their name appears there
function paintPins(d) {
  const ctx = G.puzzle.ctx;
  document.querySelectorAll('[data-pins]').forEach((p) => {
    const r = +p.dataset.pins, who = ctx.suspects.map((s, i) => i).filter((s) => d.sr[s][r] === 2 || d.sr[s][r] === 4);
    p.innerHTML = who.map((s, k) => `<g transform="translate(0 ${k * 15})"><circle cx="4" cy="-4" r="4" style="fill:hsl(${ctx.suspects[s].hue} 34% 52%)"/><text class="pin" x="12" y="0">${esc(ctx.suspects[s].short)}</text></g>`).join('');
  });
}

// the fallback: the same marks as a rooms-by-weapons table
function wrTableHTML(ctx) {
  const WO = weaponOrder(ctx);
  let h = `<table class="grid wr"><thead><tr class="names"><td class="corner"><span class="sr">${isLine(ctx) ? 'Carriage' : 'Room'}</span></td>`;
  h += WO.map((w) => `<th scope="col" class="c" data-col="w${w}" title="${esc(ctx.weapons[w].name)}">${glyph(ctx.types[w])}<span>${shortName(ctx.weapons[w])}</span></th>`).join('') + '</tr></thead><tbody>';
  roomOrder(ctx).forEach((r, row) => {
    h += `<tr><th scope="row" data-row="r${r}"><span class="who">${esc(ctx.rooms[r].name)}</span></th>`;
    h += WO.map((w, c) => cellHTML('wrt', 'wr', w, r, `The ${ctx.weapons[w].name} in the ${ctx.rooms[r].name}`, row, c, '', `w${w}`)).join('') + '</tr>';
  });
  return h + '</tbody></table>';
}

// a room's weapons at full size: the phone's way to work the plan, and the keyboard's
function openRoomSheet(r) {
  const ctx = G.puzzle.ctx, room = ctx.rooms[r], unit = isLine(ctx) ? 'carriage' : 'room';
  const rows = weaponOrder(ctx).map((w, k) => `<li><button type="button" class="cell" data-grid="room" data-r="${k}" data-c="0" data-b="wr" data-i="${w}" data-j="${r}" data-v="-1" data-label="${esc(`The ${ctx.weapons[w].name} in the ${room.name}`)}" tabindex="${k ? -1 : 0}"></button>
    <span class="wname">${glyph(ctx.types[w])}${esc(ctx.weapons[w].name)} <i>${KIND_WORD[ctx.types[w]].toLowerCase()}</i></span></li>`).join('');
  openModal(`<h2>${esc(room.name)}</h2><p class="soft">Which weapon was in this ${unit}? Tap once to rule one out, twice for the one that was.</p>
    <ul class="wr-list">${rows}</ul><div class="actions"><button type="button" class="btn" data-act="close">Done</button></div>`, 'roomsheet');
  paintAll();
}

let modalReturn = null;
function openModal(html, cls) {

  modalReturn = document.activeElement;
  const s = document.createElement('div');
  s.className = 'scrim'; s.id = 'scrim';
  s.innerHTML = `<div class="sheetbox paper ${cls || ''}" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Close">&times;</button>${html}</div>`;
  document.body.appendChild(s);
  const f = s.querySelector('.opt, .btn, button:not(.x)');
  if (f) f.focus();
}

  const s = document.getElementById('scrim');
  if (s) s.remove();
  if (modalReturn && modalReturn.focus && document.contains(modalReturn)) modalReturn.focus();
  modalReturn = null;
}
let toastTimer = null;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

// ---- accusation
function openAccuse() {
  const ctx = G.puzzle.ctx;
  const group = (title, key, items) => `<div class="pick"><h4>${title}</h4><div class="opts">${items.map((it, i) => `<button type="button" class="opt" data-pick="${key}" data-v="${i}" aria-pressed="${G.pick[key] === i}">${it}</button>`).join('')}</div></div>`;
  openModal(`<h2>Name the killer</h2>
    <p>Who did it, with what, and where. A wrong guess goes on your record.</p>
    ${group('Who did it?', 'killer', ctx.suspects.map((s) => `${seal(s)}${esc(s.name)}`))}
    ${group('With what?', 'weapon', ctx.weapons.map((w) => `${glyph(w.type)}${esc(w.name)}`))}
    ${group('Where?', 'room', ctx.rooms.map((r) => esc(r.name)))}
    <p class="said" id="said"></p>
    <div id="accuse-result"></div>
    <div class="actions"><button class="btn" id="do-accuse" data-act="submit-accuse">Name them</button><button class="btn ghost" data-act="close">Not yet</button></div>`);
  updateSaid();
}
function updateSaid() {
  const ctx = G.puzzle.ctx, p = G.pick;
  const b = (t) => `<b>${esc(t)}</b>`;
  const who = p.killer === null ? '…' : b(ctx.suspects[p.killer].name);
  const wp = p.weapon === null ? '…' : b(ctx.weapons[p.weapon].name);
  const rm = p.room === null ? '…' : b(ctx.rooms[p.room].name);
  const el = document.getElementById('said');
  if (el) el.innerHTML = `I accuse ${who}, in the ${rm}, with the ${wp}.`;
  const btn = document.getElementById('do-accuse');
  if (btn) btn.disabled = p.killer === null || p.weapon === null || p.room === null;
}

// Which statement first rules out this exact accusation?
function firstContradiction(P, acc) {
  const { perms, inv } = permutations(P.n);
  const A = [], B = [];
  perms.forEach((p, a) => { if (p[acc.killer] === acc.weapon) A.push(a); if (p[acc.killer] === acc.room) B.push(a); });
  let alive = [];
  for (const a of A) for (const b of B) alive.push([a, b]);
  for (let k = 0; k < P.clues.length; k++) {
    const c = P.clues[k];
    alive = alive.filter(([a, b]) => {
      const v = c.test(perms[a], inv[a], perms[b], inv[b]);
      return c.kind === 'M' ? (v & (1 << acc.killer)) !== 0 : v;
    });
    if (!alive.length) return k + 1;
  }
  return null;
}

function submitAccuse() {
  const p = G.pick;
  if (p.killer === null || p.weapon === null || p.room === null) return;
  const res = checkAccusation(G.puzzle, p);
  if (res.killer && res.weapon && res.room) { closeModal(); solveCase(); return; }
  G.wrong++; persist();
  const k = firstContradiction(G.puzzle, p);
  const box = document.getElementById('accuse-result');
  box.innerHTML = `<p class="miss"><b>Not quite.</b> ${k ? `That story breaks against statement <b>${k}</b>.` : 'The statements do not support that.'} Wrong accusations so far: ${G.wrong}.</p>`;
}

function solveCase() {
  if (G.mode === 'tutorial') { G.solved = true; finishWarmup(); return; }
  const first = !G.solved && !(LS.get(G.key, {}) || {}).solved;
  G.solved = true; persist();
  if (first) {
    const st = loadStats(), t = G.puzzle.tier;
    st.solved[t] = (st.solved[t] || 0) + 1;
    st.best[t] = st.best[t] ? Math.min(st.best[t], G.elapsed) : G.elapsed;
    // the streak counts today's case closed on its day (or just after midnight), never an archived one
    if (G.mode === 'daily' && G.day >= todayN() - 1 && st.lastDay !== G.day) {
      st.streak = st.lastDay === G.day - 1 ? st.streak + 1 : 1; st.lastDay = G.day;
      st.bestStreak = Math.max(st.bestStreak, st.streak);
    }
    LS.set('inq1:stats', st);
  }
  const cs = document.getElementById('closed-stamp');
  if (cs) cs.textContent = 'Case closed.';
  document.querySelectorAll('.btn.accuse').forEach((b) => { b.textContent = 'See the finish'; });
  // the three answer squares get their rings first; the finish opens once they are drawn
  paintAll();
  const g = G;
  if (FINISH_DELAY && !matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(() => { if (G === g) openVerdict(); }, FINISH_DELAY);
  else openVerdict();
}
let FINISH_DELAY = 1100;

// how it went, in words: "on the first try, in 6 minutes, with no hints"
const ORDINAL = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth'];
const tryWord = (k) => ORDINAL[k - 1] || `${k}th`;
const minutes = (sec) => (sec < 60 ? 'under a minute' : `${Math.round(sec / 60)} min`);
const hintWord = (h) => (h ? `${h} hint${h === 1 ? '' : 's'}` : 'no hints');

// Spoiler-free: the day, how hard, and how it went. Never a name, a weapon or a room.
//   Inquest No. 22 · Thursday ●●●○
//   ✕✕✕            one line per wrong accusation
//   ✒️✒️✒️ named on the second try
//   6 min · 💡💡 2 hints
function shareText() {
  const P = G.puzzle, lvl = TIER_LEVEL[P.tier], dots = '●'.repeat(lvl) + '○'.repeat(4 - lvl);
  const head = G.day ? `Inquest No. ${G.day} · ${WEEKDAY[weekdayOf(G.day)]} ${dots}` : `Inquest, a practice case ${dots}`;
  const misses = G.wrong <= 4 ? Array(G.wrong).fill('✕✕✕') : [`✕✕✕ ×${G.wrong}`];
  const named = `✒️✒️✒️ named on the ${tryWord(G.wrong + 1)} try`;
  const bulbs = G.hints ? '💡'.repeat(Math.min(G.hints, 5)) + (G.hints > 5 ? '+' : '') + ' ' : '';
  return [head, ...misses, named, `${minutes(G.elapsed)} · ${bulbs}${hintWord(G.hints)}`].join('\n');
}

function openVerdict() {
  const P = G.puzzle, ctx = P.ctx, s = P.solution, t = P.truth;
  const rows = ctx.suspects.map((su, i) => `<tr class="${i === s.killer ? 'killer' : ''}"><td>${seal(su)} ${esc(su.name)}</td><td>${esc(ctx.rooms[t.pr[i]].name)}</td><td>${esc(ctx.weapons[t.pw[i]].name)}</td></tr>`).join('');
  const w = ctx.weapons[s.weapon].name;
  const went = `Named on the ${tryWord(G.wrong + 1)} try, in ${G.elapsed < 60 ? 'under a minute' : `${Math.round(G.elapsed / 60)} minute${Math.round(G.elapsed / 60) === 1 ? '' : 's'}`}, with ${hintWord(G.hints)}.`;
  const day = G.day ? `${esc(dayName(G.day))}, No. ${G.day}` : 'A practice case';
  openModal(`<div class="verdict">
    <p class="vday">${day}<span class="sep"></span><span class="closed">Case closed</span></p>
    <h2 class="tale">It was ${esc(ctx.suspects[s.killer].name)}, in the ${esc(ctx.rooms[s.room].name)}, with the ${esc(w)}.</h2>
    <p class="went">${went}</p>
    <details class="how"><summary>How it happened</summary>
      <p>${esc(P.title)}. Where everyone was, and what each of them held:</p>
      <table><thead><tr><td></td><td>Was in</td><td>Held</td></tr></thead><tbody>${rows}</tbody></table>
      <p class="soft">Only the killer's row can be proved from the statements. The rest is one story that fits.</p></details>
    <div class="sharebox">
      <pre class="share" id="share" tabindex="0" aria-label="Your result, to share">${esc(shareText())}</pre>
      <p class="soft">No names, rooms or weapons: it shows how it went, not the answer.</p>
    </div>
    <div class="actions"><button class="btn big" data-act="share">Share</button></div>
    ${nextStepHTML()}</div>`, 'finish');
}

// After a win, the quiet ways on: an older case, and today's if this wasn't it, else when tomorrow's opens.
function nextStepHTML() {
  const st = loadStats(), closed = closedCount(st), streak = liveStreak(st), n = todayN();
  const record = `${closed} case${closed === 1 ? '' : 's'} closed${streak > 1 ? `, a ${streak}-day streak` : ''}.`;
  const today = G.mode !== 'daily' && !caseState(dailyFor(n).spec).solved;
  const t = WEEK_TIER[weekdayOf(n + 1)];

}

// Share: the share sheet on a phone; otherwise (or if it fails) the clipboard; if the clipboard is refused,

const canShareSheet = () => typeof navigator.share === 'function' && matchMedia('(pointer: coarse)').matches;
async function shareResult() {

// ---- hints from Inspector Mallory
function nextHint() {
  const P = G.puzzle, n = P.n;
  if (!G.csp) G.csp = buildCSP(P.ctx, P.clues);
  const csp = G.csp;
  const d = derive(G.marks, n, G.opts);
  const done = (b, i, j) => d[b][i][j] === 1 || d[b][i][j] === 3;
  // a square the player marked that the statements contradict: a circle on something impossible,
  // or a cross on something that has to be true
  if (!G.marg) G.marg = marginals(P.ctx, P.clues);
  const M = G.marg;
  for (const b of ['sw', 'sr', 'wr']) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = G.marks[b][i][j];
    if (v === 2 && !M[b][i][j]) return { type: 'mistake', b, i, j, v };
    if (v === 1) {
      let rowAlt = false, colAlt = false;
      for (let k = 0; k < n; k++) { if (k !== j && M[b][i][k]) rowAlt = true; if (k !== i && M[b][k][j]) colAlt = true; }
      if (!rowAlt || !colAlt) return { type: 'mistake', b, i, j, v };
    }
  }
  const dom = new Array(csp.nv).fill((1 << n) - 1), trace = [];
  propagate(csp, dom, trace);
  for (const ev of trace) {
    if (ev.v >= 2 * n) continue;
    for (let x = 0; x < n; x++) {
      if (!(ev.removed & (1 << x))) continue;
      const b = ev.v < n ? 'sw' : 'sr', i = ev.v < n ? ev.v : ev.v - n;
      if (!done(b, i, x)) return { type: 'elim', b, i, j: x, clue: ev.clue };
    }
  }
  if (answered(csp, dom) && !dom.slice(0, 2 * n).some((m) => popcount(m) > 1)) return { type: 'ready' };
  for (let v = 0; v < 2 * n; v++) for (let x = 0; x < n; x++) {
    if (!(dom[v] & (1 << x)) || popcount(dom[v]) === 1) continue;
    const trial = dom.slice(); trial[v] = 1 << x;
    if (!propagate(csp, trial)) {
      const b = v < n ? 'sw' : 'sr', i = v < n ? v : v - n;
      if (!done(b, i, x)) return { type: 'whatif', b, i, j: x, clue: -1 };
    }
  }
  return { type: 'ready' };
}

let hintNow = null;
function hintNames(h) {
  const ctx = G.puzzle.ctx;
  if (h.b === 'wr') return { S: `the ${ctx.weapons[h.i].name}`, what: `in the ${ctx.rooms[h.j].name}`, pair: `the ${ctx.weapons[h.i].name} and the ${ctx.rooms[h.j].name}` };
  const S = ctx.suspects[h.i].short;
  const X = h.b === 'sw' ? ctx.weapons[h.j].name : ctx.rooms[h.j].name;
  return { S, X, what: h.b === 'sw' ? `holding the ${X}` : `in the ${X}`, pair: `${S} and the ${X}` };
}
function openHint() {
  const h = nextHint();
  hintNow = h;
  if (h.type === 'ready') {
    openModal(`<h2>Inspector Mallory</h2><div class="hintbox">Your notes already settle it. Nothing left to look up, so name the killer.</div><div class="actions"><button class="btn" data-act="accuse">Name the killer</button><button class="btn ghost" data-act="close">Keep looking</button></div>`);
    return;
  }
  G.hints++; persist();
  const { S, what } = hintNames(h);
  let nudge;
  if (h.type === 'mistake') nudge = `Something in your notebook doesn't fit the statements. Look again at the square for ${esc(hintNames(h).pair)}.`;
  else if (h.type === 'whatif') nudge = `Test a theory. Could ${esc(S)} be ${esc(what)}? Follow that through the statements and see whether anything survives.`;
  else if (h.clue >= 0) nudge = `Read statement <b>${h.clue + 1}</b> again, alongside what your notebook already says about ${esc(S)}.`;
  else nudge = `Look along ${esc(S)}'s row in the notebook. The squares you have already crossed out leave only one way for this to go.`;
  openModal(`<h2>Inspector Mallory</h2><div class="hintbox" id="hintbox">${nudge}</div>
    <div class="actions"><button class="btn" data-act="hint-more">Spell it out</button><button class="btn ghost" data-act="close">I'll take it from here</button></div>`);
  if (h.clue >= 0) {
    selectStatement(h.clue);
    const li = document.querySelector(`.stmt[data-i="${h.clue}"]`);
    if (li) { li.classList.add('nudge'); setTimeout(() => li.classList.remove('nudge'), 5000); }
  }
}
function hintMore() {
  const h = hintNow; if (!h || h.type === 'ready') return;
  G.hints++;
  const { S, what, pair } = hintNames(h);
  if (h.type === 'mistake') {
    G.marks[h.b][h.i][h.j] = 0;
    persist(); paintAll();
    document.getElementById('hintbox').innerHTML = `You ${h.v === 2 ? 'circled' : 'crossed out'} ${esc(pair)}, but the statements ${h.v === 2 ? 'rule that out' : 'say it has to be true'}. I have cleared that square for you.`;
    document.querySelector('[data-act="hint-more"]').remove();
    return;
  }
  const why = h.type === 'whatif' ? 'Assume it and the statements contradict each other.' : h.clue >= 0 ? `Statement ${h.clue + 1} rules it out, given what you already know.` : 'The rest of the grid leaves no room for it.';
  if (G.marks[h.b][h.i][h.j] === 0) G.marks[h.b][h.i][h.j] = 1;
  persist(); paintAll();
  document.getElementById('hintbox').innerHTML = `${esc(S)} was not ${esc(what)}. ${why} I have crossed it out for you.`;
  document.querySelector('[data-act="hint-more"]').remove();
}

// strip on a phone and above the notebook on a wide screen.
const WARM = { alive: null, note: '', toldFaint: false, toldReady: false, folded: false };

// the three rules, each with its picture. Shown above the warm-up and in "How to play".
function rulesHTML() {

// the rules above the warm-up. Once read ("Got it", or the first mark) they fold to one line, so the statement
// and the notebook share the screen; they stay in How to play.
function warmHeadHTML() {

// fold the rules away (from "Got it" the page goes back to the top; after a mark, warmAfter keeps the square still)
function foldRules(toTop) {

// what each statement asks of you, said once, under the statement in hand
const WARM_TRY = [

function startWarmup() {

// every arrangement still possible after statements 1..k+1 (three guests: 6 x 6 x 3 = 108 to start with)
function warmAlive() {
  if (WARM.alive) return WARM.alive;
  const P = G.puzzle, n = P.n, { perms, inv } = permutations(n);
  let all = [];
  for (let a = 0; a < perms.length; a++) for (let b = 0; b < perms.length; b++) for (let m = 0; m < n; m++) all.push({ pw: perms[a], pwi: inv[a], pr: perms[b], pri: inv[b], m });
  WARM.alive = P.clues.map((c) => (all = all.filter((x) => clueHolds(c, x, x.pwi, x.pri))));
  return WARM.alive;
}
function fact(x, b, i, j) {
  if (b === 'sw') return x.pw[i] === j;
  if (b === 'sr') return x.pr[i] === j;
  if (b === 'wr') return x.pr[x.pwi[i]] === j;
  return x.m === i; // k: did it
}
// the first statement after which the notebook must say this (or -1)
function provenAt(b, i, j, yes) {
  return warmAlive().findIndex((alive) => alive.every((x) => fact(x, b, i, j) === yes));
}
const warmUpto = () => Math.max(G.cur, ...G.struck);
// judge one of the player's marks against the statements read so far
function warmJudge(b, i, j, v) {
  const upto = warmUpto(), k = provenAt(b, i, j, v === 2);
  if (k >= 0 && k <= upto) return { ok: true, k };
  const no = provenAt(b, i, j, v !== 2);
  return { ok: false, against: no >= 0 && no <= upto ? no : -1 };
}
// keys of the marks that stay in pencil: they are drawn, but the notebook draws nothing from them
function warmPencil() {
  const out = new Set(), n = G.puzzle.n;
  for (const b of ['sw', 'sr', 'wr']) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = G.marks[b][i][j];
    if (v && !warmJudge(b, i, j, v).ok) out.add(b + i + '-' + j);
  }
  for (let i = 0; i < n; i++) if (G.marks.k[i] && !warmJudge('k', i, 0, G.marks.k[i]).ok) out.add('k' + i + '-0');
  return out;
}
// does the notebook point to one killer, with their weapon and room circled?
function warmReady(d) {
  const yes = (v) => v === 2 || v === 4, no = (v) => v === 1 || v === 3;
  let s = d.k.findIndex(yes);
  if (s < 0 && d.k.filter(no).length === d.k.length - 1) s = d.k.findIndex((v) => !no(v));
  return s >= 0 && d.sw[s].some(yes) && d.sr[s].some(yes);
}

// the one-line reason for a mark that is right
function warmReason(b, i, j, v, k) {
  const ctx = G.puzzle.ctx, S = (x) => esc(ctx.suspects[x].short), W = (x) => 'the ' + esc(ctx.weapons[x].name), R = (x) => 'the ' + esc(ctx.rooms[x].name);
  const yes = v === 2, key = `${b}${i}-${j}-${v}`;
  const said = {
    'sw0-1-1': `Statement 1 says ${S(0)} never touched ${W(1)}, so that pair is out.`,
    'sr2-0-2': `Statement 2 puts ${S(2)} in ${R(0)}. A circle means a match.`,
    'sr1-2-1': `Statement 3: ${S(1)} was nowhere near ${R(2)}.`,
    'sr1-1-2': `${S(1)}’s row has one room left, ${R(1)}. When a row has one square left, that’s the answer.`,
    'sr0-2-2': `${S(0)} has one room left too: ${R(2)}.`,
    'sw2-0-2': `Statement 4: ${S(2)}’s weapon was blunt, and ${W(0)} is the only blunt one.`,
    'sw2-1-1': `Statement 4: ${S(2)}’s weapon was blunt, and ${W(1)} isn’t.`,
    'sw2-2-1': `Statement 4: ${S(2)}’s weapon was blunt, and ${W(2)} isn’t.`,
    'sw0-2-2': `${S(0)} never touched ${W(1)}, and ${W(0)} is ${S(2)}’s. ${cap(W(2))} is all that’s left.`,
    'sw1-1-2': `${S(1)} gets the weapon that’s left: ${W(1)}.`,
    'k1-0-2': `The body was on the ground floor (statement 5), and ${R(1)} is the only room there. ${S(1)} did it.`,
  };
  if (said[key]) return said[key];
  const what = b === 'sw' ? `${S(i)} ${yes ? 'had' : 'didn’t have'} ${W(j)}`
    : b === 'sr' ? `${S(i)} ${yes ? 'was' : 'wasn’t'} in ${R(j)}`
      : b === 'wr' ? `${W(i)} ${yes ? 'was' : 'wasn’t'} in ${R(j)}`
        : `${S(i)} ${yes ? 'did it' : 'didn’t do it'}`;
  return `Right: ${what}. That follows from statement ${k + 1}${k ? ' and the ones before it' : ''}.`;
}

// the square as it shows right now (notebook, plan chip, table or room sheet)
function visibleCell(b, i, j) {
  const all = [...document.querySelectorAll(`.cell[data-b="${b}"][data-i="${i}"][data-j="${j}"]`)];
  return all.find((x) => x.getClientRects().length) || all[0] || null;
}

function setWarmNote(html) {
  WARM.note = html;
  document.querySelectorAll('.wnote').forEach((e) => { e.innerHTML = html; });
}

// after each mark: say why it is right, or why it stays in pencil
// The rules folding and the note changing both move the notebook; the square just tapped stays where it was.
function warmAfter(b, i, j, v) {
  const keep = visibleCell(b, i, j), y0 = keep && keep.getBoundingClientRect().top;
  warmExplain(b, i, j, v);
  if (keep && keep.isConnected && window.scrollBy) window.scrollBy(0, keep.getBoundingClientRect().top - y0);
}
function warmExplain(b, i, j, v) {
  foldRules(false);
  if (!v) { setWarmNote('Cleared.'); return; }
  const r = warmJudge(b, i, j, v);
  let note;
  if (r.ok) {
    note = warmReason(b, i, j, v, r.k);
    if (r.k === G.cur && !G.struck.includes(G.cur)) { G.struck = G.struck.concat(G.cur); renderStatements(); applyFocus(); }
  } else if (r.against >= 0) note = `Statement ${r.against + 1} says otherwise, so this stays in pencil. Tap it again to change it.`;
  else note = 'Nothing so far proves that, so it stays in pencil. Mark only what a statement tells you.';
  if (r.ok && v === 2 && !WARM.toldFaint) {
    WARM.toldFaint = true;
    note += ' <span class="aside">The faint crosses are the notebook’s own: one weapon and one room each, so a circle rules out the rest of its row and column.</span>';
  }
  if (!WARM.toldReady && warmReady(stripPencil())) {
    WARM.toldReady = true;
    note += ' <span class="aside">The notebook has its answer. Press <b>Name the killer</b>.</span>';
  }
  setWarmNote(note);
}
// the notebook as it stands without the pencil marks
function stripPencil() {
  const pencil = warmPencil(), m = JSON.parse(JSON.stringify(G.marks));
  pencil.forEach((key) => { const [, b, i, j] = key.match(/^(sw|sr|wr|k)(\d+)-(\d+)$/); if (b === 'k') m.k[i] = 0; else m[b][i][j] = 0; });
  return derive(m, G.puzzle.n, G.opts);
}
