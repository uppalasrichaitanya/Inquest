// ---- accusation
function openAccuse() {
  const ctx = G.puzzle.ctx;
  const group = (title, key, items) => `<div class="pick"><h4>${title}</h4><div class="opts">${items.map((it, i) => `<button type="button" class="opt" data-pick="${key}" data-v="${i}" aria-pressed="${G.pick[key] === i}">${it}</button>`).join('')}</div></div>`;
  openModal(`<h2>Make an accusation</h2>
    <p>Name the killer, the weapon and the room. A wrong accusation goes on your record.</p>
    ${group('Who did it?', 'killer', ctx.suspects.map((s) => `${seal(s)}${esc(s.name)}`))}
    ${group('With what?', 'weapon', ctx.weapons.map((w) => `${glyph(w.type)}${esc(w.name)}`))}
    ${group('Where?', 'room', ctx.rooms.map((r) => esc(r.name)))}
    <p class="said" id="said"></p>
    <div id="accuse-result"></div>

}
function updateSaid() {
  const ctx = G.puzzle.ctx, p = G.pick;
  const b = (t) => `<b>${esc(t)}</b>`;
  const who = p.killer === null ? '…' : b(ctx.suspects[p.killer].name);
  const wp = p.weapon === null ? '…' : b(ctx.weapons[p.weapon].name);
  const rm = p.room === null ? '…' : b(ctx.rooms[p.room].name);
  const el = document.getElementById('said');
  if (el) el.innerHTML = `I accuse ${who}, in the ${rm}, with the ${wp}.`;
  const btn = document.getElementById('do-accuse');
  if (btn) btn.disabled = p.killer === null || p.weapon === null || p.room === null;
}

// Which statement first rules out this exact accusation?
function firstContradiction(P, acc) {
  const { perms, inv } = permutations(P.n);
  const A = [], B = [];
  perms.forEach((p, a) => { if (p[acc.killer] === acc.weapon) A.push(a); if (p[acc.killer] === acc.room) B.push(a); });
  let alive = [];
  for (const a of A) for (const b of B) alive.push([a, b]);
  for (let k = 0; k < P.clues.length; k++) {
    const c = P.clues[k];
    alive = alive.filter(([a, b]) => {
      const v = c.test(perms[a], inv[a], perms[b], inv[b]);
      return c.kind === 'M' ? (v & (1 << acc.killer)) !== 0 : v;
    });
    if (!alive.length) return k + 1;
  }
  return null;
}

function submitAccuse() {
  const p = G.pick;
  if (p.killer === null || p.weapon === null || p.room === null) return;
  const res = checkAccusation(G.puzzle, p);
  if (res.killer && res.weapon && res.room) { closeModal(); solveCase(); return; }
  G.wrong++; persist();
  const k = firstContradiction(G.puzzle, p);
  const box = document.getElementById('accuse-result');
  box.innerHTML = `<p class="miss"><b>Not quite.</b> ${k ? `That story breaks against statement <b>${k}</b>.` : 'The statements do not support that.'} Wrong accusations so far: ${G.wrong}.</p>`;
}

function solveCase() {
  if (G.mode === 'tutorial') { G.solved = true; finishTutorial(); return; }
  const first = !G.solved && !(LS.get(G.key, {}) || {}).solved;
  G.solved = true; persist();
  if (first) {
    const st = loadStats(), t = G.puzzle.tier;
    st.solved[t] = (st.solved[t] || 0) + 1;
    st.best[t] = st.best[t] ? Math.min(st.best[t], G.elapsed) : G.elapsed;
    if (G.mode === 'daily') {
      const today = dayNumber();
      if (st.lastDay !== today) { st.streak = st.lastDay === today - 1 ? st.streak + 1 : 1; st.lastDay = today; }
      st.bestStreak = Math.max(st.bestStreak, st.streak);
    }
    LS.set('inq1:stats', st);
  }
  const cs = document.getElementById('closed-stamp');
  if (cs) cs.textContent = 'Case closed.';
  openVerdict();
}

function shareText() {
  const P = G.puzzle;

}

    <p>Closed in ${fmtTime(G.elapsed)}. ${G.hints} hint${G.hints === 1 ? '' : 's'}, ${G.wrong} wrong accusation${G.wrong === 1 ? '' : 's'}.</p>
    <details><summary>The night as it really happened</summary>

// After a win, point at the next thing worth doing: the next level up today, or tomorrow's case.

// ---- hints from Inspector Mallory
function nextHint() {
  const P = G.puzzle, n = P.n;
  if (!G.csp) G.csp = buildCSP(P.ctx, P.clues);
  const csp = G.csp;
  const d = derive(G.marks, n, G.opts);
  const done = (b, i, j) => d[b][i][j] === 1 || d[b][i][j] === 3;
  // a square the player marked that the statements contradict: a circle on something impossible,
  // or a cross on something that has to be true
  if (!G.marg) G.marg = marginals(P.ctx, P.clues);
  const M = G.marg;
  for (const b of ['sw', 'sr', 'wr']) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = G.marks[b][i][j];
    if (v === 2 && !M[b][i][j]) return { type: 'mistake', b, i, j, v };
    if (v === 1) {
      let rowAlt = false, colAlt = false;
      for (let k = 0; k < n; k++) { if (k !== j && M[b][i][k]) rowAlt = true; if (k !== i && M[b][k][j]) colAlt = true; }
      if (!rowAlt || !colAlt) return { type: 'mistake', b, i, j, v };
    }
  }
  const dom = new Array(csp.nv).fill((1 << n) - 1), trace = [];
  propagate(csp, dom, trace);
  for (const ev of trace) {
    if (ev.v >= 2 * n) continue;
    for (let x = 0; x < n; x++) {
      if (!(ev.removed & (1 << x))) continue;
      const b = ev.v < n ? 'sw' : 'sr', i = ev.v < n ? ev.v : ev.v - n;
      if (!done(b, i, x)) return { type: 'elim', b, i, j: x, clue: ev.clue };
    }
  }
  if (answered(csp, dom) && !dom.slice(0, 2 * n).some((m) => popcount(m) > 1)) return { type: 'ready' };
  for (let v = 0; v < 2 * n; v++) for (let x = 0; x < n; x++) {
    if (!(dom[v] & (1 << x)) || popcount(dom[v]) === 1) continue;
    const trial = dom.slice(); trial[v] = 1 << x;
    if (!propagate(csp, trial)) {
      const b = v < n ? 'sw' : 'sr', i = v < n ? v : v - n;
      if (!done(b, i, x)) return { type: 'whatif', b, i, j: x, clue: -1 };
    }
  }
  return { type: 'ready' };
}

let hintNow = null;
function hintNames(h) {
  const ctx = G.puzzle.ctx;
  if (h.b === 'wr') return { S: `the ${ctx.weapons[h.i].name}`, what: `in the ${ctx.rooms[h.j].name}`, pair: `the ${ctx.weapons[h.i].name} and the ${ctx.rooms[h.j].name}` };
  const S = ctx.suspects[h.i].short;
  const X = h.b === 'sw' ? ctx.weapons[h.j].name : ctx.rooms[h.j].name;
  return { S, X, what: h.b === 'sw' ? `holding the ${X}` : `in the ${X}`, pair: `${S} and the ${X}` };
}
function openHint() {
  const h = nextHint();
  hintNow = h;
  if (h.type === 'ready') {
    openModal(`<h2>Inspector Mallory</h2><div class="hintbox">Your notes already settle it. Nothing left to look up, so make your accusation.</div><div class="actions"><button class="btn red" data-act="accuse">Accuse</button><button class="btn ghost" data-act="close">Keep looking</button></div>`);
    return;
  }
  G.hints++; persist();
  const { S, what } = hintNames(h);
  let nudge;
  if (h.type === 'mistake') nudge = `Something in your notebook doesn't fit the statements. Look again at the square for ${esc(hintNames(h).pair)}.`;
  else if (h.type === 'whatif') nudge = `Test a theory. Could ${esc(S)} be ${esc(what)}? Follow that through the statements and see whether anything survives.`;
  else if (h.clue >= 0) nudge = `Read statement <b>${h.clue + 1}</b> again, alongside what your notebook already says about ${esc(S)}.`;
  else nudge = `Look along ${esc(S)}'s row in the notebook. The squares you have already crossed out leave only one way for this to go.`;
  openModal(`<h2>Inspector Mallory</h2><div class="hintbox" id="hintbox">${nudge}</div>
    <div class="actions"><button class="btn" data-act="hint-more">Spell it out</button><button class="btn ghost" data-act="close">I'll take it from here</button></div>`);
  if (h.clue >= 0) {
    const li = document.querySelector(`.stmt[data-i="${h.clue}"]`);
    if (li) { li.classList.add('nudge'); setTimeout(() => li.classList.remove('nudge'), 5000); }
  }
}
function hintMore() {
  const h = hintNow; if (!h || h.type === 'ready') return;
  G.hints++;
  const { S, what, pair } = hintNames(h);
  if (h.type === 'mistake') {
    G.marks[h.b][h.i][h.j] = 0;
    persist(); paintAll();
    document.getElementById('hintbox').innerHTML = `You ${h.v === 2 ? 'circled' : 'crossed out'} ${esc(pair)}, but the statements ${h.v === 2 ? 'rule that out' : 'say it has to be true'}. I have cleared that square for you.`;
    document.querySelector('[data-act="hint-more"]').remove();
    return;
  }
  const why = h.type === 'whatif' ? 'Assume it and the statements contradict each other.' : h.clue >= 0 ? `Statement ${h.clue + 1} rules it out, given what you already know.` : 'The rest of the grid leaves no room for it.';
  if (G.marks[h.b][h.i][h.j] === 0) G.marks[h.b][h.i][h.j] = 1;
  persist(); paintAll();
  document.getElementById('hintbox').innerHTML = `${esc(S)} was not ${esc(what)}. ${why} I have crossed it out for you.`;
  document.querySelector('[data-act="hint-more"]').remove();
}

function openStats() {
  const st = loadStats();
  const row = (t) => `<tr><td>${TIERS[t].name}</td><td>${st.solved[t] || 0}</td><td>${st.best[t] ? fmtTime(st.best[t]) : 'none yet'}</td></tr>`;
  openModal(`<h2>Your record</h2><div class="stats"><div><b>${st.streak}</b><span>day streak</span></div><div><b>${st.bestStreak}</b><span>best streak</span></div><div><b>${Object.values(st.solved).reduce((a, b) => a + b, 0)}</b><span>cases closed</span></div></div>
    <table class="verdict" style="width:100%"><thead><tr><td></td><td>Closed</td><td>Best time</td></tr></thead><tbody>${TIER_ORDER.map(row).join('')}</tbody></table>`, 'verdict');
}

// ---- the guided first case. A coach card walks through TUTORIAL (src/46-tutorial.js) one move at a time:
// read a statement, cross out, circle a match, watch the plan, use the last open square, accuse.
// While it runs, only the square the coach points at can be marked.
const COACH = { on: false, step: 0, timer: null };

function tutSteps() {
  const ctx = G.puzzle.ctx;
  const S = (i) => `<b>${esc(ctx.suspects[i].short)}</b>`, W = (i) => `the <b>${esc(ctx.weapons[i].name)}</b>`, R = (i) => `the <b>${esc(ctx.rooms[i].name)}</b>`;
  return [
    { say: `${esc(ctx.world.victim.name)} is dead, and one of three guests did it. Your job is to name <b>who</b>, <b>with what</b>, and <b>where</b>.</p><p>Everything in the case file is true. Let's solve this one together; it takes about two minutes.`,
      button: 'Start the lesson', skip: 'Skip, I know how to play' },
    { stmt: 0, tab: 'sw', cell: ['sw', 0, 1, 1],
      say: `<b>Statement 1</b>: ${S(0)} never touched ${W(1)}.</p><p>In the notebook, find ${S(0)}'s row and the ${esc(ctx.weapons[1].name)} column. Tap that square <b>once</b> to cross it out.` },
    { stmt: 1, tab: 'sr', cell: ['sr', 2, 0, 2],
      say: `<b>Statement 2</b> puts ${S(2)} in ${R(0)}. That's a match.</p><p>The notebook has turned to the <i>Who was where</i> page. Tap ${S(2)}'s ${esc(ctx.rooms[0].name)} square <b>twice</b>: once to cross, again to circle.` },
    { plan: true, button: 'Next',
      say: `See the faint crosses? Each person was in one room and each room held one person, so the notebook crossed out the rest of that row and column for you.</p><p>${S(2)} is now pinned on the floor plan, too.` },
    { stmt: 2, tab: 'sr', cell: ['sr', 1, 2, 1],
      say: `<b>Statement 3</b>: ${S(1)} was nowhere near ${R(2)}. Cross it out.` },
    { tab: 'sr', cell: ['sr', 1, 1, 2],
      say: `Look along ${S(1)}'s row. Only one room is still open.</p><p>When a row has one square left, that's the answer. Circle it.` },
    { tab: 'sr', cell: ['sr', 0, 2, 2],
      say: `${S(0)} has one room left too. Circle it.` },
    { stmt: 3, tab: 'sw', cell: ['sw', 2, 0, 2], evidence: true,
      say: `<b>Statement 4</b>: ${S(2)} was carrying something heavy and blunt.</p><p>Under <i>What was found</i>, only ${W(0)} is a blunt object. Circle ${S(2)} and the ${esc(ctx.weapons[0].name)}.` },
    { tab: 'sw', cell: ['sw', 0, 2, 2],
      say: `${S(0)} never touched ${W(1)} (statement 1), and ${W(0)} is taken. Circle the only weapon left for ${S(0)}.` },
    { tab: 'sw', cell: ['sw', 1, 1, 2],
      say: `And ${S(1)} gets the weapon that's left. Circle it.` },
    { tab: 'wr', cell: ['wr', 1, 1, 2],
      say: `The third page, <i>What was where</i>, joins the other two. ${S(1)} had ${W(1)} and was in ${R(1)}, so ${W(1)} was in ${R(1)}. Circle it.` },
    { stmt: 4, plan: true, accuse: true,
      say: `<b>Statement 5</b>: the body was found on the ground floor.</p><p>On the floor plan, ${R(1)} is the only ground-floor room in this case. So who is the killer, and with what? Press <b>Accuse</b> when you know.` },
  ];
}

function startTutorial() {
  closeModal();
  newGame(TUTORIAL, 'tutorial');
  G.opts = { cross: true, chain: false };
  renderCase();
  COACH.on = true; COACH.step = 0;
  document.body.classList.add('coached');
  showStep();
}

function endCoach() {
  COACH.on = false; clearTimeout(COACH.timer);
  const c = document.getElementById('coach'); if (c) c.remove();
  document.body.classList.remove('coached');
  document.querySelectorAll('.coach-target').forEach((x) => x.classList.remove('coach-target'));
}

function showStep() {
  const steps = tutSteps(), st = steps[COACH.step];
  if (!st) return;
  document.querySelectorAll('.coach-target').forEach((x) => x.classList.remove('coach-target'));
  if (st.tab && G.tab !== st.tab) { G.tab = st.tab; buildGrid(); paintAll(); }
  let c = document.getElementById('coach');
  if (!c) { c = document.createElement('aside'); c.id = 'coach'; c.className = 'coach paper'; c.setAttribute('aria-label', 'Tutorial'); document.body.appendChild(c); }
  const buttons = (st.button ? `<button class="btn red" data-act="coach-next">${st.button}</button>` : '') + (st.skip ? `<button class="btn ghost" data-act="coach-skip">${st.skip}</button>` : '');
  c.innerHTML = `<div class="coach-top"><span>${COACH.step ? `Step ${COACH.step} of ${steps.length - 1}` : 'Welcome to Inquest'}</span>${st.skip ? '' : '<button data-act="coach-skip">Skip tutorial</button>'}</div>
    <div role="status" aria-live="polite"><p>${st.say}</p></div><p class="warn" id="coach-warn"></p>${buttons ? `<div class="actions">${buttons}</div>` : ''}`;
  if (st.stmt !== undefined) { const li = document.querySelector(`.stmt[data-i="${st.stmt}"]`); if (li) li.classList.add('coach-target'); }
  if (st.evidence) { const ev = document.getElementById('evidence'); if (ev) ev.open = true; }
  const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  let target = null;
  if (st.cell) {
    target = document.querySelector(`#lg .cell[data-b="${st.cell[0]}"][data-i="${st.cell[1]}"][data-j="${st.cell[2]}"]`);
    if (target) target.classList.add('coach-target');
  }
  if (st.plan) {
    const pl = document.getElementById('plan');
    if (pl) { pl.classList.remove('flash'); void pl.offsetWidth; pl.classList.add('flash'); target = target || pl; }
  }
  if (st.accuse) document.querySelector('.tool.go').classList.add('coach-target');
  if (target && target.scrollIntoView) target.scrollIntoView({ block: 'center', behavior: smooth });
  const first = c.querySelector('.actions .btn');
  if (first) first.focus({ preventScroll: true });
  else if (target && target.classList.contains('cell')) target.focus({ preventScroll: true });
}

// after the notebook is redrawn (page turn, resize), point at the square again
function coachHighlight() {
  const st = tutSteps()[COACH.step];
  if (!st || !st.cell) return;
  const t = document.querySelector(`#lg .cell[data-b="${st.cell[0]}"][data-i="${st.cell[1]}"][data-j="${st.cell[2]}"]`);
  if (t) t.classList.add('coach-target');
  else coachWarn(`The square you need is on page ${['sw', 'sr', 'wr'].indexOf(st.cell[0]) + 1}, ${BLOCKS[st.cell[0]].name}.`);
}

function coachWarn(msg) {
  const w = document.getElementById('coach-warn');
  if (w) w.textContent = msg;
}

function coachAllows(b, i, j) {
  if (!COACH.on) return true;
  const st = tutSteps()[COACH.step];
  if (st && st.cell && st.cell[0] === b && st.cell[1] === i && st.cell[2] === j) return true;
  coachWarn(st && st.cell ? 'For now, use the square with the red outline.' : st && st.accuse ? 'Your notebook is done. Press Accuse at the top.' : 'Press the button below to carry on.');
  return false;
}

function coachCheck() {
  if (!COACH.on) return;
  const st = tutSteps()[COACH.step];
  if (!st || !st.cell) return;
  const [b, i, j, want] = st.cell, v = G.marks[b][i][j];
  if (v === want) { coachWarn(''); clearTimeout(COACH.timer); COACH.timer = setTimeout(coachNext, 550); return; }
  if (want === 2 && v === 1) coachWarn('That is a cross. Tap the same square once more to circle it.');
  else if (want === 1 && v === 2) coachWarn('That is a circle, which means a match. Tap again to clear it, then once more to cross it out.');
  else coachWarn(want === 2 ? 'Tap it twice: once to cross, again to circle.' : 'Tap it once to cross it out.');
}

function coachNext() {
  if (!COACH.on) return;
  COACH.step++;
  showStep();
}

function finishTutorial() {
  LS.set('inq1:tutorial', 1);
  endCoach();
  const ctx = G.puzzle.ctx, s = G.puzzle.solution;
  openModal(`<div class="verdict"><h2>You've got it</h2>
    <p class="closed">Case closed.</p>
    <p class="tale">It was <b>${esc(ctx.suspects[s.killer].name)}</b>, in the <b>${esc(ctx.rooms[s.room].name)}</b>, with the <b>${esc(ctx.weapons[s.weapon].name)}</b>.</p>
    <p>That's the whole game. Real cases have more suspects and trickier statements, but every one is solved the same way: read a statement, cross out what it rules out, circle what it proves, then accuse.</p>
    <p class="soft">If you get stuck, the <b>Hint</b> button points you to the next step, and tells you if a square in your notebook doesn't add up.</p>
    <div class="actions"><button class="btn red" data-act="open-daily" data-tier="constable">Start your first real case</button><button class="btn ghost" data-act="home">Back to the cases</button></div></div>`);
  const cs = document.getElementById('closed-stamp');
  if (cs) cs.textContent = 'Case closed.';
}

// ---- events
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act;
    if (act === 'open-daily') openCase(dailySpec(a.dataset.tier), 'daily');
    else if (act === 'home') { closeModal(); renderHome();
// first visit: go straight into the guided case (it opens with a welcome and a way to skip)
if (!tutorialDone() && !Object.keys(loadStats().solved).length) startTutorial(); }
    else if (act === 'how') openModal(howToHTML());
    else if (act === 'theme') toggleTheme();
    else if (act === 'tutorial') startTutorial();
    else if (act === 'coach-next') coachNext();
    else if (act === 'coach-skip') { LS.set('inq1:tutorial', 1); endCoach(); renderHome();
// first visit: go straight into the guided case (it opens with a welcome and a way to skip)
if (!tutorialDone() && !Object.keys(loadStats().solved).length) startTutorial(); }
    else if (act === 'nbview') {
      G.view = a.dataset.v;
      if (G.mode !== 'tutorial') LS.set('inq1:nbview', G.view);
      buildGrid(); paintAll();
    }
    else if (act === 'stats') openStats();
    else if (act === 'random') {
      closeModal();
      const t = G ? G.puzzle.tier : TIER_ORDER[Math.floor(Math.random() * TIER_ORDER.length)];
      pickRandom(t);
    }
    else if (act === 'close') closeModal();
    else if (act === 'accuse') { closeModal(); openAccuse(); }
    else if (act === 'submit-accuse') submitAccuse();
    else if (act === 'jump') { const nb = document.getElementById('nb'); if (nb) nb.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (act === 'hint') openHint();
    else if (act === 'hint-more') hintMore();
    else if (act === 'copy-share') copyShare();
    else if (act === 'pick-tier') { closeModal(); openCase(randomSpec(a.dataset.tier), 'random'); }
    return;
  }
  const pk = e.target.closest('[data-pick]');
  if (pk) {
    const key = pk.dataset.pick, v = +pk.dataset.v;
    G.pick[key] = G.pick[key] === v ? null : v;
    document.querySelectorAll(`[data-pick="${key}"]`).forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.v === G.pick[key])));
    updateSaid();
    return;
  }
  const st = e.target.closest('.stmt > button');
  if (st) {
    const li = st.parentElement, i = +li.dataset.i, on = li.dataset.struck !== '1';
    li.dataset.struck = on ? '1' : '0'; st.setAttribute('aria-pressed', String(on));
    G.struck = on ? G.struck.concat(i) : G.struck.filter((x) => x !== i);
    persist();
    return;
  }
  if (e.target.id === 'scrim') closeModal();
  const tab = e.target.closest('#nb-tabs button');
  if (tab) { G.tab = tab.dataset.tab; buildGrid(); paintAll(); wireGrid(); }
});

function pickRandom(tier) {
  closeModal();
  openRandomChoice(tier);
}
function openRandomChoice(tier) {
  openModal(`<h2>Open a different case</h2><p>Pick a level. You will get a case you have not closed yet, when there is one.</p>
    <div class="actions">${TIER_ORDER.map((t) => `<button class="btn ${t === tier ? '' : 'ghost'}" data-act="pick-tier" data-tier="${t}">${TIERS[t].name}</button>`).join('')}</div>`);
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('change', (e) => {
  if (e.target.id === 'opt-cross') { G.opts.cross = e.target.checked; persist(); paintAll(); }
  if (e.target.id === 'opt-chain') { G.opts.chain = e.target.checked; persist(); paintAll(); }
});
document.addEventListener('mouseover', (e) => { const t = e.target.closest('.tk'); if (t) lightEnts([t.dataset.ent], true); });
document.addEventListener('mouseout', (e) => { const t = e.target.closest('.tk'); if (t) lightEnts([t.dataset.ent], false); });

setInterval(() => {
  if (VIEW !== 'case' || !G || G.solved || document.hidden) return;
  G.elapsed++;
  const c = document.getElementById('clock'); if (c) c.textContent = fmtTime(G.elapsed);
  if (G.elapsed % 5 === 0) persist();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (VIEW === 'case') { buildPlan(); chooseGridMode(); } }, 120); });

applyTheme();
document.body.insertAdjacentHTML('afterbegin', KIND_DEFS);
renderHome();
// first visit: go straight into the guided case (it opens with a welcome and a way to skip)
if (!tutorialDone() && !Object.keys(loadStats().solved).length) startTutorial();

</script>
