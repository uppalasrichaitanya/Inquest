// every word a title for this setting may not use
function titleBanned(worldId) {
  const W = WORLDS[worldId], out = new Set(TITLE_HINTS);
  for (const s of W.suspects) for (const w of titleWords(`${s.name} ${s.short} ${s.role}`)) out.add(w);
  for (const r of W.rooms) for (const w of titleWords(`${r.name} ${r.short}`)) out.add(w);
  for (const x of W.weapons) for (const w of titleWords(`${x.name} ${x.short} ${x.note} ${x.type}`)) out.add(w);
  return out;
}
// the first banned word in a title, or null
function titleClash(worldId, title) {
  const ban = titleBanned(worldId);
  return titleWords(title).find((w) => ban.has(w) || ban.has(w + 's') || ban.has(w.replace(/e?s$/, ''))) || null;
}
// every allowed title for a setting, in a fixed shuffled order so neighbouring days read differently
const TITLE_POOLS = {};
function titlePool(worldId) {
  if (TITLE_POOLS[worldId]) return TITLE_POOLS[worldId];
  const P = TITLE_PLACE[worldId], all = [];
  all.push(...TITLE_THE);
  for (const p of TITLE_PHRASE) for (const t of P.tails) all.push(`${p} ${t}`);
  for (const n of TITLE_OF) for (const o of P.owners) all.push(`The ${n} of ${o}`);
  const ok = [...new Set(all)].filter((t) => !titleClash(worldId, t));
  return (TITLE_POOLS[worldId] = makeRng('titles-' + worldId).shuffle(ok));
}

function checkAccusation(puzzle, acc) {
  const s = puzzle.solution;
  return { killer: acc.killer === s.killer, weapon: acc.weapon === s.weapon, room: acc.room === s.room };
}


// ---- INQUEST: interface. State, storage and small helpers.
const LAUNCH = Date.UTC(2026, 9, 15); // Case No. 1
const TIER_ORDER = ['constable', 'detective', 'inspector', 'mastermind'];
const STORE = 'inq2'; // the cases changed shape (a liar, a whole notebook): nothing saved by the first edition carries over

const LS = {
  get(k, d) { try { const v = localStorage.getItem(STORE + ':' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(STORE + ':' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

function dayNumber(d) {
  d = d || new Date();
  return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - LAUNCH) / 864e5) + 1;
}
// ---- the daily rhythm. Everyone gets the same case each day, and the week has a shape, like a crossword:
// Monday three suspects, Tuesday to Saturday four (Thursday on, with fewer gifts), Sunday the Mastermind with five.
// Each kind of day takes the next case of its tier in bank order, so nothing repeats until a bank wraps round.
const WEEK_TIER = ['mastermind', 'constable', 'detective', 'detective', 'inspector', 'inspector', 'inspector']; // by getDay(): Sunday first
const TIER_LEVEL = { constable: 1, detective: 2, inspector: 3, mastermind: 4 };
const DAY_FEEL = {
  constable: 'The gentlest day: three suspects, and a lie that shows.',
  detective: 'Four suspects. Every statement earns its place.',
  inspector: 'Four suspects, fewer gifts. Expect to test a theory.',
  mastermind: 'Five suspects, and nothing given away.',
};
const DAY_GROUP = { constable: 'Mondays', detective: 'Tuesdays and Wednesdays', inspector: 'Thursdays to Saturdays', mastermind: 'Sundays' };
const todayN = () => Math.max(1, dayNumber());
// the calendar date of case No. n, at local midnight
function dateOfDay(n) {
  const L = new Date(LAUNCH);
  return new Date(L.getUTCFullYear(), L.getUTCMonth(), L.getUTCDate() + n - 1);
}
const weekdayOf = (n) => (((new Date(LAUNCH).getUTCDay() + n - 1) % 7) + 7) % 7;
// case No. n: its date, its kind of day, and which case of that tier it gets
function dailyFor(n) {
  const tier = WEEK_TIER[weekdayOf(n)], list = BANK[tier];
  const weeks = Math.floor((n - 1) / 7);
  let idx = weeks * WEEK_TIER.filter((t) => t === tier).length;
  for (let m = 1 + weeks * 7; m < n; m++) if (WEEK_TIER[weekdayOf(m)] === tier) idx++;
  return { n, date: dateOfDay(n), tier, idx, spec: list[idx % list.length] };
}
const dayName = (n, opts) => dateOfDay(n).toLocaleDateString('en-GB', opts || { weekday: 'long', day: 'numeric', month: 'long' });
// a gentle first case for someone new: the latest Monday not yet closed, or (before the first Monday) a practice
// case taken from the far end of the Monday bank, years away from being anyone's Monday
function gentleStart() {
  for (let n = todayN(); n >= 1; n--) if (weekdayOf(n) === 1 && !caseState(dailyFor(n).spec).solved) return { n };
  const list = BANK.constable;
  for (let i = list.length - 1; i >= 0; i--) if (!caseState(list[i]).solved) return { spec: list[i] };
  return { spec: list[list.length - 1] };
}
const caseKey = (spec) => `case:${spec.t}:${spec.s}`;
const caseState = (spec) => LS.get(caseKey(spec), null) || {};
// the streak lives only while yesterday's or today's case was closed on its day
function liveStreak(st) { return st.lastDay >= todayN() - 1 ? st.streak : 0; }
const loadStats = () => LS.get('stats', { solved: {}, best: {}, streak: 0, bestStreak: 0, lastDay: 0 });

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTime = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
const zeros = (n) => Array.from({ length: n }, () => new Array(n).fill(0));
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const NUM_WORD = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight'];
// how hard a kind of day is, as four dots: Monday one, Sunday four
const dayDots = (tier) => `<span class="level" aria-hidden="true">${'<i class="on"></i>'.repeat(TIER_LEVEL[tier])}${'<i></i>'.repeat(4 - TIER_LEVEL[tier])}</span>`;
const shortName = (x) => x.short || x.name;
const unitOf = (ctx) => (ctx.world.layoutKind === 'line' ? 'carriage' : 'room');
// the traits as the card prints them
const traitChips = (s) => TRAIT_KEYS.map((k) => {
  const v = s.traits[k];
  if (k === 'hair') return `<li><i class="swatch" style="background:${HAIR_COLOUR[v]}"></i>${cap(v)} hair</li>`;
  return `<li>${cap(TRAITS[k].values[v])}</li>`;
}).join('');

// ---- the pen: every mark is drawn by hand, slightly differently for each square, and the same way every time
function penRng(key) {
  let h = 2166136261;
  for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
}
// v: 1 your cross, 2 your circle, 3 a cross that follows, 4 a circle that follows (fainter). size: the square's side.
function penMark(v, key, size) {
  if (!v) return '';
  const r = penRng(key), j = (a) => (r() - 0.5) * a, c = size / 2, faint = v >= 3;
  const sw = (faint ? 1.7 : 2.5) * Math.max(0.55, Math.min(1, size / 40));
  let d;
  if (v === 1 || v === 3) {
    const p = size * 0.28, q = size - p, w = size / 46;
    d = `M${p + j(4 * w)} ${p + j(4 * w)} Q${c + j(5 * w)} ${c + j(5 * w)} ${q + j(4 * w)} ${q + j(3 * w)} M${q + j(4 * w)} ${p + j(4 * w)} Q${c + j(5 * w)} ${c + j(5 * w)} ${p + j(3 * w)} ${q + j(4 * w)}`;
  } else {
    const rad = size * 0.3, a0 = r() * 6.28, pts = [];
    for (let i = 0; i <= 26; i++) {
      const a = a0 + (i / 24) * 6.28, rr = rad * (1 + j(0.12) + (i > 23 ? 0.08 : 0));
      pts.push(`${(c + Math.cos(a) * rr * 1.06).toFixed(1)} ${(c + Math.sin(a) * rr).toFixed(1)}`);
    }
    d = 'M' + pts.join(' L');
  }
  return `<svg class="pen" viewBox="0 0 ${size} ${size}" aria-hidden="true"><path d="${d}" fill="none" stroke="${faint ? 'var(--pen-faint)' : 'var(--pen)'}" stroke-width="${sw.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
// a ring round an answer square, drawn when the case is closed
function penRing(key) {
  const r = penRng(key), j = (a) => (r() - 0.5) * a, a0 = r() * 6.28, pts = [];
  for (let i = 0; i <= 28; i++) {
    const a = a0 + (i / 25) * 6.28, rr = 19 * (1 + j(0.1) + (i > 25 ? 0.07 : 0));
    pts.push(`${(23 + Math.cos(a) * rr * 1.08).toFixed(1)} ${(23 + Math.sin(a) * rr).toFixed(1)}`);
  }
  return `<svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><path d="M${pts.join(' L')}" pathLength="1" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
// a tick: this piece of evidence has been used
function penTick(key) {
  const r = penRng(key), j = (a) => (r() - 0.5) * a;
  return `<svg class="tick" viewBox="0 0 22 20" aria-hidden="true"><path d="M3 ${11 + j(2)} Q7 ${15 + j(2)} 8.5 ${17 + j(1)} Q12 ${8 + j(3)} 19 ${3 + j(2)}" fill="none" stroke="var(--pen)" stroke-width="2.3" stroke-linecap="round"/></svg>`;
}

// ---- light or dark: follows the device until the player picks one, then remembers it
function applyTheme() {
  const t = LS.get('theme', null);
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function toggleTheme() { LS.set('theme', isDark() ? 'light' : 'dark'); applyTheme(); refreshThemeButton(); }
function themeButton() {
  return `<button type="button" class="iconbtn" data-act="theme" aria-label="${isDark() ? 'Switch to light pages' : 'Switch to dark pages'}"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg></button>`;
}
function refreshThemeButton() { document.querySelectorAll('[data-act="theme"]').forEach((b) => b.setAttribute('aria-label', isDark() ? 'Switch to light pages' : 'Switch to dark pages')); }

// Turns {s:i} {w:i} {r:i} in a clue into highlightable spans.
function tokens(text, ctx) {
  return esc(text).replace(/\{([swr]):(\d+)\}/g, (_, k, i) => {
    i = +i;
    if (k === 's') return `<span class="tk s" data-ent="s${i}" style="--h:${ctx.suspects[i].hue}">${esc(ctx.suspects[i].short)}</span>`;
    if (k === 'w') return `<span class="tk w" data-ent="w${i}">${esc(ctx.weapons[i].name)}</span>`;
    return `<span class="tk r" data-ent="r${i}">${esc(ctx.rooms[i].name)}</span>`;
  });
}

// ---- the game in progress
let G = null;      // current case
let VIEW = 'home';

function newGame(spec, mode, day) {
  const puzzle = importPuzzle(spec);
  const key = caseKey(spec);
  const saved = mode === 'tutorial' ? {} : LS.get(key, null) || {};
  const n = puzzle.n;
  const marks = saved.marks || { sw: zeros(n), sr: zeros(n), wr: zeros(n), k: new Array(n).fill(0) };
  G = {
    spec, puzzle, key, mode, marks,
    day: day || null, // the case number, for a day's case (today's is mode 'daily', an earlier one 'archive')
    struck: saved.struck || [], // evidence ticked off
    say: saved.say || new Array(n).fill(0), // each suspect's statement: 0 open, 1 believed, 2 a lie
    elapsed: saved.elapsed || 0,
    hints: saved.hints || 0,
    wrong: saved.wrong || 0,
    solved: !!saved.solved,
    tab: 'sw', // on a phone the notebook shows one block at a time: weapons (sw), rooms (sr) or weapon-and-room (wr)
    pane: 'clues', // on a phone the case is in three panes: the clues, the notebook, the map
    cur: 0, // the statement in hand
    pick: { killer: null, weapon: null, room: null },
    undo: [], // steps of [b, i, j, mark before], for Undo (this visit only)
    csp: null,
  };
}
function persist() {
  if (!G || G.mode === 'tutorial') return;
  LS.set(G.key, { marks: G.marks, struck: G.struck, say: G.say, elapsed: G.elapsed, hints: G.hints, wrong: G.wrong, solved: G.solved });
}

// Marks you made: 0 blank, 1 crossed out, 2 confirmed. The notebook adds faint marks (3, 4) that follow:
// a circle crosses out the rest of its row and column; two circles that share a person or a weapon give the
// third square of the triangle (who, what, where); a statement marked as a lie circles its speaker under
// "Did it?", and one marked as true crosses them out.
function derive(marks, n, say) {
  const d = { sw: marks.sw.map((r) => r.slice()), sr: marks.sr.map((r) => r.slice()), wr: marks.wr.map((r) => r.slice()), k: marks.k.slice() };
  const yes = (v) => v === 2 || v === 4, no = (v) => v === 1 || v === 3;
  if (say) say.forEach((v, s) => { if (d.k[s] === 0 && v) d.k[s] = v === 2 ? 4 : 3; });
  let changed = true, guard = 0;
  while (changed && guard++ < 40) {
    changed = false;
    const set = (b, i, j, v) => { if (d[b][i][j] === 0) { d[b][i][j] = v; changed = true; } };
    const killer = d.k.findIndex(yes);
    if (killer >= 0) for (let i = 0; i < n; i++) if (i !== killer && d.k[i] === 0) { d.k[i] = 3; changed = true; }
    if (killer < 0 && d.k.filter(no).length === n - 1) { const i = d.k.findIndex((v) => v === 0); if (i >= 0) { d.k[i] = 4; changed = true; } }
    for (const b of ['sw', 'sr', 'wr']) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (yes(d[b][i][j])) {
      for (let k = 0; k < n; k++) { if (k !== j) set(b, i, k, 3); if (k !== i) set(b, k, j, 3); }
    }
    for (let s = 0; s < n; s++) for (let w = 0; w < n; w++) for (let r = 0; r < n; r++) {
      const a = d.sw[s][w], b = d.sr[s][r], c = d.wr[w][r];
      if (yes(a) && yes(b)) set('wr', w, r, 4);
      if (yes(a) && yes(c)) set('sr', s, r, 4);
      if (yes(b) && yes(c)) set('sw', s, w, 4);
      if (yes(a) && no(b)) set('wr', w, r, 3);
      if (yes(a) && no(c)) set('sr', s, r, 3);
      if (yes(b) && no(a)) set('wr', w, r, 3);
      if (yes(b) && no(c)) set('sw', s, w, 3);
      if (yes(c) && no(a)) set('sr', s, r, 3);
      if (yes(c) && no(b)) set('sw', s, w, 3);
    }
    // a row or column with one open square left and no circle: that square is the one
    for (const b of ['sw', 'sr', 'wr']) for (let i = 0; i < n; i++) {
      const row = d[b][i];
      if (!row.some(yes) && row.filter((v) => v === 0).length === 1) set(b, i, row.indexOf(0), 4);
      const col = d[b].map((r) => r[i]);
      if (!col.some(yes) && col.filter((v) => v === 0).length === 1) set(b, col.indexOf(0), i, 4);
    }
  }
  return d;
}

// this week, Monday to Sunday: each day's difficulty, and a tick for the ones you closed
function weekHTML(n) {
  const mon = n - ((weekdayOf(n) + 6) % 7);
  const days = [...Array(7).keys()].map((k) => {
    const m = mon + k, wd = weekdayOf(m), tier = WEEK_TIER[wd];
    const short = WEEKDAY[wd].slice(0, 3), date = dateOfDay(m).getDate();
    const inner = `<span class="dname">${short}</span><span class="dnum">${date}</span>${dayDots(tier)}`;
    if (m < 1) return `<li><span class="day before" aria-hidden="true"><span class="dname">${short}</span><span class="dnum">${date}</span></span></li>`;
    if (m > n) return `<li><span class="day future" title="Opens at midnight on ${esc(dayName(m))}">${inner}<span class="sr">${esc(dayName(m))}, not yet</span></span></li>`;
    const s = caseState(dailyFor(m).spec), word = s.solved ? 'closed' : s.elapsed > 20 ? 'started' : 'not played';
    return `<li><button class="day${m === n ? ' is-today' : ''}${s.solved ? ' is-closed' : ''}" data-act="open-day" data-n="${m}" aria-label="${esc(dayName(m))}, No. ${m}, ${word}">${inner}<span class="dmark">${s.solved ? penTick('d' + m) : ''}</span></button></li>`;
  }).join('');
  return `<section class="week" aria-labelledby="week-label"><h2 id="week-label">This week</h2><ol class="days">${days}</ol>
    <p class="soft weekline">The week rises like a crossword: Monday is the gentlest, Sunday the hardest.</p></section>`;
}

function renderArchive() {

    if (!weeks.length || weeks[weeks.length - 1].mon !== mon) weeks.push({ mon, days: [] });

  }
  const shown = weeks.slice(0, ARCH.weeks);
  const row = (m) => {

// ---- the case screen: the story, the suspects (each with a statement), the evidence, the notebook (40-grid.js)
// and the map (45-plan.js). One statement is always "in hand": what it talks about is lit in the notebook and on
// the map. Wide screens show everything at once; narrower ones split the case into three panes (clues, notebook,
// map) with a dock at the bottom, and the statement in hand rides along above the notebook.
const WIDE = matchMedia('(min-width: 1100px)');
const PHONE = matchMedia('(max-width: 760px)');
const SEAL = '<svg class="seal" viewBox="0 0 32 32" aria-hidden="true"><circle cx="13.5" cy="13.5" r="8.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 20L27 27" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="13.5" cy="13.5" r="3.2" fill="#D9452F"/></svg>';

// Inspector Mallory, who opens each case, gives the hints and closes the file
const MALLORY = { name: 'Inspector Mallory', hue: 210, traits: { hair: 'grey' }, look: { skin: '#E3B896', hair: 'short', acc: ['bowler', 'moustache'] } };
const malloryLine = (text, cls) => `<p class="${cls}">${face(MALLORY, 40)}<span><b>Inspector Mallory</b> ${esc(text)}</span></p>`;
const isSay = (c) => c.speaker !== null && c.speaker !== undefined;
// evidence is numbered in the order it is listed; testimony goes by who said it
function evidenceNo(i) { return G.puzzle.clues.slice(0, i + 1).filter((c) => !isSay(c)).length; }
function clueLabel(i) {
  const c = G.puzzle.clues[i];
  return isSay(c) ? `${G.puzzle.ctx.suspects[c.speaker].short}’s statement` : `evidence ${evidenceNo(i)}`;
}
function noteLabel(c) {
  if (c.type === 'murderType' || c.type === 'murderNotType') return ['body', 'The coroner'];
  if (c.type === 'murderTrait') return [c.args.k === 'hair' ? 'hair' : 'body', 'On the body'];
  if (c.type === 'murderNotWeapon') return ['lens', 'Forensics'];
  if (c.type === 'murderNotSuspect') return ['file', 'An alibi'];
  if (c.type.startsWith('murder')) return ['body', 'Police report'];
  if (c.type === 'traitWeapon' || c.type === 'traitRoom') return [c.args.k === 'hair' ? 'hair' : c.args.k === 'height' ? 'print' : 'lens', 'Forensics'];
  if (c.type === 'in' || c.type === 'notIn') return ['print', 'Footprints'];
  if (c.type === 'has' || c.type === 'notHas') return ['lens', 'Fingerprints'];
  return ['file', 'Case notes'];
}

// what a statement talks about: people, weapons, rooms, a kind of weapon, a floor, a trait, the killer
function clueFocus(c) {
  const a = c.args, ctx = G.puzzle.ctx;
  const f = { s: [], w: [], r: [], kind: a.t || null, floor: a.f === undefined ? null : a.f, k: c.type.startsWith('murder') };
  for (const k of ['s', 'a', 'b']) if (a[k] !== undefined) f.s.push(a[k]);
  if (a.w !== undefined) f.w.push(a.w);
  if (a.r !== undefined) f.r.push(a.r);
  if (a.k && a.v) ctx.traits.forEach((t, s) => { if (t[a.k] === a.v && !f.s.includes(s)) f.s.push(s); });

  return f;
}

function renderClues() {

// the statement in hand, above the notebook (narrow screens)

}

function selectStatement(i) {

}
function stepStatement(d) {

function toggleUsed(i) {

// believe a statement, or call it a lie (pressing the same again clears it)
function setSay(s, v) {

function setPane(p) {

}

// light up everything the statement in hand talks about
function applyFocus() {
  document.querySelectorAll('.hl').forEach((e) => e.classList.remove('hl'));
  if (!G) return;
  const ctx = G.puzzle.ctx, f = clueFocus(G.puzzle.clues[G.cur]);
  const lit = (sel) => document.querySelectorAll(sel).forEach((e) => e.classList.add('hl'));
  f.s.forEach((s) => lit(`[data-row="s${s}"]`));
  const ws = f.w.concat(f.kind ? ctx.types.map((t, i) => (t === f.kind ? i : -1)).filter((i) => i >= 0) : []);
  ws.forEach((w) => { lit(`[data-col="w${w}"]`); lit(`.weapons [data-w="${w}"]`); });
  if (f.kind) lit(`[data-kind="${f.kind}"]`);
  const rs = f.r.concat(f.floor === null ? [] : ctx.floor.map((fl, i) => (fl === f.floor ? i : -1)).filter((i) => i >= 0));
  rs.forEach((r) => { lit(`[data-col="r${r}"]`); lit(`[data-row="r${r}"]`); lit(`[data-room="${r}"]`); });
  if (f.floor !== null) lit(`[data-floor="${f.floor}"]`);
  if (f.k) lit('[data-col="k"]');
  // on a phone only one block shows: a dot on the others when the statement is about them too
  const touches = { sw: ws.length > 0 || (f.s.length > 0 && !rs.length), sr: rs.length > 0, wr: ws.length > 0 && rs.length > 0 };
  document.querySelectorAll('[data-act="nbtab"]').forEach((b) => b.classList.toggle('has-cue', b.dataset.tab !== G.tab && touches[b.dataset.tab]));
}
// a statement only about weapons (or only about rooms) turns the phone notebook to that block by itself
function autoTab() {
  if (WIDE.matches) return;
  const f = clueFocus(G.puzzle.clues[G.cur]);
  const w = f.w.length > 0 || !!f.kind, r = f.r.length > 0 || f.floor !== null;
  if (w && r && !f.s.length) setTab('wr');
  else if (w !== r) setTab(w ? 'sw' : 'sr');
}

// ---- the notebook: the classic logic grid, as an L. A row per person: their weapon (grouped by kind, in the words
// the statements use), their room (grouped by floor, or front to back on the train), and "Did it?". Under the
// weapons, a row per room: which weapon was there. Fill in every square and the whole story is told.
// On a phone it shows one block at a time (who-what, who-where, what-where), chosen with the tabs.
const KIND_ORDER = ['blade', 'blunt', 'poison', 'cord', 'firearm'];
const KIND_WORD = { blade: 'Sharp', blunt: 'Blunt', cord: 'Cord', poison: 'Poison', firearm: 'Gun' };
const isLine = (ctx) => ctx.world.layoutKind === 'line';
function weaponOrder(ctx) {
  return [...Array(ctx.n).keys()].sort((a, b) => KIND_ORDER.indexOf(ctx.types[a]) - KIND_ORDER.indexOf(ctx.types[b]) || a - b);
}
// rooms as you would read the plan: top floor first, left to right; carriages from the engine back
function roomOrder(ctx) {
  return [...Array(ctx.n).keys()].sort((a, b) => (isLine(ctx) ? 0 : ctx.floor[b] - ctx.floor[a]) || ctx.rooms[a].rect.x - ctx.rooms[b].rect.x);
}
function groupsOf(order, keyOf) {
  const g = [];
  order.forEach((x) => { const k = keyOf(x); if (!g.length || g[g.length - 1].key !== k) g.push({ key: k, items: [] }); g[g.length - 1].items.push(x); });
  return g;
}
// "in the cellar" -> "Cellar"
const floorLabel = (ctx, f) => cap(ctx.world.floors[f].replace(/^(in|on) the /, ''));

// one square: a button that holds a pen mark. data-r / data-c place it for the arrow keys.
function cellHTML(b, i, j, label, r, c, tdCls, col) {
  return `<td class="sq ${tdCls}" data-col="${col}"><button type="button" class="cell" data-grid="grid" data-r="${r}" data-c="${c}" data-b="${b}" data-i="${i}" data-j="${j}" data-v="-1" data-label="${esc(label)}" tabindex="${r === 0 && c === 0 ? 0 : -1}"></button></td>`;
}

function buildGrid() {
  const ctx = G.puzzle.ctx, el = document.getElementById('grid');
  if (!el) return;
  const WO = weaponOrder(ctx), RO = roomOrder(ctx), line = isLine(ctx), n = ctx.n;
  const wg = groupsOf(WO, (w) => ctx.types[w]), rg = groupsOf(RO, (r) => (line ? 'line' : ctx.floor[r]));
  const grp = (g, cls, attr, label) => `<th scope="colgroup" colspan="${g.items.length}" class="grp ${cls}" ${attr}><span>${label}</span></th>`;
  let h = '<thead><tr class="grps"><td class="corner"></td>';
  h += wg.map((g) => grp(g, 'wpart', `data-kind="${g.key}"`, KIND_WORD[g.key])).join('') + '<td class="gap"></td>';
  h += rg.map((g) => grp(g, 'rpart', line ? '' : `data-floor="${g.key}"`, line ? 'Engine end first' : floorLabel(ctx, g.key))).join('');
  h += '<td class="gap rpart"></td><td class="kpart"></td></tr><tr class="names"><td class="corner"><span class="sr">Suspect</span></td>';
  h += WO.map((w) => `<th scope="col" class="c wpart" data-col="w${w}" title="${esc(ctx.weapons[w].name)}">${weaponIcon(ctx.weapons[w])}<span>${shortName(ctx.weapons[w])}</span></th>`).join('') + '<td class="gap"></td>';
  h += RO.map((r) => `<th scope="col" class="c rpart" data-col="r${r}" title="${esc(ctx.rooms[r].name)}"><span>${shortName(ctx.rooms[r])}</span></th>`).join('');
  h += '<td class="gap rpart"></td><th scope="col" class="c kpart" data-col="k"><span>Did it?</span></th></tr></thead><tbody>';
  ctx.suspects.forEach((S, s) => {
    let c = 0;
    h += `<tr class="srow"><th scope="row" data-row="s${s}">${face(S, 26)}<span class="who">${esc(S.short)}</span></th>`;
    h += WO.map((w) => cellHTML('sw', s, w, `${S.short} with the ${ctx.weapons[w].name}`, s, c++, 'wpart', `w${w}`)).join('') + '<td class="gap"></td>';
    h += RO.map((r) => cellHTML('sr', s, r, `${S.short} in the ${ctx.rooms[r].name}`, s, c++, 'rpart', `r${r}`)).join('') + '<td class="gap rpart"></td>';
    h += cellHTML('k', s, 0, `${S.short} did it`, s, c++, 'kpart', 'k') + '</tr>';
  });
  // what was where: a row per room under the weapons
  h += `<tr class="rsep"><td colspan="${2 * n + 4}"><span>${line ? 'Which weapon was in which carriage' : 'Which weapon was in which room'}</span></td></tr>`;
  RO.forEach((r, k) => {
    let c = 0;
    h += `<tr class="rrow"><th scope="row" data-row="r${r}"><span class="who">${esc(ctx.rooms[r].name)}</span></th>`;
    h += WO.map((w) => cellHTML('wr', w, r, `The ${ctx.weapons[w].name} in the ${ctx.rooms[r].name}`, n + 1 + k, c++, 'wpart', `w${w}`)).join('');
    h += `<td class="gap"></td><td class="void rpart" colspan="${n + 2}"></td></tr>`;
  });
  el.innerHTML = h + '</tbody>';
}

// Shrink the squares until the notebook fits its column (never below 30px, still a fair tap),
// and if that is not enough, set the labels smaller.
function fitGrid() {
  const g = document.getElementById('grid');
  if (!g || !g.parentElement.clientWidth) return;
  g.classList.remove('tight');
  g.style.removeProperty('--cell');
  const avail = g.parentElement.clientWidth, sq = [...g.querySelectorAll('td.sq')].find((x) => x.getClientRects().length);
  if (!sq) return;
  let c = Math.floor(sq.getBoundingClientRect().width);
  for (const tight of [false, true]) {
    g.classList.toggle('tight', tight);
    while (g.offsetWidth > avail && c > 30) g.style.setProperty('--cell', --c + 'px');
    if (g.offsetWidth <= avail) return;
  }
}

function setTab(tab) {
  G.tab = tab;
  const nb = document.getElementById('nb');
  if (nb) nb.dataset.tab = tab;
  document.querySelectorAll('[data-act="nbtab"]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  applyFocus();
  fitGrid();
}

// ---- marks
const markOf = (d, b, i, j) => (b === 'k' ? d.k[i] : d[b][i][j]);
const MARK_WORD = ['open', 'ruled out', 'a match', 'ruled out, follows from your marks', 'a match, follows from your marks'];
function paintAll() {
  if (!G) return;
  // in the warm-up, a mark the statements don't prove yet stays in pencil: drawn, but nothing follows from it
  const pencil = G.mode === 'tutorial' ? warmPencil() : null;
  const d = pencil && pencil.size ? stripPencil() : derive(G.marks, G.puzzle.n, G.say);
  document.querySelectorAll('.cell').forEach((el) => {
    const b = el.dataset.b, i = +el.dataset.i, j = +el.dataset.j, p = !!pencil && pencil.has(b + i + '-' + j);
    const v = p ? userMark(b, i, j) : markOf(d, b, i, j);
    if (+el.dataset.v === v && (el.dataset.p === '1') === p) return;
    el.dataset.v = v;
    el.dataset.p = p ? '1' : '0';
    el.classList.toggle('pencil', p);
    const key = el.dataset.b + el.dataset.i + '-' + el.dataset.j;
    el.innerHTML = penMark(v, key, 46);
    el.setAttribute('aria-label', `${el.dataset.label}: ${MARK_WORD[v]}${p ? ', in pencil' : ''}`);
  });
  paintMap(d);
  paintAnswer();
  const u = document.querySelector('[data-act="undo"]');
  if (u) u.disabled = !G.undo.some((s) => s.length);
  if (G.mode === 'tutorial') warmAccuseState();
}
// once the case is closed, the killer's three squares are ringed in ink: did it, the weapon, the room
function paintAnswer() {
  const s = G.puzzle.solution, want = G.solved && G.mode !== 'tutorial' ? [['k', s.killer, 0], ['sw', s.killer, s.weapon], ['sr', s.killer, s.room], ['wr', s.weapon, s.room]] : [];
  document.querySelectorAll('#grid .cell.answer').forEach((el) => { el.classList.remove('answer'); const r = el.parentNode.querySelector('.ring'); if (r) r.remove(); });
  for (const [b, i, j] of want) {
    const el = document.querySelector(`#grid .cell[data-b="${b}"][data-i="${i}"][data-j="${j}"]`);
    if (!el) continue;
    el.classList.add('answer');
    el.insertAdjacentHTML('afterend', penRing('ring' + b + i + j));
    el.setAttribute('aria-label', el.getAttribute('aria-label') + ', the answer');
  }
}
function userMark(b, i, j) { return b === 'k' ? G.marks.k[i] : b === 'say' ? G.say[i] : G.marks[b][i][j]; }
// every change can be taken back. One step of Undo is one tap, one drag along a row, or one Clear all.
let undoStep = null; // the step being recorded while a drag is under way
function writeMark(b, i, j, v) { if (b === 'k') G.marks.k[i] = v; else if (b === 'say') G.say[i] = v; else G.marks[b][i][j] = v; }
function setMark(b, i, j, v) {
  const prev = userMark(b, i, j);
  if (prev === v) return;
  (undoStep || newUndoStep()).push([b, i, j, prev]);
  writeMark(b, i, j, v);
  persist();
  paintAll();
  if (G.mode === 'tutorial') warmAfter(b, i, j, v);
}
function newUndoStep() {
  const s = [];
  G.undo.push(s);
  if (G.undo.length > 300) G.undo.shift();
  return s;
}
function undo() {
  while (G.undo.length && !G.undo[G.undo.length - 1].length) G.undo.pop();
  const s = G.undo.pop();
  if (!s || G.solved) return;
  for (let k = s.length - 1; k >= 0; k--) writeMark(...s[k]);
  persist();
  if (s.some((x) => x[0] === 'say')) renderClues();
  paintAll();
  if (G.mode === 'tutorial') setWarmNote(s.length > 1 ? 'Those marks are back.' : 'Undone.');
}
function clearAll() {
  if (G.solved) return;
  const s = [], n = G.puzzle.n;
  for (const b of ['sw', 'sr', 'wr']) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (G.marks[b][i][j]) s.push([b, i, j, G.marks[b][i][j]]);
  for (let i = 0; i < n; i++) if (G.marks.k[i]) s.push(['k', i, 0, G.marks.k[i]]);
  for (let i = 0; i < n; i++) if (G.say[i]) s.push(['say', i, 0, G.say[i]]);
  if (!s.length) return;
  s.forEach(([b, i, j]) => writeMark(b, i, j, 0));
  G.undo.push(s);
  persist();
  renderClues();
  paintAll();
  toast('Notebook cleared. Undo brings it back.');
}
const cellInfo = (el) => ({ b: el.dataset.b, i: +el.dataset.i, j: +el.dataset.j });
const cycle = (el) => { const { b, i, j } = cellInfo(el); setMark(b, i, j, (userMark(b, i, j) + 1) % 3); };

// ---- input, wired once for every square on the page (notebook, plan, table, room sheet).
// Mouse: press to mark, drag to paint the same mark along a row. Touch: a tap, not a scroll. Keys: Space/Enter, arrows.
let drag = null, lastTouch = null;
function wireGrid() {
  document.addEventListener('pointerdown', (e) => {
    const c = e.target.closest('.cell');
    if (!c || !G || G.solved) return;
    if (e.pointerType === 'mouse') {
      if (e.button !== 0) return;
      e.preventDefault();
      const { b, i, j } = cellInfo(c), next = (userMark(b, i, j) + 1) % 3;
      drag = { v: next, b };
      undoStep = newUndoStep();
      setMark(b, i, j, next);
      if (c.focus) c.focus({ preventScroll: true });
    } else lastTouch = { c, x: e.clientX, y: e.clientY };
  });
  document.addEventListener('pointerover', (e) => {
    const c = e.target.closest('.cell');
    if (!c || !drag || e.buttons !== 1 || c.dataset.b !== drag.b) return;
    const { b, i, j } = cellInfo(c);
    if (userMark(b, i, j) !== drag.v) setMark(b, i, j, drag.v);
  });
  document.addEventListener('pointerup', (e) => {
    drag = null;
    undoStep = null;
    if (e.pointerType === 'mouse' || !lastTouch || !G || G.solved) { lastTouch = null; return; }
    const c = e.target.closest('.cell');
    if (c && c === lastTouch.c && Math.abs(e.clientX - lastTouch.x) < 8 && Math.abs(e.clientY - lastTouch.y) < 8) cycle(c);
    lastTouch = null;
  });
  document.addEventListener('click', (e) => { // keyboard activation only (pointer input is handled above)
    const c = e.target.closest('.cell');
    if (c && e.detail === 0 && G && !G.solved) cycle(c);
  });
  document.addEventListener('keydown', (e) => {
    const c = e.target.closest && e.target.closest('.cell[data-grid]');
    if (!c) return;
    const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!d) return;
    e.preventDefault();
    const all = [...document.querySelectorAll(`.cell[data-grid="${c.dataset.grid}"]`)].filter((x) => x.getClientRects().length);
    let r = +c.dataset.r, col = +c.dataset.c, t = null;
    for (let step = 0; step < 40 && !t; step++) {
      r += d[0]; col += d[1];
      t = all.find((x) => +x.dataset.r === r && +x.dataset.c === col);
      if (r < -1 || col < -1 || r > 40 || col > 40) break;
    }
    if (!t) return;
    c.tabIndex = -1; t.tabIndex = 0; t.focus();
  });
}

// ---- the map. It shows what "next to" means (a doorway or a stair between two rooms, a coupling between two
// carriages), drawn from the same adjacency the statements use (ctx.adj), so the picture can't disagree with the
// clues. As the notebook fills in, it becomes a board: each person's face appears in the room you have put them
// in, and each weapon where you have placed it.
const SVGNS = 'http://www.w3.org/2000/svg';
const svgText = (s) => esc(String(s).replace(/&shy;/g, ''));
// a room name that will not fit its room on a phone breaks where its short name allows: "Conser-" / "vatory"
function roomLabel(room, x, y, fs, width) {
  const parts = room.name.length * fs * 0.52 > width && room.short.includes('&shy;') ? room.short.split('&shy;') : null;
  if (!parts) return `<text class="room-name" x="${x}" y="${y}" style="font-size:${fs}px">${svgText(room.name)}</text>`;
  return `<text class="room-name" x="${x}" y="${y}" style="font-size:${fs}px"><tspan>${svgText(parts[0])}-</tspan><tspan x="${x}" dy="${fs * 1.1}">${svgText(parts[1])}</tspan></text>`;
}

function buildPlan() {
  const el = document.getElementById('plan');
  if (!el) return;
  const ctx = G.puzzle.ctx, w = ctx.world, line = isLine(ctx);
  const key = line
    ? 'Carriages are <i>next to</i> each other when they are coupled together. A sealed carriage in between keeps them apart.'
    : 'Rooms are <i>next to</i> each other where a doorway or a stair joins them, upstairs and down included.';
  el.innerHTML = `<div class="nb-head"><h2>${esc(w.name)}</h2><p class="howmark">${key}</p></div>
    <div class="house" id="house">${line ? trainSVG(ctx) : houseSVG(ctx)}</div>`;
}

function houseSVG(ctx) {
  const w = ctx.world, narrow = PHONE.matches;
  const u = narrow ? 40 : 72, rowH = narrow ? 104 : 118, padL = narrow ? 0 : 128;
  const inPlay = new Map(ctx.roomIdx.map((wi, li) => [wi, li]));
  let cols = 0, rows = 0;
  w.rooms.forEach((r) => { cols = Math.max(cols, r.rect.x + r.rect.w); rows = Math.max(rows, r.rect.y + r.rect.h); });
  const box = (r) => ({ x: padL + r.rect.x * u, y: r.rect.y * rowH, w: r.rect.w * u, h: r.rect.h * rowH });
  const fs = narrow ? 11.5 : 14.5;
  let g = '';
  for (let y = 0; y < rows; y++) {
    const f = rows - 1 - y;
    if (!narrow) g += `<text class="floor-name" data-floor="${f}" x="0" y="${y * rowH + 24}">${svgText(cap(w.floors[f].replace(/^(in|on) the /, '')))}</text>`;
  }
  w.rooms.forEach((room, wi) => {
    const b = box(room), r = inPlay.get(wi);
    if (r === undefined) {
      g += `<rect class="ghost" x="${b.x + 3}" y="${b.y + 3}" width="${b.w - 6}" height="${b.h - 6}" rx="4"/><text class="ghost-name" x="${b.x + 10}" y="${b.y + 22}" style="font-size:${fs - 1}px">${svgText(room.name)}</text>`;
      return;
    }
    g += `<g class="room" data-room="${r}">
      <rect class="floorspace" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="url(#pt-${room.pattern})"/>
      <rect class="lit" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>
      ${roomLabel(room, b.x + (narrow ? 6 : 10), b.y + (narrow ? 17 : 23), fs, b.w - 14)}
      <g class="occupants" data-occ="${r}" transform="translate(${b.x + (narrow ? 5 : 9)} ${b.y + b.h - (narrow ? 34 : 44)})"></g></g>`;
  });
  // walls on top of the rooms, then the openings cut into them
  w.rooms.forEach((room, wi) => { if (inPlay.has(wi)) { const b = box(room); g += `<rect class="wall" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"/>`; } });
  for (let i = 0; i < ctx.n; i++) for (let j = i + 1; j < ctx.n; j++) {
    if (!ctx.adj[i][j]) continue;
    const a = box(ctx.rooms[i]), b = box(ctx.rooms[j]);
    if (a.y === b.y) { // side by side: a doorway in the shared wall
      const x = a.x + a.w === b.x ? b.x : a.x, ym = a.y + a.h / 2;
      g += `<line class="door" x1="${x}" y1="${ym - 15}" x2="${x}" y2="${ym + 15}"/><path class="swing" d="M${x} ${ym - 15}A30 30 0 0 1 ${x + 15} ${ym + 11}"/>`;
    } else { // one above the other: a stair through the floor, near the right end of the overlap
      const top = a.y < b.y ? a : b, bot = a.y < b.y ? b : a;
      const hi = Math.min(top.x + top.w, bot.x + bot.w), mx = hi - (narrow ? 16 : 26), y = bot.y;
      g += `<line class="door" x1="${mx - 13}" y1="${y}" x2="${mx + 13}" y2="${y}"/><path class="stair" d="M${mx - 10} ${y + 10}h6.5v-6.5h6.5v-6.5h6.5v-6.5"/>`;
    }
  }
  const W = padL + cols * u, H = rows * rowH;
  return `<svg class="plan-svg${narrow ? ' narrow' : ''}" viewBox="-3 -3 ${W + 6} ${H + 6}" role="img" aria-label="Plan of ${esc(w.name)}">${g}</svg>`;
}

function trainSVG(ctx) {
  const w = ctx.world, narrow = PHONE.matches;
  const W = narrow ? 340 : 600, rowH = narrow ? 66 : 70, h = rowH - 16, top = 46;
  const inPlay = new Map(ctx.roomIdx.map((wi, li) => [wi, li]));
  const order = w.rooms.map((r, wi) => wi).sort((a, b) => w.rooms[a].rect.x - w.rooms[b].rect.x);
  // the engine, then the carriages from the front back
  let g = `<g class="engine"><path d="M${W / 2 - 70} 34V14a8 8 0 0 1 8-8h70v-4h14v4h40a8 8 0 0 1 8 8v20Z"/><circle cx="${W / 2 - 46}" cy="36" r="6"/><circle cx="${W / 2 - 10}" cy="36" r="6"/><circle cx="${W / 2 + 26}" cy="36" r="6"/></g>
    <text class="floor-name" x="0" y="22">The engine</text>`;
  order.forEach((wi, k) => {
    const room = w.rooms[wi], r = inPlay.get(wi), y = top + k * rowH;
    g += `<line class="coupling" x1="${W / 2}" y1="${y - 16}" x2="${W / 2}" y2="${y}"/>`;
    if (r === undefined) {
      g += `<rect class="ghost" x="3" y="${y + 3}" width="${W - 6}" height="${h - 6}" rx="8"/><text class="ghost-name" x="14" y="${y + h / 2 + 5}">${svgText(room.name)}, sealed</text>`;
      return;
    }
    g += `<g class="room" data-room="${r}">
      <rect class="floorspace" x="0" y="${y}" width="${W}" height="${h}" rx="8" fill="url(#pt-${room.pattern})"/><rect class="lit" x="0" y="${y}" width="${W}" height="${h}" rx="8"/>
      <rect class="wall" x="0" y="${y}" width="${W}" height="${h}" rx="8"/>
      <text class="room-name" x="14" y="${y + h / 2 + 5}" style="font-size:${narrow ? 13 : 15}px">${svgText(room.name)}</text>
      <g class="occupants" data-occ="${r}" transform="translate(${narrow ? 128 : 220} ${y + (h - 30) / 2})"></g></g>`;
  });
  const H = top + order.length * rowH - 16;
  return `<svg class="plan-svg train${narrow ? ' narrow' : ''}" viewBox="-3 -3 ${W + 6} ${H + 6}" role="img" aria-label="${esc(w.name)}, from the engine back">${g}</svg>`;
}

// who and what is in each room, as the notebook has it so far: faces for people, icons for weapons
function paintMap(d) {
  const ctx = G.puzzle.ctx, yes = (v) => v === 2 || v === 4, narrow = PHONE.matches, sz = narrow ? 26 : 32, gap = 4;
  document.querySelectorAll('[data-occ]').forEach((p) => {
    const r = +p.dataset.occ;
    const who = ctx.suspects.map((s, i) => i).filter((s) => yes(d.sr[s][r]));
    const what = ctx.weapons.map((w, i) => i).filter((w) => yes(d.wr[w][r]));
    let x = 0, out = '';
    for (const s of who) {

      out += `<g transform="translate(${x} 0)"><title>${esc(S.name)}</title><circle cx="${sz / 2}" cy="${sz / 2}" r="${sz / 2}" style="fill:hsl(${S.hue} 42% var(--face-l))"/><svg x="0" y="0" width="${sz}" height="${sz}" viewBox="7 3 50 50"><clipPath id="clip${r}-${s}"><circle cx="32" cy="28" r="25"/></clipPath><g clip-path="url(#clip${r}-${s})">${portraitSVG(S).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g></svg><circle class="pin-ring" cx="${sz / 2}" cy="${sz / 2}" r="${sz / 2 - .5}"/></g>`;
      x += sz + gap;
    }
    for (const w of what) {
      out += `<g transform="translate(${x} 0)" class="pin-w"><title>${esc(ctx.weapons[w].name)}</title><circle cx="${sz / 2}" cy="${sz / 2}" r="${sz / 2}"/><svg x="${sz * 0.18}" y="${sz * 0.18}" width="${sz * 0.64}" height="${sz * 0.64}" viewBox="0 0 24 24" fill="currentColor">${WEAPON_ICONS[ctx.weapons[w].id]}</svg></g>`;
      x += sz + gap;
    }
    p.innerHTML = out;
  });
  // the scene of the crime, once the case is closed
  const s = G.puzzle.solution;
  document.querySelectorAll('.room').forEach((el) => el.classList.toggle('scene', G.solved && G.mode !== 'tutorial' && +el.dataset.room === s.room));
}

// ---- accusation
function openAccuse() {

function updateSaid() {

// Which statement first rules out this exact accusation?
function firstContradiction(P, acc) {
  const { perms, inv } = permutations(P.n);
  const A = [], B = [];
  perms.forEach((p, a) => { if (p[acc.killer] === acc.weapon) A.push(a); if (p[acc.killer] === acc.room) B.push(a); });
  let alive = [];
  for (const a of A) for (const b of B) alive.push([a, b]);
  for (let k = 0; k < P.clues.length; k++) {
    const c = P.clues[k];
    alive = alive.filter(([a, b]) => {
      const v = c.test(perms[a], inv[a], perms[b], inv[b]);
      return c.kind === 'M' ? (v & (1 << acc.killer)) !== 0 : v;
    });
    if (!alive.length) return k + 1;
  }
  return null;
}

function submitAccuse() {
  const p = G.pick;
  if (p.killer === null || p.weapon === null || p.room === null) return;
  const res = checkAccusation(G.puzzle, p);
  if (res.killer && res.weapon && res.room) { closeModal(); solveCase(); return; }
  G.wrong++; persist();
  const k = firstContradiction(G.puzzle, p);
  const box = document.getElementById('accuse-result');
  box.innerHTML = `<p class="miss"><b>Not quite.</b> ${k ? `That story breaks against <b>${esc(clueLabel(k - 1))}</b>.` : 'The statements do not support that.'} Wrong accusations so far: ${G.wrong}.</p>`;
}

function solveCase() {
  if (G.mode === 'tutorial') { G.solved = true; finishWarmup(); return; }
  const first = !G.solved && !(LS.get(G.key, {}) || {}).solved;
  G.solved = true; persist();
  if (first) {
    const st = loadStats(), t = G.puzzle.tier;
    st.solved[t] = (st.solved[t] || 0) + 1;
    st.best[t] = st.best[t] ? Math.min(st.best[t], G.elapsed) : G.elapsed;
    // the streak counts today's case closed on its day (or just after midnight), never an archived one
    if (G.mode === 'daily' && G.day >= todayN() - 1 && st.lastDay !== G.day) {
      st.streak = st.lastDay === G.day - 1 ? st.streak + 1 : 1; st.lastDay = G.day;
      st.bestStreak = Math.max(st.bestStreak, st.streak);
    }
    LS.set('stats', st);
  }
  const cs = document.getElementById('closed-stamp');
  if (cs) cs.textContent = 'Case closed';
  document.querySelectorAll('.btn.accuse').forEach((b) => { b.textContent = 'The verdict'; });
  // the three answer squares get their rings first; the finish opens once they are drawn
  paintAll();
  const g = G;
  if (FINISH_DELAY && !matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(() => { if (G === g) openVerdict(); }, FINISH_DELAY);
  else openVerdict();
}
let FINISH_DELAY = 1100;

// how it went, in words: "on the first try, in 6 minutes, with no hints"
const ORDINAL = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth'];
const tryWord = (k) => ORDINAL[k - 1] || `${k}th`;
const minutes = (sec) => (sec < 60 ? 'under a minute' : `${Math.round(sec / 60)} min`);
const hintWord = (h) => (h ? `${h} hint${h === 1 ? '' : 's'}` : 'no hints');

// Spoiler-free: the day, how hard, and how it went. Never a name, a weapon or a room.
//   Inquest No. 22 · Thursday ●●●○
//   ✕✕✒️ named on the third try      one mark per try: ✕ wrong, the pen for the right one
//   6 min · 💡💡 2 hints
const SHARE_KEY = 'In the shared result, each try is one mark: ✕ for a wrong accusation, 🔎 for the one that closed the case. Each 💡 is a hint.';
function shareText() {
  const P = G.puzzle, lvl = TIER_LEVEL[P.tier], dots = '●'.repeat(lvl) + '○'.repeat(4 - lvl);
  const head = G.day ? `Inquest No. ${G.day} · ${WEEKDAY[weekdayOf(G.day)]} ${dots}` : `Inquest, a practice case ${dots}`;
  const misses = G.wrong <= 9 ? '✕'.repeat(G.wrong) : `✕×${G.wrong} `;
  const named = `${misses}🔎 solved on the ${tryWord(G.wrong + 1)} try`;
  const bulbs = G.hints ? '💡'.repeat(Math.min(G.hints, 5)) + (G.hints > 5 ? '+' : '') + ' ' : '';
  return [head, named, `${minutes(G.elapsed)} · ${bulbs}${hintWord(G.hints)}`].join('\n');
}

function openVerdict() {

    ${nextStepHTML()}</div>`, 'finish');
}

// After a win, the quiet ways on: an older case, and today's if this wasn't it, else when tomorrow's opens.
function nextStepHTML() {
  const st = loadStats(), closed = closedCount(st), streak = liveStreak(st), n = todayN();
  const record = `${closed} case${closed === 1 ? '' : 's'} closed${streak > 1 ? `, a ${streak}-day streak` : ''}.`;
  const today = G.mode !== 'daily' && !caseState(dailyFor(n).spec).solved;
  const t = WEEK_TIER[weekdayOf(n + 1)];
  const line = today ? `${record} Today’s case is still open.` : `${record} Tomorrow is ${WEEKDAY[weekdayOf(n + 1)]}. ${esc(DAY_FEEL[t])} It opens at midnight.`;

}

const canShareSheet = () => typeof navigator.share === 'function' && matchMedia('(pointer: coarse)').matches;
async function shareResult() {

// ---- hints from Inspector Mallory
function nextHint() {
  const P = G.puzzle, n = P.n;
  if (!G.csp) G.csp = buildCSP(P.ctx, P.clues);
  const csp = G.csp;
  const d = derive(G.marks, n, G.say);
  const done = (b, i, j) => (b === 'k' ? d.k[i] === 1 || d.k[i] === 3 : d[b][i][j] === 1 || d[b][i][j] === 3);
  // a mark the statements contradict: a circle on something impossible, or a cross on something that has to be true
  if (!G.marg) G.marg = marginals(P.ctx, P.clues);
  const M = G.marg;
  for (const b of ['sw', 'sr', 'wr']) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = G.marks[b][i][j];
    if (v === 2 && !M[b][i][j]) return { type: 'mistake', b, i, j, v };
    if (v === 1) {
      let rowAlt = false, colAlt = false;
      for (let k = 0; k < n; k++) { if (k !== j && M[b][i][k]) rowAlt = true; if (k !== i && M[b][k][j]) colAlt = true; }
      if (!rowAlt || !colAlt) return { type: 'mistake', b, i, j, v };
    }
  }
  const only = M.killer.reduce((a, x) => a + x, 0) === 1 ? M.killer.indexOf(1) : -1;
  for (let i = 0; i < n; i++) {
    if ((G.marks.k[i] === 2 || G.say[i] === 2) && !M.killer[i]) return { type: 'mistake', b: G.marks.k[i] === 2 ? 'k' : 'say', i, j: 0, v: 2 };
    if ((G.marks.k[i] === 1 || G.say[i] === 1) && i === only) return { type: 'mistake', b: G.marks.k[i] === 1 ? 'k' : 'say', i, j: 0, v: 1 };
  }
  const dom = new Array(csp.nv).fill((1 << n) - 1), trace = [];
  propagate(csp, dom, trace);
  for (const ev of trace) {
    if (ev.v > 2 * n) continue;
    for (let x = 0; x < n; x++) {
      if (!(ev.removed & (1 << x))) continue;
      if (ev.v === 2 * n) { if (!done('k', x, 0) && G.say[x] !== 1) return { type: 'elim', b: 'k', i: x, j: 0, clue: ev.clue }; continue; }
      const b = ev.v < n ? 'sw' : 'sr', i = ev.v < n ? ev.v : ev.v - n;
      if (!done(b, i, x)) return { type: 'elim', b, i, j: x, clue: ev.clue };
    }
  }
  if (answered(csp, dom)) return { type: 'ready' };
  for (let v = 0; v <= 2 * n; v++) for (let x = 0; x < n; x++) {
    if (!(dom[v] & (1 << x)) || popcount(dom[v]) === 1) continue;
    const trial = dom.slice(); trial[v] = 1 << x;
    if (!propagate(csp, trial)) {
      const b = v === 2 * n ? 'k' : v < n ? 'sw' : 'sr', i = v === 2 * n ? x : v < n ? v : v - n, j = v === 2 * n ? 0 : x;
      if (!done(b, i, j)) return { type: 'whatif', b, i, j, clue: -1 };
    }
  }
  return { type: 'ready' };
}

let hintNow = null;
function hintNames(h) {
  const ctx = G.puzzle.ctx;
  if (h.b === 'wr') return { S: `the ${ctx.weapons[h.i].name}`, what: `in the ${ctx.rooms[h.j].name}`, pair: `the ${ctx.weapons[h.i].name} and the ${ctx.rooms[h.j].name}` };
  const S = ctx.suspects[h.i].short;
  if (h.b === 'k' || h.b === 'say') return { S, what: 'the killer', pair: h.b === 'say' ? `${S}’s statement` : `${S} under “Did it?”` };
  const X = h.b === 'sw' ? ctx.weapons[h.j].name : ctx.rooms[h.j].name;
  return { S, X, what: h.b === 'sw' ? `holding the ${X}` : `in the ${X}`, pair: `${S} and the ${X}` };
}
function openHint() {
  const h = nextHint();
  hintNow = h;
  const head = `<div class="mallory">${face(MALLORY, 56)}<div><p class="kicker">A word from</p><h2>Inspector Mallory</h2></div></div>`;
  if (h.type === 'ready') {
    openModal(`${head}<div class="hintbox">Your notes already settle it. There is nothing left to find, so make your accusation.</div><div class="actions"><button class="btn red" data-act="accuse">Accuse</button><button class="btn ghost" data-act="close">Keep looking</button></div>`, 'hint');
    return;
  }
  G.hints++; persist();
  const { S, what } = hintNames(h);
  let nudge;
  if (h.type === 'mistake') nudge = `Something in your notes doesn't fit the clues. Look again at ${esc(hintNames(h).pair)}.`;
  else if (h.type === 'whatif') nudge = `Test a theory. Suppose ${esc(S)} ${h.b === 'k' ? 'did it' : `was ${esc(what)}`}. Who would be lying then, and does everything else still hold?`;
  else if (h.clue >= 0) nudge = h.b === 'k' ? `Read <b>${esc(clueLabel(h.clue))}</b> again. Could ${esc(S)} really be the liar?` : `Read <b>${esc(clueLabel(h.clue))}</b> again, alongside what your notebook already says about ${esc(S)}.`;
  else nudge = `Look along ${esc(S)}'s row in the notebook. The squares already crossed out leave only one way for this to go.`;
  openModal(`${head}<div class="hintbox" id="hintbox">${nudge}</div>
    <div class="actions"><button class="btn" data-act="hint-more">Spell it out</button><button class="btn ghost" data-act="close">I'll take it from here</button></div>`, 'hint');
  if (h.clue >= 0) {
    selectStatement(h.clue);
    const el = document.querySelector(`.ev[data-i="${h.clue}"], .suspect .quote[data-i="${h.clue}"]`);
    if (el) { el.classList.add('nudge'); setTimeout(() => el.classList.remove('nudge'), 5000); }
  }
}
function hintMore() {
  const h = hintNow; if (!h || h.type === 'ready') return;
  G.hints++;
  const { S, what, pair } = hintNames(h);
  if (h.type === 'mistake') {
    writeMark(h.b, h.i, h.j, 0);
    persist(); if (h.b === 'say') renderClues(); paintAll();
    document.getElementById('hintbox').innerHTML = h.b === 'say'
      ? `You marked ${esc(pair)} as ${h.v === 2 ? 'a lie' : 'true'}, but the clues say otherwise. I've cleared it for you.`
      : `You ${h.v === 2 ? 'circled' : 'crossed out'} ${esc(pair)}, but the clues ${h.v === 2 ? 'rule that out' : 'say it has to be so'}. I've cleared that square for you.`;
    document.querySelector('[data-act="hint-more"]').remove();
    return;
  }
  const why = h.type === 'whatif' ? 'Assume it, and the clues contradict each other.' : h.clue >= 0 ? `${cap(clueLabel(h.clue))} rules it out, given what you already know.` : 'The rest of the notebook leaves no room for it.';
  if (userMark(h.b, h.i, h.j) === 0) writeMark(h.b, h.i, h.j, 1);
  persist(); paintAll();
  document.getElementById('hintbox').innerHTML = h.b === 'k'
    ? `${esc(S)} is not the killer, so ${esc(S)} is telling the truth. ${why} I've crossed ${esc(S)} out under “Did it?”.`
    : `${esc(S)} was not ${esc(what)}. ${why} I've crossed it out for you.`;
  document.querySelector('[data-act="hint-more"]').remove();
}

const WARM = { note: '', toldFaint: false, toldReady: false, folded: false };

// the three rules, each with its picture. Shown above the warm-up and in "How to play".

function foldRules(toTop) {

// what each statement asks of you, said under the statement in hand
const WARM_TRY = [
  'Dr. Pell tells the truth, unless Dr. Pell is the killer. Hold that thought.',

function startWarmup() {

// is this mark right? (the warm-up judges against the answer)
function fact(b, i, j) {
  const t = G.puzzle.truth;
  if (b === 'sw') return t.pw[i] === j;
  if (b === 'sr') return t.pr[i] === j;
  if (b === 'wr') return t.pr[t.pw.indexOf(i)] === j;
  return t.m === i; // k and say: did it, lied
}
const warmRight = (b, i, j, v) => (v === 2) === fact(b, i, j);
// keys of the marks that stay in pencil: they are drawn, but the notebook draws nothing from them
function warmPencil() {
  const out = new Set(), n = G.puzzle.n;
  for (const b of ['sw', 'sr', 'wr']) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = G.marks[b][i][j];
    if (v && !warmRight(b, i, j, v)) out.add(b + i + '-' + j);
  }
  for (let i = 0; i < n; i++) {
    if (G.marks.k[i] && !warmRight('k', i, 0, G.marks.k[i])) out.add('k' + i + '-0');
    if (G.say[i] && !warmRight('say', i, 0, G.say[i])) out.add('say' + i + '-0');
  }
  return out;
}
// the notebook as it stands without the pencil marks
function stripPencil() {
  const pencil = warmPencil(), m = JSON.parse(JSON.stringify(G.marks)), say = G.say.slice();
  pencil.forEach((key) => {
    const [, b, i, j] = key.match(/^(sw|sr|wr|k|say)(\d+)-(\d+)$/);
    if (b === 'k') m.k[i] = 0; else if (b === 'say') say[i] = 0; else m[b][i][j] = 0;
  });
  return derive(m, G.puzzle.n, say);
}
// does the notebook point to one killer, with their weapon and room circled?
function warmReady(d) {
  const yes = (v) => v === 2 || v === 4;
  const s = d.k.findIndex(yes);
  return s >= 0 && d.sw[s].some(yes) && d.sr[s].some(yes);
}

// the one-line reason for a mark that is right
function warmReason(b, i, j, v) {
  const ctx = G.puzzle.ctx, S = (x) => esc(ctx.suspects[x].short), W = (x) => 'the ' + esc(ctx.weapons[x].name), R = (x) => 'the ' + esc(ctx.rooms[x].name);
  const said = {
    'k1-0-2': `Right. The killer is tall, and ${S(1)} is the only tall one here.`,
    'k0-0-1': `Right. ${S(0)} is short, and the killer is tall.`,
    'k2-0-1': `Right. ${S(2)} is short, and the killer is tall.`,
    'sr2-0-2': `Right. ${S(2)} isn’t the killer, so ${S(2)} told the truth: ${R(0)}.`,
    'sr1-0-1': `Right. ${S(1)} lied about ${R(0)}.`,
    'sr1-1-2': `Right. The body was on the ground floor, and the killer was with it. ${cap(R(1))} is the only room down there.`,
    'sr0-2-2': `Right. ${S(0)} has one room left: ${R(2)}.`,
    'sw2-0-2': `Right. ${S(2)}’s weapon was heavy and blunt, and ${W(0)} is the only blunt one.`,
    'sw0-1-1': `Right. ${S(0)} isn’t the killer, so the statement is true: never touched ${W(1)}.`,
    'sw0-2-2': `Right. Not ${W(1)}, and ${W(0)} is ${S(2)}’s: ${W(2)}.`,
    'sw1-1-2': `Right. ${S(1)} gets what’s left: ${W(1)}.`,
  };
  const key = `${b}${i}-${j}-${v}`;
  if (said[key]) return said[key];
  const yes = v === 2;
  const what = b === 'sw' ? `${S(i)} ${yes ? 'had' : 'didn’t have'} ${W(j)}`
    : b === 'sr' ? `${S(i)} ${yes ? 'was' : 'wasn’t'} in ${R(j)}`
      : b === 'wr' ? `${W(i)} ${yes ? 'was' : 'wasn’t'} in ${R(j)}`
        : `${S(i)} ${yes ? 'did it' : 'didn’t do it'}`;
  return `Right: ${what}.`;
}

function setWarmNote(html) {
  WARM.note = html;
  document.querySelectorAll('.wnote').forEach((e) => { e.innerHTML = html; });
}
// after each mark: say why it is right, or why it stays in pencil. The square just tapped stays where it was.
function warmAfter(b, i, j, v) {
  const all = [...document.querySelectorAll(`.cell[data-b="${b}"][data-i="${i}"][data-j="${j}"]`)];
  const keep = all.find((x) => x.getClientRects().length), y0 = keep && keep.getBoundingClientRect().top;
  foldRules(false);
  if (!v) setWarmNote('Cleared.');
  else setWarmNote(warmRight(b, i, j, v) ? warmReason(b, i, j, v) + warmExtra(v) : 'That doesn’t fit the clues, so it stays in pencil. Tap it again to change it.');
  if (keep && keep.isConnected && window.scrollBy) window.scrollBy(0, keep.getBoundingClientRect().top - y0);
}
function warmSay(s, v) {
  foldRules(false);
  const S = esc(G.puzzle.ctx.suspects[s].short);
  if (!v) { setWarmNote('Cleared.'); return; }
  const liar = s === G.puzzle.truth.m;
  let note;
  if (v === 2) note = liar ? `Right: ${S} is lying, and the liar is the killer. The notebook circles ${S} under “Did it?” by itself.` : `Not ${S}. Look at the evidence again: the killer is tall.`;
  else note = liar ? `Careful: ${S} and Miss Lark can’t both be in the Study. Who is tall?` : `Right: ${S} isn’t the killer, so ${S} is telling the truth.`;
  setWarmNote(note + (warmRight('say', s, 0, v) ? warmExtra(2) : ''));
}
function warmExtra(v) {
  let out = '';
  if (v === 2 && !WARM.toldFaint) {
    WARM.toldFaint = true;
    out += ' <span class="aside">The faint marks are the notebook’s own: it fills in what follows from yours.</span>';
  }
  if (!WARM.toldReady && warmReady(stripPencil())) {
    WARM.toldReady = true;
    out += ' <span class="aside">The notebook has its answer. Press <b>Accuse</b>.</span>';
  }
  return out;
}
