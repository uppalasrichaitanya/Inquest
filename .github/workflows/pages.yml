# Publishes the game to GitHub Pages on every push to main (or by hand from the Actions tab).
# It rebuilds dist/index.html with the site's address (for the link preview), checks the bank, and publishes
# that one file. Nothing else in the repository is published.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: SITE_URL="${{ steps.pages.outputs.base_url }}/" node build.js
      - name: Check the bank and the clue wording
        run: node test-variants.js && node test-engine.js 5
      - name: Collect the page
        run: mkdir _site && cp dist/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
